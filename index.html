<style>
  :root{
    --ink:#12202A;
    --steel:#2E4053;
    --steel-light:#3E5468;
    --steel-lighter:#4E6A80;
    --paper:#EFE8D8;
    --paper-line:#D8CDB0;
    --hazard:#F0B429;
    --hazard-dark:#C98F12;
    --rope:#9C6B3E;
    --good:#3F8F5F;
    --good-dark:#2E6E47;
    --bad:#C1443A;
    --bad-dark:#9C332B;
    --text-dark:#1B2630;
    --text-light:#F3EFE3;
    --muted:#8FA0AC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--ink);
    background-image:repeating-linear-gradient(135deg, rgba(240,180,41,0.035) 0 18px, transparent 18px 36px);
    color:var(--text-light);
    font-family:"Noto Sans JP","Hiragino Sans",sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:linear-gradient(180deg, var(--ink) 0%, #16262F 100%);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  .eyebrow{
    font-family:"Oswald",sans-serif;
    font-weight:600;
    letter-spacing:0.14em;
    font-size:11px;
    color:var(--hazard);
  }
  header.top{
    padding:22px 20px 16px;
    border-bottom:3px solid var(--hazard);
    background:repeating-linear-gradient(45deg, var(--ink) 0 10px, #1a2c37 10px 20px);
  }
  header.top h1{margin:6px 0 4px;font-size:21px;font-weight:900;line-height:1.35;}
  header.top p{margin:0;font-size:12.5px;color:var(--muted);}
  header.top .backlink{
    background:none;border:none;color:var(--muted);font-size:13px;
    font-family:inherit;cursor:pointer;padding:0 0 8px;display:block;
  }
  .exempt{
    margin-top:8px;
    padding:10px 12px;
    background:rgba(156,107,62,0.14);
    border-left:3px solid var(--rope);
    border-radius:2px;
    font-size:11.5px;
    line-height:1.75;
    color:var(--text-light);
  }
  .exempt .ex-toggle{
    display:flex;
    align-items:center;
    gap:8px;
    width:100%;
    background:none;
    border:none;
    padding:0;
    margin:0;
    font-family:inherit;
    color:var(--text-light);
    cursor:pointer;
    text-align:left;
  }
  .exempt .ex-label{
    display:inline-block;
    font-family:"Oswald",sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.08em;
    color:#fff;
    background:var(--rope);
    padding:2px 7px;
    border-radius:2px;
    flex-shrink:0;
  }
  .exempt .ex-hint{flex:1;font-size:11px;color:var(--muted);}
  .exempt .ex-caret{font-size:9px;color:var(--rope);flex-shrink:0;}
  .exempt .ex-toggle.open{margin-bottom:8px;}
  .exempt ul{margin:0;padding-left:1.1em;}
  .exempt li{margin-bottom:5px;}
  .exempt li:last-child{margin-bottom:0;}
  .exempt b{color:var(--hazard);font-weight:700;}
  .requirement{
    margin-top:12px;
    padding:10px 12px;
    background:rgba(240,180,41,0.08);
    border-left:3px solid var(--hazard);
    border-radius:2px;
    font-size:11.5px;
    line-height:1.7;
    color:var(--text-light);
  }
  .requirement .rq-label{
    display:inline-block;
    font-family:"Oswald",sans-serif;
    font-size:10px;
    font-weight:600;
    letter-spacing:0.08em;
    color:var(--ink);
    background:var(--hazard);
    padding:2px 7px;
    border-radius:2px;
    margin-right:8px;
    vertical-align:1px;
  }
  main{flex:1;padding:18px 16px 100px;}

  /* ---- category / license list ---- */
  .cat-head{
    display:flex;align-items:center;gap:8px;
    margin:20px 0 10px;
  }
  .cat-head:first-child{margin-top:0;}
  .cat-head .bar{width:4px;height:16px;background:var(--hazard);border-radius:1px;}
  .cat-head .name{font-size:13.5px;font-weight:700;letter-spacing:0.02em;}

  .lic-card{
    display:flex;align-items:center;gap:12px;
    width:100%;text-align:left;
    background:var(--steel);
    border:none;border-left:5px solid var(--hazard);
    border-radius:2px;padding:14px;margin-bottom:10px;
    color:var(--text-light);font-family:inherit;cursor:pointer;
  }
  .lic-card:active{background:var(--steel-light);}
  .lic-card.locked{border-left-color:var(--steel-lighter);cursor:default;opacity:0.6;}
  .lic-info{flex:1;min-width:0;}
  .lic-info .name{font-size:14.5px;font-weight:700;line-height:1.4;}
  .lic-info .sub{font-size:11px;color:var(--muted);margin-top:4px;}
  .lic-badge{
    font-family:"Oswald",sans-serif;font-size:11px;font-weight:600;
    color:var(--ink);background:var(--hazard);
    padding:3px 8px;border-radius:2px;flex-shrink:0;
  }
  .lic-badge.soon{background:var(--steel-lighter);color:var(--text-light);}
  .arrow{color:var(--muted);flex-shrink:0;font-size:16px;}
  .lic-prog{
    font-family:"Oswald",sans-serif;font-size:11.5px;
    color:var(--muted);flex-shrink:0;text-align:right;
  }

  /* ---- overall ring ---- */
  .overall{
    display:flex;align-items:center;gap:16px;
    background:var(--steel);border:1px solid var(--steel-lighter);
    border-radius:4px;padding:14px 16px;margin-bottom:18px;
  }
  .ring{
    width:56px;height:56px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:"Oswald",sans-serif;font-weight:700;font-size:15px;
    background:conic-gradient(var(--hazard) calc(var(--pct,0)*1%), #1f3038 0);
    position:relative;
  }
  .ring::after{content:'';position:absolute;inset:5px;border-radius:50%;background:var(--steel);}
  .ring span{position:relative;z-index:1;}
  .overall-text .label{font-size:11px;color:var(--muted);letter-spacing:0.05em;}
  .overall-text .value{font-size:13.5px;font-weight:700;margin-top:2px;}

  /* ---- subject blocks ---- */
  .subject-block{
    background:var(--steel);border-left:5px solid var(--hazard);
    border-radius:2px;padding:14px 14px 12px;margin-bottom:10px;
  }
  .subject-block-top{display:flex;align-items:center;gap:12px;margin-bottom:10px;}
  .subject-num{
    font-family:"Oswald",sans-serif;font-weight:700;font-size:20px;
    color:var(--hazard);width:30px;flex-shrink:0;
  }
  .subject-info{flex:1;min-width:0;}
  .subject-info .name{font-size:14.5px;font-weight:700;}
  .subject-info .sub{font-size:11px;color:var(--muted);margin-top:3px;}
  .subject-badge{
    font-family:"Oswald",sans-serif;font-size:12px;font-weight:600;
    color:var(--muted);flex-shrink:0;text-align:right;
  }
  .subject-actions{display:flex;gap:8px;}
  .action-chip{
    flex:1;background:var(--ink);border:1px solid var(--steel-lighter);
    color:var(--text-light);font-family:inherit;font-size:12px;font-weight:700;
    padding:10px 6px;border-radius:2px;cursor:pointer;text-align:center;
  }
  .action-chip.primary{background:var(--hazard);color:var(--ink);border-color:var(--hazard);}
  .action-chip:active{opacity:0.8;}

  .review-btn{
    width:100%;margin-top:6px;padding:14px;border-radius:2px;
    border:1px dashed var(--rope);background:transparent;color:var(--text-light);
    font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer;
  }
  .review-btn:disabled{opacity:0.35;}
  .review-btn .cnt{color:var(--hazard);}
  .reset-btn{
    width:100%;margin-top:8px;padding:12px;border-radius:2px;
    border:1px solid var(--steel-lighter);background:transparent;color:var(--muted);
    font-family:inherit;font-size:12.5px;cursor:pointer;
  }
  .reset-btn:active{color:var(--bad);border-color:var(--bad);}
  .reset-btn.confirming{color:#fff;background:var(--bad);border-color:var(--bad);font-weight:700;}
  .reset-cancel{
    width:100%;margin-top:6px;padding:10px;border-radius:2px;border:none;
    background:transparent;color:var(--muted);font-family:inherit;font-size:12px;
    cursor:pointer;text-decoration:underline;
  }

  .note{
    margin-top:22px;font-size:11px;line-height:1.7;color:var(--muted);
    border-top:1px solid var(--steel-light);padding-top:14px;
  }

  /* ---- quiz ---- */
  .quiz-header{
    padding:14px 16px 12px;background:var(--ink);
    position:sticky;top:0;z-index:5;border-bottom:1px solid var(--steel-light);
  }
  .quiz-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:10px;}
  .back-btn{
    background:none;border:none;color:var(--muted);font-size:13px;
    font-family:inherit;cursor:pointer;padding:4px 0;flex-shrink:0;
  }
  .qcount{font-family:"Oswald",sans-serif;font-size:12.5px;color:var(--hazard);letter-spacing:0.05em;text-align:right;}
  .progress-bar{height:5px;background:var(--steel);border-radius:3px;overflow:hidden;}
  .progress-fill{height:100%;background:var(--hazard);transition:width .25s;}

  .card{
    background:var(--paper);color:var(--text-dark);border-radius:3px;
    padding:18px 16px 16px;margin:16px 16px 0;
    box-shadow:0 6px 0 rgba(0,0,0,0.18);border-top:6px solid var(--hazard);
  }
  .card .subject-tag{
    font-family:"Oswald",sans-serif;font-size:10.5px;font-weight:600;
    letter-spacing:0.1em;color:var(--rope);text-transform:uppercase;
  }
  .card .qtext{font-size:15.5px;font-weight:700;line-height:1.6;margin:8px 0 16px;white-space:pre-line;}
  .diagram-box{
    background:#fff;border:1px solid var(--paper-line);border-radius:3px;
    padding:8px;margin-bottom:14px;display:flex;justify-content:center;
  }
  .diagram-box svg{width:100%;height:auto;max-width:320px;display:block;}
  .choice{
    display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;
    background:#fff;border:1.5px solid var(--paper-line);border-radius:3px;
    padding:12px;margin-bottom:9px;font-family:inherit;font-size:13.5px;
    line-height:1.55;color:var(--text-dark);cursor:pointer;
  }
  .choice .num{font-family:"Oswald",sans-serif;font-weight:700;color:var(--steel);flex-shrink:0;}
  .choice.correct{border-color:var(--good);background:#E8F3EC;}
  .choice.correct .num{color:var(--good-dark);}
  .choice.incorrect{border-color:var(--bad);background:#F8EAE8;}
  .choice.incorrect .num{color:var(--bad-dark);}
  .choice.dim{opacity:0.55;}
  .choice[disabled]{cursor:default;}

  .result-tag{
    display:inline-block;font-family:"Oswald",sans-serif;font-weight:700;
    font-size:12px;letter-spacing:0.06em;padding:4px 10px;border-radius:2px;margin-bottom:10px;
  }
  .result-tag.correct{background:var(--good);color:#fff;}
  .result-tag.incorrect{background:var(--bad);color:#fff;}
  .explain{
    margin:0 16px 16px;background:var(--steel);border-left:4px solid var(--rope);
    padding:12px 14px;font-size:13px;line-height:1.7;border-radius:2px;color:var(--text-light);
  }
  .explain .h{font-family:"Oswald",sans-serif;font-size:10.5px;letter-spacing:0.1em;color:var(--hazard);margin-bottom:5px;}
  .next-btn{
    display:block;width:calc(100% - 32px);margin:6px 16px 20px;padding:14px;
    background:var(--hazard);color:var(--ink);border:none;border-radius:3px;
    font-family:"Oswald",sans-serif;font-weight:700;font-size:14px;
    letter-spacing:0.04em;cursor:pointer;
  }
  .next-btn:active{background:var(--hazard-dark);}

  /* ---- result ---- */
  .result-wrap{padding:30px 20px;text-align:center;}
  .score-ring{
    width:140px;height:140px;border-radius:50%;margin:0 auto 18px;
    display:flex;align-items:center;justify-content:center;
    background:conic-gradient(var(--hazard) calc(var(--pct,0)*1%), #1f3038 0);position:relative;
  }
  .score-ring::after{content:'';position:absolute;inset:10px;border-radius:50%;background:var(--ink);}
  .score-ring .inner{position:relative;z-index:1;}
  .score-ring .big{font-family:"Oswald",sans-serif;font-size:32px;font-weight:700;}
  .score-ring .small{font-size:11px;color:var(--muted);}
  .result-wrap h2{font-size:18px;margin:0 0 4px;}
  .result-wrap .desc{font-size:12.5px;color:var(--muted);margin-bottom:24px;}
  .rbtn{
    display:block;width:100%;padding:14px;margin-bottom:10px;border-radius:3px;
    border:none;font-family:inherit;font-weight:700;font-size:13.5px;cursor:pointer;
  }
  .rbtn.primary{background:var(--hazard);color:var(--ink);}
  .rbtn.secondary{background:var(--steel);color:var(--text-light);border:1px solid var(--steel-lighter);}
  .missed-list{text-align:left;margin-top:24px;}
  .missed-list .h{font-family:"Oswald",sans-serif;font-size:11px;letter-spacing:0.08em;color:var(--muted);margin-bottom:8px;}
  .missed-item{
    background:var(--steel);border-radius:3px;padding:10px 12px;margin-bottom:8px;
    font-size:12.5px;border-left:3px solid var(--bad);
  }
  ::selection{background:var(--hazard);color:var(--ink);}
</style>

<script>
/* ================= 資格レジストリ =================
   新しい資格を追加するときは、CATEGORIES と LICENSES に
   項目を足し、QUESTIONS に license:"<licenseId>" を付けた
   問題を追加するだけで、アプリ側は自動で対応します。
   ================================================= */

const CATEGORIES = [
  { id:'lifting',  name:'クレーン・玉掛け関係' },
  { id:'shipwork', name:'船内荷役関係' },
  { id:'other',    name:'その他の資格' },
];

const LICENSES = [
  {
    id:'crane_fixed',
    category:'lifting',
    name:'クレーン・デリック運転士(クレーン限定)',
    short:'固定式クレーン',
    note:'天井クレーン・橋形クレーンなど',
    requirement:'受験資格は不要で、どなたでも受験できます(本人確認証明書の添付が必要)。',
    exemptions:[
      '<b>移動式クレーン運転士免許・揚貨装置運転士免許・旧デリック運転士免許</b>のいずれかをお持ちの場合は、学科の<b>「力学に関する知識」</b>が免除になります(実技の「運転のための合図」も免除)。',
      '<b>クレーン・デリック運転士[床上運転式クレーン限定]免許</b>をお持ちの場合は、<b>学科試験の全科目</b>が免除になります(実技試験のみ受験)。',
      '<b>床上操作式クレーン運転技能講習・小型移動式クレーン運転技能講習・玉掛け技能講習</b>のいずれかを修了している場合は、実技の「運転のための合図」が免除になります(学科の免除はありません)。',
    ],
    status:'available',
    subjects:[
      { id:'crane', no:'01', name:'クレーンに関する知識',
        themes:['用語の定義','ブレーキ','ワイヤロープ・玉掛用具','機械要素と安全装置の組合せ','安全装置','給油及び点検','歯車比・回転数の計算','種類・型式・用途','トロリ及び作動装置','運転時の取扱い'] },
      { id:'law', no:'02', name:'関係法令',
        themes:['建設物内設置クレーンの構造基準','つり荷の下への立入禁止','玉掛用具の使用禁止基準','組立て・点検・悪天候時の措置','自主検査及び点検','検査(性能・変更・使用再開・落成)','免許及び免許証','設置・製造許可・検査証','運転及び玉掛けの業務(就業制限)','クレーンの使用に関する規定'] },
      { id:'motor', no:'03', name:'原動機及び電気に関する知識',
        themes:['電気の基礎','電気計算(オームの法則・合成抵抗)','電動機の構造','制御器・付属機器','給電装置及び配線','電動機の制御方式','電動機の速度制御方式','導体・絶縁体の分類とスパーク','電気機器の故障の原因','感電及びその防止'] },
      { id:'mechanics', no:'04', name:'力学に関する知識',
        themes:['力の基礎','支点にかかる力・てこの計算','質量・比重・体積の計算','重心・安定','物体の運動','摩擦力','荷重の種類','応力・ひずみ・材料の強さ','つり角度と張力の計算','滑車の力の計算式'] },
    ],
  },
  {
    id:'cargo_handling',
    category:'shipwork',
    name:'揚貨装置運転士',
    short:'揚貨装置',
    note:'船舶のデリック・クレーンによる荷役',
    requirement:'受験資格は不要で、どなたでも受験できます(本人確認証明書の添付が必要)。',
    exemptions:[
      '<b>クレーン・デリック運転士免許(クレーン限定・床上運転式クレーン限定を含む)・旧クレーン運転士免許・旧デリック運転士免許・移動式クレーン運転士免許</b>のいずれかをお持ちの場合は、学科の<b>「原動機及び電気に関する知識」と「力学に関する知識」の2科目</b>が免除になります(実技の「運転のための合図」も免除)。',
      '<b>玉掛け技能講習</b>を修了している場合は、実技の「運転のための合図」が免除になります(学科の免除はありません)。',
      '<b>揚貨装置運転実技教習</b>を修了し1年以内の場合は、実技試験の全部が免除になります(学科試験のみ受験)。',
    ],
    status:'available',
    subjects:[
      { id:"crane", no:"01", name:"揚貨装置に関する知識",

function getLicense(id){ return LICENSES.find(l=>l.id===id); }
function licenseQuestions(licenseId){ return QUESTIONS.filter(q=>q.license===licenseId); }
function subjectMeta(licenseId, subjectId){
  const lic = getLicense(licenseId);
  return lic ? lic.subjects.find(s=>s.id===subjectId) : null;
}

{license:"crane_fixed", id:"c_t1_4", subject:"crane", theme:1, q:"つり上げ荷重と定格荷重に関する記述として、正しいものはどれか。", choices:["定格荷重は、クレーンの運転速度に応じて変化する値をいう。","つり上げ荷重は、クレーンの構造及び材料に応じて負荷させることができる最大の荷重で、フックなどのつり具分の質量を含む。","定格荷重は、フックなどのつり具分の質量を含めた最大の荷重をいう。","つり上げ荷重と定格荷重は、常に同じ値になる。","ジブクレーンの定格荷重は、ジブの傾斜角や長さにかかわらず常に一定である。"], answer:1, explain:"つり上げ荷重はつり具分を含む構造上の最大荷重、定格荷重はそこからつり具分の質量を除いた実際につり上げられる荷重で、ジブクレーンでは傾斜角や長さによって変化するものがあります。"},
{license:"crane_fixed", id:"c_t1_5", subject:"crane", theme:1, q:"「定格速度」の説明として、正しいものはどれか。", choices:["定格速度とは、クレーンの設計上の平均速度をいう。","定格速度とは、定格荷重に相当する荷重の荷をつって、巻上げ、走行、横行、旋回などの作動を行う場合の、それぞれの最高の速度をいう。","定格速度とは、法令で一律に定められた上限速度をいう。","定格速度とは、巻上げ運転のみに適用される速度をいう。","定格速度とは、無負荷の状態で巻上げ、走行、横行、旋回などの作動を行う場合の、それぞれの最高の速度をいう。"], answer:1, explain:"定格速度は、定格荷重に相当する荷重の荷をつった状態で、巻上げ・走行・横行・旋回などの作動を行う場合のそれぞれの最高速度をいいます。無負荷時の速度ではありません。"},
{license:"crane_fixed", id:"c_t1_6", subject:"crane", theme:1, q:"ジブクレーンの「ジブの傾斜角」の説明として、正しいものはどれか。", choices:["ジブの傾斜角とは、ジブの長さと作業半径の比をいう。","ジブの傾斜角とは、ジブの中心線と水平面とのなす角をいう。","ジブの傾斜角とは、旋回体が回転する角度をいう。","ジブの傾斜角とは、ジブの取付けピンから旋回中心までの水平距離をいう。","ジブの傾斜角とは、ジブが起伏できる範囲の最大角度のみをいう。"], answer:1, explain:"ジブの傾斜角は、ジブの中心線と水平面とのなす角度のことです。旋回角度や距離の比とは異なります。"},

{license:"crane_fixed", id:"c_t2_6", subject:"crane", theme:2, q:"足踏み油圧式ディスクブレーキに関する記述として、適切なものはどれか。", choices:["油圧シリンダ、ブレーキピストン及びこれらをつなぐ配管などに油漏れや空気の混入があると、制動力が生じなくなることがある。","足踏み油圧式ディスクブレーキは、走行用や旋回用には使用できない。","足踏み油圧式ディスクブレーキは、電気系統のみで動作し、油圧は使用しない。","足踏み油圧式ディスクブレーキには、点検は不要である。","油圧シリンダ、ブレーキピストン及びこれらをつなぐ配管などに油漏れや空気の混入があっても、制動力にはまったく影響しない。"], answer:0, explain:"足踏み油圧式ディスクブレーキは、油漏れや配管への空気混入があると制動力が生じなくなることがあるため、点検が重要です。天井クレーンの走行用やジブクレーンの旋回用などにも用いられます。"},
{license:"crane_fixed", id:"c_t2_7", subject:"crane", theme:2, q:"クレーンのブレーキ全般に関する記述として、誤っているものはどれか。", choices:["電動油圧押上機ブレーキは、無通電(停電)時にもばねの力によって制動力が働く構造となっている。","ブレーキの構造・種類によって、制動力を得る方法(ばね、油圧、電磁石など)は異なる。","ブレーキの制動トルクの調整は、一度行えば経年劣化にかかわらず永久に調整不要である。","ブレーキは、巻上げ装置のほか、走行装置や横行装置、旋回装置にも用いられる。","ドラム形電磁ブレーキは、電磁石への通電によって制動が解除される構造となっている。"], answer:2, explain:"ブレーキは摩耗や劣化により制動性能が変化するため、定期的な点検・再調整が必要です。「永久に調整不要」という記述は誤りです。"},
{license:"crane_fixed", id:"c_t2_8", subject:"crane", theme:2, q:"クレーンのブレーキに関する記述として、誤っているものはどれか。", choices:["つり上げ装置のブレーキの制動トルクは、定格荷重相当トルクの150%以上に調整する。","バンドブレーキのすき間調整は、ボルトによって行う。","電動油圧押上機ブレーキは、ばねの力で制動し、油圧の押上げ力で制動を解除する。","ドラム形電磁ブレーキは、無電圧作動型であり、停電時にも荷の落下を防ぐことができる。","ディスクブレーキは、バンドをブレーキドラムに巻き付けて制動する構造である。"], answer:4, explain:"「バンドをブレーキドラムに巻き付けて制動する構造」はバンドブレーキの説明であり、ディスクブレーキの説明ではありません。"},
{license:"crane_fixed", id:"c_t3_1", subject:"crane", theme:3, q:"ワイヤロープの構造に関する記述として、正しいものはどれか。", choices:["フィラー線は、ワイヤロープの最外周にのみ配置される線をいう。","ワイヤロープには、より方の区別は存在しない。","ワイヤロープのストランドは、単一の太い素線のみで構成される。","ワイヤロープは、心綱を中心として素線がより合わされたストランドを、さらに複数より合わせた構造となっている。","ワイヤロープには、心綱は用いられていない。"], answer:3, explain:"ワイヤロープは、中心の心綱の周りに、素線をより合わせたストランドを複数より合わせて作られています。"},
{license:"crane_fixed", id:"c_t3_2", subject:"crane", theme:3, q:"ワイヤロープのより方に関する記述として、正しいものはどれか。", choices:["より方の種類にかかわらず、すべてのワイヤロープの強度は同一である。","より方の違いは、ワイヤロープの色によってのみ区別される。","ワイヤロープのより方には、Zより・Sよりの区別があり、それぞれ普通より・ラングよりなどの組合せがある。","より方は、ワイヤロープの特性には一切関係しない。","ワイヤロープには、Zよりのみが存在し、Sよりは存在しない。"], answer:2, explain:"ワイヤロープには、より方向によるZより・Sよりの区別があり、素線のより方とストランドのより方の関係により普通より・ラングよりなどに分類されます。"},
{license:"crane_fixed", id:"c_t3_3", subject:"crane", theme:3, q:"ワイヤロープ端末の止め方に関する記述として、適切なものはどれか。", choices:["ワイヤロープの端末は、常に溶接によって止める。","ワイヤロープの端末処理は、ロープの強度に一切影響しない。","クリップ止めは、接着剤のみでロープを固定する方法である。","合金詰めソケット止めは、ロープの端末を単に折り返しただけの処理である。","クサビ止め、クリップ止め、圧縮止め、合金詰め(又は亜鉛詰め)ソケット止め、アイスプライスなど、複数の止め方がある。"], answer:4, explain:"ワイヤロープ端末の止め方には、クサビ止め・クリップ止め・圧縮止め・合金詰め(亜鉛詰め)ソケット止め・アイスプライスなど複数の方法があります。"},
{license:"crane_fixed", id:"c_t3_4", subject:"crane", theme:3, q:"玉掛け用ワイヤロープの点検・使用に関する記述として、誤っているものはどれか。", choices:["ワイヤロープの点検は、定期的に行う必要がある。","ワイヤロープには、ロープ専用のグリースを塗布する。","ワイヤロープには、ロープ専用のギヤ油やマシン油を塗布することが標準的な方法である。","ワイヤロープの直径測定は、フックブロックのシーブを通過する頻度が高い部分を避けて行う。","ワイヤロープの点検は、シーブ通過による繰り返し曲げを受ける部分やロープ端部の取付け部分に重点を置いて行う。"], answer:2, explain:"ワイヤロープにはロープ専用のグリースを塗布するのが正しい方法であり、ギヤ油やマシン油を塗布するのは適切ではありません。"},
{license:"crane_fixed", id:"c_t3_5", subject:"crane", theme:3, q:"玉掛用具の使用禁止基準に関する記述として、正しいものはどれか。", choices:["ワイヤロープの直径の減少が公称径の5%未満であれば、いかなる場合も使用禁止となる。","使用する際の安全係数が6以上のワイヤロープは使用してはならない。","シャックルやフックには、安全係数の基準は一切適用されない。","つりチェーンは、どれだけ伸びていても使用できる。","ワイヤロープ1よりの間において素線数の10%以上が切断したものは、使用してはならない。"], answer:4, explain:"玉掛け用ワイヤロープは、1よりの間で素線数の10%以上が切断しているものは使用禁止とされています。安全係数は6以上であれば使用でき、6以上であること自体は禁止事由ではありません。"},
{license:"crane_fixed", id:"c_t3_6", subject:"crane", theme:3, q:"つりチェーンの使用禁止基準に関する記述として、正しいものはどれか。", choices:["つりチェーンの使用禁止基準は、安全係数のみで定められている。","伸びが製造されたときの長さの5%以上のつりチェーンは、使用してはならない。","リンクの断面の直径の減少がどれだけあっても、常に使用できる。","つりチェーンには、伸びに関する使用禁止基準は定められていない。","つりチェーンには、使用禁止基準が一切存在しない。"], answer:1, explain:"つりチェーンは、製造時の長さに対して伸びが5%以上になったもの、またはリンク断面の直径減少が一定割合を超えたものは使用が禁止されます。"},
{license:"crane_fixed", id:"c_t3_7", subject:"crane", theme:3, q:"フック及びシャックルに関する記述として、正しいものはどれか。", choices:["使用する際の安全係数が5未満となるフックやシャックルは、使用してはならない。","フックやシャックルには、安全係数の基準は適用されない。","シャックルは、玉掛用具には該当しない。","フックに外れ止め装置を取り付けることは禁止されている。","変形やき裂のあるフックであっても、そのまま使用を継続してよい。"], answer:0, explain:"フックやシャックルは、使用する際の安全係数が5以上でなければ使用できません。変形やき裂のあるものは使用を中止する必要があります。"},
{license:"crane_fixed", id:"c_t3_8", subject:"crane", theme:3, q:"ワイヤロープの構成部分に関する記述として、誤っているものはどれか。", choices:["フィラー線は、ストランドの断面の隙間を埋めるために用いられる細い線である。","心綱は、必ずワイヤロープの最外周に配置される。","心綱は、ワイヤロープの中心に配置される芯材である。","素線は、より合わされてストランドを構成する細い金属線である。","ストランドは、複数の素線がより合わされたものである。"], answer:1, explain:"心綱はワイヤロープの中心に配置される芯材であり、最外周に配置されるという記述は誤りです。"},
{license:"crane_fixed", id:"c_t4_1", subject:"crane", theme:4, q:"クレーンの機械要素に関する記述として、正しいものはどれか。", choices:["歯車形軸継手は、クレーンには使用されない特殊な部品である。","クラウニングとは、歯車の歯数を数える単位である。","歯車形軸継手は、外歯車にクラウニングが施されているため、二つの軸にずれや傾きがあっても円滑に動力を伝えることができる。","歯車形軸継手には、内歯車・外歯車の区別は存在しない。","歯車形軸継手は、軸のずれや傾きがあると、動力を全く伝えることができない構造である。"], answer:2, explain:"歯車形軸継手は、外歯車にクラウニング(歯面を丸く仕上げる加工)が施されているため、二つの軸にずれや傾きがあっても円滑に動力を伝達できます。"},
{license:"crane_fixed", id:"c_t4_2", subject:"crane", theme:4, q:"軸継手に関する記述として、誤っているものはどれか。", choices:["割形軸継手は、円筒を二つ割りにした形の軸継手をボルトで締め付けて回転力を伝える構造である。","フランジ形たわみ軸継手は、流体(油等)のみを利用して動力を伝達し、機械的な接触部分を持たない構造である。","フランジ形たわみ軸継手は、ゴムなどの弾性体を介して二つの軸のずれや傾きの影響を緩和する構造のものが用いられる。","ローラーチェーン軸継手は、2列のローラーチェーンと2個のスプロケットから成り、ピンの抜き差しで両軸の連結及び分離が簡単にできる。","軸継手は、2本の軸を連結して動力を伝達するための機械要素である。"], answer:1, explain:"流体(油等)を利用して動力を伝達する軸継手は「流体継手(フルードカップリング)」と呼ばれる別の機構であり、フランジ形たわみ軸継手はゴムなどの弾性体を介して軸のずれを吸収する機械的な構造のものです。"},
{license:"crane_fixed", id:"c_t4_3", subject:"crane", theme:4, q:"ボルト・歯車に関する記述として、正しいものはどれか。", choices:["リーマボルトは、精度が高いため、せん断力を受ける継手には使用できない。","はすば歯車は、平歯車に比べて動力の伝達にむらが多い構造である。","リーマボルトは、ボルト径が穴径にほぼ等しい高精度な仕上げがされており、横方向のせん断力を受ける構造部材の継手に用いることができる。","ウォームギヤは、大きな減速比を得ることができない構造である。","はすば歯車は、歯が軸に対して平行に切られた歯車である。"], answer:2, explain:"リーマボルトはボルト径が穴径にほぼ等しい高精度なもので、横方向のせん断力を受ける構造部材の継手に用いることができます。はすば歯車は歯がつる巻状に斜めに切られており、平歯車よりむらの少ない滑らかな動力伝達ができます。"},
{license:"crane_fixed", id:"c_t4_4", subject:"crane", theme:4, q:"軸受に関する記述として、誤っているものはどれか。", choices:["転がり軸受は、玉やころを使った軸受で、平軸受(滑り軸受)に比べて動力の損失が少ない。","平軸受(滑り軸受)は、転がり軸受に比べて給油の頻度を高くする必要がある。","スラスト軸受は、軸の軸方向にかかる荷重(スラスト荷重)を支える軸受である。","スラスト軸受は、軸の直角方向にかかる荷重のみを支える軸受である。","軸受は、回転する軸を支持する機械要素である。"], answer:3, explain:"軸の直角方向(半径方向)の荷重を支えるのはラジアル軸受であり、スラスト軸受は軸方向にかかる荷重を支える軸受です。この選択肢が誤りです。"},
{license:"crane_fixed", id:"c_t4_5", subject:"crane", theme:4, q:"クレーンの運動と、これに対応する安全装置などの組合せとして、正しいものはどれか。", choices:["巻下げ ― 重錘形リミットスイッチを用いた巻過防止装置","走行 ― 走行車輪直径の2分の1以上の高さの車輪止め","走行 ― 横行車輪直径の4分の1以上の高さの車輪止め","起伏 ― 巻過防止装置","横行 ― 走行車輪直径の2分の1以上の高さの車輪止め"], answer:1, explain:"走行車輪の車輪止めの高さは、走行車輪直径の2分の1以上とすることとされています。巻過防止装置は巻上げに、傾斜角指示装置は起伏に対応する装置です。"},
{license:"crane_fixed", id:"c_t4_6", subject:"crane", theme:4, q:"クレーンの運動と、これに対応する安全装置などの組合せとして、誤っているものはどれか。", choices:["巻上げ ― ねじ形リミットスイッチを用いた巻過防止装置","走行 ― 斜行防止装置","巻下げ ― カム形リミットスイッチを用いた巻過防止装置","横行 ― 横行車輪直径の4分の1以上の高さの車輪止め","起伏 ― 傾斜角指示装置"], answer:2, explain:"巻過防止装置は、巻き上げ過ぎによる事故を防止するための装置であり、巻上げに対応するものです。巻下げに対応する装置として巻過防止装置を挙げるのは誤りです。"},
{license:"crane_fixed", id:"c_t4_7", subject:"crane", theme:4, q:"歯車・軸継手に関する記述として、誤っているものはどれか。", choices:["歯車形軸継手の外歯車には、クラウニングが施されている。","はすば歯車は、平歯車よりも動力の伝達にむらが多く、振動や騒音が大きいのが特徴である。","割形軸継手は、ボルトで締め付けて回転力を伝える構造である。","ローラーチェーン軸継手は、たわみ軸継手の一種である。","ウォームギヤは、ウォームとウォームホイールを組み合わせた歯車機構である。"], answer:1, explain:"はすば歯車は、歯がつる巻状に斜めに切られていることにより、平歯車よりもむらが少なく滑らかに動力を伝達できるのが特徴であり、この記述は誤りです。"},
{license:"crane_fixed", id:"c_t4_8", subject:"crane", theme:4, q:"クレーンの運動と安全装置の組合せに関する記述として、正しいものはどれか。", choices:["走行運動には、巻過防止装置が用いられる。","巻上げ運動には、巻き過ぎによる事故を防ぐための巻過防止装置が用いられる。","すべての運動には、共通の1種類の安全装置のみが用いられる。","起伏運動には、車輪止めが用いられる。","横行運動には、傾斜角指示装置が用いられる。"], answer:1, explain:"巻上げ運動には、巻き過ぎによる事故を防止する巻過防止装置が対応する安全装置として用いられます。"},
{license:"crane_fixed", id:"c_t5_1", subject:"crane", theme:5, q:"巻過防止装置に関する記述として、正しいものはどれか。", choices:["レバー形リミットスイッチを用いた巻過防止装置は、巻上げ過ぎ及び巻下げ過ぎの両方の位置制限を1個のリミットスイッチで行うことができる。","ねじ形リミットスイッチを用いた巻過防止装置は、ワイヤロープを交換しても作動位置の再調整は不要である。","重錘形リミットスイッチを用いた巻過防止装置は、ワイヤロープを交換しても作動位置の再調整は一切不要である。","カム形リミットスイッチを用いた巻過防止装置は、接点を1個しか設けることができない。","巻過防止装置は、法令上、設置が一切求められていない任意の装置である。"], answer:0, explain:"レバー形リミットスイッチを用いた巻過防止装置は、1個のスイッチで巻上げ過ぎ・巻下げ過ぎの両方を制限できる点が特徴です。重錘形・ねじ形はロープ交換時に再調整が必要です。"},
{license:"crane_fixed", id:"c_t5_2", subject:"crane", theme:5, q:"巻過防止装置に関する記述として、誤っているものはどれか。", choices:["巻過防止装置は、クレーンの横行動作の異常を検知するための装置である。","カム形リミットスイッチを用いた巻過防止装置は、巻上げドラムの回転によってカムを回転させリミットスイッチを働かせる方式で、複数の接点を設けることができる。","巻過防止装置は、つり具の巻き上げ過ぎによる事故を防止するための安全装置である。","直働式巻過防止装置のうち、レバー形リミットスイッチ式のものは、ワイヤロープ交換後の作動位置の再調整が不要とされる。","直働式巻過防止装置のうち、重錘形リミットスイッチ式のものは、ワイヤロープ交換後の作動位置の再調整が必要である。"], answer:0, explain:"巻過防止装置は巻上げ(巻き過ぎ)による事故を防止する装置であり、横行動作の異常検知を目的とした装置ではありません。"},
{license:"crane_fixed", id:"c_t5_3", subject:"crane", theme:5, q:"フックの外れ止め装置に関する記述として、正しいものはどれか。", choices:["フックの外れ止め装置は、つり荷の重量を計量するための装置である。","フックの外れ止め装置は、電気的な信号のみで作動する装置である。","フックの外れ止め装置には、スプリング式・ウエイト式以外の方式は一切考えられない。","フックの外れ止め装置には、スプリング式とウエイト式があり、小型・中型のクレーンではスプリング式のものが多く使われている。","フックの外れ止め装置は、法令上、いかなる場合も取り付けてはならない。"], answer:3, explain:"フックの外れ止め装置には主にスプリング式とウエイト式があり、小型・中型のクレーンではスプリング式が多く使われています。"},
{license:"crane_fixed", id:"c_t5_4", subject:"crane", theme:5, q:"レールクランプに関する記述として、正しいものはどれか。", choices:["レールクランプは、クレーンの巻上げ速度を制御するための装置である。","レールクランプは、つり荷の重心を検出する装置である。","レールクランプは、屋内専用の装置であり、屋外設置のクレーンには使用されない。","レールクランプは、屋外に設置された走行クレーンが作業中に突風などにより逸走することを防止する装置である。","レールクランプは、玉掛け作業に用いる用具の一種である。"], answer:3, explain:"レールクランプは、屋外に設置された走行クレーンが強風などによりレール上を逸走することを防止するための装置です。"},
{license:"crane_fixed", id:"c_t5_5", subject:"crane", theme:5, q:"感電防止のための安全装置に関する記述として、正しいものはどれか。", choices:["フートスイッチは、クレーンの速度を上げるために用いられる装置である。","フートスイッチは、玉掛け作業者が使用する合図用の装置である。","天井クレーンなどでは、運転室からクレーンガーダへ上がる階段の途中にフートスイッチを設け、点検などの際に階段を上がると主回路が開いて感電災害を防ぐようになっているものがある。","フートスイッチは、感電防止とは無関係の装置である。","フートスイッチは、巻過防止のためだけに用いられる装置である。"], answer:2, explain:"クレーンガーダへ上がる階段の途中にフートスイッチを設け、階段を上がると主回路を開いて感電災害を防止する構造のものがあります。"},
{license:"crane_fixed", id:"c_t5_6", subject:"crane", theme:5, q:"過負荷防止装置に関する記述として、正しいものはどれか。", choices:["過負荷防止装置は、クレーンの旋回角度を制限する装置である。","過負荷防止装置は、定格荷重を超える荷重がかかった場合に、警報を発し、又は動作を自動的に停止する装置である。","過負荷防止装置は、クレーンの走行速度を測定するための装置である。","過負荷防止装置が作動しても、作業をそのまま継続してよい。","過負荷防止装置は、玉掛け用ワイヤロープの安全係数を自動的に計算する装置である。"], answer:1, explain:"過負荷防止装置は、定格荷重を超える荷重がかかったときに警報を発したり、動作を自動的に停止させたりする安全装置です。"},
{license:"crane_fixed", id:"c_t5_7", subject:"crane", theme:5, q:"巻過防止装置の調整に関する記述として、正しいものはどれか。", choices:["直働式以外の巻過防止装置は、つり具の上面等と接触するおそれのある物の下面との間隔が0.05m以上となるように調整する。","巻過防止装置の間隔調整の基準は、クレーンの種類にかかわらず一律で0.5m以上である。","直働式の巻過防止装置は、つり具の上面等と接触するおそれのある物の下面との間隔が0.05m以上となるように調整する。","巻過防止装置の調整は、法令上の基準がなく、事業者の任意で決めてよい。","巻過防止装置は、一度調整すれば、ワイヤロープを交換しても再調整の必要はない。"], answer:2, explain:"直働式の巻過防止装置は間隔0.05m以上、直働式以外のものは間隔0.25m以上となるように調整することとされています。"},
{license:"crane_fixed", id:"c_t5_8", subject:"crane", theme:5, q:"クレーンの各種安全装置に関する記述として、誤っているものはどれか。", choices:["レールクランプは、屋外クレーンの逸走防止に用いられる装置である。","フックの外れ止め装置は、玉掛用具がフックから外れるのを防止する装置である。","安全装置は、いったん設置すれば点検や機能確認を行う必要が一切ない。","巻過防止装置は、つり具の巻き上げ過ぎによる事故を防止する装置である。","過負荷防止装置は、定格荷重を超える荷重に対して警報や動作停止を行う装置である。"], answer:2, explain:"安全装置は経年劣化や故障のおそれがあるため、定期的な点検や機能確認が必要です。「点検の必要が一切ない」という記述は誤りです。"},
{license:"crane_fixed", id:"c_t6_1", subject:"crane", theme:6, q:"軸受への給油に関する記述として、正しいものはどれか。", choices:["軸受には、給油を行う必要がない。","転がり軸受・平軸受ともに、給油の頻度に違いはない。","平軸受(滑り軸受)へのグリース給油は毎日1回程度、転がり軸受へのグリース給油は6か月に1回程度の間隔で行う。","転がり軸受へのグリース給油は毎日1回程度、平軸受(滑り軸受)へのグリース給油は6か月に1回程度の間隔で行う。","軸受への給油は、1年に1回で十分である。"], answer:2, explain:"摩擦が大きい平軸受(滑り軸受)は毎日1回程度、摩擦の少ない転がり軸受は6か月に1回程度の間隔でグリース給油を行うのが目安とされています。"},
{license:"crane_fixed", id:"c_t6_2", subject:"crane", theme:6, q:"減速機箱の給油に関する記述として、正しいものはどれか。", choices:["減速機箱の油の点検は禁止されている。","減速機箱には、潤滑油を使用する必要がない。","減速機箱の油は、どのような状態であっても交換の必要はない。","潤滑油としてギヤ油を用いた減速機箱は、箱内が密封されているため、油の交換は不要である。","油浴式給油方式の減速機箱の油が白く濁っている場合は、水分が多く混入しているおそれがある。"], answer:4, explain:"油浴式給油方式の減速機箱の油が白く濁っている場合は、水分の混入が疑われます。密封構造であっても劣化するため、定期的な油の交換は必要です。"},
{license:"crane_fixed", id:"c_t6_3", subject:"crane", theme:6, q:"給油方式に関する記述として、正しいものはどれか。", choices:["グリースカップ式の給油方法は、グリースカップから一定の圧力で自動的にグリースが圧送されるので、給油の手間がかからない。","給油方式には、集中給油式・グリースカップ式のいずれか一方しか存在しない。","集中給油式は、各給油箇所に個別に手作業で給油する方式をいう。","集中給油式は、ポンプから給油管、分配管及び分配弁を通じて、各給油箇所に一定量の給油を行う方式である。","給油方式の違いは、クレーンの安全性には一切関係しない。"], answer:3, explain:"集中給油式は、ポンプから給油管・分配管・分配弁を通じて各給油箇所に一定量の油を供給する方式です。グリースカップ式は、カップを手動でねじ込むなどして給油する方式で、自動で圧送されるものではありません。"},
{license:"crane_fixed", id:"c_t6_4", subject:"crane", theme:6, q:"ワイヤロープの点検に関する記述として、正しいものはどれか。", choices:["ワイヤロープの点検で直径を測定する場合は、フックブロックのシーブを通過する頻度が高い部分を避け、エコライザシーブの下方1m程度の位置で行う。","ワイヤロープの点検は目視のみで行い、直径の測定は不要である。","ワイヤロープの点検箇所は定められていない。","ワイヤロープの直径測定は、シーブを最も頻繁に通過する部分でのみ行う。","ワイヤロープの点検は、年に1回のみで十分である。"], answer:0, explain:"ワイヤロープの直径測定は、フックブロックのシーブを通過する頻度が高い部分を避け、エコライザシーブの下方1m程度の位置で行うのが基本です。"},
{license:"crane_fixed", id:"c_t6_5", subject:"crane", theme:6, q:"ワイヤロープへの給油に関する記述として、正しいものはどれか。", choices:["ワイヤロープには、ロープ専用のグリースを塗布する。","ワイヤロープには、ロープ専用のマシン油を塗布することが標準的な方法である。","ワイヤロープへの給油は、安全性には無関係である。","ワイヤロープには、歯車用のギヤ油を塗布することが標準である。","ワイヤロープには、いかなる潤滑剤も使用してはならない。"], answer:0, explain:"ワイヤロープには、専用のグリースを塗布するのが正しい方法です。"},
{license:"crane_fixed", id:"c_t6_6", subject:"crane", theme:6, q:"給油装置の点検に関する記述として、正しいものはどれか。", choices:["給油装置は、配管の穴あき、詰まりなどにより給油されないことがあるので、給油部分から古い油が押し出されている状態などにより、新油が給油されていることを確認する。","給油装置の点検は禁止されている。","給油装置からの給油の有無は、確認する方法がない。","給油装置は、一度設置すれば故障することがないため、点検の必要はない。","給油装置の点検は、給油後にのみ行えばよい。"], answer:0, explain:"給油装置は配管の詰まり等により正常に給油されないことがあるため、古い油が押し出されている状態などで新油が給油されていることを確認する必要があります。"},
{license:"crane_fixed", id:"c_t6_7", subject:"crane", theme:6, q:"軸受・減速機の給油及び点検に関する記述として、誤っているものはどれか。", choices:["ギヤ油を用いた密封構造の減速機箱は、油の交換が一切不要である。","集中給油式は、複数の給油箇所に一定量の油を分配して供給できる方式である。","転がり軸受は、平軸受(滑り軸受)に比べてグリース給油の頻度が少なくてよい。","油浴式減速機箱の油が白濁している場合は、水分の混入を疑う必要がある。","給油装置の異常は、給油部分から古い油が押し出される状態などで確認できる。"], answer:0, explain:"密封構造の減速機箱であっても、油は劣化するため定期的な交換が必要です。「油の交換が一切不要」という記述は誤りです。"},
{license:"crane_fixed", id:"c_t6_8", subject:"crane", theme:6, q:"クレーンの給油及び点検に関する記述として、正しいものはどれか。", choices:["グリースカップ式の給油は、自動でグリースが圧送されるため、日常の手間は一切かからない。","ワイヤロープには、専用のマシン油を用いることが望ましい。","ワイヤロープの点検は、シーブ通過による繰り返し曲げを受ける部分やロープ端部の取付け部分に重点を置いて行う。","平軸受のグリース給油は、6か月に1回程度で足りる。","減速機箱の油の状態は、色にかかわらず常に正常とみなしてよい。"], answer:2, explain:"ワイヤロープの点検は、シーブ通過による繰り返し曲げを受ける部分やロープ端部の取付け部分に重点を置いて行います。平軸受は毎日1回程度の給油が必要で、専用の油剤はマシン油ではなくグリースです。"},
{license:"crane_fixed", id:"c_t7_1", subject:"crane", theme:7, q:"歯車Aが毎分900回転で、これとかみ合う歯車B(A:20歯、B:60歯)を回転させているとき、歯車Bの回転数として正しいものはどれか。", choices:["200 rpm","150 rpm","300 rpm","450 rpm","600 rpm"], answer:2, diagram:{"type":"gearTrain","params":{"tA":20,"tB":60,"nA":"900rpm","nB":"?"}}, explain:"かみ合う歯車どうしは(回転数×歯数)が等しくなるので、N_B = 900×20/60 = 300rpmとなります。"},
{license:"crane_fixed", id:"c_t7_2", subject:"crane", theme:7, q:"図のような歯車列において、歯車A(16歯)が毎分1200回転し、これとかみ合う歯車B(48歯)がある。BとCは同じ軸に固定されており、C(24歯)は歯車D(96歯)とかみ合っている。歯車Dの回転数として正しいものはどれか。", choices:["150 rpm","100 rpm","50 rpm","200 rpm","80 rpm"], answer:1, diagram:{"type":"gearTrain","params":{"tA":16,"tB":48,"tC":24,"tD":96,"nA":"1200rpm","nD":"?"}}, explain:"N_B = 1200×16/48 = 400rpm。BとCは同軸なのでN_C=400rpm。N_D = 400×24/96 = 100rpmとなります。"},
{license:"crane_fixed", id:"c_t7_3", subject:"crane", theme:7, q:"歯車A(18歯)が電動機により毎分1400回転し、これとかみ合う歯車B(63歯)を回転させているとき、歯車Bの回転数に最も近いものはどれか。", choices:["200 rpm","300 rpm","600 rpm","400 rpm","500 rpm"], answer:3, diagram:{"type":"gearTrain","params":{"tA":18,"tB":63,"nA":"1400rpm","nB":"?"}}, explain:"N_B = 1400×18/63 = 400rpmとなります。"},
{license:"crane_fixed", id:"c_t7_4", subject:"crane", theme:7, q:"図のような歯車列で、歯車A(20歯)が毎分1500回転し、これとかみ合う歯車B(75歯)、Bと同じ軸に固定された歯車C(30歯)があり、Cとかみ合う歯車Dが毎分100回転しているとき、歯車Dの歯数として正しいものはどれか。", choices:["150枚","90枚","100枚","60枚","120枚"], answer:4, diagram:{"type":"gearTrain","params":{"tA":20,"tB":75,"tC":30,"tD":"?","nA":"1500rpm","nD":"100rpm"}}, explain:"N_B = 1500×20/75 = 400rpm = N_C。歯数T_D = N_C×T_C/N_D = 400×30/100 = 120枚となります。"},
{license:"crane_fixed", id:"c_t7_5", subject:"crane", theme:7, q:"歯車A(24歯)が毎分800回転し、これとかみ合う歯車Bが毎分240回転しているとき、歯車Bの歯数として正しいものはどれか。", choices:["120枚","80枚","100枚","40枚","60枚"], answer:1, diagram:{"type":"gearTrain","params":{"tA":24,"tB":"?","nA":"800rpm","nB":"240rpm"}}, explain:"T_B = N_A×T_A/N_B = 800×24/240 = 80枚となります。"},
{license:"crane_fixed", id:"c_t7_6", subject:"crane", theme:7, q:"図のような歯車列で、歯車A(15歯)が毎分1800回転し、これとかみ合う歯車B(90歯)、Bと同じ軸に固定された歯車C(20歯)があり、Cとかみ合う歯車D(80歯)であるとき、歯車Dの回転数として正しいものはどれか。", choices:["60 rpm","90 rpm","120 rpm","75 rpm","37.5 rpm"], answer:3, diagram:{"type":"gearTrain","params":{"tA":15,"tB":90,"tC":20,"tD":80,"nA":"1800rpm","nD":"?"}}, explain:"N_B = 1800×15/90 = 300rpm = N_C。N_D = 300×20/80 = 75rpmとなります。"},
{license:"crane_fixed", id:"c_t7_7", subject:"crane", theme:7, q:"歯車Aが毎分1000回転し、これとかみ合う歯車B(50歯)が毎分200回転しているとき、歯車Aの歯数として正しいものはどれか。", choices:["10枚","20枚","50枚","5枚","25枚"], answer:0, diagram:{"type":"gearTrain","params":{"tA":"?","tB":50,"nA":"1000rpm","nB":"200rpm"}}, explain:"T_A = N_B×T_B/N_A = 200×50/1000 = 10枚となります。"},
{license:"crane_fixed", id:"c_t7_8", subject:"crane", theme:7, q:"図のような歯車列で、歯車A(12歯)が毎分2400回転し、これとかみ合う歯車B(48歯)、Bと同じ軸に固定された歯車C(36歯)があり、Cとかみ合う歯車D(108歯)であるとき、歯車Dの回転数として正しいものはどれか。", choices:["150 rpm","400 rpm","200 rpm","300 rpm","100 rpm"], answer:2, diagram:{"type":"gearTrain","params":{"tA":12,"tB":48,"tC":36,"tD":108,"nA":"2400rpm","nD":"?"}}, explain:"N_B = 2400×12/48 = 600rpm = N_C。N_D = 600×36/108 = 200rpmとなります。"},
{license:"crane_fixed", id:"c_t8_1", subject:"crane", theme:8, q:"クライミング式ジブクレーンに関する記述として、正しいものはどれか。", choices:["クライミング式ジブクレーンのクライミング方法には、マストクライミング方式とフロアクライミング方式がある。","クライミング式ジブクレーンは、屋内専用のクレーンである。","クライミング式ジブクレーンのクライミング方式は、1種類のみである。","クライミング式ジブクレーンには、クライミングという概念自体が存在しない。","クライミング式ジブクレーンは、水平方向にのみ移動し、上昇・下降はできない。"], answer:0, explain:"クライミング式ジブクレーンのクライミング方法には、マストクライミング方式とフロアクライミング方式の2種類があります。"},
{license:"crane_fixed", id:"c_t8_2", subject:"crane", theme:8, q:"引込みクレーンに関する記述として、正しいものはどれか。", choices:["引込みクレーンは、常に垂直方向にのみ荷を移動させるクレーンである。","引込みクレーンには、水平引込みをさせるための機構により、ダブルリンク式、スイングレバー式、ロープバランス式などがある。","引込みクレーンの水平引込み機構には、ロープトロリ式及びマントロリ式の2種類しか存在しない。","引込みクレーンは、水平引込みの動作を一切行わないクレーンである。","引込みクレーンには、水平引込み機構は存在しない。"], answer:1, explain:"引込みクレーンの水平引込み機構には、ダブルリンク式・スイングレバー式・ロープバランス式などがあります。ロープトロリ式・マントロリ式はトロリの走行形式を表す別の分類です。"},
{license:"crane_fixed", id:"c_t8_3", subject:"crane", theme:8, q:"テルハに関する記述として、正しいものはどれか。", choices:["テルハは、必ず屋外に設置されるクレーンである。","テルハには、巻上げ・巻下げの機能はない。","テルハは、走行、旋回及び起伏の運動を行うクレーンである。","テルハは、旋回運動を主な特徴とするクレーンである。","テルハは、通常、工場・倉庫などの天井に取り付けられたI形鋼下フランジに電気ホイストや電動チェーンブロックをつり下げたもので、荷の巻上げ・巻下げとレールに沿った横行のみを行う。"], answer:4, explain:"テルハは、I形鋼下フランジに電気ホイスト等をつり下げ、荷の巻上げ・巻下げとレールに沿った横行のみを行う構造で、起伏や旋回の運動は行いません。"},
{license:"crane_fixed", id:"c_t8_4", subject:"crane", theme:8, q:"橋形クレーンに関する記述として、正しいものはどれか。", choices:["橋形クレーンは、天井クレーンと構造が同一である場合、常に天井クレーンに分類される。","橋形クレーンの分類は、設置場所とは無関係に決まる。","橋形クレーンには、脚部が存在しない。","橋形クレーンは、屋内専用のクレーンである。","屋外の架構上に設けられたランウェイのレール上を走行するクレーンは、天井クレーンと同じ構造及び形状のものであっても橋形クレーンという。"], answer:4, explain:"屋外の架構上に設けられたランウェイのレール上を走行するクレーンは、天井クレーンと構造・形状が同じであっても橋形クレーンと呼ばれます。"},
{license:"crane_fixed", id:"c_t8_5", subject:"crane", theme:8, q:"ケーブルクレーンに関する記述として、正しいものはどれか。", choices:["ケーブルクレーンのトロリが移動する運動を「走行」という。","ケーブルクレーンには、トロリという概念は存在しない。","ケーブルクレーンは、屋内専用の設備である。","ケーブルクレーンは、レール上を走行する天井クレーンの一種である。","ケーブルクレーンは、相対する二つの塔の間に張り渡したメインロープを軌道としてトロリが横行するクレーンで、ダム工事現場でのコンクリート打設、橋梁の架設工事などに使用されている。"], answer:4, explain:"ケーブルクレーンは、相対する二つの塔の間に張り渡したメインロープ上をトロリが横行する形式のクレーンで、ダム工事や橋梁架設工事などに使用されます。トロリの移動は「横行」と呼ばれます。"},
{license:"crane_fixed", id:"c_t8_6", subject:"crane", theme:8, q:"アンローダに関する記述として、正しいものはどれか。", choices:["アンローダは、コンテナをスプレッダでつり上げるための専用クレーンである。","アンローダは、フックのみを備え、グラブバケットは使用しない。","アンローダは、専ら倉庫内の荷の出し入れに使用される。","アンローダには、ホッパーやコンベヤは組み込まれない。","アンローダは、船から鉄鉱石などのばら物をグラブバケットを用いて陸揚げする専門のクレーンで、多くの場合、ばら物を受け入れるためのホッパーとコンベヤが組み込まれている。"], answer:4, explain:"アンローダは、船からばら物をグラブバケットで陸揚げする専用クレーンで、ホッパーとコンベヤが組み込まれていることが多いのが特徴です。"},
{license:"crane_fixed", id:"c_t8_7", subject:"crane", theme:8, q:"コンテナクレーン及びスタッカー式クレーンに関する記述として、正しいものはどれか。", choices:["コンテナクレーンは、コンテナをスイングレバーと呼ばれるつり具でつり上げるクレーンである。","スタッカー式クレーンは、直立したガイドフレームに沿って上下するフォークなどを持たない。","スタッカー式クレーンは、運転室又は運転台が固定され、昇降を一切行わない構造のクレーンである。","コンテナクレーンは、埠頭においてコンテナを専用のつり具であるスプレッダでつり上げて、陸揚げ及び積込みを行うクレーンである。","スタッカー式クレーンは、倉庫の棚などへの荷の出し入れには使用されない。"], answer:3, explain:"コンテナクレーンは、専用のつり具であるスプレッダでコンテナをつり上げるクレーンです。スタッカー式クレーンは運転室・運転台が荷の昇降とともに昇降し、ガイドフレームに沿って上下するフォークなどを用いて倉庫の棚への荷の出し入れを行います。"},
{license:"crane_fixed", id:"c_t8_8", subject:"crane", theme:8, q:"クレーンの種類・型式に関する記述として、誤っているものはどれか。", choices:["橋形クレーンは、設置場所(屋外の架構上のランウェイ)によって分類され、構造が天井クレーンと同一であっても橋形クレーンと呼ばれる。","テルハは、レールに沿った横行と、荷の巻上げ・巻下げのみを行う構造である。","スタッカー式クレーンは、倉庫の棚などへの荷の出し入れに使用される。","ケーブルクレーンは、2つの塔の間に張り渡したメインロープ上をトロリが横行する形式である。","クライミング式ジブクレーンのクライミング方式は、フロアクライミング方式のみである。"], answer:4, explain:"クライミング式ジブクレーンのクライミング方式には、マストクライミング方式とフロアクライミング方式の2種類があるため、この記述は誤りです。"},
{license:"crane_fixed", id:"c_t9_1", subject:"crane", theme:9, q:"クラブ(クラブトロリ)に関する記述として、正しいものはどれか。", choices:["クラブとは、トロリフレーム上に巻上装置と走行装置を備えたトロリをいう。","クラブとは、トロリフレーム上に巻上装置と横行装置を備え、2本のレール上を自走するトロリをいう。","クラブは、1本のレール上のみを移動する構造である。","クラブは、旋回運動のみを行う機構である。","クラブには、巻上装置は搭載されない。"], answer:1, explain:"クラブ(クラブトロリ)は、巻上装置と横行装置を備え、2本のレール上を自走するトロリです。トロリの移動は「横行」であり「走行」ではありません。"},
{license:"crane_fixed", id:"c_t9_2", subject:"crane", theme:9, q:"ホイストに関する記述として、正しいものはどれか。", choices:["ホイストには、ブレーキは組み込まれない。","ホイストは、大型のクレーンにのみ使用され、小型の設備には使用されない。","ホイストは、電動機を使用しない完全手動の装置である。","ホイストは、巻上げ機能のみを持ち、横行の機能は一切持たない。","ホイストは、電動機、減速装置、巻上げドラム、ブレーキなどを小型のケーシング内に収めたもので、巻上装置と横行装置が一体化されている。"], answer:4, explain:"ホイストは、電動機・減速装置・巻上げドラム・ブレーキなどを小型のケーシングに収め、巻上装置と横行装置を一体化した装置です。"},
{license:"crane_fixed", id:"c_t9_3", subject:"crane", theme:9, q:"ワイヤロープ式ホイストの型式に関する記述として、正しいものはどれか。", choices:["トップランニング式は単軌条にぶら下がる形式であり、サスペンション式は2本のレール上を走行する形式である。","サスペンション式は、屋外専用の形式である。","トップランニング式とサスペンション式に、構造上の違いは存在しない。","トップランニング式・サスペンション式のいずれも、レールを必要としない構造である。","トップランニング式は2本のレール上を走行(自走)する形式であり、サスペンション式は単軌条(I形鋼下フランジなど)に沿って移動する形式である。"], answer:4, explain:"トップランニング式は2本のレール上を自走する形式、サスペンション式は単軌条(モノレール)に沿って移動する形式です。"},
{license:"crane_fixed", id:"c_t9_4", subject:"crane", theme:9, q:"旋回装置に関する記述として、正しいものはどれか。", choices:["旋回環方式は、走行運動のための装置である。","旋回装置は、クレーンには一切用いられない。","ジブクレーンなどの旋回装置の旋回方式には、センターポスト方式、旋回環方式などがある。","旋回装置の方式は、常に1種類のみである。","センターポスト方式は、旋回運動を行わない固定構造である。"], answer:2, explain:"ジブクレーンなどの旋回装置の旋回方式には、センターポスト方式や旋回環方式などがあります。"},
{license:"crane_fixed", id:"c_t9_5", subject:"crane", theme:9, q:"主巻・補巻に関する記述として、正しいものはどれか。", choices:["補巻は、主巻よりも大きな荷重を扱うために設けられる。","主巻・補巻という区分は、天井クレーンには存在しない。","主巻の巻上げ速度は、常に補巻より速い。","巻上装置に主巻と補巻を設ける場合、一般に、主巻の巻上げ速度は、補巻より遅い。","主巻と補巻の速度は、常に同一である。"], answer:3, explain:"一般に、主巻(大容量・低速)は補巻(小容量・高速)より巻上げ速度が遅い構成となっています。"},
{license:"crane_fixed", id:"c_t9_6", subject:"crane", theme:9, q:"天井クレーンの走行装置に関する記述として、正しいものはどれか。", choices:["走行装置には、いかなる場合も電動機を用いない。","1電動機式走行装置は、両側のサドルにそれぞれ電動機を備える構造である。","走行装置は、クレーンのトロリを横行させるための装置である。","1電動機式走行装置は、片側のサドルに電動機と減速装置を備え、電動機側の走行車輪のみを駆動する。","1電動機式走行装置では、駆動されない側の車輪は取り外されている。"], answer:3, explain:"1電動機式走行装置は、片側のサドルにのみ電動機と減速装置を備え、電動機側の走行車輪を駆動する構造です(反対側へは軸等で動力を伝える場合もあります)。両側にそれぞれ電動機を備えるのは2電動機式です。"},
{license:"crane_fixed", id:"c_t9_7", subject:"crane", theme:9, q:"クレーンのトロリ及び作動装置に関する記述として、誤っているものはどれか。", choices:["ホイストは、巻上装置と旋回装置が一体化された小型の装置である。","クラブトロリは、巻上装置と横行装置を備え、2本のレール上を自走するトロリである。","ジブクレーンなどの旋回装置の旋回方式には、センターポスト方式や旋回環方式などがある。","主巻の巻上げ速度は、一般に補巻より遅い。","走行装置は、クレーン全体を移動させる装置で、2電動機式や1電動機式などの駆動方法がある。"], answer:0, explain:"ホイストは、巻上装置と横行装置が一体化された装置であり、「旋回装置」との一体化ではありません。"},
{license:"crane_fixed", id:"c_t9_8", subject:"crane", theme:9, q:"クレーンの作動装置に関する記述として、正しいものはどれか。", choices:["横行装置は、クレーン全体を移動させる装置である。","横行装置は、トロリを移動させる装置で、一般に、電動機の回転を減速装置で減速し、横行車輪を駆動する。","巻上装置は、クレーン全体を走行させるための装置である。","旋回装置は、トロリを横行させるための装置である。","作動装置の種類は、走行装置のみである。"], answer:1, explain:"横行装置はトロリを移動させる装置で、電動機の回転を減速装置で減速して横行車輪を駆動します。クレーン全体を移動させるのは走行装置です。"},
{license:"crane_fixed", id:"c_t10_1", subject:"crane", theme:10, q:"インバーター制御のクレーンに関する記述として、正しいものはどれか。", choices:["インバーター制御のクレーンは、低速から高速まで無段階に精度の高い速度制御ができるので、インチング動作をせずに微速運転で位置を合わせることができる。","インバーター制御のクレーンは、段階的な速度切替えしかできない。","インバーター制御のクレーンでは、微速運転を行うために必ずインチング動作を併用しなければならない。","インバーター制御のクレーンは、速度制御を行うことができない。","インバーター制御は、走行装置にのみ適用され、巻上げ装置には適用できない。"], answer:0, explain:"インバーター制御のクレーンは無段階に精度の高い速度制御ができるため、インチング動作をせずに微速運転で位置合わせを行うことができます。"},
{license:"crane_fixed", id:"c_t10_2", subject:"crane", theme:10, q:"ジブクレーンの運転に関する記述として、正しいものはどれか。", choices:["ジブクレーンの作業半径は、荷の質量にかかわらず常に一定である。","ジブクレーンでは、定格荷重に近い荷をつる場合であっても、作業半径の変化を確認する必要はない。","ジブクレーンは、マストやジブがたわんでも作業半径は変化しない構造である。","ジブクレーンで荷をつるときは、マストやジブのたわみにより作業半径が大きくなることがあるので、定格荷重に近い質量の荷をつる場合には、たわみにより大きくなった作業半径における定格荷重を超えないことを確認する。","ジブのたわみは、クレーンの安全性には一切関係しない。"], answer:3, explain:"ジブクレーンでは、マストやジブのたわみにより作業半径が大きくなることがあるため、定格荷重に近い荷をつる際にはたわみ後の作業半径における定格荷重を超えないことを確認する必要があります。"},
{license:"crane_fixed", id:"c_t10_3", subject:"crane", theme:10, q:"無線操作方式のクレーンに関する記述として、正しいものはどれか。", choices:["無線操作方式のクレーンには、誤操作を防止する仕組みは一切設けられていない。","無線操作方式のクレーンは、玉掛け作業と同時に運転操作を行うことが推奨されている。","無線操作方式のクレーンで運転者自身が玉掛け作業を行うときは、制御器の電源スイッチを「入」にしたまま、他の者が操作できない場所に置いておけばよい。","無線操作方式のクレーンの制御器には、電源スイッチという概念が存在しない。","無線操作方式のクレーンで、運転者自身が玉掛け作業を行うときは、制御器の操作スイッチなどへの接触による誤動作を防止するため、制御器の電源スイッチを切っておく。"], answer:4, explain:"無線操作方式のクレーンで運転者自身が玉掛け作業を行うときは、誤操作防止のため制御器の電源スイッチを切っておく必要があります。"},
{license:"crane_fixed", id:"c_t10_4", subject:"crane", theme:10, q:"クレーンの運転時の取扱いに関する記述として、正しいものはどれか。", choices:["巻上げ操作による荷の横引きを行うときは、周囲に人がいないことを確認してから行う。","荷の横引きを行う際は、周囲ではなく足元のみを確認すればよい。","荷の横引きは、玉掛け作業者の判断のみで行ってよく、運転者の確認は不要である。","巻上げ操作による荷の横引きは、周囲の確認を行わなくても常に安全である。","荷の横引きは、確認作業自体が不要な操作である。"], answer:0, explain:"巻上げ操作による荷の横引きを行うときは、周囲に人がいないことを確認してから行う必要があります。"},
{license:"crane_fixed", id:"c_t10_5", subject:"crane", theme:10, q:"巻下げ過ぎ防止装置に関する記述として、正しいものはどれか。", choices:["巻下げ過ぎ防止装置のないクレーンでは、フックをどれだけ巻き下げても問題は生じない。","巻下げ過ぎ防止装置は、走行装置の異常を防止する装置である。","巻下げ過ぎ防止装置のないクレーンのフックを巻き下げ続けると、逆巻きになるおそれがある。","巻下げ過ぎ防止装置は、すべてのクレーンに標準装備されている。","逆巻きとは、ワイヤロープが正常に巻き上げられる現象をいう。"], answer:2, explain:"巻下げ過ぎ防止装置のないクレーンのフックを限界を超えて巻き下げ続けると、ドラムに逆巻きが生じるおそれがあります。"},
{license:"crane_fixed", id:"c_t10_6", subject:"crane", theme:10, q:"つり荷を下ろしたときに玉掛け用ワイヤロープが挟まり、手で抜けなくなった場合の対応として、適切なものはどれか。", choices:["周囲に人がいないことを確認したうえで、荷の位置をずらすなど安全な方法で対処し、クレーンの巻上げ運転の力で無理に引き抜くことは避ける。","ワイヤロープが挟まった場合は、必ず新しいワイヤロープに交換しなければならず、他の対応方法はない。","周囲を確認せずに、直ちにクレーンの巻上げ運転で強く引き抜く。","ワイヤロープが挟まった場合は、そのまま放置してよい。","クレーンの巻上げ運転の力を使えば、どのような状況でも安全に引き抜くことができる。"], answer:0, explain:"挟まったワイヤロープをクレーンの動力で無理に引き抜こうとすると、荷崩れやロープの損傷などの危険があるため、安全な方法で対処することが重要です。"},
{license:"crane_fixed", id:"c_t10_7", subject:"crane", theme:10, q:"床上操作式クレーンでつり荷を移動させるときの取扱いとして、適切なものはどれか。", choices:["つり荷の前方に立ち、つり荷とともに歩きながら操作する。","つり荷の運搬経路及び荷下ろし位置の安全を確認しつつ、つり荷の直下や進行方向の前方など危険な位置を避けて操作する。","つり荷の直下に立って操作することが望ましい。","運搬経路の安全確認は、荷下ろし後に行えばよい。","つり荷の移動中は、周囲の安全確認を行う必要はない。"], answer:1, explain:"つり荷の直下や進行方向の前方など、荷が接触するおそれのある危険な位置を避けて操作し、運搬経路と荷下ろし位置の安全を随時確認することが重要です。"},
{license:"crane_fixed", id:"c_t10_8", subject:"crane", theme:10, q:"クレーンの運転時の一般的注意事項として、誤っているものはどれか。", choices:["ジブクレーンでは、たわみによる作業半径の変化を考慮する必要がある。","巻下げ過ぎ防止装置がなくても、フックを巻き下げ続けることに何の問題もない。","無線操作方式で自ら玉掛けを行うときは、制御器の電源を切っておく必要がある。","インバーター制御のクレーンは、低速から高速まで無段階に精度の高い速度制御ができる。","荷の横引きを行うときは、周囲の安全確認が必要である。"], answer:1, explain:"巻下げ過ぎ防止装置がないクレーンでフックを限界を超えて巻き下げ続けると、逆巻きが生じるおそれがあるため、「何の問題もない」というのは誤りです。"},
{license:"crane_fixed", id:"l_t1_1", subject:"law", theme:1, q:"建設物の内部に設置する走行クレーンと建設物等との間隔に関する記述として、正しいものはどれか。", choices:["歩道面と上方の梁等との間隔は、クレーンの種類にかかわらず一律1m以上でよい。","歩道面と上方の梁等との間隔についての基準は、法令上定められていない。","クレーンガーダに歩道を有するクレーンでは、当該歩道面と上方の梁・桁・照明器具・配管の下部等との間隔を1.8m以上としなければならない。","歩道面と上方の梁等との間隔は、いかなる場合も0.4m以上あればよい。","歩道面と上方の梁等との間隔の基準は、走行クレーンには適用されない。"], answer:2, explain:"クレーン等安全規則第13条により、クレーンガーダの歩道面と上方の梁・桁・照明器具・配管の下部等との間隔は1.8m以上とすることとされています。"},
{license:"crane_fixed", id:"l_t1_2", subject:"law", theme:1, q:"クレーンの最高部(集電装置の部分を除く)と、上方の梁・桁・照明器具・配管の下部等との間隔に関する記述として、正しいものはどれか。", choices:["当該間隔は、集電装置の部分を含めて測定しなければならない。","当該間隔は、0.4m以上としなければならない。","当該間隔は、クレーンの運転速度に応じて決められる。","当該間隔についての基準は存在しない。","当該間隔は、1.8m以上としなければならない。"], answer:1, explain:"クレーンの最高部(集電装置の部分を除く)と上方の障害物との間隔は0.4m以上とすることとされています。歩道面との間隔基準(1.8m以上)とは別の基準です。"},
{license:"crane_fixed", id:"l_t1_3", subject:"law", theme:1, q:"建設物内に設置する走行クレーンと建設物等との間隔の規定が適用されないクレーンに関する記述として、正しいものはどれか。", choices:["屋外に設置されたクレーンには、間隔の規定は一切適用されない。","クレーンガーダを有しないもの又はクレーンガーダに歩道を有しないものについては、この間隔の規定は適用されない。","間隔の規定は、つり上げ荷重が大きいクレーンにのみ適用される。","間隔の規定は、天井クレーンにのみ適用され、橋形クレーンには適用されない。","すべての走行クレーンに、例外なく間隔の規定が適用される。"], answer:1, explain:"クレーンガーダを有しないもの、又はクレーンガーダに歩道を有しないものについては、この間隔の規定の対象から除かれます。"},
{license:"crane_fixed", id:"l_t1_4", subject:"law", theme:1, q:"建設物とクレーンとの間の歩道の幅に関する記述として、正しいものはどれか。", choices:["歩道の幅についての基準は、法令上定められていない。","歩道の幅は、つり上げ荷重によってのみ決まり、柱の有無とは無関係である。","歩道の幅は、クレーンの運転室がある場合にのみ規定される。","歩道の幅は、いかなる部分であっても0.2mあれば十分である。","歩道の幅は、建設物の柱等に接する部分を除き、0.6m以上としなければならない。"], answer:4, explain:"建設物とクレーンとの間に設ける歩道の幅は、柱等に接する部分を除き0.6m以上とすることとされています。"},
{license:"crane_fixed", id:"l_t1_5", subject:"law", theme:1, q:"建設物とクレーンとの間の歩道のうち、建設物の柱等に接する部分の歩道の幅に関する記述として、正しいものはどれか。", choices:["柱等に接する部分の歩道の幅は、0.3mであれば基準を満たす。","柱等に接する部分の歩道には、幅の基準はない。","柱等に接する部分の歩道の幅は、0.4m以上としなければならない。","柱等に接する部分の歩道は、設けることが禁止されている。","柱等に接する部分の歩道の幅は、他の部分よりも広くしなければならない。"], answer:2, explain:"柱等に接する部分の歩道の幅は0.4m以上とすることとされており、0.3mでは基準を満たさず違反となります。"},
{license:"crane_fixed", id:"l_t1_6", subject:"law", theme:1, q:"クレーンの運転室の端と、運転室に通ずる歩道の端との間隔に関する記述として、適切なものはどれか。", choices:["運転室の端と歩道の端との間隔は、つり上げ荷重が大きいクレーンほど狭くしてよい。","運転室の端と歩道の端との間隔は、クレーンの製造者が自由に決めてよく、法令上の制約はない。","運転室の端と歩道の端との間隔についての基準は存在しない。","労働者が墜落するおそれがあるときは、当該間隔について安全を確保するための基準が設けられている。","運転室の端と歩道の端との間隔は、常に0m(隙間なし)でなければならない。"], answer:3, explain:"クレーンの運転室の端から労働者が墜落するおそれがある場合には、運転室の端と歩道の端との間隔について安全確保のための基準が定められています。"},
{license:"crane_fixed", id:"l_t1_7", subject:"law", theme:1, q:"建設物内設置クレーンと建設物等との間隔の規定の適用除外に関する記述として、正しいものはどれか。", choices:["適用除外は、運転士の経験年数によって決まる。","適用除外は、つり上げ荷重が3t未満のクレーンにのみ適用される。","一定の時点(昭和37年11月1日)においてすでに建設物の内部に設置されていたクレーンなど、一部のクレーンについては適用除外となる場合がある。","適用除外は、クレーンの色によって決まる。","適用除外となるクレーンは一切存在しない。"], answer:2, explain:"昭和37年11月1日時点で既に設置されていたクレーンなど、一定の要件に該当するクレーンについては、この間隔の規定が適用されない場合があります。"},
{license:"crane_fixed", id:"l_t1_8", subject:"law", theme:1, q:"建設物内に設置されたクレーンと建設物等との間隔に関する記述として、誤っているものはどれか。", choices:["クレーンガーダの歩道面と上方の梁等との間隔は、1.8m以上としなければならない。","建設物の柱等に接する部分の歩道の幅は、0.4m以上としなければならない。","クレーンの最高部(集電装置の部分を除く)と上方の梁等との間隔は、0.4m以上としなければならない。","建設物の柱等に接する部分以外の歩道の幅は、0.6m以上としなければならない。","これらの間隔・幅の基準は、性能検査の合否には一切関係しない。"], answer:4, explain:"法定間隔が確保されていない場合、性能検査で完全な合格が見込めないなど、有効期間の更新にも影響することがあります。「一切関係しない」という記述は誤りです。"},
{license:"crane_fixed", id:"l_t2_1", subject:"law", theme:2, q:"クレーンに係る作業において、つり上げられている荷の下への労働者の立入りに関する記述として、正しいものはどれか。", choices:["動力下降以外の方法で荷を下降させるときは、常に労働者を立ち入らせてよい。","荷の下への立入り禁止は、屋外作業にのみ適用される。","つり上げられている荷の下への立入りには、いかなる規制もない。","動力下降以外の方法によって荷を下降させるときは、原則としてつり上げられている荷の下に労働者を立ち入らせてはならない。","荷の下への立入り禁止の規定は、つり上げ荷重が小さいクレーンには適用されない。"], answer:3, explain:"動力下降以外の方法によって荷を下降させるときは、つり上げられている荷の下に労働者を立ち入らせてはなりません。"},
{license:"crane_fixed", id:"l_t2_2", subject:"law", theme:2, q:"複数の荷を一度につり上げる場合の立入り制限に関する記述として、正しいものはどれか。", choices:["立入り制限は、荷が1個の場合にのみ適用される。","複数の荷であっても、固定されていなければ立ち入らせてよい。","複数の荷が結束され、箱に入れられる等により固定されていないときは、つり上げられている荷の下に労働者を立ち入らせてはならない。","複数の荷を一度につり上げること自体が、法令上禁止されている。","複数の荷は、結束されていなくても常に安全である。"], answer:2, explain:"複数の荷を一度につり上げる場合、結束や梱包等により固定されていないときは、荷の下に労働者を立ち入らせてはなりません。"},
{license:"crane_fixed", id:"l_t2_3", subject:"law", theme:2, q:"ハッカーを用いて玉掛けをした荷に関する記述として、正しいものはどれか。", choices:["ハッカーを用いた玉掛けには、立入り制限の規定は適用されない。","ハッカーを2個以上用いていれば、荷の下に労働者を立ち入らせてもよい。","ハッカーは、玉掛用具には該当しない。","ハッカーを1個用いた場合のみ、立入りが禁止される。","ハッカーを用いて玉掛けをした荷がつり上げられているときは、その数にかかわらず、つり上げられている荷の下に労働者を立ち入らせてはならない。"], answer:4, explain:"ハッカーを用いて玉掛けをした荷は、その使用数にかかわらず、荷の下への労働者の立入りが禁止されます。"},
{license:"crane_fixed", id:"l_t2_4", subject:"law", theme:2, q:"陰圧により吸着させるつり具(バキュームリフター等)を用いて玉掛けをした荷に関する記述として、正しいものはどれか。", choices:["陰圧により吸着させるつり具を用いた場合、荷の下に人がいても安全確認は不要である。","陰圧により吸着させるつり具を用いる場合、立入り制限の規定は適用されない。","陰圧により吸着させるつり具は、他の玉掛用具よりも安全性が高いため、立入り制限の対象外である。","陰圧により吸着させるつり具は、法令上、玉掛用具として認められていない。","陰圧により吸着させるつり具を用いて玉掛けをした荷がつり上げられているときは、つり上げられている荷の下に労働者を立ち入らせてはならない。"], answer:4, explain:"陰圧により吸着させるつり具を用いて玉掛けをした荷がつり上げられているときも、荷の下への労働者の立入りは禁止されます。"},
{license:"crane_fixed", id:"l_t2_5", subject:"law", theme:2, q:"ワイヤロープを用いた玉掛けと立入り制限に関する記述として、正しいものはどれか。", choices:["ワイヤロープを用いた玉掛けには、立入り制限の規定は一切適用されない。","荷に設けられた穴又はアイボルト等にワイヤロープを通して1箇所に玉掛けをした荷は、立入り禁止の対象とならない場合がある。","ワイヤロープを用いた玉掛けは、常に2箇所以上で行わなければ違法である。","ワイヤロープを用いて玉掛けをした荷は、方法にかかわらず、常に立入りが禁止される。","荷に設けられた穴にワイヤロープを通しても、通さなくても、立入り制限の扱いは同じである。"], answer:1, explain:"荷に設けられた穴又はアイボルト等にワイヤロープを通して1箇所に玉掛けをした場合は、構造的に確実であるため、立入り禁止の対象とならない場合があります。"},
{license:"crane_fixed", id:"l_t2_6", subject:"law", theme:2, q:"つりチェーンを用いた玉掛けと立入り制限に関する記述として、正しいものはどれか。", choices:["つりチェーンは、穴やアイボルトを通さなくても、常に安全に1箇所玉掛けができる用具である。","つりチェーンを用いる場合、玉掛け箇所の数にかかわらず立入りは常に許される。","つりチェーンを用いた玉掛けには、立入り制限の規定は適用されない。","つりチェーンは、玉掛用具に該当しない。","つりチェーンを用いて、荷に設けられた穴又はアイボルトを通さずに1箇所に玉掛けをした荷がつり上げられているときは、つり上げられている荷の下に労働者を立ち入らせてはならない。"], answer:4, explain:"穴又はアイボルトを通さずに1箇所のみで玉掛けをしたつりチェーンの荷は、荷の下への労働者の立入りが禁止されます。"},
{license:"crane_fixed", id:"l_t2_7", subject:"law", theme:2, q:"つりクランプを用いた玉掛けと立入り制限に関する記述として、正しいものはどれか。", choices:["つりクランプを用いた玉掛けには、立入り制限の規定は一切適用されない。","つりクランプを1個用いた場合と2個以上用いた場合とで、扱いに違いはない。","つりクランプを2個以上用いて玉掛けをした荷は、立入り禁止の対象とならない場合がある。","つりクランプは、何個用いても常に立入りが禁止される。","つりクランプは、玉掛用具として使用することが認められていない。"], answer:2, explain:"つりクランプを2個以上用いて確実に玉掛けをした荷は、立入り禁止の対象とならない場合があります。"},
{license:"crane_fixed", id:"l_t2_8", subject:"law", theme:2, q:"つり上げられている荷の下への立入りに関する記述として、誤っているものはどれか。", choices:["動力下降以外の方法で荷を下降させるときは、荷の下への立入りが禁止される。","つりクランプを2個以上用いて確実に玉掛けをした荷であっても、いかなる場合も荷の下への立入りは禁止される。","陰圧により吸着させるつり具を用いた玉掛けは、荷の下への立入りが禁止される。","ハッカーを用いた玉掛けは、個数にかかわらず、荷の下への立入りが禁止される。","結束等で固定されていない複数の荷を一度につり上げているときは、荷の下への立入りが禁止される。"], answer:1, explain:"つりクランプを2個以上用いて確実に玉掛けをした荷は、立入り禁止の対象とならない場合があります。「いかなる場合も禁止される」という記述は誤りです。"},
{license:"crane_fixed", id:"l_t3_1", subject:"law", theme:3, q:"玉掛け用ワイヤロープの使用禁止基準に関する記述として、正しいものはどれか。", choices:["素線の切断は、ワイヤロープ全長の10%以上でなければ問題とならない。","ワイヤロープ1よりの間において素線(フィラ線を除く)の数の10%以上の素線が切断しているものは、使用してはならない。","素線の切断数に関する使用禁止基準は、法令上定められていない。","素線の切断は、ワイヤロープの使用禁止基準とは無関係である。","素線が1本でも切断していれば、直ちに使用禁止となる。"], answer:1, explain:"ワイヤロープ1よりの間で素線数の10%以上が切断しているものは、使用が禁止されています。"},
{license:"crane_fixed", id:"l_t3_2", subject:"law", theme:3, q:"玉掛け用ワイヤロープの直径の減少に関する使用禁止基準として、正しいものはどれか。", choices:["直径の減少が公称径の3%を超えるものは、使用してはならない。","直径の減少に関する使用禁止基準は存在しない。","直径の減少が公称径の20%を超えなければ、問題はない。","直径の減少が公称径の7%を超えるものは、使用してはならない。","直径の減少は、色の変化で判断すればよく、数値基準はない。"], answer:3, explain:"ワイヤロープの直径の減少が公称径の7%を超えるものは、使用が禁止されています。"},
{license:"crane_fixed", id:"l_t3_3", subject:"law", theme:3, q:"玉掛け用ワイヤロープの使用禁止基準として、正しいものはどれか。", choices:["著しい腐食があっても、切断荷重に余裕があれば使用できる。","形くずれや腐食は、使用禁止の判断基準とはならない。","キンクしたもの、著しい形くずれ又は腐食があるものは、使用してはならない。","キンクの有無は、目視で確認する必要がなく、切断試験でのみ判断する。","キンクしたワイヤロープでも、補修すれば使用できる。"], answer:2, explain:"キンクしたもの、著しい形くずれ又は腐食があるワイヤロープは、使用が禁止されています。"},
{license:"crane_fixed", id:"l_t3_4", subject:"law", theme:3, q:"玉掛け用つりチェーンの使用禁止基準として、正しいものはどれか。", choices:["伸びが製造されたときの長さの5%を超えるものは、使用してはならない。","つりチェーンには、伸びに関する使用禁止基準は定められていない。","つりチェーンは、伸びていても切れなければ使用してよい。","つりチェーンの伸びは、使用禁止基準とは無関係である。","伸びが1%程度であれば、いかなる場合も使用禁止となる。"], answer:0, explain:"つりチェーンの伸びが製造時の長さの5%を超えるものは、使用が禁止されています。"},
{license:"crane_fixed", id:"l_t3_5", subject:"law", theme:3, q:"玉掛け用つりチェーンのリンクの断面に関する使用禁止基準として、正しいものはどれか。", choices:["リンクの断面の直径の減少は、目視では判断できないため基準が存在しない。","リンクの断面が減少しても、伸びがなければ問題ない。","リンクの断面の直径の減少については、使用禁止基準は定められていない。","リンクの断面の直径の減少が、製造されたときの当該直径の10%を超えるものは、使用してはならない。","リンクの断面の直径の減少が50%を超えない限り、使用禁止とはならない。"], answer:3, explain:"つりチェーンのリンクの断面の直径の減少が製造時の当該直径の10%を超えるものは、使用が禁止されています。"},
{license:"crane_fixed", id:"l_t3_6", subject:"law", theme:3, q:"玉掛け用具の安全係数に関する記述として、正しいものはどれか。", choices:["シャックルの安全係数は、使用回数によって変動する基準である。","フック又はシャックルの安全係数は、5以上でなければ使用してはならない。","フックやシャックルには、安全係数の基準は適用されない。","フック又はシャックルの安全係数は、3以上であれば十分である。","フックの安全係数は、ワイヤロープと同じく6以上でなければならない。"], answer:1, explain:"玉掛け用フック又はシャックルの安全係数は5以上でなければ使用できません。"},
{license:"crane_fixed", id:"l_t3_7", subject:"law", theme:3, q:"玉掛用具の安全係数に関する記述として、正しいものはどれか。", choices:["安全係数は、ワイヤロープの色によって定められる。","安全係数は、切断荷重とは無関係に定められる値である。","玉掛け用ワイヤロープの安全係数は6以上、フック又はシャックルの安全係数は5以上でなければならない。","ワイヤロープとフックの安全係数は、常に同じ値である。","玉掛用具には、安全係数という概念は存在しない。"], answer:2, explain:"玉掛け用ワイヤロープの安全係数は6以上、フック又はシャックルの安全係数は5以上と、それぞれ法令で定められています。"},
{license:"crane_fixed", id:"l_t3_8", subject:"law", theme:3, q:"玉掛用具の使用禁止基準に関する記述として、誤っているものはどれか。", choices:["ワイヤロープは、素線数の10%以上が切断しているものは使用禁止である。","これらの使用禁止基準は、ワイヤロープのみに適用され、つりチェーンやフックには適用されない。","つりチェーンは、伸びが製造時の長さの5%を超えるものは使用禁止である。","ワイヤロープは、直径の減少が公称径の7%を超えるものは使用禁止である。","フック・シャックルの安全係数は、5以上でなければ使用できない。"], answer:1, explain:"使用禁止基準はワイヤロープだけでなく、つりチェーンやフック・シャックルなど、それぞれの玉掛用具ごとに定められています。"},
{license:"crane_fixed", id:"l_t4_1", subject:"law", theme:4, q:"同一のランウェイに並置されている走行クレーンの修理、調整、点検等の作業を行うときの措置に関する記述として、正しいものはどれか。", choices:["関係者以外の立入りを禁止する表示のみで足り、監視人は不要である。","隣接するクレーンの運転を常に禁止しなければならない。","特に何の措置も講じる必要はない。","監視人をおくこと、ランウェイの上にストッパーを設けること等、労働者の危険を防止するための措置を講じなければならない。","この措置は、屋外設置のクレーンにのみ適用される。"], answer:3, explain:"同一ランウェイに並置された走行クレーンの修理等の作業時には、監視人の配置やストッパーの設置など、労働者の危険を防止する措置が必要です。"},
{license:"crane_fixed", id:"l_t4_2", subject:"law", theme:4, q:"クレーンの組立ての作業に関する記述として、正しいものはどれか。", choices:["組立ての作業中は、関係労働者以外の労働者を自由に立ち入らせてよい。","組立ての作業は、いかなる場合も夜間に行ってはならないと法令で定められている。","クレーンの組立ての作業を行うときは、作業を指揮する者を選任して、その者の指揮のもとに作業を実施させなければならない。","組立ての作業には、特に指揮者を選任する必要はない。","組立ての作業区域への関係労働者以外の立入り禁止措置は、任意で行えばよい。"], answer:2, explain:"クレーンの組立ての作業を行うときは、作業を指揮する者を選任し、その指揮のもとで作業を実施させなければなりません。"},
{license:"crane_fixed", id:"l_t4_3", subject:"law", theme:4, q:"強風時のクレーン作業に関する記述として、正しいものはどれか。", choices:["強風であっても、作業を中止する義務はない。","強風のため、クレーンの組立ての作業や運転作業の実施について危険が予想されるときは、当該作業に労働者を従事させてはならない。","強風時の作業中止の判断は、天候にかかわらず運転者個人の自由な裁量にのみ委ねられ、事業者の義務ではない。","強風時の作業中止に関する規定は、屋外のクレーンにのみ適用され、屋内のクレーンには一切適用されない。","強風時であっても、定格荷重以下であれば必ず作業を継続しなければならない。"], answer:1, explain:"強風により危険が予想されるときは、事業者はその作業に労働者を従事させてはなりません。"},
{license:"crane_fixed", id:"l_t4_4", subject:"law", theme:4, q:"強風のためジブクレーンに係る作業を中止した場合の措置に関する記述として、正しいものはどれか。", choices:["当該ジブクレーンのジブが損壊するおそれがあるときは、ジブの位置を固定させる等の措置を講じなければならない。","ジブの固定措置は、事業者の任意で行えばよい。","作業を中止したときは、直ちにジブクレーンを解体しなければならない。","ジブの固定措置は、屋内設置のジブクレーンにのみ必要である。","作業を中止した場合、ジブの状態にかかわらず特に措置を講じる必要はない。"], answer:0, explain:"強風により作業を中止した場合、ジブが損壊するおそれがあるときはジブの位置を固定する等の措置を講じる必要があります。"},
{license:"crane_fixed", id:"l_t4_5", subject:"law", theme:4, q:"屋外に設置されているクレーンについて、瞬間風速が毎秒30mを超える風が吹いた後に使用するときの点検に関する記述として、正しいものはどれか。", choices:["点検は、1か月以内に行えばよい。","あらかじめ、クレーンの各部分の異常の有無について点検を行わなければならない。","点検は、当該クレーンに係る作業の開始後、遅滞なく行えばよい。","瞬間風速が毎秒30mを超える風が吹いても、点検の必要はない。","点検は、性能検査のときにまとめて行えばよい。"], answer:1, explain:"瞬間風速が毎秒30mを超える風が吹いた後に使用するときは、作業を開始する前に(あらかじめ)クレーンの各部分の異常の有無について点検を行わなければなりません。"},
{license:"crane_fixed", id:"l_t4_6", subject:"law", theme:4, q:"クレーンの点検の作業を行う際の関係労働者以外の労働者への対応に関する記述として、正しいものはどれか。", choices:["関係労働者以外の労働者への対応は、事業者の任意で決めてよい。","関係労働者以外の労働者を立ち入らせる場合、特段の監視は不要である。","点検作業中は、すべての労働者の立入りを常に許可しなければならない。","点検の作業を行う区域に関係労働者以外の労働者を立ち入らせる場合には、作業を指揮する者に、当該労働者の作業状況を監視させなければならない。","関係労働者以外の労働者は、いかなる場合も立ち入らせてはならない。"], answer:3, explain:"点検作業の区域に関係労働者以外の者を立ち入らせる場合は、作業を指揮する者にその者の作業状況を監視させる必要があります。"},
{license:"crane_fixed", id:"l_t4_7", subject:"law", theme:4, q:"天井クレーンのクレーンガーダの上で点検の作業を行うときの措置に関する記述として、正しいものはどれか。", choices:["ガーダの上での点検作業には、特段の安全措置は不要である。","運転禁止の表示は、任意で行えばよい。","原則として、当該天井クレーンの運転を禁止するとともに、当該天井クレーンの操作部分に運転を禁止する旨の表示をしなければならない。","ガーダの上で点検作業を行っていても、クレーンを通常どおり運転してよい。","ガーダの上での点検作業は、法令上禁止されている。"], answer:2, explain:"クレーンガーダの上で点検作業を行うときは、原則として当該クレーンの運転を禁止し、操作部分に運転禁止の表示をしなければなりません。"},
{license:"crane_fixed", id:"l_t4_8", subject:"law", theme:4, q:"クレーンの組立て・点検・悪天候時の措置に関する記述として、誤っているものはどれか。", choices:["クレーンの組立ての作業を行うときは、作業を指揮する者を選任しなければならない。","悪天候時の作業中止や点検に関する規定は、事業者の努力目標にすぎず、法的な義務ではない。","強風のため危険が予想される作業は、労働者を従事させてはならない。","同一のランウェイに並置されている走行クレーンの点検作業には、監視人をおくなどの措置が必要である。","瞬間風速毎秒30mを超える風が吹いた後の点検は、あらかじめ行う必要がある。"], answer:1, explain:"悪天候時の作業中止や事後点検は、事業者に課された法的な義務であり、単なる努力目標ではありません。"},
{license:"crane_fixed", id:"l_t5_1", subject:"law", theme:5, q:"クレーンの定期自主検査の頻度に関する記述として、正しいものはどれか。", choices:["定期自主検査の頻度は、クレーンの使用者の任意で決定できる。","クレーンについては、1年以内ごとに1回及び1か月以内ごとに1回、それぞれ定期に自主検査を行わなければならない。","定期自主検査には、年次のもののみがあり、月次のものは存在しない。","定期自主検査は、5年に1回行えばよい。","定期自主検査は、事業者が必要と判断したときにのみ行えばよい。"], answer:1, explain:"クレーンの定期自主検査には年次(1年以内ごとに1回)と月次(1か月以内ごとに1回)の2種類があり、それぞれ実施が義務付けられています。"},
{license:"crane_fixed", id:"l_t5_2", subject:"law", theme:5, q:"クレーンの定期自主検査の結果の記録の保存に関する記述として、正しいものはどれか。", choices:["月次の定期自主検査の結果の記録は、保存する必要がない。","年次の定期自主検査の記録は3年間、月次の記録は1年間保存すればよい。","定期自主検査の記録の保存期間についての定めはない。","定期自主検査の記録は、1か月経過後に破棄してよい。","定期自主検査(年次・月次とも)を行ったときは、その結果を記録し、3年間保存しなければならない。"], answer:4, explain:"年次・月次いずれの定期自主検査についても、結果を記録し3年間保存することとされています。"},
{license:"crane_fixed", id:"l_t5_3", subject:"law", theme:5, q:"定期自主検査で異常を認めた場合の措置に関する記述として、正しいものはどれか。", choices:["異常を認めたときは、直ちに補修その他必要な措置を講じなければならない。","異常を認めても、事業者の判断のみで放置してよい場合がある。","異常を認めた場合の措置については、法令上の定めがない。","異常を認めた場合は、クレーンの使用を継続しながら補修すればよい。","異常を認めても、次回の定期自主検査まで補修を先延ばしにしてよい。"], answer:0, explain:"定期自主検査で異常を認めたときは、直ちに補修その他必要な措置を講じなければなりません。"},
{license:"crane_fixed", id:"l_t5_4", subject:"law", theme:5, q:"クレーンの作業開始前の点検に関する記述として、正しいものはどれか。", choices:["作業開始前の点検においては、ワイヤロープが通っている箇所の状態について点検を行わなければならない。","作業開始前の点検には、ワイヤロープの状態確認は含まれない。","作業開始前の点検は、性能検査に合格していれば不要である。","作業開始前の点検は、月に1回行えば足りる。","作業開始前の点検は、任意で省略してよい。"], answer:0, explain:"作業開始前の点検では、ワイヤロープが通っている箇所の状態について点検を行う必要があります。"},
{license:"crane_fixed", id:"l_t5_5", subject:"law", theme:5, q:"1か月を超える期間使用しなかったクレーンに関する記述として、正しいものはどれか。", choices:["使用を再開する場合、性能検査を新たに受け直さなければならない。","1か月を超えて使用しなかったクレーンは、そのまま廃棄しなければならない。","使用再開時の自主検査は、任意で省略できる。","当該期間中に行うべき定期自主検査を行わなかったクレーンについては、その使用を再び開始するに当たり、必要な自主検査を行わなければならない。","1か月を超えて使用しなかった場合でも、再開時に自主検査を行う必要はない。"], answer:3, explain:"1か月を超えて使用せず、その間の月次自主検査を行わなかったクレーンは、使用再開に当たり必要な自主検査を行う必要があります。"},
{license:"crane_fixed", id:"l_t5_6", subject:"law", theme:5, q:"クレーンの定期自主検査の内容に関する記述として、正しいものはどれか。", choices:["定期自主検査の内容は、事業者が独自に決めてよく、法令上の基準はない。","定期自主検査は、クレーンの製造者のみが行うことができる。","定期自主検査においては、巻過防止装置その他の安全装置の異常の有無について検査を行わなければならない。","定期自主検査では、安全装置の検査は対象外である。","定期自主検査は、外観の目視確認のみで足りる。"], answer:2, explain:"定期自主検査では、巻過防止装置その他の安全装置の異常の有無についても検査を行う必要があります。"},
{license:"crane_fixed", id:"l_t5_7", subject:"law", theme:5, q:"クレーンの点検・検査に関する記述として、誤っているものはどれか。", choices:["異常を認めたときは、直ちに必要な措置を講じる必要がある。","定期自主検査の結果は記録し、一定期間保存する必要がある。","年次の定期自主検査は、1年以内ごとに1回行う。","定期自主検査は、クレーンの使用者が実施するかどうかを自由に選択できる。","月次の定期自主検査は、1か月以内ごとに1回行う。"], answer:3, explain:"定期自主検査は事業者に義務付けられたものであり、実施の有無を自由に選択できるものではありません。"},
{license:"crane_fixed", id:"l_t5_8", subject:"law", theme:5, q:"クレーンの自主検査に関する記述として、正しいものはどれか。", choices:["定期自主検査は、法令上の努力義務にすぎない。","定期自主検査は、性能検査を受けていれば不要になる。","定期自主検査は、クレーンの運転者以外の者が行うことは認められない。","定期自主検査の記録は、口頭での報告のみでよい。","定期自主検査は、事業者に義務付けられたものであり、任意で省略することはできない。"], answer:4, explain:"定期自主検査は事業者の法的な義務であり、性能検査を受けていても省略できるものではありません。"},
{license:"crane_fixed", id:"l_t6_1", subject:"law", theme:6, q:"クレーン検査証の有効期間の更新に関する記述として、正しいものはどれか。", choices:["検査証の更新には、必ず所轄労働基準監督署長自身が検査を行わなければならない。","クレーン検査証の有効期間の更新を受けようとする者は、原則として、登録性能検査機関が行う性能検査を受けなければならない。","検査証の更新は、事業者の自己判断のみで行うことができる。","検査証の有効期間の更新には、いかなる検査も必要ない。","検査証は、一度交付されれば更新の必要がない。"], answer:1, explain:"クレーン検査証の有効期間の更新には、原則として登録性能検査機関が行う性能検査を受ける必要があります。"},
{license:"crane_fixed", id:"l_t6_2", subject:"law", theme:6, q:"クレーンの性能検査に関する記述として、正しいものはどれか。", choices:["性能検査に荷重試験は含まれない。","性能検査では、外観の目視確認のみを行えばよい。","性能検査においては、クレーンの各部分の構造及び機能について点検を行うほか、荷重試験を行うものとする。転倒のおそれのあるクレーンについては、安定度試験も行う。","性能検査は、初回の設置時にのみ行われ、以後は行われない。","性能検査は、クレーンを設置した事業者自身が行うものである。"], answer:2, explain:"性能検査では構造・機能の点検に加えて荷重試験を行い、転倒のおそれのあるクレーンについてはさらに安定度試験も行います。"},
{license:"crane_fixed", id:"l_t6_3", subject:"law", theme:6, q:"クレーンの変更検査に関する記述として、正しいものはどれか。", choices:["クレーンの構造や機能に変更を加えた者は、所轄労働基準監督署長が検査の必要がないと認めたものを除き、変更検査を受けなければならない。","変更検査は、事業者の任意で受けるかどうかを決めてよい。","クレーンに変更を加えても、変更検査を受ける必要は一切ない。","変更検査は、性能検査とまったく同じ内容で行われることが法令上定められている。","変更検査を受けなくても、検査証は自動的に更新される。"], answer:0, explain:"クレーンの構造・機能に変更を加えた場合、所轄労働基準監督署長が不要と認めたものを除き、変更検査を受ける必要があります。"},
{license:"crane_fixed", id:"l_t6_4", subject:"law", theme:6, q:"クレーンの変更検査における労働基準監督署長の権限に関する記述として、正しいものはどれか。", choices:["所轄労働基準監督署長は、変更検査のために必要があると認めるときは、当該検査を受ける者に塗装の一部をはがすことを命ずることができる。","所轄労働基準監督署長には、塗装をはがすことを命じる権限はない。","塗装をはがす命令は、事業者からの申請がない限り行うことができない。","塗装をはがす命令は、性能検査でのみ行われる。","変更検査では、外観の塗装状態を確認することはない。"], answer:0, explain:"所轄労働基準監督署長は、変更検査のために必要があると認めるときは、塗装の一部をはがすことを命ずることができます。"},
{license:"crane_fixed", id:"l_t6_5", subject:"law", theme:6, q:"クレーン検査証の有効期間を超えて使用を休止したクレーンに関する記述として、正しいものはどれか。", choices:["使用再開検査という制度は、法令上存在しない。","使用を休止していたクレーンは、いかなる検査もなしに再使用できる。","検査証の有効期間をこえて使用を休止したクレーンを再び使用しようとする者は、使用再開検査を受けなければならない。","使用再開検査は、事業者の任意で受けなくてもよい。","使用再開検査は、クレーンを廃棄する際に行う検査である。"], answer:2, explain:"検査証の有効期間を超えて使用を休止したクレーンを再使用する際は、使用再開検査を受ける必要があります。"},
{license:"crane_fixed", id:"l_t6_6", subject:"law", theme:6, q:"クレーン検査証の有効期間に関する記述として、正しいものはどれか。", choices:["クレーン検査証の有効期間は、常に10年である。","クレーン検査証の有効期間は、性能検査の結果にかかわらず一切変更されない。","クレーン検査証には、有効期間という概念がない。","クレーン検査証の有効期間は、事業者が自由に設定できる。","クレーン検査証の有効期間は、原則として2年であるが、所轄労働基準監督署長は、落成検査の結果により当該期間を2年未満とすることができる。"], answer:4, explain:"クレーン検査証の有効期間は原則2年ですが、落成検査の結果により2年未満に短縮されることがあります。"},
{license:"crane_fixed", id:"l_t6_7", subject:"law", theme:6, q:"クレーンの落成検査に関する記述として、正しいものはどれか。", choices:["落成検査は、クレーンの運転士免許試験の一部である。","落成検査では、荷重試験を行う必要はない。","落成検査は、クレーンを設置してから10年後に行えばよい。","クレーンを設置した者は、原則として、所轄労働基準監督署長が検査の必要がないと認めたものを除き、落成検査を受けなければならない。","落成検査に合格しなくても、クレーンを使用することができる。"], answer:3, explain:"クレーンを設置した者は、原則として落成検査を受け、これに合格することで検査証の交付を受けます。"},
{license:"crane_fixed", id:"l_t6_8", subject:"law", theme:6, q:"クレーンの各種検査に関する記述として、誤っているものはどれか。", choices:["性能検査は、登録性能検査機関が行う検査で、検査証の有効期間更新のために受ける。","変更検査は、クレーンの構造・機能に変更を加えた場合に受ける検査である。","使用再開検査は、検査証の有効期間を超えて休止したクレーンを再使用する際に受ける検査である。","これらの検査は、いずれもクレーンの所有者が任意に選択して受ければよく、義務ではない。","落成検査は、クレーンを設置した際に受ける検査である。"], answer:3, explain:"性能検査・変更検査・使用再開検査・落成検査は、いずれも法令で定められた義務であり、任意に選択できるものではありません。"},
{license:"crane_fixed", id:"l_t7_1", subject:"law", theme:7, q:"クレーン・デリック運転士免許証の携帯に関する記述として、正しいものはどれか。", choices:["免許証の写しの携帯は、いかなる場合も認められない。","免許証は、いかなる場合も携帯する必要がない。","免許証は、事業場に保管しておけば、業務中に携帯する必要はない。","免許証の携帯義務は、屋内作業にのみ適用される。","免許に係る業務に従事するときは、免許証を携帯しなければならないが、屋外作業等、作業の性質上、免許証を滅失するおそれのある業務に従事するときは、免許証に代えてその写しを携帯することで差し支えない。"], answer:4, explain:"免許に係る業務に従事するときは免許証の携帯が原則ですが、滅失のおそれがある業務では写しの携帯で差し支えありません。"},
{license:"crane_fixed", id:"l_t7_2", subject:"law", theme:7, q:"クレーン・デリック運転士が氏名を変更した場合の免許証の取扱いに関する記述として、正しいものはどれか。", choices:["免許に係る業務に現に就いている者は、氏名を変更したときは、免許証の書替えを受けなければならない。","氏名変更時の書替えは、任意で行えばよい。","氏名の変更は、免許証の記載事項に一切影響しない。","氏名を変更しても、他の技能講習修了証等で変更後の氏名を確認できれば、免許証の書替えを受けなくてよい。","氏名を変更した場合、新たに免許試験を受け直さなければならない。"], answer:0, explain:"氏名を変更したときは、他の証明書の携帯にかかわらず、免許証の書替えを受けなければなりません。"},
{license:"crane_fixed", id:"l_t7_3", subject:"law", theme:7, q:"クレーン・デリック運転士免許証を滅失した場合の取扱いに関する記述として、正しいものはどれか。", choices:["免許証の滅失は、法令上、特に問題とされない。","免許証を滅失した者は、免許証の再交付を受けなければならない。","免許証を滅失した場合、新たに免許試験を受け直さなければならない。","免許証を滅失しても、免許証の写し及び事業者による所持証明書を携帯していれば、再交付を受ける必要はない。","免許証を滅失した場合、業務に従事すること自体ができなくなる。"], answer:1, explain:"免許証を滅失した者は、他の証明書の携帯にかかわらず、免許証の再交付を受ける必要があります。"},
{license:"crane_fixed", id:"l_t7_4", subject:"law", theme:7, q:"クレーン・デリック運転士免許証の譲渡・貸与に関する記述として、正しいものはどれか。", choices:["免許証を他人に譲渡又は貸与したときは、免許の取消し又は効力の一時停止の処分を受けることがある。","免許証の譲渡・貸与は、法令上、何ら問題とされない。","免許証を貸与しても、罰則や処分は一切ない。","免許証の譲渡は認められないが、貸与であれば自由に行うことができる。","免許証の譲渡・貸与に関する規定は、クレーン・デリック運転士免許には適用されない。"], answer:0, explain:"免許証を他人に譲渡又は貸与したときは、免許の取消し又は効力の一時停止の処分を受けることがあります。"},
{license:"crane_fixed", id:"l_t7_5", subject:"law", theme:7, q:"労働安全衛生法違反によりクレーン・デリック運転士免許の取消しの処分を受けた者に関する記述として、正しいものはどれか。", choices:["処分を受けた日から起算して10日以内に、免許の取消しをした都道府県労働局長に免許証を返還しなければならない。","免許証は、返還ではなく破棄しなければならない。","免許証の返還期限は、処分を受けた日から起算して30日以内である。","免許証の返還は、任意で行えばよく、期限は定められていない。","免許証を返還する必要は一切ない。"], answer:0, explain:"免許の取消し処分を受けた者は、処分を受けた日から起算して10日以内に免許証を返還しなければなりません。"},
{license:"crane_fixed", id:"l_t7_6", subject:"law", theme:7, q:"労働安全衛生法違反によりクレーン・デリック運転士免許を取り消された者の再取得に関する記述として、正しいものはどれか。", choices:["免許を取り消され、その取消しの日から起算して1年を経過しない者は、免許を受けることができない。","免許を取り消されても、翌日から再取得の申請ができる。","免許の取消しを受けた者は、生涯にわたって再取得できない。","免許の取消しを受けても、再取得に関する制限は一切ない。","免許取消し後の再取得制限期間は、5年である。"], answer:0, explain:"免許取消しの日から起算して1年を経過しない者は、免許を受けることができません。"},
{license:"crane_fixed", id:"l_t7_7", subject:"law", theme:7, q:"クレーン・デリック運転士免許の欠格事由に関する記述として、正しいものはどれか。", choices:["免許を受けられる年齢の下限は、満15歳である。","満18歳に満たない者は、クレーン・デリック運転士免許を受けることができない。","年齢による欠格事由は、クレーン・デリック運転士免許には存在しない。","免許の欠格事由は、年齢以外の要素のみで定められている。","満18歳に満たない者であっても、事業者の推薦があれば免許を受けられる。"], answer:1, explain:"満18歳に満たない者は、クレーン・デリック運転士免許の欠格事由に該当し、免許を受けることができません。"},
{license:"crane_fixed", id:"l_t7_8", subject:"law", theme:7, q:"クレーン・デリック運転士免許及び免許証に関する記述として、誤っているものはどれか。", choices:["免許証を他人に譲渡又は貸与したときは、免許の取消し又は効力の一時停止の処分を受けることがある。","氏名を変更した場合、他の技能講習修了証等で変更後の氏名を確認できるならば、免許証の書替えを受ける必要は一切ない。","満18歳に満たない者には、免許を与えない。","労働安全衛生法違反により免許を取り消され、その取消しの日から起算して1年を経過しない者は、免許を受けることができない。","免許に係る業務に従事するときは、原則として免許証を携帯しなければならない。"], answer:1, explain:"氏名を変更したときは、他の証明書の携帯にかかわらず免許証の書替えを受ける必要があり、「一切ない」という記述は誤りです。"},
{license:"crane_fixed", id:"l_t8_1", subject:"law", theme:8, q:"クレーンの製造許可に関する記述として、正しいものはどれか。", choices:["製造許可は、所轄労働基準監督署長が行うものである。","製造許可は、クレーンを設置した後に受ければよい。","クレーンの製造には、いかなる許可も不要である。","クレーンを製造しようとする者は、原則として、あらかじめ所轄都道府県労働局長の許可を受けなければならない。","製造許可を受けたクレーンと同一型式であっても、改めて許可を受けなければならない。"], answer:3, explain:"クレーンを製造しようとする者は、原則として、あらかじめ所轄都道府県労働局長の許可(製造許可)を受けなければなりません。"},
{license:"crane_fixed", id:"l_t8_2", subject:"law", theme:8, q:"つり上げ荷重3t以上のクレーンの設置に関する記述として、正しいものはどれか。", choices:["設置届は、口頭での届出で足りる。","設置届の提出は、任意である。","クレーンを設置しようとする事業者は、原則として、当該工事の開始の日の30日前までにクレーン設置届を所轄労働基準監督署長に提出しなければならない。","設置届の提出先は、所轄都道府県労働局長である。","設置届は、工事完了後に提出すればよい。"], answer:2, explain:"つり上げ荷重3t以上のクレーンを設置しようとする事業者は、工事開始の日の30日前までにクレーン設置届を所轄労働基準監督署長に提出しなければなりません。"},
{license:"crane_fixed", id:"l_t8_3", subject:"law", theme:8, q:"つり上げ荷重が比較的小さいクレーンの設置に関する記述として、正しいものはどれか。", choices:["一定のつり上げ荷重未満のクレーンを設置しようとする事業者は、設置届に代えてクレーン設置報告書を提出すればよい場合がある。","設置報告書は、事業者の任意で提出してもしなくてもよい。","つり上げ荷重が小さいクレーンには、いかなる届出も不要である。","つり上げ荷重の大小にかかわらず、常に同一の設置届の手続が必要である。","設置報告書は、設置後1年以内に提出すればよい。"], answer:0, explain:"一定のつり上げ荷重未満のクレーンについては、設置届に代えてクレーン設置報告書を提出すればよい場合があります。"},
{license:"crane_fixed", id:"l_t8_4", subject:"law", theme:8, q:"クレーンの落成検査及び検査証に関する記述として、正しいものはどれか。", choices:["落成検査は、任意で受けるかどうかを決めてよい。","検査証は、クレーンの製造時に交付されるものである。","クレーンを設置した者は、落成検査を受けなければならず、検査に合格したクレーンには検査証が交付される。","検査証の交付は、事業者の申請がなくても自動的に行われる。","落成検査に合格しなくても、検査証は自動的に交付される。"], answer:2, explain:"クレーンを設置した者は落成検査を受けなければならず、これに合格すると検査証が交付されます。"},
{license:"crane_fixed", id:"l_t8_5", subject:"law", theme:8, q:"クレーン検査証を受けたクレーンを設置している者に異動があった場合の手続に関する記述として、正しいものはどれか。", choices:["書替えの期限は、異動後30日以内である。","設置者の異動があった場合、新たに落成検査を受け直さなければならない。","設置者に異動があっても、何ら手続は不要である。","クレーンを設置している者は、当該異動後10日以内に、クレーン検査証書替申請書にクレーン検査証を添えて、所轄労働基準監督署長に提出し、書替えを受けなければならない。","書替え申請は、口頭で行えば足りる。"], answer:3, explain:"クレーンを設置している者に異動があったときは、異動後10日以内に検査証書替申請書を提出し、書替えを受ける必要があります。"},
{license:"crane_fixed", id:"l_t8_6", subject:"law", theme:8, q:"クレーンの設置に関する記述として、誤っているものはどれか。", choices:["クレーン検査証の有効期間は、原則として2年である。","落成検査に合格すると、クレーン検査証が交付される。","クレーンの設置に関する届出は、工事の完了後に行うものである。","検査証を受けたクレーンの設置者に異動があったときは、書替えの手続が必要である。","つり上げ荷重3t以上のクレーンを設置しようとする事業者は、原則として設置届を提出しなければならない。"], answer:2, explain:"クレーンの設置届は、工事開始の日の30日前までに行う必要があり、工事完了後に行うものではありません。"},
{license:"crane_fixed", id:"l_t8_7", subject:"law", theme:8, q:"クレーンの製造許可型式に関する記述として、正しいものはどれか。", choices:["製造許可は、1台ごとに個別に必ず取得しなければならず、型式による扱いの違いはない。","既に製造許可を受けているクレーンと型式が同一であるクレーンについては、改めて製造許可を受ける必要がない場合がある。","製造許可型式であっても、設置の際の手続はすべて免除される。","製造許可型式という制度は存在しない。","製造許可型式は、外国製のクレーンにのみ適用される制度である。"], answer:1, explain:"既に許可を受けているクレーンと型式が同一である場合には、改めて製造許可を受ける必要がない扱い(許可型式クレーン)があります。"},
{license:"crane_fixed", id:"l_t8_8", subject:"law", theme:8, q:"クレーンの設置・検査に関する記述として、正しいものはどれか。", choices:["クレーン設置届の添付書類には、クレーンの購入金額の明細が含まれる。","クレーン設置届には、添付書類は一切不要である。","クレーン設置届は、設置後に添付書類とともに提出すればよい。","クレーン設置届の様式は、事業者が自由に決めてよい。","クレーン設置届には、クレーン明細書や組立図、構造部分の強度計算書等を添付しなければならない。"], answer:4, explain:"クレーン設置届には、クレーン明細書、組立図、構造部分の強度計算書等を添付する必要があります。"},
{license:"crane_fixed", id:"l_t9_1", subject:"law", theme:9, q:"クレーンの運転の業務に関する就業制限の基本原則として、正しいものはどれか。", choices:["つり上げ荷重が5t以上のクレーン(一定の限定免許で扱えるものを除く一般的な場合)の運転は、原則としてクレーン・デリック運転士免許を受けた者でなければ行ってはならない。","つり上げ荷重5t以上のクレーンであっても、特別教育を受講すれば運転できる。","つり上げ荷重にかかわらず、すべてのクレーンの運転に免許が必要である。","クレーンの運転資格は、事業者が独自に定めてよい。","クレーンの運転には、いかなる資格も不要である。"], answer:0, explain:"つり上げ荷重5t以上のクレーンの運転は、原則としてクレーン・デリック運転士免許を受けた者でなければ行うことができません。"},
{license:"crane_fixed", id:"l_t9_2", subject:"law", theme:9, q:"つり上げ荷重5t未満のクレーンの運転に関する記述として、正しいものはどれか。", choices:["つり上げ荷重5t未満のクレーンの運転の業務に就かせるときは、当該業務に関する安全のための特別の教育を行わなければならない。","つり上げ荷重5t未満のクレーンの運転には、クレーン・デリック運転士免許が必要である。","つり上げ荷重5t未満のクレーンには、就業制限の規定は一切適用されない。","つり上げ荷重5t未満のクレーンの運転には、いかなる教育も不要である。","つり上げ荷重5t未満のクレーンの運転は、誰でも自由に行うことができる。"], answer:0, explain:"つり上げ荷重5t未満のクレーンの運転業務に就かせるときは、特別の教育を行う必要があります。"},
{license:"crane_fixed", id:"l_t9_3", subject:"law", theme:9, q:"玉掛けの業務に関する就業制限として、正しいものはどれか。", choices:["玉掛けの業務に係る資格制度は存在しない。","つり上げ荷重1t未満の玉掛け業務には、いかなる教育も不要である。","つり上げ荷重1t以上のクレーンで行う玉掛けの業務には、玉掛け技能講習を修了した者でなければ就かせてはならない。","玉掛けの業務には、つり上げ荷重にかかわらず資格は不要である。","玉掛けの業務には、特別教育のみで足り、技能講習を要する場面は一切ない。"], answer:2, explain:"つり上げ荷重1t以上のクレーンで行う玉掛け業務には、玉掛け技能講習の修了が必要です。"},
{license:"crane_fixed", id:"l_t9_4", subject:"law", theme:9, q:"つり上げ荷重1t未満のクレーンで行う玉掛けの業務に関する記述として、正しいものはどれか。", choices:["つり上げ荷重1t未満の玉掛け業務には、資格制度そのものが存在しない。","つり上げ荷重1t未満の玉掛け業務は、法令上禁止されている。","玉掛けの業務に係る特別の教育を修了した者を就かせることができる。","いかなる教育も受けずに玉掛けの業務に従事できる。","玉掛け技能講習の修了が必須であり、特別教育では足りない。"], answer:2, explain:"つり上げ荷重1t未満の玉掛け業務には、特別の教育を修了した者を就かせることができます。"},
{license:"crane_fixed", id:"l_t9_5", subject:"law", theme:9, q:"クレーンの運転及び玉掛けの業務に係る資格に関する記述として、誤っているものはどれか。", choices:["つり上げ荷重1t未満の玉掛け業務には、特別教育で足りる。","つり上げ荷重1t以上の玉掛け業務には、玉掛け技能講習の修了が必要である。","資格を持たない者であっても、経験が豊富であれば就業制限業務に就くことができる。","つり上げ荷重5t未満のクレーンの運転には、特別教育で足りる。","つり上げ荷重5t以上のクレーンの運転には、原則として免許が必要である。"], answer:2, explain:"就業制限業務は、経験の有無にかかわらず、法令で定める資格(免許・技能講習・特別教育等)を有する者でなければ就くことができません。"},
{license:"crane_fixed", id:"l_t9_6", subject:"law", theme:9, q:"無資格者によるクレーンの運転に関する記述として、正しいものはどれか。", choices:["法令で定める資格(免許又は特別教育の修了等)を有しない者を、就業制限業務であるクレーンの運転に就かせることは、法令上認められない。","無資格者であっても、監督者の立会いがあれば運転できる。","資格の有無にかかわらず、事業者の判断で運転させることができる。","資格制度は、クレーンの運転には適用されない。","無資格者の運転は、短時間であれば問題ない。"], answer:0, explain:"就業制限業務であるクレーンの運転を、法令上必要な資格を有しない者に行わせることは認められません。"},
{license:"crane_fixed", id:"l_t9_7", subject:"law", theme:9, q:"クレーンの就業制限業務に関する記述として、正しいものはどれか。", choices:["就業制限業務という概念は、クレーンには存在しない。","就業制限業務は、玉掛け作業には適用されない。","すべてのクレーンの運転には、同一の資格が必要である。","就業制限業務に必要な資格は、事業者が独自に定めることができる。","つり上げ荷重に応じて、必要となる資格(免許又は特別教育など)の内容が異なる。"], answer:4, explain:"クレーンの就業制限業務は、つり上げ荷重に応じて必要となる資格(免許・技能講習・特別教育)の内容が異なります。"},
{license:"crane_fixed", id:"l_t9_8", subject:"law", theme:9, q:"クレーンの運転及び玉掛けの業務に関する記述として、誤っているものはどれか。", choices:["就業制限に関する規定は、労働者の安全を確保するために設けられている。","つり上げ荷重1t以上の玉掛けには、玉掛け技能講習の修了が必要である。","つり上げ荷重5t以上のクレーンの運転には、原則として免許が必要である。","資格を有しない者を就業制限業務に就かせることは、法令上認められない。","特別教育を修了すれば、つり上げ荷重にかかわらずすべてのクレーンの運転ができる。"], answer:4, explain:"つり上げ荷重5t以上のクレーンの運転には免許が必要であり、特別教育の修了のみではすべてのクレーンを運転できるわけではありません。"},
{license:"crane_fixed", id:"l_t10_1", subject:"law", theme:10, q:"クレーンの巻過防止装置の調整に関する記述として、正しいものはどれか。", choices:["直働式の巻過防止装置は間隔0.05m以上、直働式以外の巻過防止装置は間隔0.25m以上となるように調整しなければならない。","巻過防止装置の調整基準は、法令上定められていない。","巻過防止装置は、一度調整すれば再調整の必要はない。","巻過防止装置の間隔は、種類にかかわらず一律0.05m以上でよい。","巻過防止装置の間隔は、直働式の方が直働式以外よりも大きくなければならない。"], answer:0, explain:"直働式の巻過防止装置は間隔0.05m以上、直働式以外のものは間隔0.25m以上となるように調整することとされています。"},
{license:"crane_fixed", id:"l_t10_2", subject:"law", theme:10, q:"油圧を動力として用いるクレーンの安全弁に関する記述として、正しいものはどれか。", choices:["安全弁の調整は、事業者の任意で決めてよい。","安全弁については、原則として、つり上げ荷重に相当する荷重をかけたときの油圧に相当する圧力以下で作用するように調整しておかなければならない。","安全弁の調整基準は、法令上定められていない。","安全弁は、電動式クレーンにのみ設けられる装置である。","安全弁は、常に最大圧力で作動するように調整する。"], answer:1, explain:"油圧を動力として用いるクレーンの安全弁は、つり上げ荷重相当の油圧に相当する圧力以下で作用するように調整する必要があります。"},
{license:"crane_fixed", id:"l_t10_3", subject:"law", theme:10, q:"フックの外れ止め装置に関する使用義務として、正しいものはどれか。", choices:["外れ止め装置の使用義務は、屋外作業にのみ適用される。","外れ止め装置は、具備されていても使用は任意である。","外れ止め装置を使用すると、かえって危険が増すため使用してはならない。","外れ止め装置は、玉掛け技能講習修了者以外は使用してはならない。","玉掛け用ワイヤロープ等がフックから外れることを防止するための外れ止め装置を具備するクレーンを用いて荷をつり上げるときは、当該外れ止め装置を使用しなければならない。"], answer:4, explain:"外れ止め装置を具備するクレーンで荷をつり上げるときは、当該装置を必ず使用しなければなりません。"},
{license:"crane_fixed", id:"l_t10_4", subject:"law", theme:10, q:"クレーン検査証の備付けに関する記述として、正しいものはどれか。", choices:["クレーン検査証は、事業場の本社にのみ保管しておけばよい。","クレーン検査証を受けたクレーンを用いて作業を行うときは、当該作業を行う場所に、当該クレーンのクレーン検査証を備え付けておかなければならない。","クレーン検査証を備え付けなくても、罰則の対象とはならない。","クレーン検査証は、運転者個人が常に携帯していなければならない。","クレーン検査証の備付けは、任意である。"], answer:1, explain:"クレーンを用いて作業を行うときは、その作業場所にクレーン検査証を備え付けておく必要があります。"},
{license:"crane_fixed", id:"l_t10_5", subject:"law", theme:10, q:"クレーン検査証を受けたクレーンの貸与に関する記述として、正しいものはどれか。", choices:["検査証は、貸与先の求めがあった場合にのみ提示すればよい。","クレーンの貸与は、法令上一切禁止されている。","検査証とクレーン本体は、別々に貸与してもよい。","クレーン検査証を受けたクレーンを貸与するときは、クレーン検査証とともにするのでなければ貸与してはならない。","クレーンの貸与に、検査証は不要である。"], answer:3, explain:"クレーン検査証を受けたクレーンを貸与するときは、検査証とともにしなければなりません。"},
{license:"crane_fixed", id:"l_t10_6", subject:"law", theme:10, q:"クレーンの使用制限に関する記述として、正しいものはどれか。", choices:["定格荷重は、あくまで目安であり、法的な使用制限ではない。","定格荷重を超える使用は、運転者の技量があれば認められる。","事業者は、クレーンにその定格荷重を超える荷重をかけて使用してはならない。","定格荷重を多少超える程度であれば、使用してもよい。","定格荷重の基準は、屋内設置のクレーンにのみ適用される。"], answer:2, explain:"事業者は、クレーンに定格荷重を超える荷重をかけて使用してはなりません。"},
{license:"crane_fixed", id:"l_t10_7", subject:"law", theme:10, q:"クレーンの運転者の行動に関する規定として、正しいものはどれか。", choices:["荷をつったままであっても、短時間であれば運転位置を離れてよい。","この規定は、屋外設置のクレーンにのみ適用される。","荷をつったまま運転位置を離れることは、休憩時間中に限り認められる。","運転者が運転位置を離れる際の規定は、法令上存在しない。","事業者は、クレーンの運転者を、荷をつったままで、運転位置から離れさせてはならない。"], answer:4, explain:"事業者は、荷をつったままの状態でクレーンの運転者を運転位置から離れさせてはなりません。"},
{license:"crane_fixed", id:"l_t10_8", subject:"law", theme:10, q:"ジブクレーンの使用制限に関する記述として、正しいものはどれか。", choices:["ジブの傾斜角制限は、つり上げ荷重3t以上のジブクレーンにのみ適用される。","ジブの傾斜角には、いかなる制限もない。","ジブの傾斜角の範囲は、運転者が現場の判断で自由に決めてよい。","ジブクレーンについては、クレーン明細書に記載されているジブの傾斜角(つり上げ荷重が3t未満のジブクレーンにあっては、これを製造した者が指定したジブの傾斜角)の範囲をこえて使用してはならない。","ジブの傾斜角制限は、性能検査の対象外である。"], answer:3, explain:"ジブクレーンは、クレーン明細書等に記載されたジブの傾斜角の範囲を超えて使用してはなりません。"},
{license:"crane_fixed", id:"m_t1_1", subject:"motor", theme:1, q:"交流と直流に関する記述として、正しいものはどれか。", choices:["直流はDC、交流はACと表される。","直流には、大きさや向きという概念がない。","交流も直流も、同じ記号で表される。","交流は、常に一定の大きさと向きを持つ電流である。","直流はAC、交流はDCと表される。"], answer:0, explain:"直流はDC(Direct Current)、交流はAC(Alternating Current)と表されます。"},
{license:"crane_fixed", id:"m_t1_2", subject:"motor", theme:1, q:"交流用の電圧計・電流計に関する記述として、正しいものはどれか。", choices:["交流用の電圧計や電流計の計測値は、常に最大値を示している。","交流用の電圧計は、直流の電圧も同じ精度で測定できる。","交流用の計器では、電圧や電流を測定することができない。","交流用の計器の指示値には、単位という概念がない。","交流用の電圧計や電流計の計測値は、一般に実効値を示している。"], answer:4, explain:"交流用の電圧計・電流計の指示値は、一般に実効値を示すものです。最大値を示しているわけではありません。"},
{license:"crane_fixed", id:"m_t1_3", subject:"motor", theme:1, q:"変圧器による電圧の変換に関する記述として、正しいものはどれか。", choices:["直流は、変圧器によって容易に電圧を変えることができる。","変圧器を用いても、電圧を変えることはできない。","変圧器は、電動機の一種である。","変圧器は、直流専用の機器である。","交流は、変圧器によって電圧を容易に変えることができる。"], answer:4, explain:"変圧器は交流の電圧を容易に変換できる機器です。直流の電圧を変圧器で容易に変えることはできません。"},
{license:"crane_fixed", id:"m_t1_4", subject:"motor", theme:1, q:"工場の動力用電源に関する記述として、正しいものはどれか。", choices:["工場の動力用電源の電圧は、常に100V未満である。","工場の動力用電源には、周波数という概念がない。","工場の動力用電源には、一般に、200V級又は400V級の三相交流が使用されている。","工場の動力用電源には、必ず単相交流が使用される。","工場の動力用電源には、直流のみが使用される。"], answer:2, explain:"工場の動力用電源には、一般に200V級又は400V級の三相交流が使用されています。"},
{license:"crane_fixed", id:"m_t1_5", subject:"motor", theme:1, q:"商用電源の周波数に関する記述として、正しいものはどれか。", choices:["電力として配電される交流の周波数には、地域によって50Hzと60Hzがある。","周波数は、電圧の大きさによって決まる。","同一地域内であっても、家庭用と工場の動力用とでは周波数が異なる。","日本全国どこでも、周波数は同一である。","周波数という概念は、直流にのみ存在する。"], answer:0, explain:"商用電源の周波数は地域によって50Hzと60Hzに分かれていますが、同一地域内で用途によって周波数が異なることはありません。"},
{license:"crane_fixed", id:"m_t1_6", subject:"motor", theme:1, q:"交流の整流に関する記述として、正しいものはどれか。", choices:["整流器で得られた直流は、常に完全に平滑である。","整流とは、直流を交流に変換することをいう。","交流は、整流器で直流に変換できるが、得られた直流は完全に平滑ではなく波が多少残るため、脈流と呼ばれる。","交流を整流しても、直流に変換することはできない。","脈流という概念は、クレーンの電気系統には無関係である。"], answer:2, explain:"交流を整流器で直流に変換すると、波の残った脈流と呼ばれる状態になります。"},
{license:"crane_fixed", id:"m_t1_7", subject:"motor", theme:1, q:"三相交流に関する記述として、正しいものはどれか。", choices:["三相交流は、電流及び電圧の大きさ並びに電流の方向が、時間の経過に関係なく一定となるものをいう。","三相交流は、直流の一種である。","三相交流は、必ず単相交流よりも電圧が低い。","三相交流は、単相交流を三つ組み合わせたものであるが、電流・電圧の大きさや向きは時間とともに周期的に変化する。","三相交流には、周波数という概念が存在しない。"], answer:3, explain:"三相交流も交流の一種であり、電流・電圧の大きさや向きは時間とともに周期的に変化します。「時間の経過に関係なく一定」という記述は直流の説明であり誤りです。"},
{license:"crane_fixed", id:"m_t1_8", subject:"motor", theme:1, q:"電気の基礎に関する記述として、誤っているものはどれか。", choices:["交流は、変圧器によって電圧を変えることができる。","商用電源の周波数には、地域によって50Hzと60Hzがある。","交流用の電圧計や電流計の計測値は、一般に実効値を示している。","直流は、変圧器によって容易に電圧を変えることができる。","直流はDC、交流はACと表される。"], answer:3, explain:"変圧器で容易に電圧を変えられるのは交流であり、直流ではありません。"},
{license:"crane_fixed", id:"m_t2_1", subject:"motor", theme:2, q:"抵抗6Ωと抵抗12Ωを並列に接続したときの合成抵抗の値として、正しいものはどれか。", choices:["6Ω","18Ω","3Ω","9Ω","4Ω"], answer:4, explain:"並列合成抵抗は 1/R = 1/6 + 1/12 = 3/12 = 1/4 より、R=4Ωとなります。"},
{license:"crane_fixed", id:"m_t2_2", subject:"motor", theme:2, q:"抵抗10Ω、20Ω、30Ωを直列に接続したときの合成抵抗の値として、正しいものはどれか。", choices:["20Ω","6Ω","40Ω","60Ω","600Ω"], answer:3, explain:"直列合成抵抗は各抵抗の値の和となるため、10+20+30=60Ωとなります。"},
{license:"crane_fixed", id:"m_t2_3", subject:"motor", theme:2, q:"抵抗20Ωの電熱線に100Vの電圧をかけたとき、流れる電流の値として、正しいものはどれか。", choices:["5A","0.2A","2000A","2A","20A"], answer:0, explain:"オームの法則I=E/Rより、I=100/20=5Aとなります。"},
{license:"crane_fixed", id:"m_t2_4", subject:"motor", theme:2, q:"ある回路に200Vの電圧をかけたところ、8Aの電流が流れた。この回路の抵抗の値として、正しいものはどれか。", choices:["8Ω","1600Ω","25Ω","16Ω","40Ω"], answer:2, explain:"オームの法則R=E/Iより、R=200/8=25Ωとなります。"},
{license:"crane_fixed", id:"m_t2_5", subject:"motor", theme:2, q:"抵抗100Ωの回路に2Aの電流が流れているとき、この回路が消費する電力の値として、正しいものはどれか。", choices:["50W","800W","20000W","400W","200W"], answer:3, explain:"電圧E=I×R=2×100=200Vとなり、電力P=E×I=200×2=400Wとなります。"},
{license:"crane_fixed", id:"m_t2_6", subject:"motor", theme:2, q:"直径が同じで長さが3倍になった電線の抵抗値の変化として、正しいものはどれか。", choices:["9分の1になる","変化しない","3分の1になる","3倍になる","9倍になる"], answer:3, explain:"電線の抵抗は長さに比例するため、長さが3倍になれば抵抗も3倍になります。"},
{license:"crane_fixed", id:"m_t2_7", subject:"motor", theme:2, q:"長さが同じで直径が2倍になった電線の抵抗値の変化として、正しいものはどれか。", choices:["4分の1になる","2倍になる","2分の1になる","4倍になる","変化しない"], answer:0, explain:"電線の抵抗は断面積(直径の2乗)に反比例するため、直径が2倍になると断面積は4倍になり、抵抗は4分の1になります。"},
{license:"crane_fixed", id:"m_t2_8", subject:"motor", theme:2, q:"電気に関する基礎的な計算・法則に関する記述として、誤っているものはどれか。", choices:["抵抗を直列に接続した場合の合成抵抗は、個々の抵抗の値のいずれよりも大きい。","回路に流れる電流は、抵抗に比例し、電圧に反比例する。","オームの法則によれば、回路に流れる電流は、電圧に比例し、抵抗に反比例する。","1000Vは、1kVとも表される。","電力(W)は、電圧(V)と電流(A)の積で求められる。"], answer:1, explain:"オームの法則により、電流は電圧に比例し抵抗に反比例します。「抵抗に比例し電圧に反比例する」は誤りです。"},
{license:"crane_fixed", id:"m_t3_1", subject:"motor", theme:3, q:"かご形三相誘導電動機に関する記述として、正しいものはどれか。", choices:["かご形三相誘導電動機は、直流電動機の一種である。","かご形三相誘導電動機には、回転子が存在しない。","かご形三相誘導電動機には、スリップリングが必ず用いられる。","かご形三相誘導電動機は、スリップリングやブラシがない極めて簡単な構造である。","かご形三相誘導電動機は、ブラシの保守が頻繁に必要な構造である。"], answer:3, explain:"かご形三相誘導電動機は、スリップリングやブラシがない簡単な構造で、保守性に優れています。"},
{license:"crane_fixed", id:"m_t3_2", subject:"motor", theme:3, q:"巻線形三相誘導電動機に関する記述として、正しいものはどれか。", choices:["巻線形三相誘導電動機は、固定子側、回転子側ともに巻線を用いた構造で、回転子側の巻線はスリップリングを通して外部抵抗と接続するようになっている。","巻線形三相誘導電動機は、外部抵抗と接続することができない構造である。","巻線形三相誘導電動機には、スリップリングという部品は存在しない。","巻線形三相誘導電動機には、回転子側の巻線が存在しない。","巻線形三相誘導電動機の固定子側は、かご形の構造をしている。"], answer:0, explain:"巻線形三相誘導電動機は固定子・回転子ともに巻線構造で、回転子側の巻線はスリップリングを通して外部抵抗と接続されます。"},
{license:"crane_fixed", id:"m_t3_3", subject:"motor", theme:3, q:"巻線形三相誘導電動機の一次側・二次側の呼称に関する記述として、正しいものはどれか。", choices:["巻線形三相誘導電動機では、回転子側を一次側、固定子側を二次側と呼ぶ。","一次側は常に回転する部分を指す。","一次側・二次側という呼称は、巻線形三相誘導電動機には用いられない。","一次側と二次側は、常に同じ側を指す。","巻線形三相誘導電動機では、固定子側を一次側、回転子側を二次側と呼ぶ。"], answer:4, explain:"巻線形三相誘導電動機では、固定子側が一次側、回転子側が二次側と呼ばれます。"},
{license:"crane_fixed", id:"m_t3_4", subject:"motor", theme:3, q:"直流電動機に関する記述として、正しいものはどれか。", choices:["直流電動機は、三相交流電源がなければ動作しない。","直流電動機には、界磁という部分は存在しない。","直流電動機では、回転子を界磁と呼ぶ。","直流電動機の界磁は、常に回転する。","直流電動機では、固定子を界磁と呼ぶ。"], answer:4, explain:"直流電動機では、固定子側を界磁と呼びます。"},
{license:"crane_fixed", id:"m_t3_5", subject:"motor", theme:3, q:"直流電動機の構造に関する記述として、正しいものはどれか。", choices:["整流子は、固定子側にのみ設けられる部品である。","直流電動機には、整流子という部品は使用されない。","直流電動機では、回転子に給電するために整流子が使用される。","直流電動機は、整流子がなくても回転子に給電できる。","整流子は、三相誘導電動機にのみ使用される部品である。"], answer:2, explain:"直流電動機では、回転子(電機子)への給電のために整流子が用いられます。"},
{license:"crane_fixed", id:"m_t3_6", subject:"motor", theme:3, q:"直流電動機の速度制御・保守に関する記述として、正しいものはどれか。", choices:["直流電動機には、保守が一切不要である。","直流電動機は、速度制御ができない構造である。","直流電動機のブラシは、一度取り付ければ交換不要である。","直流電動機は、三相誘導電動機よりも常に構造が単純である。","直流電動機は、一般に、速度制御性能が優れているが、整流子及びブラシの保守が必要である。"], answer:4, explain:"直流電動機は速度制御性能に優れる一方、整流子とブラシの定期的な保守が必要です。"},
{license:"crane_fixed", id:"m_t3_7", subject:"motor", theme:3, q:"三相誘導電動機の同期速度に関する記述として、正しいものはどれか。", choices:["三相誘導電動機の同期速度は、電圧のみによって決まる。","三相誘導電動機の同期速度は、常に一定であり、周波数や極数の影響を受けない。","三相誘導電動機の同期速度は、周波数を一定とすれば、極数が少ないほど速くなる。","三相誘導電動機の同期速度は、極数とは無関係である。","三相誘導電動機の同期速度は、極数が多いほど速くなる。"], answer:2, explain:"三相誘導電動機の同期速度は、周波数一定の場合、極数が少ないほど速くなります。"},
