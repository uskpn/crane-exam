{license:"crane_fixed", id:"m_t3_8", subject:"motor", theme:3, q:"三相誘導電動機の回転子の回転特性に関する記述として、正しいものはどれか。", choices:["三相誘導電動機の回転子は、無負荷時よりも負荷時の方が速く回転する。","三相誘導電動機の回転子は、負荷がかかると同期速度より15~20%程度遅く回転する。","三相誘導電動機の回転子の速度は、負荷の大小に一切影響されない。","三相誘導電動機の回転子は、負荷がかかっても常に同期速度と完全に一致して回転する。","三相誘導電動機の回転子は、固定子の回転磁界により回転するが、負荷がかかると同期速度より2~5%程度遅く回転する性質がある。"], answer:4, explain:"負荷がかかると回転子は同期速度より2~5%程度遅く回転する性質(すべり)があります。"},
{license:"crane_fixed", id:"m_t4_1", subject:"motor", theme:4, q:"カム形間接制御器に関する記述として、正しいものはどれか。", choices:["カム形間接制御器は、カム周辺に固定されたスイッチにより電磁接触器の操作回路を開閉するものである。","カム形間接制御器には、カムという部品は使用されない。","カム形間接制御器は、油圧のみで動作する。","カム形間接制御器は、直接制御器の一種である。","カム形間接制御器は、電動機の主回路を直接開閉する構造である。"], answer:0, explain:"カム形間接制御器は、カム周辺のスイッチにより電磁接触器の操作回路を開閉する間接制御器の一種です。"},
{license:"crane_fixed", id:"m_t4_2", subject:"motor", theme:4, q:"無線操作用の制御器に関する記述として、正しいものはどれか。", choices:["無線操作用の制御器は、玉掛け作業とは一切関係しない機器である。","無線操作用の制御器には、開閉器という部品は使用されない。","無線操作用の制御器は、有線でなければ操作できない。","無線操作用の制御器には、切替え開閉器により、機上運転に切り替えることができる機能を持つものがある。","無線操作用の制御器には、機上運転への切替え機能は一切存在しない。"], answer:3, explain:"無線操作用の制御器には、切替え開閉器で機上運転に切り替えられる機能を持つものがあります。"},
{license:"crane_fixed", id:"m_t4_3", subject:"motor", theme:4, q:"ユニバーサル制御器に関する記述として、正しいものはどれか。", choices:["ユニバーサル制御器は、操作ハンドルを持たない構造である。","ユニバーサル制御器は、旋回動作専用の制御器である。","ユニバーサル制御器は、1本の操作ハンドルを前後左右や斜めに操作することにより、2個の制御器を同時に又は単独で操作できる構造にしたものである。","ユニバーサル制御器は、1個の制御器のみを操作できる構造である。","ユニバーサル制御器は、5個以上の制御器を同時に操作する構造である。"], answer:2, explain:"ユニバーサル制御器は、1本のハンドルの操作により2個の制御器を同時又は単独で操作できる構造のものです。"},
{license:"crane_fixed", id:"m_t4_4", subject:"motor", theme:4, q:"クランクハンドル式の制御器に関する記述として、正しいものはどれか。", choices:["クランクハンドル式の制御器は、ハンドルを上下にスライドさせて操作する構造である。","クランクハンドル式の制御器は、油圧でのみ動作する。","クランクハンドル式の制御器は、操作ハンドルを水平方向に回して操作する構造である。","クランクハンドル式の制御器は、無線操作専用のものである。","クランクハンドル式の制御器には、ハンドルという部品が存在しない。"], answer:2, explain:"クランクハンドル式の制御器は、操作ハンドルを水平方向に回して操作する構造です。"},
{license:"crane_fixed", id:"m_t4_5", subject:"motor", theme:4, q:"ドラム形直接制御器に関する記述として、正しいものはどれか。", choices:["ドラム形直接制御器は、油圧のみで動作する装置である。","ドラム形直接制御器は、電磁接触器の操作回路のみを開閉し、主回路を直接開閉することはない。","ドラム形直接制御器には、ハンドルという部品は使用されない。","ドラム形直接制御器は、間接制御器の一種である。","ドラム形直接制御器は、ハンドルで回される円弧状の部分により、電動機の主回路を直接開閉する構造の制御器である。"], answer:4, explain:"ドラム形直接制御器は、ハンドルで回される円弧状の部分により電動機の主回路を直接開閉する直接制御器です。"},
{license:"crane_fixed", id:"m_t4_6", subject:"motor", theme:4, q:"エンコーダー型制御器に関する記述として、正しいものはどれか。", choices:["エンコーダー型制御器は、玉掛け用具の一種である。","エンコーダー型制御器は、ハンドル位置を連続的に検出する装置であるが、電動機の主回路を機械的に直接開閉するものではない。","エンコーダー型制御器は、油圧式のブレーキそのものである。","エンコーダー型制御器には、ハンドル位置を検出する機能はない。","エンコーダー型制御器は、ハンドル位置を連続的に検出し、電動機の主回路を直接開閉する直接制御器である。"], answer:1, explain:"エンコーダー型制御器はハンドル位置を連続的に検出しますが、電動機の主回路を機械的に直接開閉するものではありません。"},
{license:"crane_fixed", id:"m_t4_7", subject:"motor", theme:4, q:"押しボタンスイッチに関する記述として、正しいものはどれか。", choices:["押しボタンスイッチは、電動機の速度制御には一切使用されない。","押しボタンスイッチは、常に1段階の操作しかできない。","押しボタンスイッチには、一段目で低速、二段目で高速運転ができるようにした二段押込み式のものがある。","押しボタンスイッチには、正転・逆転の区別が一切ない。","押しボタンスイッチは、油圧専用の操作装置である。"], answer:2, explain:"押しボタンスイッチには、一段目で低速、二段目で高速運転ができる二段押込み式のものがあります。"},
{license:"crane_fixed", id:"m_t4_8", subject:"motor", theme:4, q:"クレーンの電動機の付属機器に関する記述として、誤っているものはどれか。", choices:["ユニバーサル制御器は、1本のハンドルで5個の制御器を同時に操作できる構造である。","無線操作用の制御器には、機上運転に切り替えられる機能を持つものがある。","押しボタンスイッチには、二段押込み式で低速・高速を切り替えられるものがある。","クランクハンドル式の制御器は、操作ハンドルを水平方向に回して操作する。","カム形間接制御器は、カム周辺のスイッチにより電磁接触器の操作回路を開閉する。"], answer:0, explain:"ユニバーサル制御器は、1本のハンドルで2個の制御器を同時又は単独で操作できる構造のもので、「5個」という記述は誤りです。"},
{license:"crane_fixed", id:"m_t5_1", subject:"motor", theme:5, q:"トロリ線給電の方式に関する記述として、正しいものはどれか。", choices:["トロリ線給電は、直流専用の給電方式である。","トロリ線給電には、トロリ線の取付け方法によりイヤー式とすくい上げ式がある。","トロリ線給電は、必ずキャブタイヤケーブルとともに用いられる。","イヤー式とすくい上げ式は、まったく同じ構造である。","トロリ線給電には、取付け方法による分類は一切存在しない。"], answer:1, explain:"トロリ線給電には、トロリ線の取付け方法によりイヤー式とすくい上げ式があります。"},
{license:"crane_fixed", id:"m_t5_2", subject:"motor", theme:5, q:"絶縁トロリ線方式に関する記述として、正しいものはどれか。", choices:["絶縁トロリ線方式では、集電子を使用しない。","絶縁トロリ線方式のものは、一本一本のトロリ線が、すその開いた絶縁物で被覆されており、集電子はその間を摺動して集電する。","絶縁トロリ線方式は、トロリ線がまったく被覆されていない方式である。","絶縁トロリ線方式は、感電の危険が皆無になる方式である。","絶縁トロリ線方式は、直流給電専用の方式である。"], answer:1, explain:"絶縁トロリ線方式は、すその開いた絶縁物で被覆されたトロリ線の間を集電子が摺動して集電する方式です。"},
{license:"crane_fixed", id:"m_t5_3", subject:"motor", theme:5, q:"旋回体やケーブル巻取式などの回転部分への給電に関する記述として、正しいものはどれか。", choices:["旋回体やケーブル巻取式などの回転部分への給電には、トロリバーではなく、キャブタイヤケーブルなど回転動作に適した方式が用いられる。","回転部分には、給電を行う必要がない。","回転部分への給電方式は、直線走行部分と全く同じ方式が使われる。","旋回体などの回転部分への給電には、必ずトロリバーが用いられる。","旋回体は給電の対象とならない。"], answer:0, explain:"トロリバーは直線的な走行部分の給電に適した方式で、旋回体やケーブル巻取式などの回転部分への給電には、キャブタイヤケーブル等の方式が用いられます。"},
{license:"crane_fixed", id:"m_t5_4", subject:"motor", theme:5, q:"キャブタイヤケーブルに関する記述として、正しいものはどれか。", choices:["キャブタイヤケーブルには、絶縁被覆が施されていない。","キャブタイヤケーブルは、太い1本の導体のみで構成される。","キャブタイヤケーブルは、導体に細い素線を使い、これを多数より合わせており、外装被覆も厚く丈夫に作られているので、引きずったり、屈曲を繰り返す用途に適している。","キャブタイヤケーブルは、屈曲させると断線しやすいため、固定配線にのみ使用される。","キャブタイヤケーブルは、給電には一切使用されない。"], answer:2, explain:"キャブタイヤケーブルは細い素線を多数より合わせた丈夫な構造で、引きずりや屈曲の繰り返しに適しています。"},
{license:"crane_fixed", id:"m_t5_5", subject:"motor", theme:5, q:"クレーンの内部配線に関する記述として、正しいものはどれか。", choices:["内部配線には、絶縁被覆は不要である。","内部配線は、外部からの損傷を受けても問題ない構造とされている。","内部配線は、金属管や金属ダクトに収めてはならない。","内部配線は、一般に、絶縁電線を金属管などの電線管又は金属ダクト内に収め、外部からの損傷を防いでいる。","内部配線は、常に露出させたまま設置される。"], answer:3, explain:"内部配線は、絶縁電線を金属管や金属ダクトに収め、外部からの損傷を防ぐ構造が一般的です。"},
{license:"crane_fixed", id:"m_t5_6", subject:"motor", theme:5, q:"トロリ線の材料に関する記述として、正しいものはどれか。", choices:["トロリ線は、常にゴム製である。","トロリ線の材料には、溝付硬銅トロリ線などが用いられる。","トロリ線には、木材が用いられる。","トロリ線には、いかなる金属材料も使用できない。","トロリ線には、材料に関する規定は一切ない。"], answer:1, explain:"トロリ線の材料には、溝付硬銅トロリ線などが用いられます。"},
{license:"crane_fixed", id:"m_t5_7", subject:"motor", theme:5, q:"クレーンの給電装置及び配線に関する記述として、誤っているものはどれか。", choices:["内部配線は、金属管や金属ダクトに収めて外部からの損傷を防ぐ。","旋回体やケーブル巻取式などの回転部分への給電には、トロリバーが最適な方式である。","キャブタイヤケーブルは、屈曲を繰り返す用途に適している。","絶縁トロリ線方式では、集電子がすその開いた絶縁物の間を摺動して集電する。","トロリ線給電には、イヤー式とすくい上げ式がある。"], answer:1, explain:"トロリバーは直線的な走行部分の給電に適した方式であり、旋回体等の回転部分への給電に最適な方式とはいえません。"},
{license:"crane_fixed", id:"m_t5_8", subject:"motor", theme:5, q:"クレーンへの給電に関する記述として、正しいものはどれか。", choices:["クレーンへの給電方式は、1種類しか存在しない。","クレーンへの給電には、乾電池のみが用いられる。","クレーンの給電設備は、点検の対象とならない。","クレーンへの給電方式には、トロリ線給電やキャブタイヤケーブルによる給電など、複数の方式がある。","クレーンへの給電は、いかなる場合も感電の危険がない。"], answer:3, explain:"クレーンへの給電方式には、トロリ線給電やキャブタイヤケーブルによる給電など複数の方式があります。"},
{license:"crane_fixed", id:"m_t6_1", subject:"motor", theme:6, q:"ゼロノッチインターロックに関する記述として、正しいものはどれか。", choices:["ゼロノッチインターロックは、玉掛け作業の合図装置である。","ゼロノッチインターロックは、クレーンの速度を上げるための機能である。","ゼロノッチインターロックは、ハンドルの位置にかかわらず、常に主電磁接触器を投入できる機能である。","ゼロノッチインターロックは、各制御器のハンドルが停止位置になければ、主電磁接触器を投入できないようにしたものである。","ゼロノッチインターロックは、ブレーキの制動力を高める装置である。"], answer:3, explain:"ゼロノッチインターロックは、各制御器のハンドルが停止位置になければ主電磁接触器を投入できないようにする安全機能です。"},
{license:"crane_fixed", id:"m_t6_2", subject:"motor", theme:6, q:"直接制御に関する記述として、正しいものはどれか。", choices:["直接制御は、シーケンサーを使用するので、間接制御に比べ自動運転や速度制御が容易である。","直接制御は、電動機の容量にかかわらず、常に操作が軽い。","直接制御は、間接制御よりも常に設備費が高い。","直接制御には、ハンドル操作という概念がない。","直接制御は、容量の大きな電動機では制御器のハンドル操作が重くなる。"], answer:4, explain:"直接制御は容量の大きな電動機では制御器のハンドル操作が重くなる傾向があります。シーケンサーを使い自動運転がしやすいのは間接制御の特徴です。"},
{license:"crane_fixed", id:"m_t6_3", subject:"motor", theme:6, q:"間接制御に関する記述として、正しいものはどれか。", choices:["間接制御は、電動機の主回路に電磁接触器を挿入し、主回路の開閉を電磁接触器に行わせる方式で、制御器は、主回路を開閉する電磁接触器の電磁コイル回路の開閉を受け持つ。","間接制御は、制御器が主回路を直接開閉する方式である。","間接制御では、電磁接触器は一切使用されない。","間接制御は、直接制御よりも常に設備費が安い。","間接制御は、シーケンサーを使用することができない方式である。"], answer:0, explain:"間接制御は電磁接触器を用いて主回路を開閉し、制御器はその電磁コイル回路の開閉を受け持つ方式です。"},
{license:"crane_fixed", id:"m_t6_4", subject:"motor", theme:6, q:"直接制御と間接制御の比較に関する記述として、正しいものはどれか。", choices:["直接制御と間接制御は、設備費においてまったく差がない。","間接制御の制御器は、直接制御の制御器よりも常に安価である。","間接制御は、直接制御に比べ、制御器が大型・重量になる。","間接制御は、直接制御に比べ、制御器は小型・軽量であるが、設備費が高い。","直接制御は、間接制御に比べ、常に設備費が高い。"], answer:3, explain:"間接制御は制御器が小型・軽量である一方、電磁接触器等が必要なため設備費は高くなる傾向があります。"},
{license:"crane_fixed", id:"m_t6_5", subject:"motor", theme:6, q:"半間接制御に関する記述として、正しいものはどれか。", choices:["巻線形三相誘導電動機の半間接制御は、電流の多い一次側を電磁接触器で間接制御し、電流の比較的少ない二次側を直接制御器で直接制御する方式である。","半間接制御は、一次側・二次側の両方を電磁接触器で間接制御する方式である。","半間接制御は、一次側・二次側の両方を直接制御器で制御する方式である。","半間接制御は、電流の少ない一次側を電磁接触器で制御する方式である。","半間接制御という制御方式は、実際には存在しない。"], answer:0, explain:"半間接制御は、電流の多い一次側を間接制御(電磁接触器)、電流の少ない二次側を直接制御器で制御する方式です。"},
{license:"crane_fixed", id:"m_t6_6", subject:"motor", theme:6, q:"コースチングノッチに関する記述として、正しいものはどれか。", choices:["コースチングノッチは、ブレーキには通電せず、電動機にのみ通電してブレーキを緩めるものである。","コースチングノッチは、非常停止専用のノッチである。","コースチングノッチは、電動機を最高速度で回転させるためのノッチである。","コースチングノッチは、制御器の第1ノッチとして設けられ、ブレーキにのみ通電してブレーキを緩めるようになっているノッチである。","コースチングノッチという概念は、クレーンの制御には存在しない。"], answer:3, explain:"コースチングノッチは第1ノッチとして設けられ、ブレーキにのみ通電してブレーキを緩める、荷振れ防止に有効なノッチです。"},
{license:"crane_fixed", id:"m_t6_7", subject:"motor", theme:6, q:"クレーンの電動機の制御に関する記述として、誤っているものはどれか。", choices:["半間接制御は、一次側を間接制御、二次側を直接制御する方式である。","ゼロノッチインターロックは、各制御器のハンドルが停止位置になければ主電磁接触器を投入できないようにしたものである。","間接制御は、直接制御に比べ制御器は小型・軽量であるが設備費が高い。","コースチングノッチは、ブレーキにのみ通電してブレーキを緩めるノッチである。","直接制御は、シーケンサーを使用するので間接制御に比べ自動運転が容易である。"], answer:4, explain:"シーケンサーを使用して自動運転がしやすいのは間接制御の特徴であり、直接制御の説明としては誤りです。"},
{license:"crane_fixed", id:"m_t6_8", subject:"motor", theme:6, q:"クレーンの電動機の制御方式に関する記述として、正しいものはどれか。", choices:["制御方式は、クレーンの安全性には無関係である。","間接制御は、電動機を持たないクレーンにのみ使用される。","クレーンの電動機の制御方式は、直接制御のみである。","制御方式によって、設備費や制御器の大きさに違いはない。","制御の方式には、直接制御・間接制御のほか、両者の混合型である半間接制御(複合的な方式)がある。"], answer:4, explain:"電動機の制御方式には直接制御・間接制御に加え、両者の混合型である半間接制御があります。"},
{license:"crane_fixed", id:"m_t7_1", subject:"motor", theme:7, q:"かご形三相誘導電動機の始動方法に関する記述として、正しいものはどれか。", choices:["かご形三相誘導電動機の始動電流は、抵抗器等を用いても抑えることができない。","かご形三相誘導電動機は、常に全電圧で瞬時に始動しなければならない。","かご形三相誘導電動機には、リアクトルを使用することができない。","かご形三相誘導電動機には、緩始動という概念が存在しない。","かご形三相誘導電動機では、電源回路に抵抗器、リアクトル、サイリスターなどを挿入し、始動電流を抑えて緩始動を行う方法がある。"], answer:4, explain:"かご形三相誘導電動機では、抵抗器・リアクトル・サイリスター等を用いて始動電流を抑え、緩始動を行う方法があります。"},
{license:"crane_fixed", id:"m_t7_2", subject:"motor", theme:7, q:"インバーター制御に関する記述として、正しいものはどれか。", choices:["かご形三相誘導電動機のインバーター制御は、電源の周波数を周波数変換器で変えて電動機に供給し回転数を制御するもので、精度の高い速度制御ができる。","インバーター制御は、電源の電圧のみを変え、周波数は変えない方式である。","インバーター制御では、精度の高い速度制御はできない。","インバーター制御は、直流電動機専用の制御方式である。","インバーター制御は、クレーンには使用できない制御方式である。"], answer:0, explain:"インバーター制御は電源の周波数を変換して電動機の回転数を制御するもので、精度の高い速度制御ができます。"},
{license:"crane_fixed", id:"m_t7_3", subject:"motor", theme:7, q:"巻線形三相誘導電動機の二次抵抗制御に関する記述として、正しいものはどれか。", choices:["二次抵抗制御は、かご形三相誘導電動機にのみ用いられる方式である。","二次抵抗制御は、固定子側の抵抗値のみを変化させる方式である。","二次抵抗制御は、回転子の巻線に接続した抵抗器の抵抗値を変化させて速度制御するもので、始動時には二次抵抗を全抵抗挿入状態から順次短絡することにより、緩始動することができる。","二次抵抗制御は、抵抗器を一切使用しない方式である。","二次抵抗制御では、緩始動を行うことができない。"], answer:2, explain:"二次抵抗制御は回転子(二次側)の抵抗値を変化させて速度制御を行い、始動時の緩始動にも利用されます。"},
{license:"crane_fixed", id:"m_t7_4", subject:"motor", theme:7, q:"電動油圧押上機ブレーキ制御に関する記述として、正しいものはどれか。", choices:["電動油圧押上機ブレーキ制御は、機械的な摩擦力を利用して制御するため、ブレーキドラムやライニングが過熱・摩耗することがある。","電動油圧押上機ブレーキ制御は、電気的な制御のみで機械的な摩擦を用いない。","電動油圧押上機ブレーキ制御では、摩擦や摩耗はまったく生じない。","電動油圧押上機ブレーキ制御は、クレーンの速度制御には使用されない。","電動油圧押上機ブレーキ制御は、点検の必要がない方式である。"], answer:0, explain:"電動油圧押上機ブレーキ制御は機械的摩擦を利用するため、ブレーキドラムやライニングの過熱・摩耗が生じることがあります。"},
{license:"crane_fixed", id:"m_t7_5", subject:"motor", theme:7, q:"ダイナミックブレーキ制御に関する記述として、正しいものはどれか。", choices:["巻線形三相誘導電動機のダイナミックブレーキ制御は、巻下げの速度制御時に電動機の一次側を交流電源から切り離し、一次側に直流電源を接続して直流励磁を加えることにより制動力を得るもので、つり荷が軽い場合には低速での巻下げが難しくなることがある。","ダイナミックブレーキ制御は、つり荷の重さにかかわらず、常に同じように低速巻下げができる。","ダイナミックブレーキ制御は、巻上げ専用の制御方式である。","ダイナミックブレーキ制御では、直流電源を一切使用しない。","ダイナミックブレーキ制御は、電動機を停止させたまま行う制御である。"], answer:0, explain:"ダイナミックブレーキ制御は電動機の一次側に直流励磁を加えて制動力を得る方式ですが、つり荷が軽い場合には低速での巻下げが難しくなることがあります。"},
{license:"crane_fixed", id:"m_t7_6", subject:"motor", theme:7, q:"サイリスター一次電圧制御に関する記述として、正しいものはどれか。", choices:["サイリスター一次電圧制御は、直流電動機専用の制御方式である。","サイリスター一次電圧制御は、二次抵抗制御とまったく同じ原理である。","サイリスター一次電圧制御は、電圧を変えても回転数には影響しない方式である。","サイリスター一次電圧制御には、サイリスターという部品は使用されない。","サイリスター一次電圧制御は、電動機の一次側に加える電圧を変えると、同じ負荷に対して回転数が変わる性質を利用して速度制御を行うものである。"], answer:4, explain:"サイリスター一次電圧制御は、一次側の電圧を変えることで同じ負荷に対する回転数を変える性質を利用した速度制御方式です。"},
{license:"crane_fixed", id:"m_t7_7", subject:"motor", theme:7, q:"渦電流ブレーキ制御に関する記述として、正しいものはどれか。", choices:["渦電流ブレーキ制御は、電気的なブレーキであり機械的な摩擦を利用しないため、摩擦による消耗部分がなく、制御性も優れている。","渦電流ブレーキ制御には、消耗する部分が多い。","渦電流ブレーキ制御は、クレーンには使用されない。","渦電流ブレーキ制御は、制御性に劣る方式である。","渦電流ブレーキ制御は、機械的な摩擦のみを利用する方式である。"], answer:0, explain:"渦電流ブレーキ制御は機械的な摩擦を利用しない電気的なブレーキで、消耗部分が少なく制御性にも優れています。"},
{license:"crane_fixed", id:"m_t7_8", subject:"motor", theme:7, q:"クレーンの電動機の速度制御方式に関する記述として、誤っているものはどれか。", choices:["ダイナミックブレーキ制御は、つり荷の重さにかかわらず、常に同じ低速性能が得られる。","二次抵抗制御は、始動時に二次抵抗を順次短絡することで緩始動ができる。","渦電流ブレーキ制御は、機械的な摩擦を利用しない電気的なブレーキである。","インバーター制御は、周波数を変えることで精度の高い速度制御ができる。","電動油圧押上機ブレーキ制御は、機械的摩擦を利用するため部品の摩耗が生じることがある。"], answer:0, explain:"ダイナミックブレーキ制御は、つり荷が軽い場合には低速での巻下げが難しくなることがあり、「常に同じ低速性能」という記述は誤りです。"},
{license:"crane_fixed", id:"m_t8_1", subject:"motor", theme:8, q:"導体・絶縁体(不導体)の分類に関する記述として、正しいものはどれか。", choices:["アルミニウムは絶縁体であり、磁器は導体である。","導体と絶縁体という分類は、電気工学には存在しない。","アルミニウムも磁器も、ともに導体である。","アルミニウムは導体であり、磁器は絶縁体(不導体)である。","アルミニウムも磁器も、ともに絶縁体である。"], answer:3, explain:"アルミニウムは導体、磁器は絶縁体(不導体)に分類されます。"},
{license:"crane_fixed", id:"m_t8_2", subject:"motor", theme:8, q:"黒鉛(グラファイト)の電気的性質に関する記述として、正しいものはどれか。", choices:["黒鉛は、水中でのみ電気を通す。","黒鉛は、電気を通す性質も通さない性質も持たない。","黒鉛は、磁性体である。","黒鉛は、電気の絶縁体(不導体)である。","黒鉛は、電気を通す性質を持つ導体である。"], answer:4, explain:"黒鉛(グラファイト)は炭素の同素体でありながら電気を通す性質を持ち、導体に分類されます。"},
{license:"crane_fixed", id:"m_t8_3", subject:"motor", theme:8, q:"雲母の電気的性質に関する記述として、正しいものはどれか。", choices:["雲母の電気的性質は、湿度に関係なく常に変化する。","雲母は、金属の一種である。","雲母は、電気を通す性質と通さない性質を交互に持つ。","雲母は、電気の絶縁体(不導体)である。","雲母は、電気の導体である。"], answer:3, explain:"雲母は電気の絶縁体(不導体)であり、電気絶縁材料として広く利用されています。"},
{license:"crane_fixed", id:"m_t8_4", subject:"motor", theme:8, q:"ナイフスイッチの操作に関する記述として、正しいものはどれか。", choices:["ナイフスイッチは、切るときの方が入れるときよりも常にスパークが大きい。","ナイフスイッチには、スパークが発生することは一切ない。","ナイフスイッチは、切るときよりも入れるときの方がスパークが大きいので、入れるときはできるだけスイッチに近づかないようにして、側方などから行う。","ナイフスイッチは、正面から強く押し込むようにして入れることが望ましい。","ナイフスイッチの操作には、スパークについて特に注意する必要はない。"], answer:2, explain:"ナイフスイッチは投入時の方がスパークが大きいため、側方などから行い、スイッチに近づき過ぎないようにする必要があります。"},
{license:"crane_fixed", id:"m_t8_5", subject:"motor", theme:8, q:"スパークに関する記述として、正しいものはどれか。", choices:["スパークは、接点の損傷や焼付きの原因にはならない。","スパークは、電圧が低いほど大きくなる。","スパークの大きさは、回路の電圧とは無関係である。","スパークは、直流回路にのみ発生する現象である。","スパークは、回路にかかる電圧が高いほど大きくなり、その熱で接点の損傷や焼付きを発生させることがある。"], answer:4, explain:"スパークは電圧が高いほど大きくなり、その熱によって接点の損傷や焼付きが生じることがあります。"},
{license:"crane_fixed", id:"m_t8_6", subject:"motor", theme:8, q:"スパークによる粉じんの付着に関する記述として、正しいものはどれか。", choices:["がいしの表面清掃は、電気的には無意味である。","がいし表面に粉が付着しても、電気的な問題は一切生じない。","スパークによる粉の飛散は、電気設備には無関係な現象である。","スパークにより火花となって飛んだ粉が、がいしなどの絶縁物の表面に付着すると、漏電や短絡の原因になる。","がいしは、粉が付着しても絶縁性能が変化しない。"], answer:3, explain:"スパークで飛んだ粉ががいし等の絶縁物表面に付着すると、漏電や短絡の原因になることがあります。"},
{license:"crane_fixed", id:"m_t8_7", subject:"motor", theme:8, q:"絶縁抵抗の測定に関する記述として、正しいものはどれか。", choices:["絶縁抵抗の測定には、専用の測定器は不要である。","絶縁抵抗は、目視のみで正確に判断できる。","電気回路の絶縁抵抗は、絶縁抵抗計(いわゆるメガー)と呼ばれる専用の測定器を用いて測定する。","電気回路の絶縁抵抗は、アンメーターと呼ばれる測定器を用いて測定する。","電気回路の絶縁抵抗は、ボルトメーターと呼ばれる測定器を用いて測定する。"], answer:2, explain:"絶縁抵抗は絶縁抵抗計(メガー)と呼ばれる専用の測定器で測定します。アンメーターやボルトメーターではありません。"},
{license:"crane_fixed", id:"m_t8_8", subject:"motor", theme:8, q:"導体・絶縁体及びスパークに関する記述として、誤っているものはどれか。", choices:["絶縁抵抗は、アンメーターと呼ばれる測定器で測定するのが正しい方法である。","雲母は絶縁体(不導体)である。","スパークは電圧が高いほど大きくなる傾向がある。","アルミニウムは導体、磁器は絶縁体である。","黒鉛は電気を通す導体である。"], answer:0, explain:"絶縁抵抗の測定には専用の絶縁抵抗計(メガー)を用いるのが正しい方法であり、アンメーターは電流計であって絶縁抵抗の測定器ではありません。"},
{license:"crane_fixed", id:"m_t9_1", subject:"motor", theme:9, q:"過電流継電器が作動する場合の原因に関する記述として、正しいものはどれか。", choices:["過電流継電器は、いかなる異常があっても作動しない装置である。","過電流継電器が作動する場合の原因の一つとして、電動機の回路が断線していることが挙げられる。","過電流継電器は、玉掛け作業の合図装置の一種である。","過電流継電器は、電圧の低下によってのみ作動する。","過電流継電器が作動する場合の原因の一つとして、回路が短絡していることが挙げられる。"], answer:4, explain:"過電流継電器が作動する原因の一つに回路の短絡があります。断線は電流が流れにくくなる状態であり、過電流の原因にはなりません。"},
{license:"crane_fixed", id:"m_t9_2", subject:"motor", theme:9, q:"電動機がうなるが起動しない場合の原因に関する記述として、正しいものはどれか。", choices:["電動機がうなっても、起動しない原因を調べる必要はない。","電動機がうなる原因は、常に電源電圧が高すぎることのみである。","電動機がうなる現象は、点検の対象とならない。","電動機がうなる現象は、正常な起動時にも必ず発生する。","電動機がうなるが起動しない場合の原因の一つとして、負荷が大き過ぎることが挙げられる。"], answer:4, explain:"電動機がうなるが起動しない原因の一つとして、負荷が大き過ぎることが挙げられます。"},
{license:"crane_fixed", id:"m_t9_3", subject:"motor", theme:9, q:"電動機が起動した後、回転数が上がらない場合の原因に関する記述として、正しいものはどれか。", choices:["電動機の回転数が上がらない原因は、常に潤滑油の不足のみである。","電動機の回転数は、電源電圧の状態にかかわらず一定である。","電動機の回転数不足は、電気的な原因とは無関係である。","電動機が起動した後、回転数が上がらない場合の原因の一つとして、電源の電圧降下が大きいことが挙げられる。","電動機の回転数が上がらない現象は、原因を調べる必要のない正常な状態である。"], answer:3, explain:"電動機の回転数が上がらない原因の一つとして、電源の電圧降下が大きいことが挙げられます。"},
{license:"crane_fixed", id:"m_t9_4", subject:"motor", theme:9, q:"三相誘導電動機が起動した後、回転数が上がらない場合の原因として、正しいものはどれか。", choices:["一次側電源回路の三相の配線のうち2線が断線していることが原因の一つとして挙げられる。","三相誘導電動機には、配線の断線という故障は起こり得ない。","配線の断線は、電動機の性能とは無関係である。","三相の配線状態は、回転数には一切影響しない。","三相の配線が2線断線しても、電動機の運転にはまったく影響しない。"], answer:0, explain:"一次側電源回路の三相のうち2線が断線していると、電動機は起動しても正常な回転数まで上がらないことがあります。"},
{license:"crane_fixed", id:"m_t9_5", subject:"motor", theme:9, q:"電動機が停止しない場合の原因に関する記述として、正しいものはどれか。", choices:["電磁接触器の主接点は、溶着することが絶対にない部品である。","電動機が停止しない原因は、常に運転者の操作ミスのみである。","電動機の停止不良は、電気的な原因とは無関係である。","電動機が停止しない現象は、原因を調べる必要のない正常な状態である。","電動機が停止しない場合の原因の一つとして、電磁接触器の主接点が溶着していることが挙げられる。"], answer:4, explain:"電動機が停止しない原因の一つとして、電磁接触器の主接点が溶着していることが挙げられます。"},
{license:"crane_fixed", id:"m_t9_6", subject:"motor", theme:9, q:"電動機が全く起動しない場合の原因に関する記述として、正しいものはどれか。", choices:["電動機が起動しない原因は、常に電動機本体の寿命のみである。","電動機の起動不良は、配線とは無関係な現象である。","配線の端子が外れても、電動機の起動には影響しない。","電動機が起動しない場合、原因を調べずに新品に交換することが唯一の対策である。","電動機が全く起動しない場合の原因の一つとして、配線の端子が外れていることが挙げられる。"], answer:4, explain:"電動機が全く起動しない原因の一つとして、配線の端子が外れていることが挙げられます。"},
{license:"crane_fixed", id:"m_t9_7", subject:"motor", theme:9, q:"集電装置の火花が激しい場合の原因に関する記述として、正しいものはどれか。", choices:["集電装置の火花は、必ず電源電圧の異常によってのみ発生する。","集電装置の火花は、集電子の状態とは無関係に発生する。","集電子が摩耗していても、火花には一切影響しない。","集電装置の火花が激しい場合の原因の一つとして、集電子が摩耗していることが挙げられる。","集電装置に火花が発生することは、正常な状態であり点検の必要はない。"], answer:3, explain:"集電装置の火花が激しい原因の一つとして、集電子の摩耗が挙げられます。"},
{license:"crane_fixed", id:"m_t9_8", subject:"motor", theme:9, q:"クレーンの電気機器の故障の原因に関する記述として、誤っているものはどれか。", choices:["電動機がうなるが起動しない原因の一つに、負荷が大き過ぎることがある。","集電装置の火花が激しい原因の一つに、集電子の摩耗がある。","過電流継電器が作動する原因の一つに、電動機の回路が断線していることがある。","電動機が停止しない原因の一つに、電磁接触器の主接点の溶着がある。","過電流継電器が作動する原因の一つに、回路の短絡がある。"], answer:2, explain:"回路が断線すると電流は流れにくくなるため、過電流継電器が作動する原因にはなりません。"},
{license:"crane_fixed", id:"m_t10_1", subject:"motor", theme:10, q:"接地(アース)に関する記述として、正しいものはどれか。", choices:["接地は、電気機器の性能を向上させるためだけに行うものである。","接地は、感電の危険をかえって高める措置である。","接地は、法令上、行うことが禁止されている。","接地は、漏電している電気機器のフレームなどに人が接触したとき、感電の危険を少なくする効果がある。","接地は、直流回路にのみ有効な措置である。"], answer:3, explain:"接地は、漏電している機器に人が触れた際の感電の危険を少なくする効果があります。"},
{license:"crane_fixed", id:"m_t10_2", subject:"motor", theme:10, q:"接地線に用いる電線に関する記述として、正しいものはどれか。", choices:["接地線には、できるだけ電気抵抗の大きな電線を使った方が丈夫で安全である。","接地線の抵抗の大小は、感電防止の効果には関係しない。","接地線には、できるだけ電気抵抗の小さい(太い)電線を使うことが望ましい。","接地線には、絶縁体を用いるべきである。","接地線の太さは、感電防止とは無関係である。"], answer:2, explain:"接地線は電気抵抗が小さい(太い)ほど、漏電時の電流を確実に大地へ逃がすことができ、安全性が高くなります。"},
{license:"crane_fixed", id:"m_t10_3", subject:"motor", theme:10, q:"感電による人体への影響に関する記述として、正しいものはどれか。", choices:["感電による人体への影響は、通電時間の長さにかかわらず同じである。","感電による人体への影響は、常に一定であり、条件によって変化しない。","感電による人体への影響は、体質とは無関係である。","感電による人体への影響の程度は、電流の大きさ、通電時間、電流の種類、体質などの条件により異なる。","感電による人体への影響は、電流の大きさのみによって決まる。"], answer:3, explain:"感電による人体への影響は、電流の大きさ・通電時間・電流の種類・体質など複数の条件によって異なります。"},
{license:"crane_fixed", id:"m_t10_4", subject:"motor", theme:10, q:"電気によるやけどに関する記述として、正しいものはどれか。", choices:["電気によるやけどは、アークによるものだけであり、ジュール熱とは無関係である。","電気によるやけどという現象は、クレーン作業には無関係である。","電気によるやけどには、アークなどの高熱による熱傷のほか、電流通過に伴い発生するジュール熱によって引き起こされる、皮膚や内部組織の傷害がある。","電気によるやけどは、皮膚の表面にのみ生じ、内部組織には影響しない。","電気によるやけどは、直流でのみ発生し、交流では発生しない。"], answer:2, explain:"電気によるやけどには、アーク等の高熱による熱傷と、ジュール熱による皮膚・内部組織の傷害があります。"},
{license:"crane_fixed", id:"m_t10_5", subject:"motor", theme:10, q:"天井クレーンの走行レールと感電の関係に関する記述として、正しいものはどれか。", choices:["天井クレーンには、感電の危険が生じる箇所は存在しない。","トロリ線は、常に絶縁されているため、身体が接触しても問題ない。","走行レールが接地されている場合であっても、クレーンガーダ上でトロリ線の充電部分に身体が接触すれば、感電の危険がある。","走行レールの接地状態は、感電の危険とは無関係である。","走行レールが接地されていれば、トロリ線の充電部分に身体が接触しても感電の危険は一切ない。"], answer:2, explain:"走行レールが接地されていても、トロリ線の充電部分に直接触れれば感電の危険は残ります。「危険は一切ない」という記述は誤りです。"},
{license:"crane_fixed", id:"m_t10_6", subject:"motor", theme:10, q:"感電災害の防止措置に関する記述として、正しいものはどれか。", choices:["絶縁抵抗の測定は、感電防止とは無関係である。","感電防止のための点検は、法令上禁止されている。","電動機や配線の絶縁抵抗を定期的に測定することは、感電防止に有効である。","感電防止措置は、屋外作業にのみ必要である。","感電防止のためには、接地を行わない方がよい。"], answer:2, explain:"絶縁抵抗の定期的な測定は、感電防止に有効な措置の一つです。"},
{license:"crane_fixed", id:"m_t10_7", subject:"motor", theme:10, q:"ぬれた手での電気設備の取扱いに関する記述として、正しいものはどれか。", choices:["水は電気を通さないため、ぬれた手での作業はより安全である。","ぬれた手で電気設備に触れても、感電の危険性に変化はない。","ぬれた手の方が、乾いた手よりも感電しにくい。","ぬれた手で電気設備に触れることは、感電の危険を高める。","ぬれた手での作業は、感電とは無関係の問題である。"], answer:3, explain:"水は電気を通しやすいため、ぬれた手で電気設備に触れると感電の危険が高まります。"},
{license:"crane_fixed", id:"m_t10_8", subject:"motor", theme:10, q:"感電及びその防止に関する記述として、誤っているものはどれか。", choices:["接地は、漏電時の感電災害防止に効果がある。","ぬれた手で電気設備に触れることは、感電の危険を高める。","感電による人体への影響は、電流の大きさや通電時間などの条件により異なる。","走行レールが接地されていれば、トロリ線の充電部分に触れても感電の危険は一切ない。","接地線には、できるだけ抵抗の小さい電線を使うことが望ましい。"], answer:3, explain:"走行レールが接地されていても、トロリ線の充電部分に直接触れれば感電の危険は残るため、「危険は一切ない」という記述は誤りです。"},
{license:"crane_fixed", id:"k_t1_1", subject:"mechanics", theme:1, q:"力の三要素に関する記述として、正しいものはどれか。", choices:["力の三要素とは、力の大きさ、力の色及び力の速さをいう。","力の三要素は、物体の質量によって決まる。","力の三要素とは、力の大きさのみをいう。","力の三要素には、作用点は含まれない。","力の三要素とは、力の大きさ、力の向き及び力の作用点をいう。"], answer:4, explain:"力の三要素とは、力の大きさ、力の向き及び力の作用点の3つをいいます。"},
{license:"crane_fixed", id:"k_t1_2", subject:"mechanics", theme:1, q:"力の作用点の移動に関する記述として、正しいものはどれか。", choices:["力の作用点をどこに移しても、物体に与える効果はまったく変わらない。","力の作用点は、常に物体の重心と一致する。","力の作用点を作用線上で移動させると、必ず効果が変わる。","力の作用点は、物体の運動には無関係である。","力が物体に作用する位置をその作用線上以外の箇所に移すと、物体に与える効果が変わることがある。"], answer:4, explain:"力の作用点を作用線上以外の箇所に移すと、物体に与える効果(回転の仕方など)が変わることがあります。作用線上での移動では効果は変わりません。"},
{license:"crane_fixed", id:"k_t1_3", subject:"mechanics", theme:1, q:"力の合成に関する記述として、正しいものはどれか。", choices:["力の合成という概念は、クレーンの力学には登場しない。","一直線上に作用する互いに同じ向きの二つの力の合力は、その二つの力の差で求められる。","二つの力の合力は、常に元の力よりも小さくなる。","一直線上に作用する互いに同じ向きの二つの力の合力の大きさは、その二つの力の大きさの和で求められる。","力の合成は、向きが異なる力どうしには適用できない。"], answer:3, explain:"同じ向きの二つの力の合力は、その大きさの和で求められます。"},
{license:"crane_fixed", id:"k_t1_4", subject:"mechanics", theme:1, q:"一直線上に作用する互いに逆向きの二つの力に関する記述として、正しいものはどれか。", choices:["逆向きの二つの力は、合成することができない。","一直線上に作用する互いに逆を向く二つの力の合力の大きさは、その二つの力の大きさの差で求められる。","逆向きの二つの力の大きさが等しい場合、合力は元の力の2倍になる。","逆向きの二つの力の合力は、常に二つの力の和になる。","逆向きの二つの力の合力の向きは、常に定まらない。"], answer:1, explain:"逆向きの二つの力の合力の大きさは、二つの力の差で求められます。大きさが等しい場合は合力は0になります。"},
{license:"crane_fixed", id:"k_t1_5", subject:"mechanics", theme:1, q:"力のつり合いに関する記述として、正しいものはどれか。", choices:["つり合いの状態にある物体には、いかなる力も作用していない。","多数の力が一点に作用し、つり合っているとき、これらの力の合力は0になる。","力がつり合っていても、物体は必ず運動を続ける。","力がつり合っている状態では、合力は常に最大になる。","力のつり合いは、1つの力のみが作用している場合にのみ成立する。"], answer:1, explain:"複数の力が一点に作用してつり合っているとき、それらの合力は0になります。"},
{license:"crane_fixed", id:"k_t1_6", subject:"mechanics", theme:1, q:"力のモーメントに関する記述として、正しいものはどれか。", choices:["力のモーメントは、物体の回転のしやすさとは無関係な量である。","力のモーメントの単位には、力の単位(N)のみが用いられる。","力の大きさをF、回転軸の中心から力の作用線に下ろした垂線の長さをLとすれば、力のモーメントMは、M=F×Lで求められる。","力のモーメントMは、M=F/Lで求められる。","力のモーメントは、力の大きさのみで決まり、うでの長さには関係しない。"], answer:2, explain:"力のモーメントM=F×L(力の大きさ×うでの長さ)で求められ、単位はN・mです。"},
{license:"crane_fixed", id:"k_t1_7", subject:"mechanics", theme:1, q:"力の分解に関する記述として、正しいものはどれか。", choices:["力の分解は、鉛直方向にのみ行うことができる。","力は、分解することができない量である。","1つの力は、互いに直交する2方向の成分に分解することができる。","力を分解しても、元の力と同じ効果を再現することはできない。","つり荷を斜めにつり上げても、ワイヤロープには鉛直方向の分力しか生じない。"], answer:2, explain:"1つの力は、互いに直交する2方向の成分に分解することができます。"},
{license:"crane_fixed", id:"k_t1_8", subject:"mechanics", theme:1, q:"力に関する記述として、誤っているものはどれか。", choices:["力の大きさが等しく逆向きの二つの力の合力は、元の力の2倍になる。","力のモーメントは、力の大きさとうでの長さの積で求められる。","1つの力は、互いに直交する2方向の成分に分解することができる。","力の三要素とは、力の大きさ、力の向き及び力の作用点をいう。","多数の力が一点に作用しつり合っているとき、その合力は0になる。"], answer:0, explain:"力の大きさが等しく逆向きの二つの力の合力は0になります。「2倍になる」という記述は誤りです。"},
{license:"crane_fixed", id:"k_t2_1", subject:"mechanics", theme:2, q:"図のような「てこ」において、支点からA点までの距離が0.2m、支点からB点までの距離が0.8mであり、B点に質量40kgの荷をつり下げてつり合わせるとき、A点に加える力Pの値に最も近いものはどれか。ただし、重力の加速度は9.8m/s²とし、てこ自体の質量は考えないものとする。", choices:["784N","98N","1568N","3136N","392N"], answer:2, diagram:{"type":"lever","params":{"leftLabel":"P","leftDist":"0.2m","rightLabel":"40kg","rightDist":"0.8m"}}, explain:"モーメントのつり合いより、P×0.2=W×0.8。W=40×9.8=392Nなので、P=392×0.8/0.2=1568Nとなります。"},
{license:"crane_fixed", id:"k_t2_2", subject:"mechanics", theme:2, q:"図のような天びん棒で、支点Oから0.3mの位置に質量20kgの荷、支点Oから0.6mの位置に質量Pの荷をつるしてつり合わせるとき、Pの値として正しいものはどれか。ただし、天びん棒及びワイヤロープの質量は考えないものとする。", choices:["40kg","20kg","10kg","5kg","60kg"], answer:2, diagram:{"type":"lever","params":{"leftLabel":"20kg","leftDist":"0.3m","rightLabel":"P","rightDist":"0.6m"}}, explain:"モーメントのつり合いより、20×0.3=P×0.6なので、P=10kgとなります。"},
{license:"crane_fixed", id:"k_t2_3", subject:"mechanics", theme:2, q:"図のように天びん棒のA点(支点から左に0.4m)に質量30kgの荷、B点(支点から右に0.2m)に質量Qの荷をつるしてつり合わせるとき、Qの値として正しいものはどれか。", choices:["15kg","30kg","60kg","45kg","90kg"], answer:2, diagram:{"type":"lever","params":{"leftLabel":"30kg","leftDist":"0.4m","rightLabel":"Q","rightDist":"0.2m"}}, explain:"モーメントのつり合いより、30×0.4=Q×0.2なので、Q=60kgとなります。"},
{license:"crane_fixed", id:"k_t2_4", subject:"mechanics", theme:2, q:"図のように、長さ10mのクレーンガーダがA、Bの2点の支点で支えられており、A点から6mの位置に質量5tの荷をつるしたとき、B点にかかる力の値に最も近いものはどれか。ただし、重力の加速度は9.8m/s²とし、ガーダ自体の質量は考えないものとする。", choices:["29.4kN","19.6kN","39.2kN","49kN","9.8kN"], answer:0, diagram:{"type":"beamTwoSupports","params":{"leftSegLabel":"6m","rightSegLabel":"4m","loadLabel":"5t","loadFrac":0.6}}, explain:"A点まわりのモーメントのつり合いより、B点の反力=W×6/10。W=5000×9.8=49000N=49kNなので、B点の反力=49×0.6=29.4kNとなります。"},
{license:"crane_fixed", id:"k_t2_5", subject:"mechanics", theme:2, q:"図のように、長さ12mのクレーンガーダがA、Bの2点の支点で支えられており、A点から4mの位置に質量6tの荷をつるしたとき、A点にかかる力の値に最も近いものはどれか。ただし、重力の加速度は9.8m/s²とし、ガーダ自体の質量は考えないものとする。", choices:["29.4kN","39.2kN","58.8kN","19.6kN","9.8kN"], answer:1, diagram:{"type":"beamTwoSupports","params":{"leftSegLabel":"4m","rightSegLabel":"8m","loadLabel":"6t","loadFrac":0.333}}, explain:"B点まわりのモーメントのつり合いより、A点の反力=W×8/12。W=6000×9.8=58800N=58.8kNなので、A点の反力=58.8×2/3=39.2kNとなります。"},
{license:"crane_fixed", id:"k_t2_6", subject:"mechanics", theme:2, q:"図のような「てこ」で、支点からP点(力を加える点)までの距離が1.2m、支点からW点(荷を支える点)までの距離が0.3mであるとき、質量120kgの荷をP点での力Fで支えるために必要な力の値に最も近いものはどれか。ただし、重力の加速度は9.8m/s²とし、てこ自体の質量は考えないものとする。", choices:["1176N","588N","196N","294N","98N"], answer:3, diagram:{"type":"lever","params":{"leftLabel":"F","leftDist":"1.2m","rightLabel":"120kg","rightDist":"0.3m"}}, explain:"モーメントのつり合いより、F×1.2=W×0.3。W=120×9.8=1176Nなので、F=1176×0.3/1.2=294Nとなります。"},
{license:"crane_fixed", id:"k_t2_7", subject:"mechanics", theme:2, q:"てこの原理に関する記述として、正しいものはどれか。", choices:["てこの原理は、クレーンの構造の理解には役立たない。","てこでは、支点・力点・作用点の位置関係により、必要な力の大きさが変わる。","てこを用いると、原理的に仕事の量(エネルギー)自体を減らすことができる。","支点から力点までの距離を短くすると、同じ荷を持ち上げるのに必要な力は小さくなる。","てこには、支点・力点・作用点という概念は存在しない。"], answer:1, explain:"てこでは、支点・力点・作用点の位置関係(距離の比)によって必要な力の大きさが変わります。"},
{license:"crane_fixed", id:"k_t2_8", subject:"mechanics", theme:2, q:"支点にかかる力・てこの計算に関する記述として、誤っているものはどれか。", choices:["てこを用いれば、支点からの距離に関係なく、常に同じ大きさの力で荷を持ち上げることができる。","てこの原理を用いると、必要な力を小さくできる。","力のモーメントのつり合いから、てこや天びん棒にかかる力を計算することができる。","てこにおいて、支点から力点までの距離を長くすると、同じ荷を持ち上げるのに必要な力は小さくなる。","2点で支えられた梁において、荷の位置によって各支点にかかる力の割合が変わる。"], answer:0, explain:"てこで必要な力の大きさは、支点からの距離の比によって変わるため、「距離に関係なく常に同じ力」という記述は誤りです。"},
{license:"crane_fixed", id:"k_t3_1", subject:"mechanics", theme:3, q:"比重の定義に関する記述として、正しいものはどれか。", choices:["比重は、物体の色によって決まる量である。","比重は、物体の温度に一切関係しない絶対的な値である。","比重には、単位が必ず必要である。","比重とは、物体の質量と、その物体と同じ体積の4℃の純水の質量との比をいう。","比重とは、物体の体積のみを表す量である。"], answer:3, explain:"比重は、物体の質量と、同体積の4℃の純水の質量との比で表される、単位のない量です。"},
{license:"crane_fixed", id:"k_t3_2", subject:"mechanics", theme:3, q:"質量の計算式に関する記述として、正しいものはどれか。", choices:["質量Wは、W=V/dで求められる。","質量の単位には、立方メートルが用いられる。","質量は、体積とは無関係に決まる。","質量は、単位体積当たりの質量にかかわらず一定である。","物体の体積をV、その単位体積当たりの質量をdとすれば、その物体の質量WはW=V×dで求められる。"], answer:4, explain:"質量W=体積V×単位体積当たりの質量dで求められます。"},
{license:"crane_fixed", id:"k_t3_3", subject:"mechanics", theme:3, q:"縦2m、横3m、高さ0.5mの直方体の体積の値として、正しいものはどれか。", choices:["1.5m³","5m³","6m³","3m³","7.5m³"], answer:3, explain:"直方体の体積は縦×横×高さで求められ、2×3×0.5=3m³となります。"},
{license:"crane_fixed", id:"k_t3_4", subject:"mechanics", theme:3, q:"半径0.5m、高さ2mの円柱の体積の値に最も近いものはどれか。ただし、円周率は3.14とする。", choices:["1.6m³","0.8m³","4.7m³","3.1m³","6.3m³"], answer:0, explain:"円柱の体積は半径²×π×高さで求められ、0.5²×3.14×2=1.57≒1.6m³となります。"},
{license:"crane_fixed", id:"k_t3_5", subject:"mechanics", theme:3, q:"相似な形状の物体で、各辺の長さが2倍になったとき、体積は何倍になるか。", choices:["6倍","8倍","2倍","16倍","4倍"], answer:1, explain:"相似な立体の体積比は、対応する辺の長さの比の3乗に等しいため、辺が2倍になると体積は2³=8倍になります。"},
{license:"crane_fixed", id:"k_t3_6", subject:"mechanics", theme:3, q:"均質な材料でできた立方体の各辺の長さが3分の1になったとき、質量は何倍になるか。", choices:["9倍","3倍","9分の1倍","27分の1倍","3分の1倍"], answer:3, explain:"立方体の質量は体積に比例し、体積は辺の長さの3乗に比例するため、辺が3分の1になると質量は(1/3)³=27分の1倍になります。"},
{license:"crane_fixed", id:"k_t3_7", subject:"mechanics", theme:3, q:"1m³当たりの質量が2.3tの材料でできた、体積4m³の物体の質量の値として、正しいものはどれか。", choices:["6.9t","11.5t","2.3t","9.2t","4.6t"], answer:3, explain:"質量=体積×単位体積当たりの質量より、4×2.3=9.2tとなります。"},
{license:"crane_fixed", id:"k_t3_8", subject:"mechanics", theme:3, q:"物体の質量及び体積に関する記述として、誤っているものはどれか。", choices:["質量は、体積と単位体積当たりの質量(密度)の積で求められる。","物体の比重は、その物体の質量のみによって決まり、体積とは無関係である。","直方体の体積は、縦×横×高さで求められる。","比重とは、物体の質量と同体積の4℃の純水の質量との比をいう。","相似な立体の体積比は、対応する辺の長さの比の3乗に等しい。"], answer:1, explain:"比重は質量と体積の両方に関わる量(単位体積当たりの質量の相対値)であり、「体積とは無関係」という記述は誤りです。"},
{license:"crane_fixed", id:"k_t4_1", subject:"mechanics", theme:4, q:"重心の定義に関する記述として、正しいものはどれか。", choices:["物体を構成する各部分に作用する重力の合力の作用点を、その物体の重心という。","重心は、物体の体積の最も大きい部分をいう。","重心は、常に物体の表面上にある。","重心とは、物体の色の中心をいう。","重心には、力は一切作用しない。"], answer:0, explain:"重心は、物体の各部分に作用する重力の合力が作用する点です。"},
{license:"crane_fixed", id:"k_t4_2", subject:"mechanics", theme:4, q:"円柱の重心に関する記述として、正しいものはどれか。", choices:["円柱の重心の位置は、材質にかかわらず常に同じ絶対的な位置(空間座標)にある。","円柱の重心は、常に円柱の外部にある。","円柱には、重心という概念が存在しない。","均質な材料でできた円柱の重心は、上下の底面の円の中心を結んだ線分の中点の位置にある。","円柱の重心は、底面の外周上にある。"], answer:3, explain:"均質な円柱の重心は、上下底面の中心を結んだ線分の中点にあります。"},
{license:"crane_fixed", id:"k_t4_3", subject:"mechanics", theme:4, q:"物体の安定性と重心の高さに関する記述として、正しいものはどれか。", choices:["重心の位置が高くなるほど、安定性は良くなる。","重心が低い物体は、常に転倒しやすい。","安定性は、重心の高さのみで決まり、底面積には無関係である。","直方体の物体の置き方を変える場合、重心の位置が高くなるほど安定性は悪くなる。","重心の高さは、物体の安定性には無関係である。"], answer:3, explain:"重心の位置が高くなるほど、物体の安定性は悪くなります。"},
{license:"crane_fixed", id:"k_t4_4", subject:"mechanics", theme:4, q:"物体の底面積と安定性に関する記述として、正しいものはどれか。", choices:["物体の底面積が狭いほど、安定性は高くなる。","底面積は、安定性には一切関係しない。","物体の底面積が広いほど、一般に安定性は高くなる。","底面積は、物体の質量とは無関係な概念である。","底面積が広いと、必ず重心も低くなる。"], answer:2, explain:"物体の底面積が広いほど、一般に安定性は高くなります。"},
{license:"crane_fixed", id:"k_t4_5", subject:"mechanics", theme:4, q:"物体を傾けたときの転倒に関する記述として、正しいものはどれか。", choices:["重心からの鉛直線が底面を外れても、物体は倒れない。","転倒するかどうかは、物体の色によって決まる。","水平面上に置いた直方体の物体を傾けた場合、重心からの鉛直線がその物体の底面を外れるときは、その物体は倒れる。","重心からの鉛直線は、物体の転倒とは無関係である。","物体は、どのように傾けても常に元の位置に戻る。"], answer:2, explain:"重心からの鉛直線が底面から外れると、物体は元の位置に戻らずに倒れます。"},
{license:"crane_fixed", id:"k_t4_6", subject:"mechanics", theme:4, q:"転倒モーメントに関する記述として、正しいものはどれか。", choices:["転倒モーメントは、常に一定の値である。","転倒モーメントは、重心の位置には無関係に決まる。","転倒モーメントが大きいほど、物体は不安定になる(転倒しやすくなる)。","転倒モーメントは、物体の安定性には関係しない量である。","転倒モーメントが大きいほど、物体は安定する。"], answer:2, explain:"転倒モーメントが大きいほど、物体は転倒しやすく不安定になります。"},
{license:"crane_fixed", id:"k_t4_7", subject:"mechanics", theme:4, q:"つり荷の重心と玉掛けに関する記述として、正しいものはどれか。", choices:["つり荷の重心の位置は、玉掛け作業には一切影響しない。","つり荷の重心がフックの真下からずれていると、玉掛け用ワイヤロープに偏った荷重がかかることがある。","つり荷の重心の位置は、玉掛け用具の選定には関係しない。","つり荷は、重心の位置にかかわらず、常に安定してつり上げられる。","つり荷の重心は、常にフックの真下にくるよう自動的に調整される。"], answer:1, explain:"つり荷の重心がフックの真下からずれると、ワイヤロープに偏った荷重がかかることがあります。"},
{license:"crane_fixed", id:"k_t4_8", subject:"mechanics", theme:4, q:"重心及び安定に関する記述として、誤っているものはどれか。", choices:["重心は、物体の形状にかかわらず、必ず物体の内部に存在する。","物体の底面積が広いほど、一般に安定性は高くなる。","重心は、物体各部分にかかる重力の合力の作用点である。","直方体の重心の位置が高くなるほど、安定性は悪くなる。","重心からの鉛直線が底面を外れると、物体は倒れる。"], answer:0, explain:"重心は、物体の形状によっては必ずしも物体の内部にあるとは限りません。"},
{license:"crane_fixed", id:"k_t5_1", subject:"mechanics", theme:5, q:"速さの定義に関する記述として、正しいものはどれか。", choices:["物体の運動の「速い」「遅い」の程度を示す量を速さといい、単位時間に物体が移動した距離で表す。","速さは、常に一定であり、時間によって変化しない。","速さには、単位という概念がない。","速さは、物体の質量で表される量である。","速さは、力の大きさと同じ量である。"], answer:0, explain:"速さは、単位時間に物体が移動した距離で表される量です。"},
{license:"crane_fixed", id:"k_t5_2", subject:"mechanics", theme:5, q:"慣性の法則に関する記述として、正しいものはどれか。", choices:["慣性は、力が作用しているときにのみ生じる性質である。","慣性という概念は、クレーンの運転には関係しない。","慣性とは、物体が常に加速し続ける性質をいう。","外から力が作用しない限り、静止している物体は静止の状態を、運動している物体は同一の運動の状態を続けようとする性質を慣性という。","慣性は、静止している物体にのみ存在する性質である。"], answer:3, explain:"慣性とは、外力が作用しない限り、静止又は運動の状態を維持しようとする性質です。"},
{license:"crane_fixed", id:"k_t5_3", subject:"mechanics", theme:5, q:"物体が一定の加速度で加速し、その速度が5秒間に5m/sから25m/sになったときの加速度の値として、正しいものはどれか。", choices:["3m/s²","5m/s²","4m/s²","20m/s²","2m/s²"], answer:2, explain:"加速度=速度の変化/時間より、(25-5)/5=4m/s²となります。"},
{license:"crane_fixed", id:"k_t5_4", subject:"mechanics", theme:5, q:"遠心力に関する記述として、正しいものはどれか。", choices:["遠心力の大きさは、質量とは無関係である。","遠心力は、物体の質量が大きいほど小さくなる。","物体が円運動をしているとき、遠心力は、物体の質量が大きいほど大きくなる。","遠心力は、静止している物体にのみ作用する力である。","遠心力は、円運動をしていない物体にも常に作用する。"], answer:2, explain:"遠心力は、物体の質量が大きいほど大きくなります。"},
{license:"crane_fixed", id:"k_t5_5", subject:"mechanics", theme:5, q:"ジブクレーンの旋回とつり荷の動きに関する記述として、正しいものはどれか。", choices:["つり荷は、旋回中は常に旋回前より小さい半径で回る。","ジブを旋回させても、つり荷には遠心力の影響はまったく生じない。","荷をつった状態でジブを旋回させても、荷の描く半径は常に一定で変化しない。","ジブクレーンの旋回速度は、つり荷の振れには一切影響しない。","荷をつった状態でジブクレーンのジブを旋回させると、荷は旋回する前の作業半径より大きい半径で回るようになることがある。"], answer:4, explain:"旋回によって生じる遠心力の影響で、つり荷は旋回前の作業半径より大きい半径で振れて回ることがあります。"},
{license:"crane_fixed", id:"k_t5_6", subject:"mechanics", theme:5, q:"等速直線運動に関する記述として、正しいものはどれか。", choices:["等速直線運動の速さは、移動距離のみによって決まり、時間とは無関係である。","等速直線運動をしている物体には、いかなる法則も成立しない。","等速直線運動の速さVは、V=L×Tで求められる。","等速直線運動では、速さは時間とともに変化する。","等速直線運動をしている物体の移動した距離をL、その移動に要した時間をTとすれば、その速さVは、V=L/Tで求められる。"], answer:4, explain:"等速直線運動の速さVは、V=L/T(距離/時間)で求められます。"},
{license:"crane_fixed", id:"k_t5_7", subject:"mechanics", theme:5, q:"物体の運動に関する記述として、正しいものはどれか。", choices:["慣性の法則は、静止している物体には適用されない。","慣性の大きさは、物体の質量には無関係である。","運動している物体には、外部から力が作用しない限り、同一の運動の状態を続けようとする性質(慣性)がある。","運動している物体は、外力の有無にかかわらず常に減速する。","運動している物体は、外部から力が作用しなくても、自然に静止しようとする性質がある。"], answer:2, explain:"運動している物体は、外力が作用しない限り同一の運動状態を続けようとする慣性を持ちます。"},
{license:"crane_fixed", id:"k_t5_8", subject:"mechanics", theme:5, q:"物体の運動に関する記述として、誤っているものはどれか。", choices:["速さは、単位時間に物体が移動した距離で表される。","遠心力は、物体の質量にかかわらず常に一定である。","慣性とは、外力が作用しない限り運動状態を維持しようとする性質である。","一定の加速度で加速する物体の加速度は、速度変化を時間で除して求められる。","遠心力は、物体の質量が大きいほど大きくなる。"], answer:1, explain:"遠心力は物体の質量が大きいほど大きくなるため、「質量にかかわらず常に一定」という記述は誤りです。"},
{license:"crane_fixed", id:"k_t6_1", subject:"mechanics", theme:6, q:"摩擦力の定義に関する記述として、正しいものはどれか。", choices:["摩擦力は、接触面の垂直抗力にかかわらず常に一定である。","摩擦力には、向きという概念がない。","摩擦力は、常に運動を助長する向きに働く。","摩擦力は、接触する2つの面の間で、相対運動を妨げる向きに働く力である。","摩擦力は、接触面がない場合にも生じる力である。"], answer:3, explain:"摩擦力は、接触面の間で相対運動(又はその傾向)を妨げる向きに働く力です。"},
{license:"crane_fixed", id:"k_t6_2", subject:"mechanics", theme:6, q:"静止摩擦力に関する記述として、正しいものはどれか。", choices:["他の物体に接触し、その接触面に沿う方向の力が作用している物体が静止しているとき、接触面に働いている摩擦力を静止摩擦力という。","静止摩擦力は、力が作用していない物体にも常に働く。","静止摩擦力には、最大値という概念が存在しない。","静止摩擦力は、接触面の状態にかかわらず常に一定である。","静止摩擦力は、物体が運動しているときにのみ働く力である。"], answer:0, explain:"静止摩擦力は、力が作用していても静止している物体の接触面に働く摩擦力です。"},
{license:"crane_fixed", id:"k_t6_3", subject:"mechanics", theme:6, q:"最大静止摩擦力の計算式に関する記述として、正しいものはどれか。", choices:["摩擦係数μは、常に1より大きい値をとる。","最大静止摩擦力は、F=μ/Nで求められる。","最大静止摩擦力は、垂直力Nとは無関係に決まる。","静止摩擦係数をμ、物体の接触面に作用する垂直力をNとすれば、最大静止摩擦力FはF=μ×Nで求められる。","最大静止摩擦力は、常に運動摩擦力より小さい。"], answer:3, explain:"最大静止摩擦力F=μ×N(静止摩擦係数×垂直力)で求められます。"},
{license:"crane_fixed", id:"k_t6_4", subject:"mechanics", theme:6, q:"静止摩擦係数0.3の水平な床面に置かれた質量50kgの物体を、床面に沿って引っ張り動かし始めるために必要な力の値に最も近いものはどれか。ただし、重力の加速度は9.8m/s²とする。", choices:["196N","147N","98N","49N","245N"], answer:1, explain:"垂直力N=50×9.8=490N、最大静止摩擦力F=μN=0.3×490=147Nとなります。"},
{license:"crane_fixed", id:"k_t6_5", subject:"mechanics", theme:6, q:"運動摩擦力に関する記述として、正しいものはどれか。", choices:["物体が他の物体に接触しながら運動しているときに働く摩擦力を、運動摩擦力という。","運動摩擦力は、物体が静止しているときに働く力である。","運動摩擦力には、係数という概念が存在しない。","運動摩擦力は、常に静止摩擦力より大きい。","運動摩擦力は、接触面がなくても生じる。"], answer:0, explain:"運動摩擦力は、物体が接触しながら運動しているときに働く摩擦力です。"},
{license:"crane_fixed", id:"k_t6_6", subject:"mechanics", theme:6, q:"転がり摩擦力とすべり摩擦力に関する記述として、正しいものはどれか。", choices:["転がり摩擦力とすべり摩擦力は、常に同じ大きさである。","転がり摩擦力という概念は、円柱には適用されない。","すべり摩擦力は、転がり摩擦力よりも常に小さい。","円柱状の物体を動かす場合、転がり摩擦力はすべり摩擦力に比べると小さい。","転がり摩擦力は、すべり摩擦力より常に大きい。"], answer:3, explain:"円柱状の物体を動かす場合、転がり摩擦力はすべり摩擦力に比べて小さくなります。"},
{license:"crane_fixed", id:"k_t6_7", subject:"mechanics", theme:6, q:"摩擦力とブレーキに関する記述として、正しいものはどれか。", choices:["ブレーキには、摩擦力を利用するものは一切存在しない。","摩擦力を利用したブレーキは、クレーンには使用されない。","摩擦力は、クレーンのブレーキの働きとは無関係である。","摩擦力とブレーキの制動力には、いかなる関係もない。","クレーンのブレーキには、摩擦力を利用して制動を行うものがある。"], answer:4, explain:"クレーンのブレーキには、バンドブレーキやディスクブレーキなど摩擦力を利用して制動を行うものがあります。"},
{license:"crane_fixed", id:"k_t6_8", subject:"mechanics", theme:6, q:"摩擦力に関する記述として、誤っているものはどれか。", choices:["最大静止摩擦力は、静止摩擦係数と垂直力の積で求められる。","クレーンのブレーキには、摩擦力を利用するものがある。","摩擦力は、接触面の状態にかかわらず常に一定の値をとる。","転がり摩擦力は、すべり摩擦力に比べて小さい。","摩擦力は、接触面の間で相対運動を妨げる向きに働く力である。"], answer:2, explain:"摩擦力は接触面の状態(材質・粗さなど)によって変化するため、「常に一定」という記述は誤りです。"},
{license:"crane_fixed", id:"k_t7_1", subject:"mechanics", theme:7, q:"せん断荷重に関する記述として、正しいものはどれか。", choices:["せん断荷重は、材料を引き伸ばすように働く荷重である。","せん断荷重は、材料をねじるように働く荷重である。","せん断荷重は、材料を押しつぶすように働く荷重である。","せん断荷重は、材料をはさみで切るように働く荷重である。","せん断荷重という概念は、クレーンの部材には存在しない。"], answer:3, explain:"せん断荷重は、材料をはさみで切るように働く荷重です。"},
{license:"crane_fixed", id:"k_t7_2", subject:"mechanics", theme:7, q:"クレーンガーダにかかる荷重に関する記述として、正しいものはどれか。", choices:["クレーンガーダには、主にねじり荷重のみがかかる。","クレーンガーダには、せん断荷重のみがかかる。","天井クレーンのクレーンガーダには、主に曲げ荷重がかかる。","クレーンガーダには、荷重が一切かからない。","クレーンガーダにかかる荷重は、常に一定で変化しない。"], answer:2, explain:"天井クレーンのクレーンガーダには、主に曲げ荷重がかかります。"},
{license:"crane_fixed", id:"k_t7_3", subject:"mechanics", theme:7, q:"クレーンのフックにかかる荷重に関する記述として、正しいものはどれか。", choices:["フックには、荷重が一切かからない。","クレーンのフックには、主に引張荷重と曲げ荷重がかかる。","フックには、主にせん断荷重のみがかかる。","フックにかかる荷重は、圧縮荷重のみである。","フックには、ねじり荷重のみがかかる。"], answer:1, explain:"クレーンのフックには、主に引張荷重と曲げ荷重がかかります。"},
{license:"crane_fixed", id:"k_t7_4", subject:"mechanics", theme:7, q:"クレーンの巻上げドラムにかかる荷重に関する記述として、正しいものはどれか。", choices:["巻上げドラムには、引張荷重のみがかかる。","巻上げドラムには、荷重がまったくかからない。","巻上げドラムにかかる荷重は、常に一定で変化しない。","クレーンの巻上げドラムには、曲げ荷重とねじり荷重がかかる。","巻上げドラムには、せん断荷重のみがかかる。"], answer:3, explain:"クレーンの巻上げドラムには、曲げ荷重とねじり荷重がかかります。"},
{license:"crane_fixed", id:"k_t7_5", subject:"mechanics", theme:7, q:"ワイヤロープにかかる荷重に関する記述として、正しいものはどれか。", choices:["ワイヤロープには、圧縮荷重のみがかかる。","ワイヤロープには、ねじり荷重のみがかかる。","クレーンのシーブを通る巻上げ用ワイヤロープには、引張荷重と曲げ荷重がかかる。","ワイヤロープには、荷重が一切かからない。","シーブを通るワイヤロープには、曲げ荷重は生じない。"], answer:2, explain:"シーブを通る巻上げ用ワイヤロープには、引張荷重と曲げ荷重がかかります。"},
{license:"crane_fixed", id:"k_t7_6", subject:"mechanics", theme:7, q:"静荷重と動荷重に関する記述として、正しいものはどれか。", choices:["動荷重には、片振り荷重や両振り荷重、衝撃荷重などが含まれない。","このような繰返し荷重を、静荷重という。","静荷重と動荷重の区別は、クレーンの設計には関係しない。","静荷重は、時間とともに大きさや向きが変化する荷重である。","荷重が繰返し作用すると、比較的小さな荷重であっても機械や構造物が破壊することがあるが、このような現象を引き起こす荷重を動荷重という。"], answer:4, explain:"繰返し作用して比較的小さな荷重でも破壊を引き起こすことがある荷重は、動荷重に分類されます。"},
{license:"crane_fixed", id:"k_t7_7", subject:"mechanics", theme:7, q:"片振り荷重・両振り荷重に関する記述として、正しいものはどれか。", choices:["片振り荷重は、向きは同じであるが、大きさが時間とともに変わる荷重である。","片振り荷重は、向きも大きさも一切変化しない荷重である。","片振り荷重は、静荷重の一種である。","片振り荷重と両振り荷重は、区別されない同一の概念である。","両振り荷重は、常に一定の大きさと向きを持つ荷重である。"], answer:0, explain:"片振り荷重は、向きは同じで大きさが時間とともに変わる荷重です。"},
{license:"crane_fixed", id:"k_t7_8", subject:"mechanics", theme:7, q:"荷重の種類に関する記述として、誤っているものはどれか。", choices:["天井クレーンのクレーンガーダには、主に曲げ荷重がかかる。","巻上げドラムには、曲げ荷重とねじり荷重がかかる。","クレーンのフックには、主に引張荷重と曲げ荷重がかかる。","せん断荷重は、材料をはさみで切るように働く荷重である。","荷重が繰り返し作用しても、機械や構造物が破壊することはない。"], answer:4, explain:"荷重が繰り返し作用すると、比較的小さな荷重でも機械や構造物が破壊することがあるため、この記述は誤りです。"},
{license:"crane_fixed", id:"k_t8_1", subject:"mechanics", theme:8, q:"ひずみの定義に関する記述として、正しいものはどれか。", choices:["ひずみとは、材料の断面積のみを表す量である。","ひずみは、材料が破断したときにのみ生じる。","ひずみには、単位という概念が常に必要である。","ひずみは、荷重の大きさとは無関係な量である。","材料に荷重が作用し変形するとき、荷重が作用する前の元の量(原形)に対する変形量の割合をひずみという。"], answer:4, explain:"ひずみは、原形に対する変形量の割合で表される、単位のない量です。"},
{license:"crane_fixed", id:"k_t8_2", subject:"mechanics", theme:8, q:"引張強さの定義に関する記述として、正しいものはどれか。", choices:["引張強さには、単位という概念が存在しない。","引張強さは、荷重とは無関係な値である。","引張強さは、断面積を荷重で除して求められる。","引張強さは、材料の長さのみで決まる。","引張試験で、材料が破断するまでにかけられる最大の荷重を、材料が破断する前の断面積で除した値を引張強さという。"], answer:4, explain:"引張強さは、破断までの最大荷重を破断前の断面積で除して求めます。"},
{license:"crane_fixed", id:"k_t8_3", subject:"mechanics", theme:8, q:"比例限度と材料の変形に関する記述として、正しいものはどれか。", choices:["荷重の大きさが「荷重-伸び線図」における比例限度以内であれば、荷重を取り除くと、試験片は荷重が作用する前の形状(原形)に戻る。","比例限度という概念は、材料試験には存在しない。","比例限度は、材料の色によって決まる。","比例限度以内であっても、荷重を除いても原形には戻らない。","比例限度を超えても、荷重を除けば必ず原形に戻る。"], answer:0, explain:"比例限度以内であれば、荷重を除くと試験片は原形に戻ります。"},
{license:"crane_fixed", id:"k_t8_4", subject:"mechanics", theme:8, q:"材料の内力に関する記述として、正しいものはどれか。", choices:["内力は、材料が破断したときにのみ発生する。","材料に荷重をかけても、内力は一切生じない。","内力は、外部からの荷重とは無関係に生じる力である。","内力という概念は、クレーンの材料力学には存在しない。","材料に荷重をかけると、材料の内部にはその荷重に抵抗し、つり合いを保とうとする内力が生じる。"], answer:4, explain:"材料に荷重をかけると、その荷重に抵抗しつり合いを保とうとする内力が材料内部に生じます。"},
{license:"crane_fixed", id:"k_t8_5", subject:"mechanics", theme:8, q:"圧縮応力の求め方に関する記述として、正しいものはどれか。", choices:["圧縮応力は、材料の長さのみによって決まる。","圧縮応力は、材料に作用する圧縮荷重を材料の断面積で除して求められる。","圧縮応力には、単位という概念が存在しない。","圧縮応力は、材料の断面積を圧縮荷重で除して求められる。","圧縮応力は、荷重とは無関係な値である。"], answer:1, explain:"圧縮応力は、圧縮荷重を断面積で除して求められます(応力=荷重/断面積)。"},
{license:"crane_fixed", id:"k_t8_6", subject:"mechanics", theme:8, q:"天井から垂直につるした直径2cmの丸棒の先端に質量200kgの荷をつり下げるとき、丸棒に生じる引張応力の値に最も近いものはどれか。ただし、重力の加速度は9.8m/s²とし、丸棒の質量は考えないものとする。", choices:["3 N/mm²","6 N/mm²","12 N/mm²","25 N/mm²","1 N/mm²"], answer:1, diagram:{"type":"hangingRod","params":{"diameterLabel":"直径2cm","weightLabel":"200kg"}}, explain:"断面積A=π×(直径/2)²=3.14×10²=314mm²、荷重F=200×9.8=1960N。応力σ=F/A=1960/314≒6.2N/mm²となります。"},
{license:"crane_fixed", id:"k_t8_7", subject:"mechanics", theme:8, q:"天井から垂直につるした直径1cmの丸棒の先端に質量50kgの荷をつり下げるとき、丸棒に生じる引張応力の値に最も近いものはどれか。ただし、重力の加速度は9.8m/s²とし、丸棒の質量は考えないものとする。", choices:["15 N/mm²","6 N/mm²","10 N/mm²","2 N/mm²","4 N/mm²"], answer:1, diagram:{"type":"hangingRod","params":{"diameterLabel":"直径1cm","weightLabel":"50kg"}}, explain:"断面積A=π×5²=78.5mm²、荷重F=50×9.8=490N。応力σ=F/A=490/78.5≒6.2N/mm²となります。"},
{license:"crane_fixed", id:"k_t8_8", subject:"mechanics", theme:8, q:"材料の強さに関する記述として、誤っているものはどれか。", choices:["ひずみは、原形に対する変形量の割合で表される。","比例限度以内であれば、荷重を除くと試験片は原形に戻る。","引張強さは、破断までの最大荷重を断面積で除して求められる。","材料には、荷重に抵抗する内力が生じる。","圧縮応力は、材料の断面積を圧縮荷重で除して求められる。"], answer:4, explain:"圧縮応力は「圧縮荷重を断面積で除して」求めるものであり、逆に「断面積を荷重で除す」という記述は誤りです。"},
{license:"crane_fixed", id:"k_t9_1", subject:"mechanics", theme:9, q:"図のように、質量20kgの荷を、同じ長さの2本のロープでつり角度(2本のロープが成す角度)60°でつり上げるとき、1本のロープにかかる張力の値に最も近いものはどれか。ただし、重力の加速度は9.8m/s²とし、ロープの質量は考えないものとする。", choices:["196N","170N","98N","57N","113N"], answer:4, diagram:{"type":"angleTension","params":{"angleLabel":"60°","weightLabel":"20kg"}}, explain:"W=20×9.8=196N。半角30°としてT=W/(2cos30°)=196/(2×0.866)≒113Nとなります。"},
{license:"crane_fixed", id:"k_t9_2", subject:"mechanics", theme:9, q:"質量30kgの荷を、同じ長さの2本のロープでつり角度90°でつり上げるとき、1本のロープにかかる張力の値に最も近いものはどれか。ただし、重力の加速度は9.8m/s²とし、ロープの質量は考えないものとする。", choices:["208N","147N","104N","416N","294N"], answer:0, diagram:{"type":"angleTension","params":{"angleLabel":"90°","weightLabel":"30kg"}}, explain:"W=30×9.8=294N。半角45°としてT=W/(2cos45°)=294/(2×0.707)≒208Nとなります。"},
{license:"crane_fixed", id:"k_t9_3", subject:"mechanics", theme:9, q:"質量10kgの荷を、同じ長さの2本のロープでつり角度120°でつり上げるとき、1本のロープにかかる張力の値として、正しいものはどれか。ただし、重力の加速度は9.8m/s²とし、ロープの質量は考えないものとする。", choices:["98N","196N","140N","49N","69N"], answer:0, diagram:{"type":"angleTension","params":{"angleLabel":"120°","weightLabel":"10kg"}}, explain:"W=10×9.8=98N。半角60°としてT=W/(2cos60°)=98/(2×0.5)=98Nとなります。"},
{license:"crane_fixed", id:"k_t9_4", subject:"mechanics", theme:9, q:"質量40kgの荷を、同じ長さの2本の垂直なロープ(つり角度0°)でつり上げるとき、1本のロープにかかる張力の値として、正しいものはどれか。ただし、重力の加速度は9.8m/s²とする。", choices:["196N","392N","784N","588N","98N"], answer:0, diagram:{"type":"angleTension","params":{"angleLabel":"0°","weightLabel":"40kg"}}, explain:"つり角度が0°(2本が垂直で平行)の場合、1本にかかる張力は荷重の2分の1になります。W=40×9.8=392Nなので、T=392/2=196Nとなります。"},
{license:"crane_fixed", id:"k_t9_5", subject:"mechanics", theme:9, q:"つり角度と張力の関係に関する記述として、正しいものはどれか。", choices:["つり角度が0度のとき、張力は無限大になる。","つり角度は、張力の大きさには一切関係しない。","つり角度が180度に近い場合、張力は非常に小さくなる。","つり角度が大きくなるほど、1本のロープにかかる張力は小さくなる。","つり角度(2本のロープが成す角度)が大きくなるほど、1本のロープにかかる張力は大きくなる。"], answer:4, diagram:{"type":"angleTension","params":{"angleLabel":"θ","weightLabel":"W"}}, explain:"つり角度が大きくなるほど、1本のロープにかかる張力は大きくなります。180度に近づくと張力は非常に大きくなります。"},
{license:"crane_fixed", id:"k_t9_6", subject:"mechanics", theme:9, q:"つり角度の実務上の注意に関する記述として、正しいものはどれか。", choices:["つり角度は、一般に60度以内とすることが望ましいとされている。","つり角度は、常に180度に近づけることが望ましい。","つり角度が大きいほど、玉掛け作業は安全になる。","つり角度は、荷の重量には無関係に決めてよい。","つり角度に関する目安は、法令上も実務上も存在しない。"], answer:0, explain:"つり角度は、一般に60度以内とすることが望ましいとされています。"},
{license:"crane_fixed", id:"k_t9_7", subject:"mechanics", theme:9, q:"質量50kgの荷を、同じ長さの2本のロープでつり角度90°でつり上げるとき、1本のロープにかかる張力の値に最も近いものはどれか。ただし、重力の加速度は9.8m/s²とし、ロープの質量は考えないものとする。", choices:["245N","347N","693N","173N","490N"], answer:1, diagram:{"type":"angleTension","params":{"angleLabel":"90°","weightLabel":"50kg"}}, explain:"W=50×9.8=490N。半角45°としてT=W/(2cos45°)=490/(2×0.707)≒347Nとなります。"},
{license:"crane_fixed", id:"k_t9_8", subject:"mechanics", theme:9, q:"つり角度と張力の計算に関する記述として、誤っているものはどれか。", choices:["つり角度にかかわらず、1本のロープにかかる張力は常に荷重の2分の1で一定である。","つり角度が大きくなるほど、1本のロープにかかる張力は大きくなる。","つり角度0度(2本が平行)の場合、1本の張力は荷重の2分の1になる。","つり角度が大きいほど、玉掛け作業における危険性は高まる可能性がある。","つり角度は、一般に60度以内とすることが望ましい。"], answer:0, explain:"1本のロープにかかる張力はつり角度によって変化するため、「常に荷重の2分の1で一定」という記述は誤りです。"},
{license:"crane_fixed", id:"k_t10_1", subject:"mechanics", theme:10, q:"図のような定滑車を用いて質量50kgの荷をつり上げるとき、荷を支えるために必要な力Fの値に最も近いものはどれか。ただし、重力の加速度は9.8m/s²とし、滑車及びロープの質量並びに摩擦は考えないものとする。", choices:["490N","980N","98N","1960N","245N"], answer:0, diagram:{"type":"pulley","params":{"kind":"fixed1"}}, explain:"定滑車は力の向きを変えるだけで大きさは変わらないため、F=W=50×9.8=490Nとなります。"},
{license:"crane_fixed", id:"k_t10_2", subject:"mechanics", theme:10, q:"図のような動滑車を1個用いて質量80kgの荷をつり上げるとき、荷を支えるために必要な力Fの値に最も近いものはどれか。ただし、条件は前問と同様とする。", choices:["784N","1568N","196N","392N","98N"], answer:3, diagram:{"type":"pulley","params":{"kind":"movable1"}}, explain:"動滑車を1個用いると必要な力は理論上2分の1になります。F=80×9.8/2=392Nとなります。"},
{license:"crane_fixed", id:"k_t10_3", subject:"mechanics", theme:10, q:"図のような組合せ滑車(動滑車2個)を用いて質量200kgの荷をつり上げるとき、荷を支えるために必要な力Fの値として、正しいものはどれか。ただし、条件は前問と同様とする。", choices:["245N","490N","980N","1960N","3920N"], answer:1, diagram:{"type":"pulley","params":{"kind":"compound2"}}, explain:"図の組合せ滑車では必要な力は理論上4分の1になります。F=200×9.8/4=490Nとなります。"},
{license:"crane_fixed", id:"k_t10_4", subject:"mechanics", theme:10, q:"滑車の基本原理に関する記述として、正しいものはどれか。", choices:["動滑車を用いても、必要な力の大きさは変わらない。","定滑車を用いると、必要な力は半分になる。","滑車を用いても、荷を持ち上げることはできない。","定滑車は、力の向きを変えることはできるが、力の大きさを変えることはできない。","動滑車を1個用いると、必要な力は4分の1になる。"], answer:3, diagram:{"type":"pulley","params":{"kind":"fixed1"}}, explain:"定滑車は力の向きを変えるだけで、力の大きさは変わりません。"},
{license:"crane_fixed", id:"k_t10_5", subject:"mechanics", theme:10, q:"動滑車と引くロープの長さに関する記述として、正しいものはどれか。", choices:["動滑車は、力を大きくするために用いる装置である。","動滑車を用いると、必要な力は小さくなるが、その分ロープを引く距離は長くなる。","動滑車を用いると、仕事の量(エネルギー)自体を減らすことができる。","動滑車を用いると、ロープを引く距離は短くなる。","動滑車を用いても、引くロープの長さはまったく変化しない。"], answer:1, diagram:{"type":"pulley","params":{"kind":"movable1"}}, explain:"動滑車を用いると必要な力は小さくなりますが、その分ロープを引く距離は長くなり、仕事の量自体は変わりません。"},
{license:"crane_fixed", id:"k_t10_6", subject:"mechanics", theme:10, q:"図のような動滑車を1個用いて質量120kgの荷をつり上げるとき、荷を支えるために必要な力Fの値として、正しいものはどれか。ただし、条件は前問までと同様とする。", choices:["196N","1176N","588N","294N","2352N"], answer:2, diagram:{"type":"pulley","params":{"kind":"movable1"}}, explain:"動滑車1個で必要な力は2分の1になるため、F=120×9.8/2=588Nとなります。"},
{license:"crane_fixed", id:"k_t10_7", subject:"mechanics", theme:10, q:"図のような組合せ滑車(動滑車2個)を用いて質量400kgの荷をつり上げるとき、荷を支えるために必要な力Fの値として、正しいものはどれか。ただし、条件は前問までと同様とする。", choices:["7840N","3920N","1960N","490N","980N"], answer:4, diagram:{"type":"pulley","params":{"kind":"compound2"}}, explain:"図の組合せ滑車では必要な力は理論上4分の1になります。F=400×9.8/4=980Nとなります。"},
{license:"crane_fixed", id:"k_t10_8", subject:"mechanics", theme:10, q:"滑車の力の計算に関する記述として、誤っているものはどれか。", choices:["動滑車を何個用いても、必要な力を小さくすることはできない。","動滑車を用いると、引くロープの長さが長くなる。","クレーンの巻上げ機構には、滑車の原理が応用されている。","定滑車を用いても、必要な力の大きさは変わらない。","動滑車を1個用いると、必要な力は理論上2分の1になる。"], answer:0, explain:"動滑車の数を増やすことで、理論上必要な力をさらに小さくすることができるため、この記述は誤りです。"},
{license:"sennai", id:"s1_t1_1", subject:"command", theme:1, q:"船内荷役作業主任者の職務に関する記述として、正しいものはどれか。", choices:["作業の方法及び労働者の配置を決定し、作業を直接指揮する。","作業主任者は、作業終了後の報告のみを行えばよい。","作業主任者の職務は、法令上定められていない。","作業の指揮は行わず、書類の作成のみを行う。","作業主任者は、荷役機械の運転のみを担当する。"], answer:0, explain:"作業主任者は、作業の方法及び労働者の配置を決定し、作業を直接指揮することが職務の中心です。"},
{license:"sennai", id:"s1_t1_2", subject:"command", theme:1, q:"作業主任者が行うべき器具・工具等の点検に関する記述として、正しいものはどれか。", choices:["器具、工具、要求性能墜落制止用器具等及び保護具の機能を点検し、不良品を取り除く。","器具や工具の点検は、作業者各自に任せ、作業主任者は関与しない。","点検は法令上の義務ではなく、任意である。","保護具の点検は、年に1回行えばよい。","不良品が見つかっても、作業を優先して使用を継続させる。"], answer:0, explain:"作業主任者は、器具・工具・要求性能墜落制止用器具等及び保護具の機能を点検し、不良品を取り除く職務があります。"},
{license:"sennai", id:"s1_t1_3", subject:"command", theme:1, q:"作業主任者の職務として、誤っているものはどれか。", choices:["作業の方法及び労働者の配置を決定する。","作業を直接指揮する。","作業中に発生した災害の責任をすべて作業者個人に負わせる。","器具・工具等の機能を点検し、不良品を取り除く。","要求性能墜落制止用器具等及び保護具の使用状況を監視する。"], answer:2, explain:"災害の責任を作業者個人に負わせることは作業主任者の職務ではありません。作業主任者は安全を確保するための指揮・監視を行います。"},
{license:"sennai", id:"s1_t1_4", subject:"command", theme:1, q:"作業主任者の選任に関する記述として、正しいものはどれか。", choices:["作業主任者は、資格がなくても経験が長ければ選任できる。","作業主任者の氏名は、作業者に周知する必要はない。","作業主任者は、作業者の互選によって決めればよい。","事業者は、技能講習を修了した者のうちから作業主任者を選任しなければならない。","作業主任者は、一度選任すれば作業内容が変わっても再検討は不要である。"], answer:3, explain:"事業者は、船内荷役作業主任者技能講習を修了した者のうちから作業主任者を選任し、その氏名及び職務を作業者に周知する必要があります。"},
{license:"sennai", id:"s1_t2_1", subject:"command", theme:2, q:"船内荷役作業に伴う災害の特徴に関する記述として、正しいものはどれか。", choices:["船倉内は平坦であるため、転倒のおそれはない。","船内荷役作業は陸上作業に比べ、災害発生の危険性は極めて低い。","船内荷役作業の災害は、すべて荷役機械の故障が原因である。","船倉内の作業には、照明や換気を考慮する必要はない。","船倉内は視界や足場が悪く、狭あいな場所での作業となるため、墜落・はさまれ等の災害が発生しやすい。"], answer:4, explain:"船倉内は狭あいで足場や視界が悪く、墜落・転落、はさまれ・巻き込まれ、荷の落下など多様な災害が発生しやすい環境です。"},
{license:"sennai", id:"s1_t2_2", subject:"command", theme:2, q:"船内荷役作業における主な災害の型に関する記述として、誤っているものはどれか。", choices:["荷と船体、荷と荷の間でのはさまれ災害が発生することがある。","船内荷役作業では、酸素欠乏による災害が発生することは一切ない。","つり荷や荷崩れによる飛来・落下災害が発生することがある。","ハッチや船倉内への墜落・転落災害が発生することがある。","荷役機械や玉掛用具の破損による災害が発生することがある。"], answer:1, explain:"船倉内は閉鎖空間であり、貨物の種類によっては酸素欠乏や有害ガスによる災害が発生するおそれがあります。"},
{license:"sennai", id:"s1_t2_3", subject:"command", theme:2, q:"災害防止の基本的な考え方として、正しいものはどれか。", choices:["設備の改善は費用がかかるため、行うべきではない。","災害防止対策は、災害が発生してから考えれば十分である。","設備面の対策(本質安全化)と、作業方法・管理面の対策を組み合わせて講じることが重要である。","作業方法を定めれば、設備上の危険は放置してよい。","災害防止は、作業者の注意力のみに頼ればよい。"], answer:2, explain:"災害防止は、設備面の対策と作業方法・管理面の対策を組み合わせて講じることが基本です。"},
{license:"sennai", id:"s1_t2_4", subject:"command", theme:2, q:"ヒヤリ・ハットに関する記述として、正しいものはどれか。", choices:["ヒヤリ・ハットは、船内荷役作業には存在しない概念である。","災害に至らなかった事象は、記録する必要がない。","ヒヤリ・ハットの報告は、報告者を処分するために用いる。","ヒヤリ・ハットの収集は、作業能率を下げるため行うべきではない。","災害には至らなかったが危険を感じた事象を収集・共有し、再発防止に活かすことが有効である。"], answer:4, explain:"ヒヤリ・ハット事例を収集・共有することは、重大災害の未然防止に有効です。報告者を処分に用いると報告されなくなり逆効果です。"},
{license:"sennai", id:"s1_t3_1", subject:"command", theme:3, q:"船内荷役作業における墜落・転落災害の防止措置として、正しいものはどれか。", choices:["ハッチの開口部や高所での作業では、要求性能墜落制止用器具を使用させるなどの措置を講じる。","開口部があっても、注意して作業すれば特段の措置は不要である。","要求性能墜落制止用器具は、作業者が希望する場合にのみ使用させればよい。","高所作業では、手すりや囲いを設けてはならない。","墜落のおそれがある箇所でも、作業を急ぐ場合は措置を省略してよい。"], answer:0, explain:"開口部や高所では、囲い・手すりの設置や要求性能墜落制止用器具の使用など、墜落を防止する措置を講じる必要があります。"},
{license:"sennai", id:"s1_t3_2", subject:"command", theme:3, q:"船倉への昇降に関する記述として、正しいものはどれか。", choices:["つり荷に乗って船倉へ昇降することが効率的である。","昇降設備の状態は、点検する必要がない。","昇降は作業者の自由な方法に任せてよい。","荷や荷役機械につかまって昇降させてもよい。","船倉への昇降には、安全な昇降設備(タラップ・はしご等)を使用させる。"], answer:4, explain:"船倉への昇降には安全な昇降設備を使用させる必要があり、荷やつり具に乗って昇降させることは危険で認められません。"},
{license:"sennai", id:"s1_t3_3", subject:"command", theme:3, q:"要求性能墜落制止用器具の使用に関する記述として、誤っているものはどれか。", choices:["損傷や著しい摩耗があるものは使用してはならない。","使用前に、ベルトやフックの損傷の有無を点検する。","作業主任者は、使用状況を監視する職務がある。","一度使用した器具は、どのような状態であっても点検せず継続使用してよい。","取付設備は、十分な強度を有するものに確実に取り付ける。"], answer:3, explain:"要求性能墜落制止用器具は使用の都度点検し、損傷や摩耗があるものは使用してはなりません。"},
{license:"sennai", id:"s1_t3_4", subject:"command", theme:3, q:"船内での足場・作業床に関する記述として、正しいものはどれか。", choices:["足元が不安定でも、バランスを取って作業すればよい。","作業床は、荷の上に直接設ければ十分である。","足元が不安定な箇所では、作業床や歩み板を設けるなど安全に作業できる状態を確保する。","歩み板は、幅や強度を考慮する必要がない。","足場の状態は、作業開始後に確認すればよい。"], answer:2, explain:"足元が不安定な箇所では、作業床や歩み板の設置など、安全に作業できる状態を確保することが必要です。"},
{license:"sennai", id:"s1_t4_1", subject:"command", theme:4, q:"はさまれ・巻き込まれ災害の防止に関する記述として、正しいものはどれか。", choices:["荷の移動中も、作業者は自由に移動してよい。","退避位置を定める必要はない。","つり荷と船体、荷と荷の間に身体を入れないよう作業者に徹底し、退避位置を定めておく。","つり荷と船体の間に入って作業した方が効率がよい。","はさまれの危険は、作業者の注意のみで完全に防げる。"], answer:2, explain:"つり荷と船体・荷の間に身体を入れないことを徹底し、あらかじめ安全な退避位置を定めておくことが重要です。"},
{license:"sennai", id:"s1_t4_2", subject:"command", theme:4, q:"荷役機械の運転中における作業者の位置に関する記述として、正しいものはどれか。", choices:["つり荷の下や、荷の移動経路には立ち入らせないようにする。","つり荷の直下は、玉掛け作業者に限り安全である。","荷の移動経路上で待機させた方が作業効率がよい。","つり荷の下は、荷をよく見られるため適切な位置である。","荷役機械の運転中でも、作業者の位置は考慮しなくてよい。"], answer:0, explain:"つり荷の下や荷の移動経路には立ち入らせないことが基本であり、作業者の位置管理は作業主任者の重要な職務です。"},
{license:"sennai", id:"s1_t4_3", subject:"command", theme:4, q:"荷役機械の運転者と作業者の連携に関する記述として、正しいものはどれか。", choices:["合図者を定めることは、作業効率を下げるため避けるべきである。","合図が不明確でも、作業を継続する。","合図者を定め、運転者と作業者の間の合図を統一して行わせる。","運転者は、合図がなくても自分の判断で操作してよい。","合図は、その場にいる誰が行ってもよい。"], answer:2, explain:"合図者を定め統一した合図で運転者と作業者が連携することが、はさまれ等の災害防止に不可欠です。"},
{license:"sennai", id:"s1_t4_4", subject:"command", theme:4, q:"作業中断時・中止時の措置に関する記述として、正しいものはどれか。", choices:["作業中断時の措置は、運転者の判断のみに委ねてよい。","作業を中断するときは、つり荷を宙づりのまま放置せず、安全な状態にしてから離れる。","作業を中断する際は、つり荷を宙づりにしたまま離れてよい。","つり荷を宙づりにしておく方が、再開時に効率がよい。","短時間の中断であれば、つり荷の状態は問わない。"], answer:1, explain:"つり荷を宙づりのまま放置することは落下等の重大災害につながるため、安全な状態にしてから離れる必要があります。"},
{license:"sennai", id:"s1_t5_1", subject:"command", theme:5, q:"荷崩れの防止に関する記述として、正しいものはどれか。", choices:["荷は高く積むほど安定するため、できる限り高く積む。","荷崩れは、船体の動揺とは無関係に発生する。","荷崩れの防止は、作業者個人の経験のみに任せればよい。","積付けの方法や固縛(ラッシング)を適切に行い、荷崩れが生じないようにする。","固縛は、荷の種類にかかわらず不要である。"], answer:3, explain:"積付け方法や固縛を適切に行い、船体の動揺等によっても荷崩れが生じないようにすることが重要です。"},
{license:"sennai", id:"s1_t5_2", subject:"command", theme:5, q:"荷の落下防止に関する記述として、正しいものはどれか。", choices:["荷の形状にかかわらず、同じ玉掛け方法でよい。","玉掛けが不十分でも、慎重に運べば落下しない。","荷は、とりあえずつり上げてから状態を確認すればよい。","つり荷の落下は、防ぎようのない偶発的な事象である。","玉掛けの方法を適切にし、荷が外れたり抜け落ちたりしないことを確認してからつり上げる。"], answer:4, explain:"玉掛けの方法を荷の形状・重量に応じて適切に選び、荷が外れないことを確認してからつり上げることが落下防止の基本です。"},
{license:"sennai", id:"s1_t5_3", subject:"command", theme:5, q:"地切り時の確認に関する記述として、正しいものはどれか。", choices:["地切り時の確認は、荷が軽い場合には不要である。","地切り時に荷が傾いても、そのままつり上げてよい。","地切りは行わず、一気につり上げた方が安全である。","地切り(荷を少し浮かせた状態)で一旦停止し、荷の安定と玉掛けの状態を確認する。","地切りという手順は、船内荷役作業には存在しない。"], answer:3, explain:"地切りで一旦停止して荷の安定と玉掛け状態を確認することは、荷崩れ・落下防止の基本手順です。"},
{license:"sennai", id:"s1_t5_4", subject:"command", theme:5, q:"重量物の取扱いに関する記述として、正しいものはどれか。", choices:["荷の重量は、見た目で判断すれば十分である。","定格荷重を多少超えても、短時間なら問題ない。","荷の重量・重心を事前に確認し、使用する荷役機械や玉掛用具の能力が十分であることを確かめる。","玉掛用具の能力は、荷の重量にかかわらず同じでよい。","重心の位置は、玉掛けには影響しない。"], answer:2, explain:"荷の重量・重心を事前に確認し、荷役機械や玉掛用具の能力が十分であることを確かめることが必要です。"},
{license:"sennai", id:"s1_t6_1", subject:"command", theme:6, q:"災害発生時の措置として、まず行うべきこととして正しいものはどれか。", choices:["報告書の作成を最優先で行う。","まず原因の究明を行い、それが終わってから救助する。","被災者の家族への連絡を最優先で行う。","二次災害の防止を図りつつ、被災者の救出と救急措置を最優先で行う。","作業をそのまま継続し、後で対応する。"], answer:3, explain:"災害発生時は、二次災害を防止しながら被災者の救出・救急措置を最優先で行います。"},
{license:"sennai", id:"s1_t6_2", subject:"command", theme:6, q:"災害発生時の作業主任者の対応として、誤っているものはどれか。", choices:["直ちに作業を中止させ、関係者に周知する。","現場の危険要因を除去し、二次災害を防止する。","原因が判明するまで、作業を通常どおり継続させる。","必要に応じて救急機関への通報を行う。","事業者や関係者へ速やかに報告する。"], answer:2, explain:"災害発生時は直ちに作業を中止させる必要があり、原因が判明するまで通常どおり継続させることは適切ではありません。"},
{license:"sennai", id:"s1_t6_3", subject:"command", theme:6, q:"酸素欠乏のおそれがある船倉内で人が倒れているのを発見した場合の対応として、正しいものはどれか。", choices:["換気は不要であり、扉を閉めたまま救助する。","空気呼吸器等の適切な保護具を装着せずに立ち入ってはならず、換気等の措置と装備を整えてから救助する。","倒れている人の呼びかけに応じるまで待つ。","救助は、船員のみが行うべきであり、作業者は関与しない。","直ちに何も装備せずに船倉内へ入り救助する。"], answer:1, explain:"装備なしでの立入りは救助者自身が被災する二次災害の典型例です。換気と適切な保護具の装着など安全を確保してから救助します。"},
{license:"sennai", id:"s1_t6_4", subject:"command", theme:6, q:"災害後の再発防止に関する記述として、正しいものはどれか。", choices:["災害が起きた作業は、以後すべて中止するしかない。","災害の原因調査は、行っても意味がない。","再発防止策の周知は、関係者の一部にのみ行えばよい。","災害の原因を調査・分析し、作業方法や設備の改善、関係者への周知を行う。","再発防止策は、作業者への注意喚起のみで十分である。"], answer:3, explain:"災害の原因を調査・分析し、作業方法や設備の改善を行い、関係者全員へ周知することが再発防止につながります。"},
{license:"sennai", id:"s1_t7_1", subject:"command", theme:7, q:"作業計画の確認に関する記述として、正しいものはどれか。", choices:["作業計画は、作業を始めてから考えればよい。","貨物の種類が変わっても、作業計画は同じでよい。","作業計画は、口頭の伝達のみで十分であり確認は不要である。","作業開始前に、貨物の種類・重量、使用する荷役機械、作業手順、人員配置等を確認する。","作業計画の確認は、事業者のみが行い、作業主任者は関与しない。"], answer:3, explain:"作業開始前に、貨物の種類・重量、使用機械、作業手順、人員配置等を確認することが作業主任者の重要な職務です。"},
{license:"sennai", id:"s1_t7_2", subject:"command", theme:7, q:"作業開始前の打合せ(ミーティング)に関する記述として、正しいものはどれか。", choices:["合図の方法は、作業中に各自が決めればよい。","作業手順、危険箇所、合図の方法、退避場所等を作業者全員に周知する。","打合せでは、作業手順のみを伝えればよく、危険箇所は伝えなくてよい。","打合せは、新人作業者のみを対象に行えばよい。","打合せは、作業能率を下げるため省略すべきである。"], answer:1, explain:"作業開始前の打合せで、作業手順・危険箇所・合図の方法・退避場所等を作業者全員に周知することが重要です。"},
{license:"sennai", id:"s1_t7_3", subject:"command", theme:7, q:"貨物の情報確認に関する記述として、正しいものはどれか。", choices:["危険物であっても、通常の貨物と同じ方法で取り扱えばよい。","貨物の表示やラベルは、確認する必要がない。","有害物の情報は、作業者に知らせない方がよい。","貨物の性状は、荷役を始めてから確認すればよい。","危険物や有害物が含まれる場合は、その性状と取扱い上の注意事項を事前に確認する。"], answer:4, explain:"危険物・有害物が含まれる場合は、その性状と取扱い上の注意事項を事前に確認し、作業者へ周知する必要があります。"},
{license:"sennai", id:"s1_t7_4", subject:"command", theme:7, q:"作業環境の事前確認に関する記述として、誤っているものはどれか。", choices:["船倉内の照度が不足していないかを確認する。","天候や海象の状況を確認する。","作業環境の確認は、災害が発生してから行えば足りる。","作業用通路や昇降設備の安全性を確認する。","船倉内の換気状態や有害ガスの有無を確認する。"], answer:2, explain:"作業環境の確認は作業開始前に行うべきものであり、災害発生後に行えばよいというものではありません。"},
{license:"sennai", id:"s1_t8_1", subject:"command", theme:8, q:"労働者の配置に関する記述として、正しいものはどれか。", choices:["配置は、作業者の希望のみで決めればよい。","経験の有無にかかわらず、配置は無作為に決めてよい。","作業内容・難易度と各作業者の経験や資格を考慮して配置を決定する。","配置の決定は、作業開始後に行えばよい。","資格が必要な業務にも、無資格者を配置してよい。"], answer:2, explain:"作業内容や難易度、各作業者の経験・資格を考慮して適切に配置することが作業主任者の職務です。"},
{license:"sennai", id:"s1_t8_2", subject:"command", theme:8, q:"資格を要する業務への配置に関する記述として、正しいものはどれか。", choices:["揚貨装置の運転や玉掛け業務など、資格や特別教育が必要な業務には、有資格者を配置する。","有資格者の立会いがあれば、無資格者が単独で作業してよい。","資格制度は、船内荷役作業には適用されない。","資格の有無は、配置の際に考慮しなくてよい。","無資格者でも、経験が長ければ資格業務に就かせてよい。"], answer:0, explain:"揚貨装置の運転や玉掛け等の資格・特別教育が必要な業務には、必ず有資格者を配置しなければなりません。"},
{license:"sennai", id:"s1_t8_3", subject:"command", theme:8, q:"新規入場者や経験の浅い作業者への対応として、正しいものはどれか。", choices:["作業内容や危険箇所を十分に教育し、経験者と組ませるなど配慮した配置を行う。","新規入場者への教育は、省略しても差し支えない。","経験の浅い作業者も、経験者と同じ扱いで単独作業させてよい。","経験の浅い作業者は、最も危険な作業に配置して慣れさせるべきである。","新規入場者は、作業内容を知らせずに配置した方がよい。"], answer:0, explain:"経験の浅い作業者には十分な教育を行い、経験者と組ませるなど配慮した配置を行うことが重要です。"},
{license:"sennai", id:"s1_t8_4", subject:"command", theme:8, q:"作業者の健康状態への配慮に関する記述として、正しいものはどれか。", choices:["高温多湿な環境でも、休憩の配慮は不要である。","体調不良の作業者を危険な作業に就かせないなど、健康状態にも配慮して配置する。","作業者の健康管理は、本人の責任のみである。","体調不良であっても、人員が足りなければ危険作業に就かせてよい。","健康状態は、作業の配置とは無関係である。"], answer:1, explain:"体調不良の作業者を危険な作業に就かせないなど、健康状態にも配慮した配置が必要です。熱中症予防の休憩配慮も重要です。"},
{license:"sennai", id:"s1_t9_1", subject:"command", theme:9, q:"安全作業標準に関する記述として、正しいものはどれか。", choices:["作業の手順・急所・安全上の注意事項を定めたもので、関係作業者に周知する必要がある。","安全作業標準は、作業能率のみを目的としたものである。","安全作業標準は、法令上禁止されている。","安全作業標準は、一度定めれば見直す必要がない。","安全作業標準は、作業主任者だけが知っていればよい。"], answer:0, explain:"安全作業標準は作業の手順・急所・安全上の注意事項を定めたもので、関係作業者への周知が不可欠です。"},
{license:"sennai", id:"s1_t9_2", subject:"command", theme:9, q:"安全作業標準の見直しに関する記述として、正しいものはどれか。", choices:["見直しは、10年に1回程度でよい。","災害が発生しても、安全作業標準を見直す必要はない。","一度作成した安全作業標準は、いかなる場合も変更してはならない。","見直しは、作業者に知らせずに行うべきである。","作業方法や設備、取り扱う貨物が変わったときは、内容を見直す必要がある。"], answer:4, explain:"作業方法・設備・貨物が変わったときや災害・ヒヤリハットが発生したときは、安全作業標準を見直す必要があります。"},
{license:"sennai", id:"s1_t9_3", subject:"command", theme:9, q:"安全作業標準の周知方法に関する記述として、誤っているものはどれか。", choices:["作業場所に掲示する。","周知は口頭で一度伝えれば、以後は不要である。","教育資料を配布し、内容を確認させる。","実際の作業を通じて具体的に指導する。","作業開始前の打合せで説明する。"], answer:1, explain:"安全作業標準は繰り返し周知・指導することが重要であり、一度伝えれば十分というものではありません。"},
{license:"sennai", id:"s1_t9_4", subject:"command", theme:9, q:"安全作業標準と実際の作業が異なっている場合の対応として、正しいものはどれか。", choices:["標準と実作業の差は、確認する必要がない。","作業者を一方的に処分すれば解決する。","原因を確認し、標準どおりに作業させるか、標準自体が実態に合わない場合は見直しを検討する。","実際の作業を優先し、標準は無視してよい。","標準と異なっていても、災害が起きていなければ放置してよい。"], answer:2, explain:"標準と実作業に差がある場合は、原因を確認したうえで、標準どおりの作業を徹底するか、標準自体の見直しを検討します。"},
{license:"sennai", id:"s1_t10_1", subject:"command", theme:10, q:"作業指揮の方法に関する記述として、正しいものはどれか。", choices:["作業主任者は、事務所で待機しながら電話で指示すればよい。","作業者から見える位置・聞こえる位置で、明確な指示を出しながら直接指揮する。","指示は、あいまいでも作業者が察してくれればよい。","指揮は、作業開始時のみ行えばよい。","作業主任者は、作業には立ち会わなくてよい。"], answer:1, explain:"作業主任者は作業者から見える・聞こえる位置で直接作業を指揮し、明確な指示を出す必要があります。"},
{license:"sennai", id:"s1_t10_2", subject:"command", theme:10, q:"作業者への指導に関する記述として、正しいものはどれか。", choices:["不安全な行動は、作業終了後にまとめて注意すればよい。","不安全な行動は、災害が起きてから指導すればよい。","不安全な行動でも、本人の慣れたやり方であれば尊重すべきである。","不安全な行動を見つけたときは、その場で是正し、理由を説明して理解させる。","指導は、理由を説明せず命令するだけでよい。"], answer:3, explain:"不安全行動はその場で是正し、なぜ危険なのか理由を説明して理解させることが、再発防止につながります。"},
{license:"sennai", id:"s1_t10_3", subject:"command", theme:10, q:"作業主任者の監視に関する記述として、正しいものはどれか。", choices:["監視は、作業開始時の1回のみでよい。","保護具の使用状況は、記録だけ取れば監視は不要である。","要求性能墜落制止用器具等及び保護具の使用状況を監視する。","監視は、法令上の職務に含まれていない。","保護具の使用は本人の判断に任せ、監視しない。"], answer:2, explain:"要求性能墜落制止用器具等及び保護具の使用状況を監視することは、作業主任者の法令上の職務です。"},
{license:"sennai", id:"s1_t10_4", subject:"command", theme:10, q:"作業条件が変化した場合の指揮に関する記述として、正しいものはどれか。", choices:["天候の悪化は、作業の可否に影響しない。","天候の悪化や貨物の状態の変化など、作業条件が変わったときは作業方法を再検討し、必要に応じて作業を中止する。","作業の中止は、事業者の指示がなければ一切できない。","条件の変化は、作業終了後に報告すれば足りる。","作業条件が変わっても、当初の計画どおり進めるべきである。"], answer:1, explain:"作業条件が変化したときは作業方法を再検討し、危険が予想される場合は作業を中止する判断が必要です。"},
{license:"sennai", id:"s2_t1_1", subject:"machine", theme:1, q:"揚貨装置に関する記述として、正しいものはどれか。", choices:["揚貨装置とは、船舶に設置されたデリックやクレーンで、荷の積卸しに用いられるものをいう。","揚貨装置には、デリックは含まれない。","揚貨装置とは、陸上に設置されたクレーンのみをいう。","揚貨装置は、船舶の推進装置の一種である。","揚貨装置は、荷の運搬には使用されない設備である。"], answer:0, explain:"揚貨装置は、船舶に設置され荷の積卸しに用いられるデリックやクレーン等の荷役設備をいいます。"},
{license:"sennai", id:"s2_t1_2", subject:"machine", theme:1, q:"揚貨装置の制限荷重に関する記述として、正しいものはどれか。", choices:["制限荷重は、作業の都合により作業主任者が変更できる。","制限荷重は、荷役機械の速度を表す値である。","制限荷重は目安であり、多少超えても差し支えない。","揚貨装置には、荷重の制限という概念がない。","揚貨装置には制限荷重が定められており、これを超える荷重をかけて使用してはならない。"], answer:4, explain:"揚貨装置には制限荷重が定められており、事業者はこれを超える荷重をかけて使用してはなりません。"},
{license:"sennai", id:"s2_t1_3", subject:"machine", theme:1, q:"揚貨装置のワイヤロープに関する記述として、正しいものはどれか。", choices:["ワイヤロープは、外観がきれいであれば内部の劣化を考慮しなくてよい。","ワイヤロープは、素線切れ・径の減少・キンク・著しい形くずれや腐食の有無を点検する。","ワイヤロープの点検は、破断してから行えばよい。","ワイヤロープの点検基準は、法令上定められていない。","ワイヤロープにキンクがあっても、伸ばせば問題なく使用できる。"], answer:1, explain:"ワイヤロープは、素線切れ・径の減少・キンク・形くずれ・腐食などを点検し、基準に該当するものは使用できません。"},
{license:"sennai", id:"s2_t1_4", subject:"machine", theme:1, q:"揚貨装置の運転の業務に関する記述として、正しいものはどれか。", choices:["制限荷重が5トン以上の揚貨装置の運転業務には、揚貨装置運転士免許が必要である。","制限荷重にかかわらず、すべて特別教育のみで運転できる。","揚貨装置の運転は、船員以外は行ってはならない。","揚貨装置の運転には、いかなる資格も不要である。","揚貨装置の運転資格は、事業者が独自に認定できる。"], answer:0, explain:"制限荷重5トン以上の揚貨装置の運転には揚貨装置運転士免許が、5トン未満のものには特別教育の修了が必要です。"},
{license:"sennai", id:"s2_t2_1", subject:"machine", theme:2, q:"デリック装置の構成に関する記述として、正しいものはどれか。", choices:["デリックは、マストのみで構成される。","デリックは、電動機を一切使用しない人力専用の装置である。","デリックには、ウインチは使用されない。","デリックは、マスト(ポスト)とブーム(デリックブーム)、ウインチ、索具等で構成される。","デリックは、ブームを持たない構造である。"], answer:3, explain:"デリックは、マスト(ポスト)、ブーム、ウインチ、各種索具等で構成される荷役装置です。"},
{license:"sennai", id:"s2_t2_2", subject:"machine", theme:2, q:"双吊り(union purchase／けんか巻き)作業に関する記述として、正しいものはどれか。", choices:["双吊り作業では、ブームの角度は考慮しなくてよい。","双吊り作業では、ロープの張力は常に荷重の半分以下となる。","双吊り作業は、1台のウインチのみで行う方法である。","双吊り作業では、荷の振れは発生しない。","2本のデリックブームを固定し、2台のウインチを連動させて荷を移動させる方法で、ロープの張力が過大にならないよう注意が必要である。"], answer:4, explain:"双吊り作業は2本のブームを固定し2台のウインチを連動させる方法で、ブームの角度や荷の位置によりロープ張力が過大になるおそれがあるため注意が必要です。"},
{license:"sennai", id:"s2_t2_3", subject:"machine", theme:2, q:"デリックブームの傾斜角に関する記述として、正しいものはどれか。", choices:["ブームの傾斜角が小さくなるほど、索にかかる張力は小さくなる。","ブームの傾斜角には、使用上の制限が一切ない。","ブームの傾斜角が小さくなる(水平に近づく)ほど、索にかかる張力は大きくなる。","ブームの傾斜角は、索の張力に影響しない。","ブームは、水平状態で使用するのが最も安全である。"], answer:2, explain:"ブームの傾斜角が小さく水平に近づくほど、索にかかる張力は増大し危険が増すため、傾斜角の制限が定められています。"},
{license:"sennai", id:"s2_t2_4", subject:"machine", theme:2, q:"デリックの取扱いに関する記述として、誤っているものはどれか。", choices:["荷をつったまま運転位置を離れてはならない。","制限荷重を超える荷重をかけて使用してはならない。","使用前にブーム、索具、ウインチ等の状態を点検する。","ガイ(控え索)の張り具合や取付け状態を確認する。","作業能率を上げるため、ブームの傾斜角の制限は無視してよい。"], answer:4, explain:"ブームの傾斜角の制限は索の張力や装置の強度に基づくもので、無視することはできません。"},
{license:"sennai", id:"s2_t3_1", subject:"machine", theme:3, q:"船舶に設置されたクレーン(デッキクレーン)に関する記述として、正しいものはどれか。", choices:["デッキクレーンには、巻上げの機能がない。","デッキクレーンは、陸上専用の設備である。","デッキクレーンは、旋回することができない。","デッキクレーンは、デリックより操作が複雑で能率が低い。","旋回・起伏・巻上げの運動を行い、デリックに比べて操作が容易で作業能率が高い。"], answer:4, explain:"デッキクレーンは旋回・起伏・巻上げができ、デリックに比べ操作が容易で作業能率が高いのが特徴です。"},
{license:"sennai", id:"s2_t3_2", subject:"machine", theme:3, q:"ガントリークレーンに関する記述として、正しいものはどれか。", choices:["ガントリークレーンは、船舶に搭載された小型のクレーンである。","ガントリークレーンは、荷の巻上げを行わない。","ガントリークレーンは、ばら貨物専用の設備である。","岸壁に設置され、スプレッダを用いてコンテナの積卸しを行うクレーンである。","ガントリークレーンには、つり具が存在しない。"], answer:3, explain:"ガントリークレーンは岸壁に設置され、スプレッダによりコンテナの積卸しを行うクレーンです。"},
{license:"sennai", id:"s2_t3_3", subject:"machine", theme:3, q:"クレーンの安全装置に関する記述として、正しいものはどれか。", choices:["安全装置は、作業の妨げになるため取り外して使用してよい。","安全装置は、故障していても作業を継続してよい。","クレーンには、安全装置は設けられていない。","巻過防止装置や過負荷防止装置等が設けられており、機能が正常であることを確認して使用する。","安全装置の点検は、年に1回で十分である。"], answer:3, explain:"巻過防止装置や過負荷防止装置等の安全装置は、機能が正常であることを確認して使用しなければなりません。"},
{license:"sennai", id:"s2_t3_4", subject:"machine", theme:3, q:"船舶用クレーンの取扱い上の注意として、正しいものはどれか。", choices:["船舶用クレーンでは、定格荷重を考慮する必要がない。","船体の傾斜や動揺により作業半径や荷の振れが変化するため、状況に応じた慎重な操作が必要である。","船体の動揺は、つり荷の振れには影響しない。","船体が傾斜しても、クレーンの作業条件は変わらない。","荷の振れは、速い操作をすれば防げる。"], answer:1, explain:"船体の傾斜や動揺により作業半径や荷の振れが変化するため、陸上のクレーンより慎重な操作が求められます。"},
{license:"sennai", id:"s2_t4_1", subject:"machine", theme:4, q:"荷役機械の運転開始前の確認に関する記述として、正しいものはどれか。", choices:["運転を開始してから、異常の有無を確認すればよい。","確認は、月に1回行えば十分である。","荷役機械の状態確認は、運転者以外が行ってはならない。","確認事項は、法令上定められていない。","ブレーキ、クラッチ、安全装置、ワイヤロープ等の状態を確認してから運転を開始する。"], answer:4, explain:"作業開始前に、ブレーキ・クラッチ・安全装置・ワイヤロープ等の状態を点検してから運転を開始する必要があります。"},
{license:"sennai", id:"s2_t4_2", subject:"machine", theme:4, q:"荷役機械の運転操作に関する記述として、正しいものはどれか。", choices:["作業能率を優先し、急発進・急停止を積極的に行う。","荷の振れは、操作方法とは無関係である。","運転中は、合図を確認する必要がない。","つり荷を宙づりにしたまま運転位置を離れてよい。","急発進・急停止を避け、荷の振れを抑えた滑らかな操作を行う。"], answer:4, explain:"急発進・急停止は荷振れや衝撃荷重の原因となるため、滑らかな操作を行うことが基本です。"},
{license:"sennai", id:"s2_t4_3", subject:"machine", theme:4, q:"荷役機械の異常を発見した場合の対応として、正しいものはどれか。", choices:["直ちに運転を中止し、事業者等に報告して必要な措置を講じる。","異常は、次回の定期点検で報告すればよい。","運転者の判断で、その場で分解修理を行う。","異常の有無は、記録する必要がない。","異常があっても、作業終了まで運転を継続する。"], answer:0, explain:"異常を発見した場合は直ちに運転を中止し、報告のうえ必要な措置を講じる必要があります。"},
{license:"sennai", id:"s2_t4_4", subject:"machine", theme:4, q:"荷役機械の荷の横引きに関する記述として、正しいものはどれか。", choices:["横引きは、荷が軽い場合には常に安全である。","荷の横引きは、索に過大な張力がかかり荷の振れや転倒を招くおそれがあるため、原則として行わない。","横引きは、作業能率が上がるため積極的に行うべきである。","横引きをしても、索の張力は変化しない。","横引きの危険性は、法令上も実務上も認識されていない。"], answer:1, explain:"荷の横引きは索に過大な張力がかかり、荷の振れや転倒、索の破断を招くおそれがあるため原則として行いません。"},
{license:"sennai", id:"s2_t5_1", subject:"machine", theme:5, q:"揚貨装置の点検に関する記述として、正しいものはどれか。", choices:["点検の結果は、記録してはならない。","その日の作業を開始する前に、制動装置・クラッチ・ワイヤロープ等の機能について点検を行う。","作業開始前の点検は、任意で省略できる。","点検は、異常を感じたときだけ行えばよい。","点検は、1か月に1回行えば足りる。"], answer:1, explain:"揚貨装置を用いて作業を行うときは、その日の作業開始前に制動装置・クラッチ・ワイヤロープ等の機能を点検する必要があります。"},
{license:"sennai", id:"s2_t5_2", subject:"machine", theme:5, q:"揚貨装置の定期自主検査に関する記述として、正しいものはどれか。", choices:["定期自主検査は、5年に1回行えばよい。","定期自主検査は、揚貨装置には適用されない。","定期自主検査は、事業者が任意で実施を選択できる。","定期自主検査の結果は、記録する必要がない。","1年以内ごとに1回、定期に自主検査を行い、結果を記録して一定期間保存しなければならない。"], answer:4, explain:"揚貨装置については1年以内ごとに1回の定期自主検査が義務付けられ、結果の記録と保存が必要です。"},
{license:"sennai", id:"s2_t5_3", subject:"machine", theme:5, q:"点検で異常を認めたときの措置として、正しいものはどれか。", choices:["異常の程度が軽ければ、記録も措置も不要である。","次回の定期検査まで使用を継続してよい。","異常の判断は、作業者の感覚のみで行えばよい。","異常があっても、生産に支障がなければそのまま使用してよい。","直ちに補修その他必要な措置を講じ、異常のあるまま使用してはならない。"], answer:4, explain:"点検で異常を認めたときは、直ちに補修その他必要な措置を講じなければなりません。"},
{license:"sennai", id:"s2_t5_4", subject:"machine", theme:5, q:"荷役機械の点検箇所に関する記述として、誤っているものはどれか。", choices:["ワイヤロープの素線切れや摩耗の状態","ブレーキの効き具合と摩耗の状態","塗装の色あせの程度のみを重点的に点検すれば足りる","フック等のつり具の変形・き裂の有無","シーブやドラムの損傷・回転の状態"], answer:2, explain:"点検は機能や強度に関わる部分を対象とするもので、塗装の色あせのみを点検すれば足りるものではありません。"},
{license:"sennai", id:"s2_t6_1", subject:"machine", theme:6, q:"玉掛用具の点検に関する記述として、正しいものはどれか。", choices:["点検は、玉掛用具が破断してから行えばよい。","玉掛用具の点検は、年に1回で足りる。","その日の作業を開始する前に、玉掛用具の異常の有無について点検を行う。","玉掛用具は、消耗品であるため点検の必要はない。","玉掛用具の点検は、作業主任者の職務に含まれない。"], answer:2, explain:"玉掛用具についても、その日の作業を開始する前に異常の有無を点検する必要があります。"},
{license:"sennai", id:"s2_t6_2", subject:"machine", theme:6, q:"使用してはならない玉掛け用ワイヤロープに関する記述として、正しいものはどれか。", choices:["1よりの間で素線数の10%以上が切断しているものは使用してはならない。","素線が1本でも切れていれば、直ちに使用禁止となる。","素線数の50%以上が切断していなければ使用してよい。","素線切れは、使用可否の判断に関係しない。","素線切れの割合に関する基準は存在しない。"], answer:0, explain:"1よりの間で素線数の10%以上が切断したワイヤロープは、玉掛用具として使用が禁止されています。"},
{license:"sennai", id:"s2_t6_3", subject:"machine", theme:6, q:"玉掛け用ワイヤロープの直径の減少に関する使用禁止基準として、正しいものはどれか。", choices:["直径の減少が公称径の20%を超えるものは使用してはならない。","直径の減少が公称径の7%を超えるものは使用してはならない。","直径の減少は、目視で判断できないため基準がない。","直径の減少に関する基準は定められていない。","直径が減少しても、切断しなければ使用できる。"], answer:1, explain:"ワイヤロープの直径の減少が公称径の7%を超えるものは、玉掛用具として使用が禁止されています。"},
{license:"sennai", id:"s2_t6_4", subject:"machine", theme:6, q:"繊維ロープ・繊維ベルトの点検に関する記述として、正しいものはどれか。", choices:["ストランドが切断しているものや、著しい損傷・腐食があるものは使用してはならない。","繊維ロープの使用禁止基準は定められていない。","繊維ベルトは、切れ目があっても強度に影響しない。","繊維ロープは金属製でないため、点検は不要である。","繊維ベルトは、摩耗しても問題なく使用できる。"], answer:0, explain:"繊維ロープ・繊維ベルトも、ストランドの切断や著しい損傷・腐食があるものは使用できません。"},
{license:"sennai", id:"s2_t7_1", subject:"machine", theme:7, q:"船内荷役作業における保護帽の使用に関する記述として、正しいものはどれか。", choices:["船倉内では、保護帽を着用する必要はない。","飛来・落下物や墜落による危険を防止するため、保護帽を着用させる必要がある。","保護帽の着用は、作業者の任意である。","保護帽は、夏季には着用しなくてよい。","保護帽は、作業主任者のみが着用すればよい。"], answer:1, explain:"飛来・落下物や墜落による危険を防止するため、船内荷役作業では保護帽の着用が必要です。"},
{license:"sennai", id:"s2_t7_2", subject:"machine", theme:7, q:"要求性能墜落制止用器具の使用に関する記述として、正しいものはどれか。", choices:["器具は、身体に装着していれば取り付けなくてもよい。","器具の使用は、事業者への報告のためだけに行う。","取付設備の強度は、考慮する必要がない。","墜落のおそれのある高所作業では、十分な強度を有する取付設備に確実に取り付けて使用する。","高所作業でも、慣れていれば使用しなくてよい。"], answer:3, explain:"要求性能墜落制止用器具は、十分な強度を有する取付設備に確実に取り付けて使用しなければ効果がありません。"},
{license:"sennai", id:"s2_t7_3", subject:"machine", theme:7, q:"作業内容に応じた保護具の選択に関する記述として、正しいものはどれか。", choices:["酸素欠乏の場所では、防じんマスクを使用すれば安全である。","どのような作業でも、保護帽さえ着用していれば十分である。","粉じん作業でも、マスクは不要である。","粉じんが発生する貨物の取扱いでは防じんマスク、酸素欠乏のおそれがある場所では空気呼吸器等を使用する。","保護具の種類は、作業内容とは無関係に選んでよい。"], answer:3, explain:"保護具は作業内容や危険有害性に応じて選択します。酸素欠乏の場所では防じんマスクでは効果がなく、空気呼吸器等が必要です。"},
{license:"sennai", id:"s2_t7_4", subject:"machine", theme:7, q:"保護具の使用に関する作業主任者の職務として、正しいものはどれか。", choices:["保護具の使用状況は、作業終了後に確認すれば足りる。","保護具の監視は、事業者のみが行う。","保護具の使用は、記録さえ残せば監視は不要である。","保護具の使用は作業者の自己責任であり、監視は職務に含まれない。","保護具の使用状況を監視することが職務に含まれる。"], answer:4, explain:"要求性能墜落制止用器具等及び保護具の使用状況を監視することは、作業主任者の法令上の職務です。"},
{license:"sennai", id:"s2_t8_1", subject:"machine", theme:8, q:"保護具の保守点検に関する記述として、正しいものはどれか。", choices:["保護具の保管場所は、どこでもよい。","保護具の点検は、購入時に一度行えば足りる。","保護具の点検記録は、残してはならない。","保護具は、破損するまで使い続けてよい。","使用前後に点検を行い、損傷・劣化したものは補修又は取り替える。"], answer:4, explain:"保護具は使用前後に点検し、損傷・劣化したものは補修または取り替える必要があります。"},
{license:"sennai", id:"s2_t8_2", subject:"machine", theme:8, q:"保護帽の保守に関する記述として、誤っているものはどれか。", choices:["着装体(ヘッドバンド等)の劣化や緩みを点検する。","帽体にき裂や著しい傷があるものは使用しない。","あごひもを正しく締めて使用する。","保護帽は、塗装や穴あけなどの改造を自由に行ってよい。","強い衝撃を受けた保護帽は、外観に異常がなくても交換を検討する。"], answer:3, explain:"保護帽への塗装や穴あけ等の改造は、帽体の強度を低下させるおそれがあるため行ってはなりません。"},
{license:"sennai", id:"s2_t8_3", subject:"machine", theme:8, q:"保護具の保管に関する記述として、正しいものはどれか。", choices:["保管場所は、劣化には影響しない。","直射日光や高温多湿を避け、損傷しないよう適切な場所に保管する。","保護具は、屋外に放置して保管してよい。","保護具は、油や薬品と一緒に保管するのが望ましい。","保護具は、使用後そのまま床に置いておけばよい。"], answer:1, explain:"保護具は直射日光・高温多湿・油や薬品を避け、損傷しないよう適切に保管する必要があります。"},
{license:"sennai", id:"s2_t8_4", subject:"machine", theme:8, q:"要求性能墜落制止用器具の保守点検に関する記述として、正しいものはどれか。", choices:["一度墜落を制止した器具も、外観に異常がなければそのまま使い続けてよい。","金具が変形していても、機能すれば問題ない。","ベルトの摩耗・切れ、金具の変形、ランヤードの損傷等を点検し、異常があるものは使用しない。","器具の点検基準は、存在しない。","点検は、購入時のみ行えばよい。"], answer:2, explain:"ベルト・金具・ランヤード等を点検し、異常があるものは使用しません。墜落を制止した器具は外観に異常がなくても交換します。"},
{license:"sennai", id:"s2_t9_1", subject:"machine", theme:9, q:"船内荷役作業における作業用通路に関する記述として、正しいものはどれか。", choices:["通路に荷を積んでも、作業者が避けて通ればよい。","通路の確保は、作業能率を下げるため不要である。","通路の幅や状態は、考慮する必要がない。","通路は、荷役作業が終わってから確保すればよい。","作業者が安全に通行できる通路を確保し、通行の妨げとなる物を置かないようにする。"], answer:4, explain:"作業者が安全に通行できる通路を確保し、通行の妨げとなる物を置かないことが必要です。"},
{license:"sennai", id:"s2_t9_2", subject:"machine", theme:9, q:"船倉内の照度に関する記述として、正しいものはどれか。", choices:["作業を安全に行うために必要な照度を確保し、不足する場合は照明設備を設ける。","照度の確保は、昼間の作業では一切不要である。","船倉内は暗くても、目が慣れれば作業できる。","照明設備の設置は、法令上禁止されている。","照度は、作業の安全とは無関係である。"], answer:0, explain:"船倉内など採光が不十分な場所では、作業を安全に行うために必要な照度を確保する必要があります。"},
{license:"sennai", id:"s2_t9_3", subject:"machine", theme:9, q:"昇降設備に関する記述として、正しいものはどれか。", choices:["船倉等への昇降には安全な昇降設備を設け、その状態を点検する。","昇降設備がなくても、荷につかまって昇降すればよい。","昇降設備の点検は不要である。","昇降設備は、作業者が自作したものでよい。","昇降は、つり荷に乗って行うのが最も効率的である。"], answer:0, explain:"船倉等への昇降には安全な昇降設備を設け、その状態を点検することが必要です。荷やつり荷での昇降は危険で認められません。"},
{license:"sennai", id:"s2_t9_4", subject:"machine", theme:9, q:"通路や作業床の状態管理に関する記述として、誤っているものはどれか。", choices:["つまずきの原因となる突起物や資材は、取り除くか表示する。","開口部には、囲いや覆いを設ける。","通路の障害物は、作業者が各自よけて通れば措置は不要である。","油や水で滑りやすくなっている箇所は、清掃や滑り止めの措置を講じる。","通路上の照明が切れている場合は、速やかに交換する。"], answer:2, explain:"通路の障害物は取り除くのが原則であり、作業者各自がよけて通ることを前提とするのは適切な措置ではありません。"},
{license:"sennai", id:"s2_t10_1", subject:"machine", theme:10, q:"ハッチカバーの開閉作業に関する記述として、正しいものはどれか。", choices:["ハッチカバーの開閉は、誰でも自由に行ってよい。","ハッチカバーの開閉には、手順は存在しない。","開閉は決められた手順に従って行い、作業範囲内に関係者以外を立ち入らせないようにする。","開閉中も、作業者は自由に周囲を移動してよい。","開閉作業は、荷役作業と同時に行うのが望ましい。"], answer:2, explain:"ハッチカバーの開閉は定められた手順で行い、作業範囲内への立入りを制限する必要があります。"},
{license:"sennai", id:"s2_t10_2", subject:"machine", theme:10, q:"ハッチ開口部の危険に関する記述として、正しいものはどれか。", choices:["ハッチを開放した状態では墜落の危険があるため、囲い・手すりの設置や立入制限等の措置を講じる。","ハッチが開放されていても、注意すれば危険はない。","ハッチ開口部は、墜落災害とは無関係である。","ハッチの開口部には、表示すら不要である。","開口部の措置は、夜間のみ必要である。"], answer:0, explain:"開放されたハッチ開口部は墜落の危険が大きいため、囲い・手すりの設置や立入制限等の措置が必要です。"},
{license:"sennai", id:"s2_t10_3", subject:"machine", theme:10, q:"ハッチビーム等の取扱いに関する記述として、正しいものはどれか。", choices:["ハッチビームは、つり上げたまま放置してよい。","取り外したハッチビームは、ハッチのそばに立てかけておけばよい。","取り外した部材の置き場所は、考慮する必要がない。","取り外したハッチビームやハッチボードは、転倒・落下しないよう安全な場所に確実に置く。","ハッチボードは、通路上に積んでおいても差し支えない。"], answer:3, explain:"取り外したハッチビームやハッチボードは、転倒・落下のおそれがない安全な場所に確実に置く必要があります。"},
{license:"sennai", id:"s2_t10_4", subject:"machine", theme:10, q:"ハッチの開閉と船倉内作業の関係に関する記述として、正しいものはどれか。", choices:["ハッチの開閉と船倉内作業は、同時に行うほど効率がよい。","船倉内に作業者がいる状態でハッチの開閉を行うことは危険であり、作業者の位置を確認してから行う。","ハッチ開閉時の合図は不要である。","船倉内に作業者がいても、ハッチの開閉を行って差し支えない。","作業者の位置は、開閉後に確認すればよい。"], answer:1, explain:"船倉内の作業者の位置を確認せずにハッチを開閉することは、はさまれ・落下等の重大災害につながります。"},
{license:"sennai", id:"s3_t1_1", subject:"slinging", theme:1, q:"力の三要素に関する記述として、正しいものはどれか。", choices:["力の三要素は、荷の形状によって変化する。","力に三要素という概念は存在しない。","力の三要素には、作用点は含まれない。","力の三要素とは、力の大きさ、力の向き及び力の作用点をいう。","力の三要素とは、力の大きさ、質量及び速度をいう。"], answer:3, explain:"力の三要素とは、力の大きさ・力の向き・力の作用点の3つをいいます。"},
{license:"sennai", id:"s3_t1_2", subject:"slinging", theme:1, q:"力のモーメントに関する記述として、正しいものはどれか。", choices:["力のモーメントの単位は、ニュートン(N)である。","力のモーメントは、うでの長さに関係しない。","力のモーメントは、物体の回転とは無関係である。","力のモーメントは、力の大きさを距離で除して求める。","力のモーメントは、力の大きさと、支点から力の作用線までの垂直距離との積で表される。"], answer:4, explain:"力のモーメントは「力の大きさ×うでの長さ」で表され、単位はN・mです。"},
{license:"sennai", id:"s3_t1_3", subject:"slinging", theme:1, q:"力のつり合いに関する記述として、正しいものはどれか。", choices:["つり合っている状態では、合力は最大になる。","力がつり合っていても、物体は必ず動き出す。","つり合いの状態では、物体に力は作用していない。","複数の力が作用してつり合っているとき、それらの合力は0になる。","力のつり合いは、玉掛け作業とは無関係である。"], answer:3, explain:"複数の力が作用してつり合っているとき、それらの合力は0になります。"},
{license:"sennai", id:"s3_t1_4", subject:"slinging", theme:1, q:"荷重の種類に関する記述として、誤っているものはどれか。", choices:["せん断荷重は、材料をはさみで切るように働く荷重である。","玉掛け用ワイヤロープには、主に引張荷重がかかる。","衝撃荷重は、静荷重より常に小さい。","衝撃荷重は、極めて短時間に急激に加わる荷重である。","荷を急制動すると、玉掛用具に衝撃荷重がかかる。"], answer:2, explain:"衝撃荷重は静荷重よりはるかに大きな力となることがあり、急制動や急発進は玉掛用具の破断につながるおそれがあります。"},
{license:"sennai", id:"s3_t2_1", subject:"slinging", theme:2, q:"物体の質量の求め方に関する記述として、正しいものはどれか。", choices:["物体の質量は、体積と単位体積当たりの質量(密度)の積で求められる。","質量の単位には、立方メートルが用いられる。","質量は、物体の形状には関係しない絶対的な値であり、体積とも無関係である。","質量は、体積のみによって決まる。","質量は、体積を密度で除して求める。"], answer:0, explain:"物体の質量は「体積×単位体積当たりの質量(密度)」で求められます。"},
{license:"sennai", id:"s3_t2_2", subject:"slinging", theme:2, q:"縦2m、横1.5m、高さ1mの鋼材(1m³当たりの質量7.8t)の質量に最も近いものはどれか。", choices:["23.4t","15.6t","7.8t","3.0t","11.7t"], answer:0, explain:"体積=2×1.5×1=3m³、質量=3×7.8=23.4tとなります。"},
{license:"sennai", id:"s3_t2_3", subject:"slinging", theme:2, q:"つり荷の重心に関する記述として、正しいものはどれか。", choices:["重心の真上にフックが位置するように玉掛けしないと、荷が傾いたり片荷になったりする。","重心の位置は、玉掛けには影響しない。","重心の位置は、地切り後に確認すればよく、事前の検討は不要である。","重心は、常に荷の幾何学的中心にある。","重心が偏っていても、つり上げれば自然に水平になる。"], answer:0, explain:"重心の真上にフックがくるように玉掛けしないと、荷が傾いたり一方のロープに荷重が偏ったりして危険です。"},
{license:"sennai", id:"s3_t2_4", subject:"slinging", theme:2, q:"重心が高い荷の取扱いに関する記述として、正しいものはどれか。", choices:["重心が高い荷でも、特別な配慮は不要である。","重心が高い荷は、通常より速く移動させた方が安全である。","重心の高さは、荷の安定性とは無関係である。","重心が高いほど、荷は安定する。","重心が高い荷は不安定で転倒しやすいため、つり方や固定方法に注意が必要である。"], answer:4, explain:"重心が高い荷は不安定で転倒しやすいため、つり方や固定方法に十分注意する必要があります。"},
{license:"sennai", id:"s3_t3_1", subject:"slinging", theme:3, q:"つり角度と張力の関係に関する記述として、正しいものはどれか。", choices:["つり角度が0度のとき、張力は無限大になる。","つり角度が大きくなるほど、張力は小さくなる。","つり角度が大きくなるほど、1本のワイヤロープにかかる張力は大きくなる。","つり角度は、張力に影響しない。","張力は、荷の質量のみで決まり、つり角度には関係しない。"], answer:2, explain:"つり角度が大きくなるほど、1本のワイヤロープにかかる張力は増大します。"},
{license:"sennai", id:"s3_t3_2", subject:"slinging", theme:3, q:"実務上望ましいつり角度に関する記述として、正しいものはどれか。", choices:["つり角度は、大きいほど安全である。","つり角度は、一般に60度以内とすることが望ましいとされている。","つり角度は、荷の重量が軽ければ何度でもよい。","つり角度に関する目安は存在しない。","つり角度は、150度以上とすることが望ましい。"], answer:1, explain:"つり角度が大きいほど張力が増すため、一般に60度以内とすることが望ましいとされています。"},
{license:"sennai", id:"s3_t3_3", subject:"slinging", theme:3, q:"質量2tの荷を、同じ長さの2本のワイヤロープでつり角度60度でつるとき、1本にかかる張力に最も近いものはどれか。ただし重力の加速度は9.8m/s²とする。", choices:["4.9kN","9.8kN","11.3kN","19.6kN","39.2kN"], answer:2, explain:"W=2000×9.8=19600N。半角30度としてT=W/(2cos30°)=19600/1.732≒11.3kNとなります。"},
{license:"sennai", id:"s3_t3_4", subject:"slinging", theme:3, q:"安全係数に関する記述として、正しいものはどれか。", choices:["安全係数は、切断荷重を荷の体積で除して求める。","安全係数は、玉掛用具には適用されない。","玉掛け用ワイヤロープの安全係数は3以上でよい。","安全係数は、すべての玉掛用具で共通の値である。","玉掛け用ワイヤロープの安全係数は6以上、フック又はシャックルの安全係数は5以上でなければならない。"], answer:4, explain:"玉掛け用ワイヤロープの安全係数は6以上、フック又はシャックルは5以上と定められています。"},
{license:"sennai", id:"s3_t4_1", subject:"slinging", theme:4, q:"玉掛用具の選定に関する記述として、正しいものはどれか。", choices:["用具の強度は、選定の際に考慮しなくてよい。","荷の形状にかかわらず、常に同じ用具を使用してよい。","玉掛用具は、手近にあるものを使えばよい。","荷の質量・形状・材質・つり角度等を考慮し、十分な強度を有する用具を選定する。","玉掛用具の選定は、作業終了後に検討すればよい。"], answer:3, explain:"荷の質量・形状・材質・つり角度等を考慮し、十分な強度を有する玉掛用具を選定する必要があります。"},
{license:"sennai", id:"s3_t4_2", subject:"slinging", theme:4, q:"つりチェーンの特徴に関する記述として、正しいものはどれか。", choices:["つりチェーンは、玉掛用具には該当しない。","つりチェーンは、伸びても強度に影響しない。","つりチェーンは、耐熱性が低く高熱物には使用できない。","ワイヤロープに比べて耐熱性・耐食性に優れており、高熱物の玉掛けなどに用いられる。","つりチェーンには、使用禁止基準が存在しない。"], answer:3, explain:"つりチェーンはワイヤロープに比べ耐熱性・耐食性に優れ、高熱物の玉掛け等に用いられます。"},
{license:"sennai", id:"s3_t4_3", subject:"slinging", theme:4, q:"繊維スリング(ベルトスリング)の特徴に関する記述として、正しいものはどれか。", choices:["繊維スリングは、鋭利な角に直接掛けても損傷しない。","繊維スリングは、重量物専用の用具である。","繊維スリングには、点検の必要がない。","繊維スリングは、熱や薬品の影響を受けない。","軽量で荷を傷つけにくいが、刃物状の角や熱・薬品に弱いため、当て物等の配慮が必要である。"], answer:4, explain:"繊維スリングは軽量で荷を傷つけにくい反面、鋭利な角・熱・薬品に弱いため当て物等の配慮が必要です。"},
{license:"sennai", id:"s3_t4_4", subject:"slinging", theme:4, q:"つりクランプ・ハッカー等の使用に関する記述として、正しいものはどれか。", choices:["ハッカーは、1個だけ使用すれば常に安全である。","適用板厚は、確認する必要がない。","使用荷重を超えても、短時間であれば問題ない。","つりクランプは、どのような形状の荷にも使用できる。","使用荷重や適用板厚等の使用条件を守り、対象物に確実に取り付けて使用する。"], answer:4, explain:"つりクランプやハッカーは、使用荷重・適用板厚等の使用条件を守り、対象物に確実に取り付けて使用します。"},
{license:"sennai", id:"s3_t5_1", subject:"slinging", theme:5, q:"ワイヤロープに当て物を用いる理由として、正しいものはどれか。", choices:["ワイヤロープを重くするため。","作業能率を上げるため。","荷の角によるワイヤロープの損傷を防ぐとともに、荷の傷付きも防止するため。","当て物は装飾のために用いる。","当て物は、法令で使用が禁止されている。"], answer:2, explain:"荷の角部でワイヤロープが折れ曲がると素線切れ等の損傷を招くため、当て物を用いて保護します。"},
{license:"sennai", id:"s3_t5_2", subject:"slinging", theme:5, q:"キンクしたワイヤロープに関する記述として、正しいものはどれか。", choices:["キンクは、ワイヤロープの強度に影響しない。","キンクしたワイヤロープは、軽い荷なら使用してよい。","キンクは、ワイヤロープの正常な状態である。","キンクしたワイヤロープは、伸ばせば元の強度に戻る。","キンクしたワイヤロープは強度が著しく低下するため、使用してはならない。"], answer:4, explain:"キンクしたワイヤロープは強度が著しく低下するため、玉掛用具として使用してはなりません。"},
{license:"sennai", id:"s3_t5_3", subject:"slinging", theme:5, q:"ワイヤロープの点検に関する記述として、正しいものはどれか。", choices:["点検は、年に1回で十分である。","外観がきれいであれば、点検は省略してよい。","ワイヤロープの点検は、破断してから行えばよい。","点検項目は、作業者が自由に決めてよい。","素線切れ・直径の減少・キンク・形くずれ・腐食の有無を、その日の作業開始前に点検する。"], answer:4, explain:"その日の作業開始前に、素線切れ・直径の減少・キンク・形くずれ・腐食等を点検する必要があります。"},
{license:"sennai", id:"s3_t5_4", subject:"slinging", theme:5, q:"玉掛用具の保管に関する記述として、正しいものはどれか。", choices:["玉掛用具は、甲板上に放置して保管すればよい。","湿気や腐食を避け、変形や損傷が生じないよう整理して保管する。","ワイヤロープは、束ねて踏みつけて保管するのがよい。","保管方法は、玉掛用具の寿命に影響しない。","玉掛用具は、油分を完全に除去して保管する。"], answer:1, explain:"玉掛用具は湿気や腐食を避け、変形・損傷が生じないよう整理して保管する必要があります。"},
