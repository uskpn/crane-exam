{license:"crane_mobile", id:"mobile_law_5_7", subject:"law", theme:5, q:"作業計画とアウトリガーについて、正しいものはどれか。", choices:["最大限に張り出せないときは、張出し幅に応じた定格荷重を下回ることが確実に見込まれる等の条件を満たす必要がある。","軟弱地盤等で使用する例外措置は、薄い布を敷くことだけで満たせる。","作業方法等は、管理者だけが知っていれば周知する必要はない。","鉄板等を敷けば、アウトリガーを鉄板の縁から外して置いてもよい。","転倒防止方法や指揮系統は、荷をつってから決めればよい。"], answer:0, explain:"この記述が正しい内容です。最大限に張り出せないときは、張出し幅に応じた定格荷重を下回ることが確実に見込まれる等の条件を満たす必要がある。<br><br>ほかの選択肢の確認：<br>・鉄板等の上にアウトリガーを設置するときは、機械が転倒するおそれのない位置を選ぶ。<br>・定めた作業方法等は、作業開始前に関係労働者へ周知する。<br>・軟弱地盤等で使用する例外措置には、必要な広さと強度の鉄板等を敷いてその上に設置する方法がある。<br>・作業方法、転倒防止方法、労働者の配置と指揮系統をあらかじめ定める。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_5_8", subject:"law", theme:5, q:"作業計画とアウトリガーについて、誤っているものはどれか。", choices:["定めた作業方法等は、作業開始前に関係労働者へ周知する。","軟弱地盤等で使用する例外措置には、必要な広さと強度の鉄板等を敷いてその上に設置する方法がある。","軟弱地盤等で転倒のおそれがある場所での使用は、原則として禁止される。","鉄板等を敷けば、アウトリガーを鉄板の縁から外して置いてもよい。","アウトリガーや拡幅式クローラは、原則として最大限に張り出す。"], answer:3, explain:"この記述が誤りです。正しくは、鉄板等の上にアウトリガーを設置するときは、機械が転倒するおそれのない位置を選ぶ。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_6_1", subject:"law", theme:6, q:"合図と立入禁止について、正しいものはどれか。", choices:["磁力や陰圧で吸着する荷は、吸着中なら下への立入禁止の対象外となる。","運転について一定の合図を定め、合図者を指名することが原則である。","固定されていない複数の荷でも、まとめてつれば下への立入りを禁止する必要はない。","合図者は、第71条により必ず移動式クレーン運転士免許を持たなければならない。","運転者だけの単独作業であっても、必ず別の合図者を配置する旨が第71条に規定されている。"], answer:1, explain:"この記述が正しい内容です。運転について一定の合図を定め、合図者を指名することが原則である。<br><br>ほかの選択肢の確認：<br>・運転者に単独で作業を行わせる場合は、合図者指名の規定に例外がある。<br>・結束等で固定されていない複数の荷を一度につり上げる場合は、荷の下への立入りを禁止する。<br>・磁力や陰圧で吸着するつり具でつった荷の下は、法令の立入禁止条件に該当する。<br>・合図者には、第71条により移動式クレーン運転士免許の取得が一律に義務付けられているわけではない。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_6_2", subject:"law", theme:6, q:"合図と立入禁止について、誤っているものはどれか。", choices:["運転者だけの単独作業であっても、必ず別の合図者を配置する旨が第71条に規定されている。","磁力や陰圧で吸着するつり具でつった荷の下は、法令の立入禁止条件に該当する。","上部旋回体と接触する危険箇所は、立入禁止にする。","結束等で固定されていない複数の荷を一度につり上げる場合は、荷の下への立入りを禁止する。","運転について一定の合図を定め、合図者を指名することが原則である。"], answer:0, explain:"この記述が誤りです。正しくは、運転者に単独で作業を行わせる場合は、合図者指名の規定に例外がある。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},

{license:"crane_mobile", id:"mobile_law_7_1", subject:"law", theme:7, q:"玉掛用具の基準について、正しいものはどれか。", choices:["玉掛け用フック・シャックルの安全係数は、4以上でよい。","ワイヤロープは、1よりの素線切断が10％ちょうどなら使用禁止基準に該当しない。","つりチェーンは、製造時から6％伸びたものでも使用できる。","玉掛け用ワイヤロープの安全係数は、6以上とする。","フックやつりチェーンのき裂は、荷を軽くすれば使用禁止の対象とならない。"], answer:3, explain:"この記述が正しい内容です。玉掛け用ワイヤロープの安全係数は、6以上とする。<br><br>ほかの選択肢の確認：<br>・変形・き裂があるフック等や、き裂があるつりチェーンは使用しない。<br>・ワイヤロープは、1よりの素線数の10％以上が切断したものを使用しない。フィラ線は素線数から除く。<br>・玉掛け用フック・シャックルの安全係数は、5以上とする。<br>・つりチェーンは、伸びが製造時の長さの5％を超えるものを使用しない。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_7_2", subject:"law", theme:7, q:"玉掛用具の基準について、誤っているものはどれか。", choices:["つりチェーンは、伸びが製造時の長さの5％を超えるものを使用しない。","ワイヤロープは、1よりの素線数の10％以上が切断したものを使用しない。フィラ線は素線数から除く。","玉掛け用フック・シャックルの安全係数は、4以上でよい。","キンクしたワイヤロープは、玉掛けに使用しない。","変形・き裂があるフック等や、き裂があるつりチェーンは使用しない。"], answer:2, explain:"この記述が誤りです。正しくは、玉掛け用フック・シャックルの安全係数は、5以上とする。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_7_3", subject:"law", theme:7, q:"玉掛用具の基準について、正しいものはどれか。", choices:["フックやつりチェーンのき裂は、荷を軽くすれば使用禁止の対象とならない。","つりチェーンは、製造時から6％伸びたものでも使用できる。","ワイヤロープは、1よりの素線数の10％以上が切断したものを使用しない。フィラ線は素線数から除く。","つりチェーンは、リンク断面の直径が製造時から12％減少していても使用できる。","玉掛け用フック・シャックルの安全係数は、4以上でよい。"], answer:2, explain:"この記述が正しい内容です。ワイヤロープは、1よりの素線数の10％以上が切断したものを使用しない。フィラ線は素線数から除く。<br><br>ほかの選択肢の確認：<br>・つりチェーンは、伸びが製造時の長さの5％を超えるものを使用しない。<br>・つりチェーンは、リンク断面の直径が製造時から10％を超えて減少したものを使用しない。<br>・玉掛け用フック・シャックルの安全係数は、5以上とする。<br>・変形・き裂があるフック等や、き裂があるつりチェーンは使用しない。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},

{license:"crane_mobile", id:"mobile_law_7_5", subject:"law", theme:7, q:"玉掛用具の基準について、正しいものはどれか。", choices:["フックやつりチェーンのき裂は、荷を軽くすれば使用禁止の対象とならない。","キンクしたワイヤロープは、玉掛けに使用しない。","ワイヤロープの直径減少の使用禁止基準は、公称径の10％を超える減少である。","つりチェーンは、製造時から6％伸びたものでも使用できる。","ワイヤロープは、1よりの素線切断が10％ちょうどなら使用禁止基準に該当しない。"], answer:1, explain:"この記述が正しい内容です。キンクしたワイヤロープは、玉掛けに使用しない。<br><br>ほかの選択肢の確認：<br>・つりチェーンは、伸びが製造時の長さの5％を超えるものを使用しない。<br>・ワイヤロープは、1よりの素線数の10％以上が切断したものを使用しない。フィラ線は素線数から除く。<br>・ワイヤロープは、直径が公称径から7％を超えて減少したものを使用しない。<br>・変形・き裂があるフック等や、き裂があるつりチェーンは使用しない。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},

{license:"crane_mobile", id:"mobile_law_7_7", subject:"law", theme:7, q:"玉掛用具の基準について、正しいものはどれか。", choices:["ワイヤロープは、1よりの素線切断が10％ちょうどなら使用禁止基準に該当しない。","玉掛け用ワイヤロープの安全係数は、4以上でよい。","玉掛け用フック・シャックルの安全係数は、4以上でよい。","ワイヤロープの直径減少の使用禁止基準は、公称径の10％を超える減少である。","つりチェーンは、リンク断面の直径が製造時から10％を超えて減少したものを使用しない。"], answer:4, explain:"この記述が正しい内容です。つりチェーンは、リンク断面の直径が製造時から10％を超えて減少したものを使用しない。<br><br>ほかの選択肢の確認：<br>・玉掛け用ワイヤロープの安全係数は、6以上とする。<br>・ワイヤロープは、1よりの素線数の10％以上が切断したものを使用しない。フィラ線は素線数から除く。<br>・ワイヤロープは、直径が公称径から7％を超えて減少したものを使用しない。<br>・玉掛け用フック・シャックルの安全係数は、5以上とする。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_7_8", subject:"law", theme:7, q:"玉掛用具の基準について、誤っているものはどれか。", choices:["ワイヤロープは、直径が公称径から7％を超えて減少したものを使用しない。","つりチェーンは、伸びが製造時の長さの5％を超えるものを使用しない。","ワイヤロープは、1よりの素線数の10％以上が切断したものを使用しない。フィラ線は素線数から除く。","玉掛け用フック・シャックルの安全係数は、5以上とする。","フックやつりチェーンのき裂は、荷を軽くすれば使用禁止の対象とならない。"], answer:4, explain:"この記述が誤りです。正しくは、変形・き裂があるフック等や、き裂があるつりチェーンは使用しない。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_8_1", subject:"law", theme:8, q:"自主検査と開始前点検について、正しいものはどれか。", choices:["使用中の移動式クレーンは、1年以内ごとに1回の定期自主検査を行う。","年次自主検査の荷重試験は、必ずつり上げ荷重に相当する荷をつって行う。","1か月を超えて使用しなかった機械の自主検査は、使用再開後1か月以内に行えばよい。","自主検査や点検で異常を認めても、次回の年次検査まで補修を延期できる。","定期自主検査の結果の保存期間は、3か月である。"], answer:0, explain:"この記述が正しい内容です。使用中の移動式クレーンは、1年以内ごとに1回の定期自主検査を行う。<br><br>ほかの選択肢の確認：<br>・定期自主検査の結果は記録し、3年間保存する。<br>・自主検査や点検で異常を認めたときは、直ちに補修する。<br>・1か月を超えて使用せず月例検査を行わなかった機械は、使用を再び開始する際に所定の自主検査を行う。<br>・年次自主検査の荷重試験は、原則として定格荷重に相当する荷をつって行う。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_8_2", subject:"law", theme:8, q:"自主検査と開始前点検について、誤っているものはどれか。", choices:["1か月を超えて使用せず月例検査を行わなかった機械は、使用を再び開始する際に所定の自主検査を行う。","月例自主検査では、安全装置、警報装置、ブレーキ、クラッチ、ロープ、つり具、電気系統等を調べる。","その日の作業開始前に、巻過防止装置、警報装置、ブレーキ等の機能を点検する。","使用中の移動式クレーンの月例自主検査は、6か月以内ごとに1回でよい。","年次自主検査の荷重試験は、原則として定格荷重に相当する荷をつって行う。"], answer:3, explain:"この記述が誤りです。正しくは、使用中の移動式クレーンは、1か月以内ごとに1回の定期自主検査を行う。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_8_3", subject:"law", theme:8, q:"自主検査と開始前点検について、正しいものはどれか。", choices:["1か月を超えて使用しなかった機械の自主検査は、使用再開後1か月以内に行えばよい。","月例自主検査では、機体の塗装色だけを調べればよい。","その日の作業開始前に、巻過防止装置、警報装置、ブレーキ等の機能を点検する。","定期自主検査の結果の保存期間は、3か月である。","自主検査や点検で異常を認めても、次回の年次検査まで補修を延期できる。"], answer:2, explain:"この記述が正しい内容です。その日の作業開始前に、巻過防止装置、警報装置、ブレーキ等の機能を点検する。<br><br>ほかの選択肢の確認：<br>・月例自主検査では、安全装置、警報装置、ブレーキ、クラッチ、ロープ、つり具、電気系統等を調べる。<br>・1か月を超えて使用せず月例検査を行わなかった機械は、使用を再び開始する際に所定の自主検査を行う。<br>・定期自主検査の結果は記録し、3年間保存する。<br>・自主検査や点検で異常を認めたときは、直ちに補修する。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},

{license:"crane_mobile", id:"mobile_law_8_5", subject:"law", theme:8, q:"自主検査と開始前点検について、正しいものはどれか。", choices:["使用中の移動式クレーンの年次自主検査は、3年以内ごとに1回でよい。","自主検査や点検で異常を認めたときは、直ちに補修する。","年次自主検査の荷重試験は、必ずつり上げ荷重に相当する荷をつって行う。","月例自主検査では、機体の塗装色だけを調べればよい。","定期自主検査の結果の保存期間は、3か月である。"], answer:1, explain:"この記述が正しい内容です。自主検査や点検で異常を認めたときは、直ちに補修する。<br><br>ほかの選択肢の確認：<br>・定期自主検査の結果は記録し、3年間保存する。<br>・月例自主検査では、安全装置、警報装置、ブレーキ、クラッチ、ロープ、つり具、電気系統等を調べる。<br>・年次自主検査の荷重試験は、原則として定格荷重に相当する荷をつって行う。<br>・使用中の移動式クレーンは、1年以内ごとに1回の定期自主検査を行う。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_8_6", subject:"law", theme:8, q:"自主検査と開始前点検について、誤っているものはどれか。", choices:["自主検査や点検で異常を認めたときは、直ちに補修する。","年次自主検査の荷重試験は、原則として定格荷重に相当する荷をつって行う。","1か月を超えて使用しなかった機械の自主検査は、使用再開後1か月以内に行えばよい。","月例自主検査では、安全装置、警報装置、ブレーキ、クラッチ、ロープ、つり具、電気系統等を調べる。","使用中の移動式クレーンは、1か月以内ごとに1回の定期自主検査を行う。"], answer:2, explain:"この記述が誤りです。正しくは、1か月を超えて使用せず月例検査を行わなかった機械は、使用を再び開始する際に所定の自主検査を行う。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_8_7", subject:"law", theme:8, q:"自主検査と開始前点検について、正しいものはどれか。", choices:["使用中の移動式クレーンの月例自主検査は、6か月以内ごとに1回でよい。","1か月を超えて使用しなかった機械の自主検査は、使用再開後1か月以内に行えばよい。","使用中の移動式クレーンの年次自主検査は、3年以内ごとに1回でよい。","年次自主検査の荷重試験は、原則として定格荷重に相当する荷をつって行う。","定期自主検査の結果の保存期間は、3か月である。"], answer:3, explain:"この記述が正しい内容です。年次自主検査の荷重試験は、原則として定格荷重に相当する荷をつって行う。<br><br>ほかの選択肢の確認：<br>・1か月を超えて使用せず月例検査を行わなかった機械は、使用を再び開始する際に所定の自主検査を行う。<br>・使用中の移動式クレーンは、1か月以内ごとに1回の定期自主検査を行う。<br>・使用中の移動式クレーンは、1年以内ごとに1回の定期自主検査を行う。<br>・定期自主検査の結果は記録し、3年間保存する。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_8_8", subject:"law", theme:8, q:"自主検査と開始前点検について、誤っているものはどれか。", choices:["1か月を超えて使用せず月例検査を行わなかった機械は、使用を再び開始する際に所定の自主検査を行う。","使用中の移動式クレーンは、1か月以内ごとに1回の定期自主検査を行う。","年次自主検査の荷重試験は、原則として定格荷重に相当する荷をつって行う。","月例自主検査では、機体の塗装色だけを調べればよい。","定期自主検査の結果は記録し、3年間保存する。"], answer:3, explain:"この記述が誤りです。正しくは、月例自主検査では、安全装置、警報装置、ブレーキ、クラッチ、ロープ、つり具、電気系統等を調べる。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_9_1", subject:"law", theme:9, q:"荷重試験と安定度試験について、正しいものはどれか。", choices:["性能検査の荷重試験は、定格荷重の1.25倍で行う。","変更検査の荷重試験は、定格荷重の半分に相当する荷重で行う。","使用再開検査は、無負荷で動かすだけで完了する。","使用検査は、製造検査と異なり荷重試験を行わない。","製造検査の荷重試験は、定格荷重200t以下では、その1.25倍の荷重で行う。"], answer:4, explain:"この記述が正しい内容です。製造検査の荷重試験は、定格荷重200t以下では、その1.25倍の荷重で行う。<br><br>ほかの選択肢の確認：<br>・性能検査の荷重試験は、定格荷重に相当する荷重で行う。<br>・使用再開検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。<br>・使用検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。<br>・変更検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_9_2", subject:"law", theme:9, q:"荷重試験と安定度試験について、誤っているものはどれか。", choices:["製造検査の安定度試験は、定格荷重の1.1倍の荷重で行う。","変更検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。","使用検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。","定格荷重が200tを超える場合、製造検査の荷重試験の荷重は定格荷重に50tを加えた荷重とする。","性能検査の荷重試験は、定格荷重に相当する荷重で行う。"], answer:0, explain:"この記述が誤りです。正しくは、製造検査の安定度試験は、定格荷重の1.27倍の荷重で行う。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_9_3", subject:"law", theme:9, q:"荷重試験と安定度試験について、正しいものはどれか。", choices:["性能検査の荷重試験は、定格荷重の1.25倍で行う。","使用検査は、製造検査と異なり荷重試験を行わない。","製造検査の安定度試験は、定格荷重の1.1倍の荷重で行う。","安定度試験は、安定に関して最も不利な条件で地切りして行う。","定格荷重が200tを超える場合も、製造検査の荷重試験は必ず定格荷重の2倍で行う。"], answer:3, explain:"この記述が正しい内容です。安定度試験は、安定に関して最も不利な条件で地切りして行う。<br><br>ほかの選択肢の確認：<br>・定格荷重が200tを超える場合、製造検査の荷重試験の荷重は定格荷重に50tを加えた荷重とする。<br>・性能検査の荷重試験は、定格荷重に相当する荷重で行う。<br>・製造検査の安定度試験は、定格荷重の1.27倍の荷重で行う。<br>・使用検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_9_4", subject:"law", theme:9, q:"荷重試験と安定度試験について、誤っているものはどれか。", choices:["変更検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。","使用再開検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。","性能検査の荷重試験は、定格荷重に相当する荷重で行う。","製造検査の安定度試験は、定格荷重の1.27倍の荷重で行う。","定格荷重が200tを超える場合も、製造検査の荷重試験は必ず定格荷重の2倍で行う。"], answer:4, explain:"この記述が誤りです。正しくは、定格荷重が200tを超える場合、製造検査の荷重試験の荷重は定格荷重に50tを加えた荷重とする。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_9_5", subject:"law", theme:9, q:"荷重試験と安定度試験について、正しいものはどれか。", choices:["使用検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。","製造検査の安定度試験は、定格荷重の1.1倍の荷重で行う。","安定度試験は、安定に関して最も有利な条件だけで行う。","製造検査の荷重試験は、定格荷重200t以下では、その1.0倍の荷重で行う。","使用再開検査は、無負荷で動かすだけで完了する。"], answer:0, explain:"この記述が正しい内容です。使用検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。<br><br>ほかの選択肢の確認：<br>・使用再開検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。<br>・製造検査の荷重試験は、定格荷重200t以下では、その1.25倍の荷重で行う。<br>・製造検査の安定度試験は、定格荷重の1.27倍の荷重で行う。<br>・安定度試験は、安定に関して最も不利な条件で地切りして行う。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},

{license:"crane_mobile", id:"mobile_law_9_8", subject:"law", theme:9, q:"荷重試験と安定度試験について、誤っているものはどれか。", choices:["変更検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。","使用再開検査は、無負荷で動かすだけで完了する。","製造検査の安定度試験は、定格荷重の1.27倍の荷重で行う。","使用検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。","製造検査の荷重試験は、定格荷重200t以下では、その1.25倍の荷重で行う。"], answer:1, explain:"この記述が誤りです。正しくは、使用再開検査の荷重試験・安定度試験は、製造検査の試験規定を準用する。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_10_1", subject:"law", theme:10, q:"強風時の措置と運転上の禁止について、正しいものはどれか。", choices:["強風で作業を中止した後は、転倒のおそれがあっても何もしなくてよい。","移動式クレーンでは、フックに人を直接つかまらせて常時運搬してよい。","強風のため作業に危険が予想されるときは、作業を中止する。","ジブの組立て・解体の区域には、保護帽を着ければ誰でも立ち入ってよい。","ジブ組立て等の指揮者は、作業時間だけを管理し、材料や工具は確認しない。"], answer:2, explain:"この記述が正しい内容です。強風のため作業に危険が予想されるときは、作業を中止する。<br><br>ほかの選択肢の確認：<br>・移動式クレーンで人をつり上げることは原則禁止で、専用搭乗設備による法定の例外条件がある。<br>・ジブ組立て等の指揮者は、材料や器具工具を点検し、不良品を取り除く。<br>・ジブの組立て・解体では、関係者以外の立入りを禁止する。<br>・強風で作業を中止し、転倒のおそれがあるときは、ジブの位置を固定する等の転倒防止措置を講じる。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_10_2", subject:"law", theme:10, q:"強風時の措置と運転上の禁止について、誤っているものはどれか。", choices:["ジブの組立て・解体では、関係者以外の立入りを禁止する。","移動式クレーンで人をつり上げることは原則禁止で、専用搭乗設備による法定の例外条件がある。","強風のため作業に危険が予想されるときは、作業を中止する。","強風で作業を中止した後は、転倒のおそれがあっても何もしなくてよい。","ジブの組立て・解体では、作業指揮者を選任してその指揮の下で作業する。"], answer:3, explain:"この記述が誤りです。正しくは、強風で作業を中止し、転倒のおそれがあるときは、ジブの位置を固定する等の転倒防止措置を講じる。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_10_3", subject:"law", theme:10, q:"強風時の措置と運転上の禁止について、正しいものはどれか。", choices:["強風で作業を中止した後は、転倒のおそれがあっても何もしなくてよい。","ジブの組立て・解体は、経験者同士なら指揮者を定めなくてよい。","ジブの組立て・解体は、強風時でも予定どおり続けなければならない。","移動式クレーンでは、フックに人を直接つかまらせて常時運搬してよい。","荷をつったまま、運転者は運転位置を離れてはならない。"], answer:4, explain:"この記述が正しい内容です。荷をつったまま、運転者は運転位置を離れてはならない。<br><br>ほかの選択肢の確認：<br>・ジブの組立て・解体で悪天候による危険が予想されるときは、作業を行わせない。<br>・移動式クレーンで人をつり上げることは原則禁止で、専用搭乗設備による法定の例外条件がある。<br>・強風で作業を中止し、転倒のおそれがあるときは、ジブの位置を固定する等の転倒防止措置を講じる。<br>・ジブの組立て・解体では、作業指揮者を選任してその指揮の下で作業する。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},

{license:"crane_mobile", id:"mobile_law_10_7", subject:"law", theme:10, q:"強風時の措置と運転上の禁止について、正しいものはどれか。", choices:["荷をつったままでも、数分間なら運転位置を離れてよい。","ジブ組立て等の指揮者は、材料や器具工具を点検し、不良品を取り除く。","強風でも、荷が定格荷重以下なら作業を中止する必要はない。","ジブの組立て・解体は、経験者同士なら指揮者を定めなくてよい。","ジブの組立て・解体は、強風時でも予定どおり続けなければならない。"], answer:1, explain:"この記述が正しい内容です。ジブ組立て等の指揮者は、材料や器具工具を点検し、不良品を取り除く。<br><br>ほかの選択肢の確認：<br>・荷をつったまま、運転者は運転位置を離れてはならない。<br>・ジブの組立て・解体では、作業指揮者を選任してその指揮の下で作業する。<br>・強風のため作業に危険が予想されるときは、作業を中止する。<br>・ジブの組立て・解体で悪天候による危険が予想されるときは、作業を行わせない。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},

{license:"crane_mobile", id:"mobile_mechanics_1_1", subject:"mechanics", theme:1, q:"力の基礎について、正しいものはどれか。", choices:["一点に働く二力の合力は、常に二力の大きさの単純な和になる。","同一直線上で同じ向きの二力の合力は、必ずゼロになる。","偶力は、同じ作用線上で同じ向きに働く二力である。","力の三要素は、大きさ、方向、作用点である。","同一直線上で反対向きの二力の合力は、常に大きさの積になる。"], answer:3, explain:"この記述が正しい内容です。力の三要素は、大きさ、方向、作用点である。<br><br>ほかの選択肢の確認：<br>・同一直線上で同じ向きの二力の合力は、二力の大きさの和になる。<br>・同一直線上で反対向きの二力の合力は、大きさの差で求められる。<br>・偶力は、大きさが等しく逆向きで、作用線が異なる平行な二力である。<br>・一点に働く二力の合力は、平行四辺形の対角線で表せる。"},
{license:"crane_mobile", id:"mobile_mechanics_1_2", subject:"mechanics", theme:1, q:"力の基礎について、誤っているものはどれか。", choices:["剛体に働く力は、作用線上で作用点を移しても外部に対する作用は変わらない。","同一直線上で同じ向きの二力の合力は、必ずゼロになる。","一点に働く二力の合力は、平行四辺形の対角線で表せる。","同一直線上で反対向きの二力の合力は、大きさの差で求められる。","力の三要素は、大きさ、方向、作用点である。"], answer:1, explain:"この記述が誤りです。正しくは、同一直線上で同じ向きの二力の合力は、二力の大きさの和になる。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_mechanics_1_3", subject:"mechanics", theme:1, q:"力の基礎について、正しいものはどれか。", choices:["一点に働く二力の合力は、常に二力の大きさの単純な和になる。","剛体に働く力は、作用線から離れたどの位置に移しても作用が変わらない。","力の単位はN・mで、力のモーメントの単位はNである。","同一直線上で反対向きの二力の合力は、大きさの差で求められる。","力の三要素は、質量、体積、密度である。"], answer:3, explain:"この記述が正しい内容です。同一直線上で反対向きの二力の合力は、大きさの差で求められる。<br><br>ほかの選択肢の確認：<br>・剛体に働く力は、作用線上で作用点を移しても外部に対する作用は変わらない。<br>・力の単位Nと、力のモーメントの単位N・mは区別する。<br>・力の三要素は、大きさ、方向、作用点である。<br>・一点に働く二力の合力は、平行四辺形の対角線で表せる。"},

{license:"crane_mobile", id:"mobile_mechanics_3_1", subject:"mechanics", theme:3, q:"質量・比重・体積について、正しいものはどれか。", choices:["質量は、密度と体積の積で求める。","質量mの物体に働く重力の大きさは、mをgで割った値である。","比重の単位は、必ずkgである。","均質な材料では、体積が2倍になれば質量は半分になる。","水の密度を1t/m³とすると、比重7.8の鋼の密度は0.78t/m³である。"], answer:0, explain:"この記述が正しい内容です。質量は、密度と体積の積で求める。<br><br>ほかの選択肢の確認：<br>・比重は基準物質の密度に対する比なので、単位を持たない。<br>・質量mの物体に働く重力の大きさは、重力加速度をgとしてmgである。<br>・均質な材料では、体積が2倍になれば質量も2倍になる。<br>・水の密度を1t/m³とすると、比重7.8の鋼の密度は7.8t/m³である。"},
{license:"crane_mobile", id:"mobile_mechanics_3_2", subject:"mechanics", theme:3, q:"質量・比重・体積について、誤っているものはどれか。", choices:["質量mの物体に働く重力の大きさは、重力加速度をgとしてmgである。","円柱の体積は、底面積に高さを掛けて求める。","直方体の体積は、縦、横、高さを掛けて求める。","比重の単位は、必ずkgである。","水の密度を1t/m³とすると、比重7.8の鋼の密度は7.8t/m³である。"], answer:3, explain:"この記述が誤りです。正しくは、比重は基準物質の密度に対する比なので、単位を持たない。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_mechanics_3_3", subject:"mechanics", theme:3, q:"質量・比重・体積について、正しいものはどれか。", choices:["均質な材料では、体積が2倍になれば質量は半分になる。","比重の単位は、必ずkgである。","水の密度を1t/m³とすると、比重7.8の鋼の密度は7.8t/m³である。","直方体の体積は、縦、横、高さを足して求める。","円柱の体積は、底面の円周に高さを掛けて求める。"], answer:2, explain:"この記述が正しい内容です。水の密度を1t/m³とすると、比重7.8の鋼の密度は7.8t/m³である。<br><br>ほかの選択肢の確認：<br>・円柱の体積は、底面積に高さを掛けて求める。<br>・比重は基準物質の密度に対する比なので、単位を持たない。<br>・均質な材料では、体積が2倍になれば質量も2倍になる。<br>・直方体の体積は、縦、横、高さを掛けて求める。"},

{license:"crane_mobile", id:"mobile_mechanics_4_1", subject:"mechanics", theme:4, q:"重心と安定について、正しいものはどれか。", choices:["物体の重心からの鉛直線が支持面の外へ出るほど安定する。","複数の物体の合成重心は、それぞれの質量を無視して位置だけで決まる。","同じ重心高さなら、支持面が狭い方が一般に安定する。","均質で左右対称な物体の重心は、その対称面上にある。","同じ支持面なら、重心が高い方が一般に転倒に対して安定する。"], answer:3, explain:"この記述が正しい内容です。均質で左右対称な物体の重心は、その対称面上にある。<br><br>ほかの選択肢の確認：<br>・複数の物体の合成重心は、それぞれの質量と位置から求められる。<br>・物体の重心からの鉛直線が支持面の外へ出ると、転倒しやすくなる。<br>・同じ重心高さなら、支持面が広い方が一般に安定する。<br>・同じ支持面なら、重心が低い方が一般に転倒に対して安定する。"},

{license:"crane_mobile", id:"mobile_mechanics_4_3", subject:"mechanics", theme:4, q:"重心と安定について、正しいものはどれか。", choices:["同じ支持面なら、重心が低い方が一般に転倒に対して安定する。","荷を安定してつるには、フックを荷の重心からできるだけ横にずらす。","均質で左右対称な物体の重心は、必ず物体の最下点にある。","複数の物体の合成重心は、それぞれの質量を無視して位置だけで決まる。","同じ重心高さなら、支持面が狭い方が一般に安定する。"], answer:0, explain:"この記述が正しい内容です。同じ支持面なら、重心が低い方が一般に転倒に対して安定する。<br><br>ほかの選択肢の確認：<br>・荷を安定してつるには、フックを荷の重心の真上に合わせる。<br>・同じ重心高さなら、支持面が広い方が一般に安定する。<br>・複数の物体の合成重心は、それぞれの質量と位置から求められる。<br>・均質で左右対称な物体の重心は、その対称面上にある。"},

{license:"crane_mobile", id:"mobile_mechanics_4_8", subject:"mechanics", theme:4, q:"重心と安定について、誤っているものはどれか。", choices:["物体の重心からの鉛直線が支持面の外へ出ると、転倒しやすくなる。","地切り時に荷が傾いても、そのまま高速で巻き上げる。","荷を安定してつるには、フックを荷の重心の真上に合わせる。","同じ支持面なら、重心が低い方が一般に転倒に対して安定する。","均質な円環では、重心が材料の存在しない中心部に位置することがある。"], answer:1, explain:"この記述が誤りです。正しくは、地切り時には、荷の傾きや玉掛けの状態を確認する。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_mechanics_5_1", subject:"mechanics", theme:5, q:"物体の運動について、正しいものはどれか。", choices:["等速円運動では、速さが一定なので加速度はない。","仕事率は、仕事に所要時間を掛けた値である。","急な旋回停止では、荷は慣性の影響を受けず必ず直ちに静止する。","慣性とは、物体が静止又は等速直線運動の状態を保とうとする性質である。","遠心力の大きさは、速さに反比例し、回転半径に比例する。"], answer:3, explain:"この記述が正しい内容です。慣性とは、物体が静止又は等速直線運動の状態を保とうとする性質である。<br><br>ほかの選択肢の確認：<br>・急な旋回停止では、荷が慣性によって振れやすい。<br>・遠心力の大きさは、質量と速さの二乗に比例し、回転半径に反比例する。<br>・仕事率は、単位時間当たりに行う仕事である。<br>・等速円運動でも速度の向きが変わるため、加速度がある。"},

{license:"crane_mobile", id:"mobile_mechanics_6_1", subject:"mechanics", theme:6, q:"摩擦力について、正しいものはどれか。", choices:["一般に、転がり摩擦は滑り摩擦より必ず大きい。","静止摩擦力は、外力がゼロでも常に最大値で働く。","最大静止摩擦力は、静止摩擦係数と垂直抗力の積で求める。","摩擦係数は、材料や表面状態によらず常に1である。","乾燥摩擦の基本モデルでは、接触面積が2倍になると摩擦力は必ず2倍になる。"], answer:2, explain:"この記述が正しい内容です。最大静止摩擦力は、静止摩擦係数と垂直抗力の積で求める。<br><br>ほかの選択肢の確認：<br>・摩擦係数は接触する材料や表面状態などで変わる。<br>・乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。<br>・一般に、転がり摩擦は滑り摩擦より小さい。<br>・静止摩擦力は、滑り出す直前まで外力に応じて変化する。"},
{license:"crane_mobile", id:"mobile_mechanics_6_2", subject:"mechanics", theme:6, q:"摩擦力について、誤っているものはどれか。", choices:["ブレーキの摩擦面に油が付着すると、制動力が低下するおそれがある。","静止摩擦力は、外力がゼロでも常に最大値で働く。","乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。","一般に、転がり摩擦は滑り摩擦より小さい。","滑り摩擦力は、接触面の相対的な滑りを妨げる向きに働く。"], answer:1, explain:"この記述が誤りです。正しくは、静止摩擦力は、滑り出す直前まで外力に応じて変化する。<br>ほかの4つの記述は正しい内容です。"},

{license:"crane_mobile", id:"mobile_mechanics_6_4", subject:"mechanics", theme:6, q:"摩擦力について、誤っているものはどれか。", choices:["乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。","滑り摩擦力は、常に接触面の滑りを加速する向きに働く。","一般に、動摩擦力は最大静止摩擦力より小さい。","摩擦係数は接触する材料や表面状態などで変わる。","ブレーキの摩擦面に油が付着すると、制動力が低下するおそれがある。"], answer:1, explain:"この記述が誤りです。正しくは、滑り摩擦力は、接触面の相対的な滑りを妨げる向きに働く。<br>ほかの4つの記述は正しい内容です。"},

{license:"crane_mobile", id:"mobile_mechanics_6_7", subject:"mechanics", theme:6, q:"摩擦力について、正しいものはどれか。", choices:["乾燥摩擦の基本モデルでは、接触面積が2倍になると摩擦力は必ず2倍になる。","一般に、転がり摩擦は滑り摩擦より小さい。","ブレーキの摩擦面には、制動力を高めるため常に油を多量に塗る。","滑り摩擦力は、常に接触面の滑りを加速する向きに働く。","最大静止摩擦力は、静止摩擦係数を垂直抗力で割って求める。"], answer:1, explain:"この記述が正しい内容です。一般に、転がり摩擦は滑り摩擦より小さい。<br><br>ほかの選択肢の確認：<br>・ブレーキの摩擦面に油が付着すると、制動力が低下するおそれがある。<br>・最大静止摩擦力は、静止摩擦係数と垂直抗力の積で求める。<br>・乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。<br>・滑り摩擦力は、接触面の相対的な滑りを妨げる向きに働く。"},
{license:"crane_mobile", id:"mobile_mechanics_6_8", subject:"mechanics", theme:6, q:"摩擦力について、誤っているものはどれか。", choices:["ブレーキの摩擦面には、制動力を高めるため常に油を多量に塗る。","滑り摩擦力は、接触面の相対的な滑りを妨げる向きに働く。","最大静止摩擦力は、静止摩擦係数と垂直抗力の積で求める。","乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。","摩擦係数は接触する材料や表面状態などで変わる。"], answer:0, explain:"この記述が誤りです。正しくは、ブレーキの摩擦面に油が付着すると、制動力が低下するおそれがある。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_mechanics_7_1", subject:"mechanics", theme:7, q:"荷重の種類について、正しいものはどれか。", choices:["静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。","衝撃荷重は、ゆっくり一定に加え続ける荷重だけをいう。","繰返し荷重は、材料の疲労に関係しない。","分布荷重は、一点だけに作用する荷重である。","急な巻上げや停止でも、ロープに作用する力は静止時と必ず同じである。"], answer:0, explain:"この記述が正しい内容です。静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。<br><br>ほかの選択肢の確認：<br>・繰返し荷重は、繰り返して作用する荷重で、材料疲労の原因となる。<br>・分布荷重は、ある範囲に分布して作用する荷重である。<br>・急な巻上げや停止では、静かにつっているときより大きな力が生じることがある。<br>・衝撃荷重は、ごく短時間に作用する荷重である。"},
{license:"crane_mobile", id:"mobile_mechanics_7_2", subject:"mechanics", theme:7, q:"荷重の種類について、誤っているものはどれか。", choices:["動荷重は、必ず大きさも方向も永久に一定の荷重である。","交番荷重は、引張りと圧縮など、向きが交互に変わる荷重である。","静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。","衝撃荷重は、ごく短時間に作用する荷重である。","分布荷重は、ある範囲に分布して作用する荷重である。"], answer:0, explain:"この記述が誤りです。正しくは、動荷重は、時間とともに大きさや方向が変化する荷重である。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_mechanics_7_3", subject:"mechanics", theme:7, q:"荷重の種類について、正しいものはどれか。", choices:["分布荷重は、一点だけに作用する荷重である。","交番荷重は、一度だけ作用して終わる荷重である。","繰返し荷重は、材料の疲労に関係しない。","衝撃荷重は、ごく短時間に作用する荷重である。","集中荷重は、全体に均一に広がって作用する荷重である。"], answer:3, explain:"この記述が正しい内容です。衝撃荷重は、ごく短時間に作用する荷重である。<br><br>ほかの選択肢の確認：<br>・交番荷重は、引張りと圧縮など、向きが交互に変わる荷重である。<br>・分布荷重は、ある範囲に分布して作用する荷重である。<br>・繰返し荷重は、繰り返して作用する荷重で、材料疲労の原因となる。<br>・集中荷重は、狭い範囲に集中して作用する荷重である。"},
{license:"crane_mobile", id:"mobile_mechanics_7_4", subject:"mechanics", theme:7, q:"荷重の種類について、誤っているものはどれか。", choices:["衝撃荷重は、ごく短時間に作用する荷重である。","繰返し荷重は、材料の疲労に関係しない。","分布荷重は、ある範囲に分布して作用する荷重である。","静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。","動荷重は、時間とともに大きさや方向が変化する荷重である。"], answer:1, explain:"この記述が誤りです。正しくは、繰返し荷重は、繰り返して作用する荷重で、材料疲労の原因となる。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_mechanics_7_5", subject:"mechanics", theme:7, q:"荷重の種類について、正しいものはどれか。", choices:["急な巻上げや停止でも、ロープに作用する力は静止時と必ず同じである。","静荷重は、短時間に急激な衝撃を与える荷重だけをいう。","交番荷重は、引張りと圧縮など、向きが交互に変わる荷重である。","集中荷重は、全体に均一に広がって作用する荷重である。","繰返し荷重は、材料の疲労に関係しない。"], answer:2, explain:"この記述が正しい内容です。交番荷重は、引張りと圧縮など、向きが交互に変わる荷重である。<br><br>ほかの選択肢の確認：<br>・静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。<br>・急な巻上げや停止では、静かにつっているときより大きな力が生じることがある。<br>・繰返し荷重は、繰り返して作用する荷重で、材料疲労の原因となる。<br>・集中荷重は、狭い範囲に集中して作用する荷重である。"},

{license:"cargo_handling", id:"cargo_crane_1_1", subject:"crane", theme:1, q:"揚貨装置の種類と構造について、正しいものはどれか。", choices:["デリック型式は、走行レールと横行トロリだけで構成される。","揚貨装置は、船舶の荷の積卸しのため船舶に設けられた荷役設備である。","走行式橋形クレーン型式では、ガーダ先端にデリックブームを取り付けた構造が基本である。","走行式橋形クレーン型式は、必ず岸壁のレール上だけを走行する。","ジブクレーン型式の巻上げ動力は、必ず人力だけである。"], answer:1, explain:"この記述が正しい内容です。揚貨装置は、船舶の荷の積卸しのため船舶に設けられた荷役設備である。<br><br>ほかの選択肢の確認：<br>・走行式橋形クレーン型式では、船外への荷役に張出しガーダを用いる構造のものがある。<br>・ジブクレーン型式には、油圧モータ又は電動機を動力に用いるものがある。<br>・走行式橋形クレーン型式は、上甲板口の両側のレールに沿って移動できる。<br>・デリック型式は、デリックポスト、ブーム、ウインチを主体に構成される。"},
{license:"cargo_handling", id:"cargo_crane_1_2", subject:"crane", theme:1, q:"揚貨装置の種類と構造について、誤っているものはどれか。", choices:["デリックブームの起伏とは、ブームの仰角を変える動きである。","走行式橋形クレーン型式では、船外への荷役に張出しガーダを用いる構造のものがある。","揚貨装置は、船舶の荷の積卸しのため船舶に設けられた荷役設備である。","デリック型式は、走行レールと横行トロリだけで構成される。","走行式橋形クレーン型式は、上甲板口の両側のレールに沿って移動できる。"], answer:3, explain:"この記述が誤りです。正しくは、デリック型式は、デリックポスト、ブーム、ウインチを主体に構成される。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_1_3", subject:"crane", theme:1, q:"揚貨装置の種類と構造について、正しいものはどれか。", choices:["デリック型式は、走行レールと横行トロリだけで構成される。","走行式橋形クレーン型式では、ガーダ先端にデリックブームを取り付けた構造が基本である。","ジブクレーン型式には、油圧モータ又は電動機を動力に用いるものがある。","船上の揚貨装置は、船体が動揺しても荷の動きに影響を受けない。","デリックブームの起伏とは、船舶全体を前後に移動させる動きである。"], answer:2, explain:"この記述が正しい内容です。ジブクレーン型式には、油圧モータ又は電動機を動力に用いるものがある。<br><br>ほかの選択肢の確認：<br>・船上の揚貨装置では、船体の傾きや動揺が作業に影響する。<br>・走行式橋形クレーン型式では、船外への荷役に張出しガーダを用いる構造のものがある。<br>・デリックブームの起伏とは、ブームの仰角を変える動きである。<br>・デリック型式は、デリックポスト、ブーム、ウインチを主体に構成される。"},
{license:"cargo_handling", id:"cargo_crane_1_4", subject:"crane", theme:1, q:"揚貨装置の種類と構造について、誤っているものはどれか。", choices:["走行式橋形クレーン型式は、必ず岸壁のレール上だけを走行する。","走行式橋形クレーン型式では、船外への荷役に張出しガーダを用いる構造のものがある。","ジブクレーン型式には、油圧モータ又は電動機を動力に用いるものがある。","デリックブームの起伏とは、ブームの仰角を変える動きである。","船上の揚貨装置では、船体の傾きや動揺が作業に影響する。"], answer:0, explain:"この記述が誤りです。正しくは、走行式橋形クレーン型式は、上甲板口の両側のレールに沿って移動できる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_1_5", subject:"crane", theme:1, q:"揚貨装置の種類と構造について、正しいものはどれか。", choices:["デリック型式は、走行レールと横行トロリだけで構成される。","ウインチは、船倉内の空気を換気するためだけの装置である。","船上の揚貨装置は、船体が動揺しても荷の動きに影響を受けない。","走行式橋形クレーン型式では、船外への荷役に張出しガーダを用いる構造のものがある。","ジブクレーン型式の巻上げ動力は、必ず人力だけである。"], answer:3, explain:"この記述が正しい内容です。走行式橋形クレーン型式では、船外への荷役に張出しガーダを用いる構造のものがある。<br><br>ほかの選択肢の確認：<br>・ジブクレーン型式には、油圧モータ又は電動機を動力に用いるものがある。<br>・ウインチは、ドラムにロープを巻き取り、又は繰り出して荷役動作を行わせる。<br>・船上の揚貨装置では、船体の傾きや動揺が作業に影響する。<br>・デリック型式は、デリックポスト、ブーム、ウインチを主体に構成される。"},

{license:"cargo_handling", id:"cargo_crane_1_7", subject:"crane", theme:1, q:"揚貨装置の種類と構造について、正しいものはどれか。", choices:["デリック型式は、走行レールと横行トロリだけで構成される。","船上の揚貨装置は、船体が動揺しても荷の動きに影響を受けない。","走行式橋形クレーン型式は、必ず岸壁のレール上だけを走行する。","ウインチは、ドラムにロープを巻き取り、又は繰り出して荷役動作を行わせる。","デリックブームの起伏とは、船舶全体を前後に移動させる動きである。"], answer:3, explain:"この記述が正しい内容です。ウインチは、ドラムにロープを巻き取り、又は繰り出して荷役動作を行わせる。<br><br>ほかの選択肢の確認：<br>・デリック型式は、デリックポスト、ブーム、ウインチを主体に構成される。<br>・走行式橋形クレーン型式は、上甲板口の両側のレールに沿って移動できる。<br>・デリックブームの起伏とは、ブームの仰角を変える動きである。<br>・船上の揚貨装置では、船体の傾きや動揺が作業に影響する。"},
{license:"cargo_handling", id:"cargo_crane_1_8", subject:"crane", theme:1, q:"揚貨装置の種類と構造について、誤っているものはどれか。", choices:["走行式橋形クレーン型式では、船外への荷役に張出しガーダを用いる構造のものがある。","船上の揚貨装置は、船体が動揺しても荷の動きに影響を受けない。","デリックブームの起伏とは、ブームの仰角を変える動きである。","ウインチは、ドラムにロープを巻き取り、又は繰り出して荷役動作を行わせる。","揚貨装置は、船舶の荷の積卸しのため船舶に設けられた荷役設備である。"], answer:1, explain:"この記述が誤りです。正しくは、船上の揚貨装置では、船体の傾きや動揺が作業に影響する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_2_1", subject:"crane", theme:2, q:"デリックの索具とけんか巻きについて、正しいものはどれか。", choices:["けんか巻き方式のカーゴランナーは、船舶を岸壁に係留する索だけをいう。","カーゴワイヤロープは、荷のつり上げ・つり下ろしに用いる。","プリベンターガイは、荷の巻上げのたびに巻き取るカーゴ用の動索である。","センターガイは、2本のブームを交互に旋回させるための動索である。","けんか巻き方式では、ガイテークルを毎回高速で動かし、ブームを連続旋回させる。"], answer:1, explain:"この記述が正しい内容です。カーゴワイヤロープは、荷のつり上げ・つり下ろしに用いる。<br><br>ほかの選択肢の確認：<br>・けんか巻き方式では、ガイテークルはブームを所定の位置に固定するために用いられる。<br>・プリベンターガイは、ブーム先端を所定の位置に固定する静索である。<br>・けんか巻き方式のカーゴワイヤロープは、カーゴランナーとも呼ばれる。<br>・センターガイは、2本のブームの先端をつなぎ、両者が広がるのを抑える。"},
{license:"cargo_handling", id:"cargo_crane_2_2", subject:"crane", theme:2, q:"デリックの索具とけんか巻きについて、誤っているものはどれか。", choices:["カーゴワイヤロープは、荷のつり上げ・つり下ろしに用いる。","カーゴフォールは、ウインチの潤滑油だけを指す名称である。","ガイテークルは、組合せ滑車とロープからなる装置である。","センターガイは、2本のブームの先端をつなぎ、両者が広がるのを抑える。","トッピングリフトワイヤロープは、ブームを起伏させたり、仰角を保持したりする。"], answer:1, explain:"この記述が誤りです。正しくは、カーゴワイヤロープは、カーゴフォールとも呼ばれる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_2_3", subject:"crane", theme:2, q:"デリックの索具とけんか巻きについて、正しいものはどれか。", choices:["プリベンターガイは、荷の巻上げのたびに巻き取るカーゴ用の動索である。","けんか巻き方式のカーゴワイヤロープは、カーゴランナーとも呼ばれる。","トッピングリフトワイヤロープは、ドラム缶に直接フックをかける専用スリングである。","カーゴフォールは、ウインチの潤滑油だけを指す名称である。","カーゴワイヤロープは、ブームを固定するだけで荷のつり上げには用いない。"], answer:1, explain:"この記述が正しい内容です。けんか巻き方式のカーゴワイヤロープは、カーゴランナーとも呼ばれる。<br><br>ほかの選択肢の確認：<br>・プリベンターガイは、ブーム先端を所定の位置に固定する静索である。<br>・カーゴワイヤロープは、荷のつり上げ・つり下ろしに用いる。<br>・カーゴワイヤロープは、カーゴフォールとも呼ばれる。<br>・トッピングリフトワイヤロープは、ブームを起伏させたり、仰角を保持したりする。"},
{license:"cargo_handling", id:"cargo_crane_2_4", subject:"crane", theme:2, q:"デリックの索具とけんか巻きについて、誤っているものはどれか。", choices:["トッピングリフトワイヤロープは、ブームを起伏させたり、仰角を保持したりする。","けんか巻き方式では、ガイテークルはブームを所定の位置に固定するために用いられる。","プリベンターガイは、ブーム先端を所定の位置に固定する静索である。","ガイテークルは、組合せ滑車とロープからなる装置である。","センターガイは、2本のブームを交互に旋回させるための動索である。"], answer:4, explain:"この記述が誤りです。正しくは、センターガイは、2本のブームの先端をつなぎ、両者が広がるのを抑える。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_2_5", subject:"crane", theme:2, q:"デリックの索具とけんか巻きについて、正しいものはどれか。", choices:["センターガイは、2本のブームを交互に旋回させるための動索である。","プリベンターガイは、ブーム先端を所定の位置に固定する静索である。","けんか巻き方式のカーゴランナーは、船舶を岸壁に係留する索だけをいう。","けんか巻き方式では、ガイテークルを毎回高速で動かし、ブームを連続旋回させる。","ガイテークルは、歯車と電動機だけからなる発電装置である。"], answer:1, explain:"この記述が正しい内容です。プリベンターガイは、ブーム先端を所定の位置に固定する静索である。<br><br>ほかの選択肢の確認：<br>・センターガイは、2本のブームの先端をつなぎ、両者が広がるのを抑える。<br>・けんか巻き方式のカーゴワイヤロープは、カーゴランナーとも呼ばれる。<br>・けんか巻き方式では、ガイテークルはブームを所定の位置に固定するために用いられる。<br>・ガイテークルは、組合せ滑車とロープからなる装置である。"},

{license:"cargo_handling", id:"cargo_crane_2_7", subject:"crane", theme:2, q:"デリックの索具とけんか巻きについて、正しいものはどれか。", choices:["プリベンターガイは、荷の巻上げのたびに巻き取るカーゴ用の動索である。","ガイテークルは、歯車と電動機だけからなる発電装置である。","カーゴワイヤロープは、ブームを固定するだけで荷のつり上げには用いない。","カーゴフォールは、ウインチの潤滑油だけを指す名称である。","けんか巻き方式では、ガイテークルはブームを所定の位置に固定するために用いられる。"], answer:4, explain:"この記述が正しい内容です。けんか巻き方式では、ガイテークルはブームを所定の位置に固定するために用いられる。<br><br>ほかの選択肢の確認：<br>・プリベンターガイは、ブーム先端を所定の位置に固定する静索である。<br>・カーゴワイヤロープは、カーゴフォールとも呼ばれる。<br>・ガイテークルは、組合せ滑車とロープからなる装置である。<br>・カーゴワイヤロープは、荷のつり上げ・つり下ろしに用いる。"},
{license:"cargo_handling", id:"cargo_crane_2_8", subject:"crane", theme:2, q:"デリックの索具とけんか巻きについて、誤っているものはどれか。", choices:["センターガイは、2本のブームの先端をつなぎ、両者が広がるのを抑える。","トッピングリフトワイヤロープは、ドラム缶に直接フックをかける専用スリングである。","けんか巻き方式のカーゴワイヤロープは、カーゴランナーとも呼ばれる。","カーゴワイヤロープは、カーゴフォールとも呼ばれる。","カーゴワイヤロープは、荷のつり上げ・つり下ろしに用いる。"], answer:1, explain:"この記述が誤りです。正しくは、トッピングリフトワイヤロープは、ブームを起伏させたり、仰角を保持したりする。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_3_1", subject:"crane", theme:3, q:"ワイヤロープの構造と取扱いについて、正しいものはどれか。", choices:["SよりとZよりは、ワイヤロープの材質の強度等級だけを表す。","ラングよりは、ロープのより方向とストランドのより方向が反対である。","IWRCは、麻などの繊維だけで作った心を示す。","ストランドは、複数の素線などをより合わせたワイヤロープの構成要素である。","ロープの点検では、表面の色だけで使用できるか判定する。"], answer:3, explain:"この記述が正しい内容です。ストランドは、複数の素線などをより合わせたワイヤロープの構成要素である。<br><br>ほかの選択肢の確認：<br>・ラングよりは、ロープのより方向とストランドのより方向が同じである。<br>・ワイヤロープのより方向には、SよりとZよりがある。<br>・IWRCは、独立したワイヤロープを心に用いる構成を示す。<br>・ロープの点検では、素線切断、摩耗、腐食、形くずれ、端末の状態などを調べる。"},
{license:"cargo_handling", id:"cargo_crane_3_2", subject:"crane", theme:3, q:"ワイヤロープの構造と取扱いについて、誤っているものはどれか。", choices:["普通よりは、ロープのより方向とストランドのより方向が同じである。","ワイヤロープのキンクは、ロープに生じた局部的なねじれの変形である。","ラングよりは、ロープのより方向とストランドのより方向が同じである。","ワイヤロープのより方向には、SよりとZよりがある。","ワイヤロープの直径は、向かい合うストランドの山を挟んで測る。"], answer:0, explain:"この記述が誤りです。正しくは、普通よりは、ロープのより方向とストランドのより方向が反対である。<br>ほかの4つの記述は正しい内容です。"},

{license:"cargo_handling", id:"cargo_crane_4_1", subject:"crane", theme:4, q:"荷役用スリングの選定について、正しいものはどれか。", choices:["ウェブスリングは、袋物の荷役に用いられる。","ボックススリングは、長尺の鋼管だけを直接締め付ける専用具である。","スリングを掛ける位置は、荷の重心を無視して最も近い場所だけで決める。","荷役用スリングは、外観が似ていれば荷の質量や形状によらず交換できる。","ドラムスリングは、巻上げドラムの回転速度を測る計器である。"], answer:0, explain:"この記述が正しい内容です。ウェブスリングは、袋物の荷役に用いられる。<br><br>ほかの選択肢の確認：<br>・荷役用スリングは、荷の形状、質量、性質に合ったものを選ぶ。<br>・ドラムスリングは、ドラム缶などの荷役に用いる。<br>・ボックススリングは、ばら荷を箱状の容器に収めて扱う用途に用いられる。<br>・荷の重心を考えて掛け位置を決め、地切り時に傾きや滑りを確認する。"},
{license:"cargo_handling", id:"cargo_crane_4_2", subject:"crane", theme:4, q:"荷役用スリングの選定について、誤っているものはどれか。", choices:["ドラムスリングは、ドラム缶などの荷役に用いる。","ウェブスリングは、袋物の荷役に用いられる。","スリングにねじれや局部的な折れを残さず、荷重を適切に受けるように掛ける。","ボックススリングは、長尺の鋼管だけを直接締め付ける専用具である。","鋭い角に繊維製スリングが接する場合は、適切な角当て等で保護する。"], answer:3, explain:"この記述が誤りです。正しくは、ボックススリングは、ばら荷を箱状の容器に収めて扱う用途に用いられる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_4_3", subject:"crane", theme:4, q:"荷役用スリングの選定について、正しいものはどれか。", choices:["繊維製スリングは、鋭い角に直接強く押し付けるほど損傷しにくい。","ドラムスリングは、ドラム缶などの荷役に用いる。","ボックススリングは、長尺の鋼管だけを直接締め付ける専用具である。","スリングを掛ける位置は、荷の重心を無視して最も近い場所だけで決める。","荷役用スリングは、外観が似ていれば荷の質量や形状によらず交換できる。"], answer:1, explain:"この記述が正しい内容です。ドラムスリングは、ドラム缶などの荷役に用いる。<br><br>ほかの選択肢の確認：<br>・ボックススリングは、ばら荷を箱状の容器に収めて扱う用途に用いられる。<br>・荷の重心を考えて掛け位置を決め、地切り時に傾きや滑りを確認する。<br>・鋭い角に繊維製スリングが接する場合は、適切な角当て等で保護する。<br>・荷役用スリングは、荷の形状、質量、性質に合ったものを選ぶ。"},
{license:"cargo_handling", id:"cargo_crane_4_4", subject:"crane", theme:4, q:"荷役用スリングの選定について、誤っているものはどれか。", choices:["スリングにねじれや局部的な折れを残さず、荷重を適切に受けるように掛ける。","ボックススリングは、ばら荷を箱状の容器に収めて扱う用途に用いられる。","つり角度が大きくなると、同じ荷をつっても各脚の張力が大きくなる。","ウェブスリングは、袋物の荷役に用いられる。","荷役用スリングは、外観が似ていれば荷の質量や形状によらず交換できる。"], answer:4, explain:"この記述が誤りです。正しくは、荷役用スリングは、荷の形状、質量、性質に合ったものを選ぶ。<br>ほかの4つの記述は正しい内容です。"},

{license:"cargo_handling", id:"cargo_crane_4_8", subject:"crane", theme:4, q:"荷役用スリングの選定について、誤っているものはどれか。", choices:["鋭い角に繊維製スリングが接する場合は、適切な角当て等で保護する。","スリングを掛ける位置は、荷の重心を無視して最も近い場所だけで決める。","スリングにねじれや局部的な折れを残さず、荷重を適切に受けるように掛ける。","荷役用スリングは、荷の形状、質量、性質に合ったものを選ぶ。","つり角度が大きくなると、同じ荷をつっても各脚の張力が大きくなる。"], answer:1, explain:"この記述が誤りです。正しくは、荷の重心を考えて掛け位置を決め、地切り時に傾きや滑りを確認する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_5_1", subject:"crane", theme:5, q:"つり具とカーゴフックについて、正しいものはどれか。", choices:["コンテナ用スプレッダは、コンテナの薄い側板を磁力だけで吸着するものに限られる。","グリッパーは、貨物と接触せず、風圧だけで浮かせるつり具である。","カーゴフックでは、大荷重用は片フックに限られ、両フックは小荷重にしか使わない。","リフティングマグネットは、鉄などの磁性体を吸着して扱うつり具である。","グリッパーは、つかむ部分の形状に関係なく、どの貨物にも同じものを使う。"], answer:3, explain:"この記述が正しい内容です。リフティングマグネットは、鉄などの磁性体を吸着して扱うつり具である。<br><br>ほかの選択肢の確認：<br>・カーゴフックには片フックと両フックがあり、両フックは大荷重用にも使われる。<br>・グリッパーは、貨物を直接つかんでつり上げるためのつり具である。<br>・コンテナ用スプレッダは、コンテナのすみ金具に適合する構造を持つ。<br>・グリッパーは、木材、箱、ベール梱包などの荷姿に合うものを選ぶ。"},
{license:"cargo_handling", id:"cargo_crane_5_2", subject:"crane", theme:5, q:"つり具とカーゴフックについて、誤っているものはどれか。", choices:["コンテナ用スプレッダは、コンテナのすみ金具に適合する構造を持つ。","グリッパーは、木材、箱、ベール梱包などの荷姿に合うものを選ぶ。","グラブバケットの作動方式には、単索式、複索式、電動油圧式などがある。","グラブバケットは、長尺物を水平につるための横長のつりビームだけをいう。","カーゴフックには片フックと両フックがあり、両フックは大荷重用にも使われる。"], answer:3, explain:"この記述が誤りです。正しくは、グラブバケットは、石炭や鉱石などのばら貨物の荷役に用いられる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_5_3", subject:"crane", theme:5, q:"つり具とカーゴフックについて、正しいものはどれか。", choices:["カーゴフックでは、大荷重用は片フックに限られ、両フックは小荷重にしか使わない。","グラブバケットの作動方式には、単索式、複索式、電動油圧式などがある。","グリッパーは、つかむ部分の形状に関係なく、どの貨物にも同じものを使う。","グラブバケットは、長尺物を水平につるための横長のつりビームだけをいう。","リフティングマグネットは、金・銀・銅・アルミニウムを含むすべての金属を同様に吸着する。"], answer:1, explain:"この記述が正しい内容です。グラブバケットの作動方式には、単索式、複索式、電動油圧式などがある。<br><br>ほかの選択肢の確認：<br>・リフティングマグネットは、鉄などの磁性体を吸着して扱うつり具である。<br>・グリッパーは、木材、箱、ベール梱包などの荷姿に合うものを選ぶ。<br>・グラブバケットは、石炭や鉱石などのばら貨物の荷役に用いられる。<br>・カーゴフックには片フックと両フックがあり、両フックは大荷重用にも使われる。"},

{license:"cargo_handling", id:"cargo_crane_5_8", subject:"crane", theme:5, q:"つり具とカーゴフックについて、誤っているものはどれか。", choices:["リフティングマグネットは、鉄などの磁性体を吸着して扱うつり具である。","グラブバケットの作動方式には、単索式、複索式、電動油圧式などがある。","グリッパーは、木材、箱、ベール梱包などの荷姿に合うものを選ぶ。","スプレッダには、長尺貨物を安定してつるための補助つり具として用いるものがある。","カーゴフックでは、大荷重用は片フックに限られ、両フックは小荷重にしか使わない。"], answer:4, explain:"この記述が誤りです。正しくは、カーゴフックには片フックと両フックがあり、両フックは大荷重用にも使われる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_6_1", subject:"crane", theme:6, q:"揚貨装具と繊維ロープについて、正しいものはどれか。", choices:["D字形のシャックルは、必ずスイベルと呼ばれる。","合成繊維ロープは、一般に金属製ロープより重く、衝撃を全く吸収しない。","シーブは、ロープを切断するための刃を持つ部品である。","リングプレートは、ロープの方向が変化する箇所では使用目的に合わない。","シャックルは、ロープ、チェーン、フックなどの接続に用いる。"], answer:4, explain:"この記述が正しい内容です。シャックルは、ロープ、チェーン、フックなどの接続に用いる。<br><br>ほかの選択肢の確認：<br>・合成繊維ロープは、一般に軽量で強じんであり、衝撃にも比較的強い。<br>・シーブは、ロープを案内する溝を持つ車輪状の部品である。<br>・リングプレートは、ロープの方向が広範囲に変わる場合などに用いられる。<br>・D字形のシャックルは、ストレートシャックルとも呼ばれる。"},
{license:"cargo_handling", id:"cargo_crane_6_2", subject:"crane", theme:6, q:"揚貨装具と繊維ロープについて、誤っているものはどれか。", choices:["シーブは、ロープを案内する溝を持つ車輪状の部品である。","合成繊維ロープは、一般に軽量で強じんであり、衝撃にも比較的強い。","リングプレートは、アイプレートにリングを付けた構造である。","マニラロープは、天然繊維を用いたロープである。","バウシャックルは、胴部が直線的なD字形のものだけをいう。"], answer:4, explain:"この記述が誤りです。正しくは、バウシャックルは、胴部が丸くふくらんだ形をしている。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_6_3", subject:"crane", theme:6, q:"揚貨装具と繊維ロープについて、正しいものはどれか。", choices:["マニラロープは、鋼線だけをより合わせたロープである。","合成繊維ロープは、一般に金属製ロープより重く、衝撃を全く吸収しない。","D字形のシャックルは、ストレートシャックルとも呼ばれる。","リングプレートは、ロープの方向が変化する箇所では使用目的に合わない。","シャックルは、電動機の回転数を測る計器である。"], answer:2, explain:"この記述が正しい内容です。D字形のシャックルは、ストレートシャックルとも呼ばれる。<br><br>ほかの選択肢の確認：<br>・リングプレートは、ロープの方向が広範囲に変わる場合などに用いられる。<br>・シャックルは、ロープ、チェーン、フックなどの接続に用いる。<br>・マニラロープは、天然繊維を用いたロープである。<br>・合成繊維ロープは、一般に軽量で強じんであり、衝撃にも比較的強い。"},
{license:"cargo_handling", id:"cargo_crane_6_4", subject:"crane", theme:6, q:"揚貨装具と繊維ロープについて、誤っているものはどれか。", choices:["マニラロープは、天然繊維を用いたロープである。","D字形のシャックルは、ストレートシャックルとも呼ばれる。","リングプレートは、ブームを伸縮させる油圧シリンダである。","リングプレートは、ロープの方向が広範囲に変わる場合などに用いられる。","合成繊維ロープは、一般に軽量で強じんであり、衝撃にも比較的強い。"], answer:2, explain:"この記述が誤りです。正しくは、リングプレートは、アイプレートにリングを付けた構造である。<br>ほかの4つの記述は正しい内容です。"},

{license:"cargo_handling", id:"cargo_crane_8_1", subject:"crane", theme:8, q:"作業開始前の確認と運転について、正しいものはどれか。", choices:["合図が見えない場合は、周囲の人の動きを推測して操作を続ける。","荷が地面を離れたら、玉掛けを確認せずに最高速度で巻き上げる。","船舶側の点検・注油の完了を確認し、責任者から取扱要領の指示を受ける。","作業終了時は、荷をつったまま操作場所を離れる。","制御器は、始動時に一気に最高ノッチへ入れるのが原則である。"], answer:2, explain:"この記述が正しい内容です。船舶側の点検・注油の完了を確認し、責任者から取扱要領の指示を受ける。<br><br>ほかの選択肢の確認：<br>・荷の巻上げは、地切りで玉掛けと荷の安定を確認してから続ける。<br>・作業終了時は、つり荷を安全に着地させ、所定の停止・格納措置を行う。<br>・多段の制御器は、所定の順序でノッチを進め、急激な操作を避ける。<br>・合図が不明確な場合は、動作を止めて確認する。"},
{license:"cargo_handling", id:"cargo_crane_8_2", subject:"crane", theme:8, q:"作業開始前の確認と運転について、誤っているものはどれか。", choices:["無負荷で各動作を確認し、異常がないことを確かめてから荷を扱う。","操作レバーの方向は、どの船でも同じと考えて表示を確認しない。","作業終了時は、つり荷を安全に着地させ、所定の停止・格納措置を行う。","荷やロープが障害物に掛かったときは、無理な巻上げを止めて原因を除く。","多段の制御器は、所定の順序でノッチを進め、急激な操作を避ける。"], answer:1, explain:"この記述が誤りです。正しくは、操作レバーの動きと、表示された操作方向を作業前に確認する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_8_3", subject:"crane", theme:8, q:"作業開始前の確認と運転について、正しいものはどれか。", choices:["無負荷で各動作を確認し、異常がないことを確かめてから荷を扱う。","荷が障害物に掛かったときは、ウインチの力で一気に引き抜く。","荷が地面を離れたら、玉掛けを確認せずに最高速度で巻き上げる。","操作レバーの方向は、どの船でも同じと考えて表示を確認しない。","制御器は、始動時に一気に最高ノッチへ入れるのが原則である。"], answer:0, explain:"この記述が正しい内容です。無負荷で各動作を確認し、異常がないことを確かめてから荷を扱う。<br><br>ほかの選択肢の確認：<br>・操作レバーの動きと、表示された操作方向を作業前に確認する。<br>・荷の巻上げは、地切りで玉掛けと荷の安定を確認してから続ける。<br>・多段の制御器は、所定の順序でノッチを進め、急激な操作を避ける。<br>・荷やロープが障害物に掛かったときは、無理な巻上げを止めて原因を除く。"},
{license:"cargo_handling", id:"cargo_crane_8_4", subject:"crane", theme:8, q:"作業開始前の確認と運転について、誤っているものはどれか。", choices:["荷やロープが障害物に掛かったときは、無理な巻上げを止めて原因を除く。","制御器は、始動時に一気に最高ノッチへ入れるのが原則である。","操作レバーの動きと、表示された操作方向を作業前に確認する。","合図が不明確な場合は、動作を止めて確認する。","荷の巻上げは、地切りで玉掛けと荷の安定を確認してから続ける。"], answer:1, explain:"この記述が誤りです。正しくは、多段の制御器は、所定の順序でノッチを進め、急激な操作を避ける。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_8_5", subject:"crane", theme:8, q:"作業開始前の確認と運転について、正しいものはどれか。", choices:["操作レバーの方向は、どの船でも同じと考えて表示を確認しない。","以前に別の船で運転した経験があれば、船舶側からの取扱説明は不要である。","作業終了時は、荷をつったまま操作場所を離れる。","荷が障害物に掛かったときは、ウインチの力で一気に引き抜く。","荷の巻上げは、地切りで玉掛けと荷の安定を確認してから続ける。"], answer:4, explain:"この記述が正しい内容です。荷の巻上げは、地切りで玉掛けと荷の安定を確認してから続ける。<br><br>ほかの選択肢の確認：<br>・船舶側の点検・注油の完了を確認し、責任者から取扱要領の指示を受ける。<br>・荷やロープが障害物に掛かったときは、無理な巻上げを止めて原因を除く。<br>・作業終了時は、つり荷を安全に着地させ、所定の停止・格納措置を行う。<br>・操作レバーの動きと、表示された操作方向を作業前に確認する。"},

{license:"cargo_handling", id:"cargo_crane_8_7", subject:"crane", theme:8, q:"作業開始前の確認と運転について、正しいものはどれか。", choices:["制御器は、始動時に一気に最高ノッチへ入れるのが原則である。","以前に別の船で運転した経験があれば、船舶側からの取扱説明は不要である。","合図が見えない場合は、周囲の人の動きを推測して操作を続ける。","荷やロープが障害物に掛かったときは、無理な巻上げを止めて原因を除く。","荷が地面を離れたら、玉掛けを確認せずに最高速度で巻き上げる。"], answer:3, explain:"この記述が正しい内容です。荷やロープが障害物に掛かったときは、無理な巻上げを止めて原因を除く。<br><br>ほかの選択肢の確認：<br>・合図が不明確な場合は、動作を止めて確認する。<br>・船舶側の点検・注油の完了を確認し、責任者から取扱要領の指示を受ける。<br>・荷の巻上げは、地切りで玉掛けと荷の安定を確認してから続ける。<br>・多段の制御器は、所定の順序でノッチを進め、急激な操作を避ける。"},
{license:"cargo_handling", id:"cargo_crane_8_8", subject:"crane", theme:8, q:"作業開始前の確認と運転について、誤っているものはどれか。", choices:["操作レバーの動きと、表示された操作方向を作業前に確認する。","作業終了時は、荷をつったまま操作場所を離れる。","荷の巻上げは、地切りで玉掛けと荷の安定を確認してから続ける。","合図が不明確な場合は、動作を止めて確認する。","船舶側の点検・注油の完了を確認し、責任者から取扱要領の指示を受ける。"], answer:1, explain:"この記述が誤りです。正しくは、作業終了時は、つり荷を安全に着地させ、所定の停止・格納措置を行う。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_9_1", subject:"crane", theme:9, q:"制限荷重と制限角度について、正しいものはどれか。", choices:["つり具が重くなっても、荷自体の重量だけを制限荷重と比べればよい。","制限荷重には、フック、スイベル、スリングなどのつり具の重量を含まない。","ブームの仰角は、ブームと鉛直線とのなす角である。","制限角度が標示されているデリックブームは、その角度未満の仰角で使用する。","制限荷重は、揚貨装置の構造や材料に応じて安全に負荷できる最大の荷重である。"], answer:4, explain:"この記述が正しい内容です。制限荷重は、揚貨装置の構造や材料に応じて安全に負荷できる最大の荷重である。<br><br>ほかの選択肢の確認：<br>・ブームの仰角は、ブームと水平面とのなす角である。<br>・荷自体の重量だけでなく、つり具の重量も加えて制限荷重と比較する。<br>・制限角度が標示されているデリックブームは、その角度以上の仰角で使用する。<br>・制限荷重には、フック、スイベル、スリングなどのつり具の重量を含む。"},
{license:"cargo_handling", id:"cargo_crane_9_2", subject:"crane", theme:9, q:"制限荷重と制限角度について、誤っているものはどれか。", choices:["制限荷重には、フック、スイベル、スリングなどのつり具の重量を含まない。","ブームの仰角は、ブームと水平面とのなす角である。","デリック型式の制限荷重は、ブーム1本だけで荷をつった場合の最大荷重を基本とする。","制限角度が標示されているデリックブームは、その角度以上の仰角で使用する。","けんか巻きの使用荷重は、指定された方式・条件に従って確認する。"], answer:0, explain:"この記述が誤りです。正しくは、制限荷重には、フック、スイベル、スリングなどのつり具の重量を含む。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_9_3", subject:"crane", theme:9, q:"制限荷重と制限角度について、正しいものはどれか。", choices:["ブームの仰角は、ブームと鉛直線とのなす角である。","制限荷重には、フック、スイベル、スリングなどのつり具の重量を含まない。","デリック型式の制限荷重は、ブーム1本だけで荷をつった場合の最大荷重を基本とする。","制限荷重は、運転士の経験年数だけで自由に決められる荷重である。","同じ長さのブームを伏せると、一般に先端の水平張出し距離がゼロになる。"], answer:2, explain:"この記述が正しい内容です。デリック型式の制限荷重は、ブーム1本だけで荷をつった場合の最大荷重を基本とする。<br><br>ほかの選択肢の確認：<br>・制限荷重は、揚貨装置の構造や材料に応じて安全に負荷できる最大の荷重である。<br>・制限荷重には、フック、スイベル、スリングなどのつり具の重量を含む。<br>・同じ長さのブームを伏せると、一般に先端の水平張出し距離が増える。<br>・ブームの仰角は、ブームと水平面とのなす角である。"},

{license:"cargo_handling", id:"cargo_crane_9_5", subject:"crane", theme:9, q:"制限荷重と制限角度について、正しいものはどれか。", choices:["同じ長さのブームを伏せると、一般に先端の水平張出し距離がゼロになる。","制限荷重は、運転士の経験年数だけで自由に決められる荷重である。","制限荷重には、フック、スイベル、スリングなどのつり具の重量を含まない。","ブームの仰角は、ブームと鉛直線とのなす角である。","制限角度が標示されているデリックブームは、その角度以上の仰角で使用する。"], answer:4, explain:"この記述が正しい内容です。制限角度が標示されているデリックブームは、その角度以上の仰角で使用する。<br><br>ほかの選択肢の確認：<br>・同じ長さのブームを伏せると、一般に先端の水平張出し距離が増える。<br>・制限荷重には、フック、スイベル、スリングなどのつり具の重量を含む。<br>・制限荷重は、揚貨装置の構造や材料に応じて安全に負荷できる最大の荷重である。<br>・ブームの仰角は、ブームと水平面とのなす角である。"},
{license:"cargo_handling", id:"cargo_crane_9_6", subject:"crane", theme:9, q:"制限荷重と制限角度について、誤っているものはどれか。", choices:["制限荷重には、フック、スイベル、スリングなどのつり具の重量を含む。","制限荷重は、揚貨装置の構造や材料に応じて安全に負荷できる最大の荷重である。","けんか巻きの使用荷重は、指定された方式・条件に従って確認する。","デリック型式の制限荷重は、ブーム1本だけで荷をつった場合の最大荷重を基本とする。","ブームの仰角は、ブームと鉛直線とのなす角である。"], answer:4, explain:"この記述が誤りです。正しくは、ブームの仰角は、ブームと水平面とのなす角である。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_9_7", subject:"crane", theme:9, q:"制限荷重と制限角度について、正しいものはどれか。", choices:["けんか巻きでは、2本のブームの制限荷重を無条件に足して使用してよい。","同じ長さのブームを伏せると、一般に先端の水平張出し距離が増える。","デリック型式の制限荷重は、常に2本のブームの能力の合計を表す。","ブームの仰角は、ブームと鉛直線とのなす角である。","制限荷重には、フック、スイベル、スリングなどのつり具の重量を含まない。"], answer:1, explain:"この記述が正しい内容です。同じ長さのブームを伏せると、一般に先端の水平張出し距離が増える。<br><br>ほかの選択肢の確認：<br>・けんか巻きの使用荷重は、指定された方式・条件に従って確認する。<br>・ブームの仰角は、ブームと水平面とのなす角である。<br>・デリック型式の制限荷重は、ブーム1本だけで荷をつった場合の最大荷重を基本とする。<br>・制限荷重には、フック、スイベル、スリングなどのつり具の重量を含む。"},
{license:"cargo_handling", id:"cargo_crane_9_8", subject:"crane", theme:9, q:"制限荷重と制限角度について、誤っているものはどれか。", choices:["同じ長さのブームを伏せると、一般に先端の水平張出し距離が増える。","けんか巻きでは、2本のブームの制限荷重を無条件に足して使用してよい。","制限角度が標示されているデリックブームは、その角度以上の仰角で使用する。","荷自体の重量だけでなく、つり具の重量も加えて制限荷重と比較する。","デリック型式の制限荷重は、ブーム1本だけで荷をつった場合の最大荷重を基本とする。"], answer:1, explain:"この記述が誤りです。正しくは、けんか巻きの使用荷重は、指定された方式・条件に従って確認する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_10_1", subject:"crane", theme:10, q:"グースネックと支持部について、正しいものはどれか。", choices:["グリースニップルは、ロープを切断するための刃物である。","グースネックは、カーゴワイヤロープの案内に全く関係しない。","ブロックブラケットは、燃料噴射量を調整する装置である。","グースネックは、デリックブームの起伏と旋回を円滑にする支持機構である。","グースネックは、カーゴフックの先端にだけ設けられる。"], answer:3, explain:"この記述が正しい内容です。グースネックは、デリックブームの起伏と旋回を円滑にする支持機構である。<br><br>ほかの選択肢の確認：<br>・グースネックの機構は、カーゴワイヤロープ等をウインチへ案内する役割も持つ。<br>・グースネックは、ブームの基部付近に設けられる。<br>・グリースニップルは、所定の摺動部へ給油するために用いる。<br>・ブロックブラケットは、カーゴワイヤロープ用などの滑車を取り付ける受けとなる。"},
{license:"cargo_handling", id:"cargo_crane_10_2", subject:"crane", theme:10, q:"グースネックと支持部について、誤っているものはどれか。", choices:["グースネックは、デリックブームの起伏と旋回を円滑にする支持機構である。","グースネックブラケットは、グースネックをデリックポストに固定する構造体である。","グースネックは、カーゴフックの先端にだけ設けられる。","ブロックブラケットは、カーゴワイヤロープ用などの滑車を取り付ける受けとなる。","グリースニップルは、所定の摺動部へ給油するために用いる。"], answer:2, explain:"この記述が誤りです。正しくは、グースネックは、ブームの基部付近に設けられる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_10_3", subject:"crane", theme:10, q:"グースネックと支持部について、正しいものはどれか。", choices:["支持部は動く部分がないため、摩耗や給油状態の確認は不要である。","グリースニップルは、ロープを切断するための刃物である。","グースネックは、カーゴフックの先端にだけ設けられる。","グースネックブラケットは、グースネックをデリックポストに固定する構造体である。","グースネックは、デリックブームを伸縮させる油圧装置である。"], answer:3, explain:"この記述が正しい内容です。グースネックブラケットは、グースネックをデリックポストに固定する構造体である。<br><br>ほかの選択肢の確認：<br>・グースネックは、デリックブームの起伏と旋回を円滑にする支持機構である。<br>・グリースニップルは、所定の摺動部へ給油するために用いる。<br>・支持部の摩耗・損傷や給油状態は、ブームの円滑な動作と安全に関係する。<br>・グースネックは、ブームの基部付近に設けられる。"},
{license:"cargo_handling", id:"cargo_crane_10_4", subject:"crane", theme:10, q:"グースネックと支持部について、誤っているものはどれか。", choices:["ピンテルは、作動油の圧力だけを調整する弁である。","グースネックの機構は、カーゴワイヤロープ等をウインチへ案内する役割も持つ。","グリースニップルは、所定の摺動部へ給油するために用いる。","ブロックブラケットは、カーゴワイヤロープ用などの滑車を取り付ける受けとなる。","グースネックブラケットは、グースネックをデリックポストに固定する構造体である。"], answer:0, explain:"この記述が誤りです。正しくは、ピンテルは、デリックブームの基部金具に連結され、立てピンの働きをする。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_10_5", subject:"crane", theme:10, q:"グースネックと支持部について、正しいものはどれか。", choices:["グリースニップルは、ロープを切断するための刃物である。","ブロックブラケットは、カーゴワイヤロープ用などの滑車を取り付ける受けとなる。","グースネックは、カーゴワイヤロープの案内に全く関係しない。","支持部は動く部分がないため、摩耗や給油状態の確認は不要である。","ピンテルは、作動油の圧力だけを調整する弁である。"], answer:1, explain:"この記述が正しい内容です。ブロックブラケットは、カーゴワイヤロープ用などの滑車を取り付ける受けとなる。<br><br>ほかの選択肢の確認：<br>・グリースニップルは、所定の摺動部へ給油するために用いる。<br>・グースネックの機構は、カーゴワイヤロープ等をウインチへ案内する役割も持つ。<br>・ピンテルは、デリックブームの基部金具に連結され、立てピンの働きをする。<br>・支持部の摩耗・損傷や給油状態は、ブームの円滑な動作と安全に関係する。"},
{license:"cargo_handling", id:"cargo_crane_10_6", subject:"crane", theme:10, q:"グースネックと支持部について、誤っているものはどれか。", choices:["グリースニップルは、ロープを切断するための刃物である。","グースネックの機構は、カーゴワイヤロープ等をウインチへ案内する役割も持つ。","支持部の摩耗・損傷や給油状態は、ブームの円滑な動作と安全に関係する。","グースネックは、ブームの基部付近に設けられる。","ブロックブラケットは、カーゴワイヤロープ用などの滑車を取り付ける受けとなる。"], answer:0, explain:"この記述が誤りです。正しくは、グリースニップルは、所定の摺動部へ給油するために用いる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_crane_10_7", subject:"crane", theme:10, q:"グースネックと支持部について、正しいものはどれか。", choices:["ピンテルは、作動油の圧力だけを調整する弁である。","グースネックの機構は、カーゴワイヤロープ等をウインチへ案内する役割も持つ。","支持部は動く部分がないため、摩耗や給油状態の確認は不要である。","グースネックブラケットは、ワイヤロープの心綱の名称である。","グリースニップルは、ロープを切断するための刃物である。"], answer:1, explain:"この記述が正しい内容です。グースネックの機構は、カーゴワイヤロープ等をウインチへ案内する役割も持つ。<br><br>ほかの選択肢の確認：<br>・グリースニップルは、所定の摺動部へ給油するために用いる。<br>・支持部の摩耗・損傷や給油状態は、ブームの円滑な動作と安全に関係する。<br>・ピンテルは、デリックブームの基部金具に連結され、立てピンの働きをする。<br>・グースネックブラケットは、グースネックをデリックポストに固定する構造体である。"},
{license:"cargo_handling", id:"cargo_crane_10_8", subject:"crane", theme:10, q:"グースネックと支持部について、誤っているものはどれか。", choices:["グースネックブラケットは、グースネックをデリックポストに固定する構造体である。","グリースニップルは、所定の摺動部へ給油するために用いる。","グースネックの機構は、カーゴワイヤロープ等をウインチへ案内する役割も持つ。","グースネックは、デリックブームの起伏と旋回を円滑にする支持機構である。","支持部は動く部分がないため、摩耗や給油状態の確認は不要である。"], answer:4, explain:"この記述が誤りです。正しくは、支持部の摩耗・損傷や給油状態は、ブームの円滑な動作と安全に関係する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_1_1", subject:"law", theme:1, q:"運転と玉掛けの資格について、正しいものはどれか。", choices:["制限荷重4tの揚貨装置も、必ず揚貨装置運転士免許がなければ運転できない。","制限荷重5t以上の揚貨装置の運転には、原則として揚貨装置運転士免許が必要である。","揚貨装置運転士免許があれば、岸壁の20tの移動式クレーンも運転できる。","限定なしのクレーン・デリック運転士免許があれば、制限荷重20tの揚貨装置も運転できる。","制限荷重2tの揚貨装置でも、荷が0.5tなら玉掛けの特別教育だけでよい。"], answer:1, explain:"この記述が正しい内容です。制限荷重5t以上の揚貨装置の運転には、原則として揚貨装置運転士免許が必要である。<br><br>ほかの選択肢の確認：<br>・制限荷重1t以上の揚貨装置の玉掛けは、玉掛け技能講習修了等の資格が必要である。<br>・限定なしのクレーン・デリック運転士免許だけでは、制限荷重20tの揚貨装置の運転資格にならない。<br>・揚貨装置の運転の特別教育を受けた者は、その教育によって制限荷重4tの揚貨装置の運転業務に就ける。<br>・揚貨装置運転士免許だけでは、岸壁のつり上げ荷重20tの移動式クレーンの運転資格にならない。"},
{license:"cargo_handling", id:"cargo_law_1_2", subject:"law", theme:1, q:"運転と玉掛けの資格について、誤っているものはどれか。", choices:["制限荷重1t以上の揚貨装置の玉掛けは、玉掛け技能講習修了等の資格が必要である。","玉掛け資格の区分は、実際の荷の重量ではなく揚貨装置の制限荷重によって判断する。","揚貨装置の運転の特別教育を受けた者は、その教育によって制限荷重4tの揚貨装置の運転業務に就ける。","揚貨装置の運転資格を持つことだけで、玉掛け資格も自動的に得られるわけではない。","制限荷重5t未満の揚貨装置は、教育を受けずに運転業務に就いてよい。"], answer:4, explain:"この記述が誤りです。正しくは、制限荷重5t未満の揚貨装置の運転業務には、特別教育の規定がある。<br>ほかの4つの記述は正しい内容です。"},

{license:"cargo_handling", id:"cargo_law_2_1", subject:"law", theme:2, q:"有害物・ハッチ・隔壁の確認について、正しいものはどれか。", choices:["港湾荷役作業を始める前に、作業場所の荷に有害物や危険物があるかを調べる。","ばら物荷卸しで隔壁が倒壊する危険があっても、作業指揮者を置けば取り外さずに作業できる。","シフチングボードやフィーダボックスは、電気計器なので荷卸し時の隔壁の確認とは無関係である。","有害物等の漏えい時の処置は、実際に漏れてから初めて考えればよい。","有害物等の取扱方法を定めても、作業者が任意に方法を変えてよい。"], answer:0, explain:"この記述が正しい内容です。港湾荷役作業を始める前に、作業場所の荷に有害物や危険物があるかを調べる。<br><br>ほかの選択肢の確認：<br>・シフチングボードやフィーダボックスは、荷の移動を防ぐ隔壁等として確認の対象になる。<br>・有害物等の取扱いは、定めて周知した安全な方法によって実施させる。<br>・有害物等があるときは、飛散・漏えい時の処置をあらかじめ定めて周知する。<br>・ばら物荷卸しで隔壁の倒壊・落下による危険がある場合は、隔壁を取り外してから作業させる。"},
{license:"cargo_handling", id:"cargo_law_2_2", subject:"law", theme:2, q:"有害物・ハッチ・隔壁の確認について、誤っているものはどれか。", choices:["港湾荷役作業を始める前に、作業場所の荷に有害物や危険物があるかを調べる。","有害物等があるときは、飛散・漏えい時の処置をあらかじめ定めて周知する。","船倉への巻上げ・巻卸しの前に、ハッチビーム等の固定状態を点検する。","有害物等の取扱方法は、管理者が知っていれば作業者への周知は不要である。","有害物等の取扱いは、定めて周知した安全な方法によって実施させる。"], answer:3, explain:"この記述が誤りです。正しくは、有害物等があるときは、安全な取扱方法を定めて作業者に周知する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_2_3", subject:"law", theme:2, q:"有害物・ハッチ・隔壁の確認について、正しいものはどれか。", choices:["開放したハッチボードが固定されていなくても、監視人を置くだけで荷役を始めてよい。","シフチングボードやフィーダボックスは、電気計器なので荷卸し時の隔壁の確認とは無関係である。","有害物等があるときは、飛散・漏えい時の処置をあらかじめ定めて周知する。","有害物や危険物の有無は、作業を終えた後にだけ調べればよい。","ハッチビーム等の固定状態は、巻上げ作業を始めてから点検する。"], answer:2, explain:"この記述が正しい内容です。有害物等があるときは、飛散・漏えい時の処置をあらかじめ定めて周知する。<br><br>ほかの選択肢の確認：<br>・港湾荷役作業を始める前に、作業場所の荷に有害物や危険物があるかを調べる。<br>・シフチングボードやフィーダボックスは、荷の移動を防ぐ隔壁等として確認の対象になる。<br>・開放したちょうつがい付きハッチボードは、確実な固定を確認してから荷役を行う。<br>・船倉への巻上げ・巻卸しの前に、ハッチビーム等の固定状態を点検する。"},

{license:"cargo_handling", id:"cargo_law_2_7", subject:"law", theme:2, q:"有害物・ハッチ・隔壁の確認について、正しいものはどれか。", choices:["ハッチビーム等の固定状態は、巻上げ作業を始めてから点検する。","有害物等の取扱方法は、管理者が知っていれば作業者への周知は不要である。","有害物や危険物の有無は、作業を終えた後にだけ調べればよい。","ばら物荷卸しで隔壁の倒壊・落下による危険がある場合は、隔壁を取り外してから作業させる。","シフチングボードやフィーダボックスは、電気計器なので荷卸し時の隔壁の確認とは無関係である。"], answer:3, explain:"この記述が正しい内容です。ばら物荷卸しで隔壁の倒壊・落下による危険がある場合は、隔壁を取り外してから作業させる。<br><br>ほかの選択肢の確認：<br>・シフチングボードやフィーダボックスは、荷の移動を防ぐ隔壁等として確認の対象になる。<br>・港湾荷役作業を始める前に、作業場所の荷に有害物や危険物があるかを調べる。<br>・有害物等があるときは、安全な取扱方法を定めて作業者に周知する。<br>・船倉への巻上げ・巻卸しの前に、ハッチビーム等の固定状態を点検する。"},

{license:"cargo_handling", id:"cargo_law_3_1", subject:"law", theme:3, q:"玉掛用具の安全係数について、正しいものはどれか。", choices:["安全係数の計算では、つり角度が変わっても各脚の荷重を常に同じとみなす。","玉掛け用フック・シャックルの安全係数は、3以上でよい。","同じ切断荷重の用具では、作用荷重が大きくなるほど安全係数も大きくなる。","揚貨装置の玉掛け用ワイヤロープの安全係数は、6以上とする。","安全係数4の区分の要件を満たさない玉掛け用鎖は、安全係数2以上でよい。"], answer:3, explain:"この記述が正しい内容です。揚貨装置の玉掛け用ワイヤロープの安全係数は、6以上とする。<br><br>ほかの選択肢の確認：<br>・玉掛け用フック・シャックルの安全係数は、5以上とする。<br>・安全係数4の区分の要件を満たさない玉掛け用鎖は、安全係数5以上とする。<br>・ワイヤロープ各脚の作用荷重を考えるときは、つり角度による張力増加を考慮する。<br>・同じ切断荷重の用具では、作用荷重が大きくなるほど安全係数は小さくなる。"},
{license:"cargo_handling", id:"cargo_law_3_2", subject:"law", theme:3, q:"玉掛用具の安全係数について、誤っているものはどれか。", choices:["玉掛け用フック・シャックルの安全係数は、3以上でよい。","ワイヤロープ各脚の作用荷重を考えるときは、つり角度による張力増加を考慮する。","玉掛け用鎖は、法定の材質・伸び等の要件をすべて満たす区分では安全係数4以上とする。","安全係数は、切断荷重を、その用具にかかる荷重の最大値で割った値である。","法定安全係数を満たしていても、き裂や著しい損傷等がある用具を使用してよいわけではない。"], answer:0, explain:"この記述が誤りです。正しくは、玉掛け用フック・シャックルの安全係数は、5以上とする。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_3_3", subject:"law", theme:3, q:"玉掛用具の安全係数について、正しいものはどれか。", choices:["安全係数4の区分の要件を満たさない玉掛け用鎖は、安全係数2以上でよい。","揚貨装置の玉掛け用ワイヤロープの安全係数は、4以上でよい。","安全係数は、切断荷重を、その用具にかかる荷重の最大値で割った値である。","同じ切断荷重の用具では、作用荷重が大きくなるほど安全係数も大きくなる。","玉掛け用フック・シャックルの安全係数は、3以上でよい。"], answer:2, explain:"この記述が正しい内容です。安全係数は、切断荷重を、その用具にかかる荷重の最大値で割った値である。<br><br>ほかの選択肢の確認：<br>・安全係数4の区分の要件を満たさない玉掛け用鎖は、安全係数5以上とする。<br>・玉掛け用フック・シャックルの安全係数は、5以上とする。<br>・同じ切断荷重の用具では、作用荷重が大きくなるほど安全係数は小さくなる。<br>・揚貨装置の玉掛け用ワイヤロープの安全係数は、6以上とする。"},
{license:"cargo_handling", id:"cargo_law_3_4", subject:"law", theme:3, q:"玉掛用具の安全係数について、誤っているものはどれか。", choices:["同じ切断荷重の用具では、作用荷重が大きくなるほど安全係数も大きくなる。","揚貨装置の玉掛け用ワイヤロープの安全係数は、6以上とする。","玉掛け用フック・シャックルの安全係数は、5以上とする。","ワイヤロープ各脚の作用荷重を考えるときは、つり角度による張力増加を考慮する。","安全係数は、切断荷重を、その用具にかかる荷重の最大値で割った値である。"], answer:0, explain:"この記述が誤りです。正しくは、同じ切断荷重の用具では、作用荷重が大きくなるほど安全係数は小さくなる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_3_5", subject:"law", theme:3, q:"玉掛用具の安全係数について、正しいものはどれか。", choices:["安全係数4の区分の要件を満たさない玉掛け用鎖は、安全係数2以上でよい。","玉掛け用フック・シャックルの安全係数は、3以上でよい。","揚貨装置の玉掛け用ワイヤロープの安全係数は、4以上でよい。","安全係数の計算では、つり角度が変わっても各脚の荷重を常に同じとみなす。","玉掛け用鎖は、法定の材質・伸び等の要件をすべて満たす区分では安全係数4以上とする。"], answer:4, explain:"この記述が正しい内容です。玉掛け用鎖は、法定の材質・伸び等の要件をすべて満たす区分では安全係数4以上とする。<br><br>ほかの選択肢の確認：<br>・ワイヤロープ各脚の作用荷重を考えるときは、つり角度による張力増加を考慮する。<br>・安全係数4の区分の要件を満たさない玉掛け用鎖は、安全係数5以上とする。<br>・揚貨装置の玉掛け用ワイヤロープの安全係数は、6以上とする。<br>・玉掛け用フック・シャックルの安全係数は、5以上とする。"},
{license:"cargo_handling", id:"cargo_law_3_6", subject:"law", theme:3, q:"玉掛用具の安全係数について、誤っているものはどれか。", choices:["玉掛け用フック・シャックルの安全係数は、5以上とする。","法定安全係数を満たしていても、き裂や著しい損傷等がある用具を使用してよいわけではない。","揚貨装置の玉掛け用ワイヤロープの安全係数は、6以上とする。","安全係数4の区分の要件を満たさない玉掛け用鎖は、安全係数2以上でよい。","同じ切断荷重の用具では、作用荷重が大きくなるほど安全係数は小さくなる。"], answer:3, explain:"この記述が誤りです。正しくは、安全係数4の区分の要件を満たさない玉掛け用鎖は、安全係数5以上とする。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_3_7", subject:"law", theme:3, q:"玉掛用具の安全係数について、正しいものはどれか。", choices:["玉掛け用鎖は、材質・伸び等の要件によらず、すべて安全係数4でよい。","法定安全係数を満たしていても、き裂や著しい損傷等がある用具を使用してよいわけではない。","玉掛け用フック・シャックルの安全係数は、3以上でよい。","安全係数4の区分の要件を満たさない玉掛け用鎖は、安全係数2以上でよい。","安全係数の計算では、つり角度が変わっても各脚の荷重を常に同じとみなす。"], answer:1, explain:"この記述が正しい内容です。法定安全係数を満たしていても、き裂や著しい損傷等がある用具を使用してよいわけではない。<br><br>ほかの選択肢の確認：<br>・玉掛け用フック・シャックルの安全係数は、5以上とする。<br>・安全係数4の区分の要件を満たさない玉掛け用鎖は、安全係数5以上とする。<br>・ワイヤロープ各脚の作用荷重を考えるときは、つり角度による張力増加を考慮する。<br>・玉掛け用鎖は、法定の材質・伸び等の要件をすべて満たす区分では安全係数4以上とする。"},
{license:"cargo_handling", id:"cargo_law_3_8", subject:"law", theme:3, q:"玉掛用具の安全係数について、誤っているものはどれか。", choices:["玉掛け用フック・シャックルの安全係数は、5以上とする。","同じ切断荷重の用具では、作用荷重が大きくなるほど安全係数は小さくなる。","安全係数4の区分の要件を満たさない玉掛け用鎖は、安全係数5以上とする。","安全係数の計算では、つり角度が変わっても各脚の荷重を常に同じとみなす。","玉掛け用鎖は、法定の材質・伸び等の要件をすべて満たす区分では安全係数4以上とする。"], answer:3, explain:"この記述が誤りです。正しくは、ワイヤロープ各脚の作用荷重を考えるときは、つり角度による張力増加を考慮する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_4_1", subject:"law", theme:4, q:"立入禁止と同時作業について、正しいものはどれか。", choices:["異なる層での同時作業は、防網等の設備があっても法令上例外が一切ない。","ハッチボード開閉作業の下方は、作業経験があれば立ち入ってよい。","索の内角側の立入禁止は、貨物の汚れだけを防ぐためである。","同じ船倉の上下層での同時作業は、防護設備がなくても自由に行える。","荷の落下・激突のおそれがある船倉への通行設備は、荷の巻上げ・巻卸し中に通行を禁止する。"], answer:4, explain:"この記述が正しい内容です。荷の落下・激突のおそれがある船倉への通行設備は、荷の巻上げ・巻卸し中に通行を禁止する。<br><br>ほかの選択肢の確認：<br>・防網・防布等の荷の落下防止設備がある場合は、異なる層の同時作業禁止に例外がある。<br>・ハッチボード開閉作業の下方で、落下により危険が及ぶ場所は立入禁止とする。<br>・同じ船倉で、同時に異なる層で作業することは原則として禁止される。<br>・索の内角側の立入禁止は、索やみぞ車の脱落による危険を防ぐためである。"},
{license:"cargo_handling", id:"cargo_law_4_2", subject:"law", theme:4, q:"立入禁止と同時作業について、誤っているものはどれか。", choices:["索の内角側の立入禁止は、索やみぞ車の脱落による危険を防ぐためである。","防網・防布等の荷の落下防止設備がある場合は、異なる層の同時作業禁止に例外がある。","ハッチビームの取付け・取外し中、その落下で危険が及ぶ下方の場所は立入禁止とする。","ハッチボード開閉作業の下方は、作業経験があれば立ち入ってよい。","荷の落下・激突のおそれがある船倉への通行設備は、荷の巻上げ・巻卸し中に通行を禁止する。"], answer:3, explain:"この記述が誤りです。正しくは、ハッチボード開閉作業の下方で、落下により危険が及ぶ場所は立入禁止とする。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_4_3", subject:"law", theme:4, q:"立入禁止と同時作業について、正しいものはどれか。", choices:["索の内角側の立入禁止は、貨物の汚れだけを防ぐためである。","同じ船倉の上下層での同時作業は、防護設備がなくても自由に行える。","船倉への通行設備は、荷が激突するおそれがあっても保護帽があれば通行してよい。","ハッチビームの取付け・取外し中、その落下で危険が及ぶ下方の場所は立入禁止とする。","ブーム起伏中は、空荷ならブームが倒れる危険箇所へ立ち入ってよい。"], answer:3, explain:"この記述が正しい内容です。ハッチビームの取付け・取外し中、その落下で危険が及ぶ下方の場所は立入禁止とする。<br><br>ほかの選択肢の確認：<br>・ブーム起伏中、ブームが倒れて危険が及ぶ場所は立入禁止とする。<br>・索の内角側の立入禁止は、索やみぞ車の脱落による危険を防ぐためである。<br>・荷の落下・激突のおそれがある船倉への通行設備は、荷の巻上げ・巻卸し中に通行を禁止する。<br>・同じ船倉で、同時に異なる層で作業することは原則として禁止される。"},
{license:"cargo_handling", id:"cargo_law_4_4", subject:"law", theme:4, q:"立入禁止と同時作業について、誤っているものはどれか。", choices:["ハッチボード開閉作業の下方で、落下により危険が及ぶ場所は立入禁止とする。","索の内角側の立入禁止は、索やみぞ車の脱落による危険を防ぐためである。","防網・防布等の荷の落下防止設備がある場合は、異なる層の同時作業禁止に例外がある。","ブーム起伏中は、空荷ならブームが倒れる危険箇所へ立ち入ってよい。","ハッチビームの取付け・取外し中、その落下で危険が及ぶ下方の場所は立入禁止とする。"], answer:3, explain:"この記述が誤りです。正しくは、ブーム起伏中、ブームが倒れて危険が及ぶ場所は立入禁止とする。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_4_5", subject:"law", theme:4, q:"立入禁止と同時作業について、正しいものはどれか。", choices:["船倉への通行設備は、荷が激突するおそれがあっても保護帽があれば通行してよい。","巻出索や引込索で荷を引いているときは、索の内角側の危険箇所へ立ち入らせない。","索の内角側の立入禁止は、貨物の汚れだけを防ぐためである。","同じ船倉の上下層での同時作業は、防護設備がなくても自由に行える。","異なる層での同時作業は、防網等の設備があっても法令上例外が一切ない。"], answer:1, explain:"この記述が正しい内容です。巻出索や引込索で荷を引いているときは、索の内角側の危険箇所へ立ち入らせない。<br><br>ほかの選択肢の確認：<br>・防網・防布等の荷の落下防止設備がある場合は、異なる層の同時作業禁止に例外がある。<br>・荷の落下・激突のおそれがある船倉への通行設備は、荷の巻上げ・巻卸し中に通行を禁止する。<br>・索の内角側の立入禁止は、索やみぞ車の脱落による危険を防ぐためである。<br>・同じ船倉で、同時に異なる層で作業することは原則として禁止される。"},
{license:"cargo_handling", id:"cargo_law_4_6", subject:"law", theme:4, q:"立入禁止と同時作業について、誤っているものはどれか。", choices:["同じ船倉で、同時に異なる層で作業することは原則として禁止される。","ブーム起伏中、ブームが倒れて危険が及ぶ場所は立入禁止とする。","索の内角側の立入禁止は、貨物の汚れだけを防ぐためである。","ハッチビームの取付け・取外し中、その落下で危険が及ぶ下方の場所は立入禁止とする。","ハッチボード開閉作業の下方で、落下により危険が及ぶ場所は立入禁止とする。"], answer:2, explain:"この記述が誤りです。正しくは、索の内角側の立入禁止は、索やみぞ車の脱落による危険を防ぐためである。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_4_7", subject:"law", theme:4, q:"立入禁止と同時作業について、正しいものはどれか。", choices:["ハッチビームの取外し中でも、下方に監視人だけは無条件に立ち入ってよい。","索の内角側の立入禁止は、貨物の汚れだけを防ぐためである。","船倉への通行設備は、荷が激突するおそれがあっても保護帽があれば通行してよい。","同じ船倉で、同時に異なる層で作業することは原則として禁止される。","巻出索や引込索の内角側は、索やみぞ車が外れても安全なので立ち入ってよい。"], answer:3, explain:"この記述が正しい内容です。同じ船倉で、同時に異なる層で作業することは原則として禁止される。<br><br>ほかの選択肢の確認：<br>・荷の落下・激突のおそれがある船倉への通行設備は、荷の巻上げ・巻卸し中に通行を禁止する。<br>・巻出索や引込索で荷を引いているときは、索の内角側の危険箇所へ立ち入らせない。<br>・索の内角側の立入禁止は、索やみぞ車の脱落による危険を防ぐためである。<br>・ハッチビームの取付け・取外し中、その落下で危険が及ぶ下方の場所は立入禁止とする。"},
{license:"cargo_handling", id:"cargo_law_4_8", subject:"law", theme:4, q:"立入禁止と同時作業について、誤っているものはどれか。", choices:["索の内角側の立入禁止は、索やみぞ車の脱落による危険を防ぐためである。","同じ船倉で、同時に異なる層で作業することは原則として禁止される。","巻出索や引込索で荷を引いているときは、索の内角側の危険箇所へ立ち入らせない。","ハッチビームの取付け・取外し中、その落下で危険が及ぶ下方の場所は立入禁止とする。","異なる層での同時作業は、防網等の設備があっても法令上例外が一切ない。"], answer:4, explain:"この記述が誤りです。正しくは、防網・防布等の荷の落下防止設備がある場合は、異なる層の同時作業禁止に例外がある。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_5_1", subject:"law", theme:5, q:"船内荷役作業主任者について、正しいものはどれか。", choices:["作業主任者は、通行設備や保護具の点検整備に関与しない。","揚貨装置を用いていても、船舶が小さければ作業主任者は常に不要である。","作業主任者は、自分の作業班以外とは連絡調整をしないことが職務である。","作業主任者の職務は、出勤人数の記録だけである。","船内荷役作業主任者は、所定の技能講習を修了した者から選任する。"], answer:4, explain:"この記述が正しい内容です。船内荷役作業主任者は、所定の技能講習を修了した者から選任する。<br><br>ほかの選択肢の確認：<br>・作業主任者は、通行設備・荷役機械・保護具・器具工具を点検整備する。<br>・作業主任者は、作業方法を決定し、作業を直接指揮する。<br>・揚貨装置を用いて船舶に荷を積み卸す作業は、船内荷役作業主任者の選任対象である。<br>・作業主任者は、周辺の作業者との連絡調整を行う。"},

{license:"cargo_handling", id:"cargo_law_6_1", subject:"law", theme:6, q:"作業前点検・通路・保護具について、正しいものはどれか。", choices:["船倉への通行設備は、深さが5mを超える場合にだけ必要である。","スリングの作業前点検は、個数だけを数えればよく、損傷の確認は不要である。","船倉へは、通行設備があってもつり荷につかまって移動してよい。","作動状態に異常があっても、荷が軽ければ点検結果を無視して使用できる。","揚貨装置の作動状態は、巻上げ・巻卸しの作業を始める前に点検する。"], answer:4, explain:"この記述が正しい内容です。揚貨装置の作動状態は、巻上げ・巻卸しの作業を始める前に点検する。<br><br>ほかの選択肢の確認：<br>・作動状態に異常がないことを確認してから、揚貨装置を使用させる。<br>・スリングの作業前点検では、異常があるかどうかを確認する。<br>・ばく露甲板から船倉底までの深さが1.5mを超える船倉では、安全な通行設備を確保する。<br>・船倉への通行には、設けられた安全な通行設備を使用する。"},

{license:"cargo_handling", id:"cargo_law_6_7", subject:"law", theme:6, q:"作業前点検・通路・保護具について、正しいものはどれか。", choices:["船倉への通行設備は、深さが5mを超える場合にだけ必要である。","港湾荷役作業では、安全に作業できる必要な照度を保持する。","港湾荷役作業の保護帽は、本人が希望するときだけ着用すればよい。","作動状態に異常があっても、荷が軽ければ点検結果を無視して使用できる。","スリングの作業前点検は、個数だけを数えればよく、損傷の確認は不要である。"], answer:1, explain:"この記述が正しい内容です。港湾荷役作業では、安全に作業できる必要な照度を保持する。<br><br>ほかの選択肢の確認：<br>・作動状態に異常がないことを確認してから、揚貨装置を使用させる。<br>・ばく露甲板から船倉底までの深さが1.5mを超える船倉では、安全な通行設備を確保する。<br>・港湾荷役作業に従事する労働者には、飛来・落下物による危険防止のため保護帽を着用させる。<br>・スリングの作業前点検では、異常があるかどうかを確認する。"},

{license:"cargo_handling", id:"cargo_law_7_1", subject:"law", theme:7, q:"玉掛用具の使用禁止基準について、正しいものはどれか。", choices:["鎖は、製造時より6％伸びても使用禁止には該当しない。","鎖は、リンク断面の直径が12％減少していても使用できる。","ワイヤロープは、1よりの素線数の10％以上が切断したものを使用しない。フィラ線は除く。","フックのき裂は、使用する荷を軽くすれば使用禁止の対象外となる。","キンクしたワイヤロープは、手で伸ばせば必ず再使用できる。"], answer:2, explain:"この記述が正しい内容です。ワイヤロープは、1よりの素線数の10％以上が切断したものを使用しない。フィラ線は除く。<br><br>ほかの選択肢の確認：<br>・キンクしたワイヤロープは、揚貨装置の玉掛けに使用しない。<br>・鎖は、製造時の長さからの伸びが5％を超えるものを使用しない。<br>・き裂のある鎖、又は変形・き裂のあるフック・シャックル・リングは使用しない。<br>・鎖は、リンク断面の直径減少が製造時の10％を超えるものを使用しない。"},
{license:"cargo_handling", id:"cargo_law_7_2", subject:"law", theme:7, q:"玉掛用具の使用禁止基準について、誤っているものはどれか。", choices:["鎖は、製造時の長さからの伸びが5％を超えるものを使用しない。","著しい形くずれ又は腐食があるワイヤロープは、玉掛けに使用しない。","ストランドが切断したものや著しい損傷・腐食のある繊維ロープ等は使用しない。","鎖は、リンク断面の直径減少が製造時の10％を超えるものを使用しない。","ワイヤロープは、直径が公称径より8％減少していても使用できる。"], answer:4, explain:"この記述が誤りです。正しくは、ワイヤロープは、公称径からの直径減少が7％を超えるものを使用しない。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_7_3", subject:"law", theme:7, q:"玉掛用具の使用禁止基準について、正しいものはどれか。", choices:["鎖は、リンク断面の直径が12％減少していても使用できる。","著しい腐食があっても、素線が切れていなければ使用してよい。","キンクしたワイヤロープは、揚貨装置の玉掛けに使用しない。","フックのき裂は、使用する荷を軽くすれば使用禁止の対象外となる。","繊維ロープは、ストランドが1本切れていても使用してよい。"], answer:2, explain:"この記述が正しい内容です。キンクしたワイヤロープは、揚貨装置の玉掛けに使用しない。<br><br>ほかの選択肢の確認：<br>・著しい形くずれ又は腐食があるワイヤロープは、玉掛けに使用しない。<br>・鎖は、リンク断面の直径減少が製造時の10％を超えるものを使用しない。<br>・き裂のある鎖、又は変形・き裂のあるフック・シャックル・リングは使用しない。<br>・ストランドが切断したものや著しい損傷・腐食のある繊維ロープ等は使用しない。"},
{license:"cargo_handling", id:"cargo_law_7_4", subject:"law", theme:7, q:"玉掛用具の使用禁止基準について、誤っているものはどれか。", choices:["ワイヤロープは、公称径からの直径減少が7％を超えるものを使用しない。","き裂のある鎖、又は変形・き裂のあるフック・シャックル・リングは使用しない。","著しい腐食があっても、素線が切れていなければ使用してよい。","鎖は、製造時の長さからの伸びが5％を超えるものを使用しない。","キンクしたワイヤロープは、揚貨装置の玉掛けに使用しない。"], answer:2, explain:"この記述が誤りです。正しくは、著しい形くずれ又は腐食があるワイヤロープは、玉掛けに使用しない。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_7_5", subject:"law", theme:7, q:"玉掛用具の使用禁止基準について、正しいものはどれか。", choices:["キンクしたワイヤロープは、手で伸ばせば必ず再使用できる。","鎖は、製造時の長さからの伸びが5％を超えるものを使用しない。","鎖は、リンク断面の直径が12％減少していても使用できる。","繊維ロープは、ストランドが1本切れていても使用してよい。","フックのき裂は、使用する荷を軽くすれば使用禁止の対象外となる。"], answer:1, explain:"この記述が正しい内容です。鎖は、製造時の長さからの伸びが5％を超えるものを使用しない。<br><br>ほかの選択肢の確認：<br>・ストランドが切断したものや著しい損傷・腐食のある繊維ロープ等は使用しない。<br>・キンクしたワイヤロープは、揚貨装置の玉掛けに使用しない。<br>・鎖は、リンク断面の直径減少が製造時の10％を超えるものを使用しない。<br>・き裂のある鎖、又は変形・き裂のあるフック・シャックル・リングは使用しない。"},
{license:"cargo_handling", id:"cargo_law_7_6", subject:"law", theme:7, q:"玉掛用具の使用禁止基準について、誤っているものはどれか。", choices:["き裂のある鎖、又は変形・き裂のあるフック・シャックル・リングは使用しない。","鎖は、製造時の長さからの伸びが5％を超えるものを使用しない。","ストランドが切断したものや著しい損傷・腐食のある繊維ロープ等は使用しない。","鎖は、リンク断面の直径が12％減少していても使用できる。","著しい形くずれ又は腐食があるワイヤロープは、玉掛けに使用しない。"], answer:3, explain:"この記述が誤りです。正しくは、鎖は、リンク断面の直径減少が製造時の10％を超えるものを使用しない。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_7_7", subject:"law", theme:7, q:"玉掛用具の使用禁止基準について、正しいものはどれか。", choices:["き裂のある鎖、又は変形・き裂のあるフック・シャックル・リングは使用しない。","ワイヤロープは、素線切断が10％ちょうどなら使用禁止基準に該当しない。","キンクしたワイヤロープは、手で伸ばせば必ず再使用できる。","鎖は、リンク断面の直径が12％減少していても使用できる。","ワイヤロープは、直径が公称径より8％減少していても使用できる。"], answer:0, explain:"この記述が正しい内容です。き裂のある鎖、又は変形・き裂のあるフック・シャックル・リングは使用しない。<br><br>ほかの選択肢の確認：<br>・ワイヤロープは、公称径からの直径減少が7％を超えるものを使用しない。<br>・ワイヤロープは、1よりの素線数の10％以上が切断したものを使用しない。フィラ線は除く。<br>・鎖は、リンク断面の直径減少が製造時の10％を超えるものを使用しない。<br>・キンクしたワイヤロープは、揚貨装置の玉掛けに使用しない。"},
{license:"cargo_handling", id:"cargo_law_7_8", subject:"law", theme:7, q:"玉掛用具の使用禁止基準について、誤っているものはどれか。", choices:["繊維ロープは、ストランドが1本切れていても使用してよい。","き裂のある鎖、又は変形・き裂のあるフック・シャックル・リングは使用しない。","キンクしたワイヤロープは、揚貨装置の玉掛けに使用しない。","鎖は、製造時の長さからの伸びが5％を超えるものを使用しない。","ワイヤロープは、公称径からの直径減少が7％を超えるものを使用しない。"], answer:0, explain:"この記述が誤りです。正しくは、ストランドが切断したものや著しい損傷・腐食のある繊維ロープ等は使用しない。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_8_1", subject:"law", theme:8, q:"合図と運転者の職務について、正しいものはどれか。", choices:["運転を停止しただけで、荷をつったまま作業位置から離れてよい。","指名された合図者も、合図を省略して運転者の推測に任せてよい。","事業者が指名しないときは、運転者が自分を合図者に指名して事後報告すればよい。","事業者は、揚貨装置の運転について一定の合図を定める。","ブレーキをかければ、荷をつったまま運転者を休憩へ行かせてよい。"], answer:3, explain:"この記述が正しい内容です。事業者は、揚貨装置の運転について一定の合図を定める。<br><br>ほかの選択肢の確認：<br>・合図者の指名は、事業者が行う。<br>・指名を受けた合図者は、当該作業に従事するときに定めた合図を行う。<br>・事業者は、荷をつったまま運転者を作業位置から離れさせてはならない。<br>・作業位置を離れる前に、荷を安全に着地させる必要がある。"},
{license:"cargo_handling", id:"cargo_law_8_2", subject:"law", theme:8, q:"合図と運転者の職務について、誤っているものはどれか。", choices:["事業者は、揚貨装置の運転について一定の合図を定める。","合図者は、装置の数によらず船舶ごとに1人と法令で定められている。","作業位置を離れる前に、荷を安全に着地させる必要がある。","合図者の指名は、事業者が行う。","指名を受けた合図者は、当該作業に従事するときに定めた合図を行う。"], answer:1, explain:"この記述が誤りです。正しくは、合図者は、揚貨装置ごとに指名する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_8_3", subject:"law", theme:8, q:"合図と運転者の職務について、正しいものはどれか。", choices:["合図者の合図に従う義務は、労働者にはない。","運転を停止しただけで、荷をつったまま作業位置から離れてよい。","ブレーキをかければ、荷をつったまま運転者を休憩へ行かせてよい。","合図者は、装置の数によらず船舶ごとに1人と法令で定められている。","指名を受けた合図者は、当該作業に従事するときに定めた合図を行う。"], answer:4, explain:"この記述が正しい内容です。指名を受けた合図者は、当該作業に従事するときに定めた合図を行う。<br><br>ほかの選択肢の確認：<br>・合図者は、揚貨装置ごとに指名する。<br>・当該作業に従事する労働者は、合図者の合図に従う。<br>・事業者は、荷をつったまま運転者を作業位置から離れさせてはならない。<br>・作業位置を離れる前に、荷を安全に着地させる必要がある。"},
{license:"cargo_handling", id:"cargo_law_8_4", subject:"law", theme:8, q:"合図と運転者の職務について、誤っているものはどれか。", choices:["合図者の合図に従う義務は、労働者にはない。","合図者の指名は、事業者が行う。","運転者自身も、荷をつったまま作業位置を離れてはならない。","事業者は、荷をつったまま運転者を作業位置から離れさせてはならない。","指名を受けた合図者は、当該作業に従事するときに定めた合図を行う。"], answer:0, explain:"この記述が誤りです。正しくは、当該作業に従事する労働者は、合図者の合図に従う。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_8_5", subject:"law", theme:8, q:"合図と運転者の職務について、正しいものはどれか。", choices:["指名された合図者も、合図を省略して運転者の推測に任せてよい。","合図者の指名は、事業者が行う。","合図者は、装置の数によらず船舶ごとに1人と法令で定められている。","ブレーキをかければ、荷をつったまま運転者を休憩へ行かせてよい。","荷が小さければ、運転者は荷をつったまま作業位置を離れてよい。"], answer:1, explain:"この記述が正しい内容です。合図者の指名は、事業者が行う。<br><br>ほかの選択肢の確認：<br>・合図者は、揚貨装置ごとに指名する。<br>・指名を受けた合図者は、当該作業に従事するときに定めた合図を行う。<br>・事業者は、荷をつったまま運転者を作業位置から離れさせてはならない。<br>・運転者自身も、荷をつったまま作業位置を離れてはならない。"},
{license:"cargo_handling", id:"cargo_law_8_6", subject:"law", theme:8, q:"合図と運転者の職務について、誤っているものはどれか。", choices:["事業者は、揚貨装置の運転について一定の合図を定める。","ブレーキをかければ、荷をつったまま運転者を休憩へ行かせてよい。","合図者の指名は、事業者が行う。","合図者は、揚貨装置ごとに指名する。","運転者自身も、荷をつったまま作業位置を離れてはならない。"], answer:1, explain:"この記述が誤りです。正しくは、事業者は、荷をつったまま運転者を作業位置から離れさせてはならない。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_8_7", subject:"law", theme:8, q:"合図と運転者の職務について、正しいものはどれか。", choices:["合図者の合図に従う義務は、労働者にはない。","運転者自身も、荷をつったまま作業位置を離れてはならない。","事業者が指名しないときは、運転者が自分を合図者に指名して事後報告すればよい。","運転を停止しただけで、荷をつったまま作業位置から離れてよい。","運転の合図は、作業のたびに各作業者が別々に決めればよい。"], answer:1, explain:"この記述が正しい内容です。運転者自身も、荷をつったまま作業位置を離れてはならない。<br><br>ほかの選択肢の確認：<br>・当該作業に従事する労働者は、合図者の合図に従う。<br>・合図者の指名は、事業者が行う。<br>・事業者は、揚貨装置の運転について一定の合図を定める。<br>・作業位置を離れる前に、荷を安全に着地させる必要がある。"},
{license:"cargo_handling", id:"cargo_law_8_8", subject:"law", theme:8, q:"合図と運転者の職務について、誤っているものはどれか。", choices:["事業者は、揚貨装置の運転について一定の合図を定める。","合図者は、揚貨装置ごとに指名する。","合図者の指名は、事業者が行う。","運転を停止しただけで、荷をつったまま作業位置から離れてよい。","運転者自身も、荷をつったまま作業位置を離れてはならない。"], answer:3, explain:"この記述が誤りです。正しくは、作業位置を離れる前に、荷を安全に着地させる必要がある。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_9_1", subject:"law", theme:9, q:"巻出し作業とスリングの取扱いについて、正しいものはどれか。", choices:["玉掛け用ワイヤロープのアイは、簡単な一重結びだけで所定の端末条件を満たす。","ハッチ直下以外の荷は、巻出索を用いる等によりハッチ直下へ移してから巻き上げる。","ドラム缶等は、どのようなフックでも縁に浅くかければよい。","ベール包装の帯鉄には、荷を安定させるため直接フックをかけなければならない。","合図者が了承すれば、制限荷重を超えて使用できる。"], answer:1, explain:"この記述が正しい内容です。ハッチ直下以外の荷は、巻出索を用いる等によりハッチ直下へ移してから巻き上げる。<br><br>ほかの選択肢の確認：<br>・ドラム缶等は、荷が外れるおそれのない構造のフック付きスリングを用いる。<br>・ベール包装の帯鉄・ロープ・針金に、スリングのフックをかけて巻き上げてはならない。<br>・玉掛け用ワイヤロープのアイは、アイスプライスや圧縮止め等、所定の強さを持つ方法で作る。<br>・揚貨装置に制限荷重を超える荷重をかけて使用してはならない。"},
{license:"cargo_handling", id:"cargo_law_9_2", subject:"law", theme:9, q:"巻出し作業とスリングの取扱いについて、誤っているものはどれか。", choices:["ハッチ直下以外の荷は、巻出索を用いる等によりハッチ直下へ移してから巻き上げる。","揚貨装置に制限荷重を超える荷重をかけて使用してはならない。","巻出索・引込索用のみぞ車は、手で押さえるだけで使用してよい。","ベール包装の帯鉄・ロープ・針金に、スリングのフックをかけて巻き上げてはならない。","玉掛け用ワイヤロープのアイは、アイスプライスや圧縮止め等、所定の強さを持つ方法で作る。"], answer:2, explain:"この記述が誤りです。正しくは、巻出索・引込索用のみぞ車は、所定の取付具で船のフレームに確実に取り付ける。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_9_3", subject:"law", theme:9, q:"巻出し作業とスリングの取扱いについて、正しいものはどれか。", choices:["エンドレスでない玉掛け用ワイヤロープは、両端を切り放したままで使用できる。","巻出索・引込索用のみぞ車は、手で押さえるだけで使用してよい。","ドラム缶等は、どのようなフックでも縁に浅くかければよい。","合図者が了承すれば、制限荷重を超えて使用できる。","みぞ車の取付具には、ビームクランプやシャックル等を用いる。"], answer:4, explain:"この記述が正しい内容です。みぞ車の取付具には、ビームクランプやシャックル等を用いる。<br><br>ほかの選択肢の確認：<br>・エンドレスでない玉掛け用ワイヤロープ・鎖は、両端にフック、シャックル、リング又はアイを備える。<br>・ドラム缶等は、荷が外れるおそれのない構造のフック付きスリングを用いる。<br>・巻出索・引込索用のみぞ車は、所定の取付具で船のフレームに確実に取り付ける。<br>・揚貨装置に制限荷重を超える荷重をかけて使用してはならない。"},

{license:"cargo_handling", id:"cargo_law_9_8", subject:"law", theme:9, q:"巻出し作業とスリングの取扱いについて、誤っているものはどれか。", choices:["ハッチ直下以外の荷は、巻出索を用いる等によりハッチ直下へ移してから巻き上げる。","玉掛け用ワイヤロープのアイは、アイスプライスや圧縮止め等、所定の強さを持つ方法で作る。","エンドレスでない玉掛け用ワイヤロープ・鎖は、両端にフック、シャックル、リング又はアイを備える。","ドラム缶等は、荷が外れるおそれのない構造のフック付きスリングを用いる。","合図者が了承すれば、制限荷重を超えて使用できる。"], answer:4, explain:"この記述が誤りです。正しくは、揚貨装置に制限荷重を超える荷重をかけて使用してはならない。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_10_1", subject:"law", theme:10, q:"免許と免許証について、正しいものはどれか。", choices:["免許証の再交付申請先は、必ず所属会社の所在地の市町村長である。","免許に係る業務で故意に重大事故を起こしても、免許の取消しや効力停止の対象にはならない。","免許取消しの処分を受けても、次の更新時まで免許証を保持してよい。","氏名を変更しても、他の身分証で確認できれば免許証の書替えは不要である。","免許が必要な運転業務に就くときは、その資格を証する免許証を携帯する。"], answer:4, explain:"この記述が正しい内容です。免許が必要な運転業務に就くときは、その資格を証する免許証を携帯する。<br><br>ほかの選択肢の確認：<br>・免許に係る業務に現に就く者又は就こうとする者が氏名を変更したときは、書替えを受ける。<br>・故意又は重大な過失で免許に係る業務について重大な事故を起こすと、取消し又は効力の一時停止の対象となり得る。<br>・再交付申請先には、免許証の交付を受けた都道府県労働局長又は住所を管轄する都道府県労働局長がある。<br>・免許取消しの処分を受けたときは、遅滞なく免許証を返還する。"},
{license:"cargo_handling", id:"cargo_law_10_2", subject:"law", theme:10, q:"免許と免許証について、誤っているものはどれか。", choices:["故意又は重大な過失で免許に係る業務について重大な事故を起こすと、取消し又は効力の一時停止の対象となり得る。","免許に係る業務に現に就く者又は就こうとする者が氏名を変更したときは、書替えを受ける。","免許証を滅失しても、会社が所持を証明すれば再交付を受けなくてよい。","再交付申請先には、免許証の交付を受けた都道府県労働局長又は住所を管轄する都道府県労働局長がある。","免許取消しの処分を受けたときは、遅滞なく免許証を返還する。"], answer:2, explain:"この記述が誤りです。正しくは、免許に係る業務に現に就く者又は就こうとする者が免許証を滅失したときは、再交付を受ける。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_law_10_3", subject:"law", theme:10, q:"免許と免許証について、正しいものはどれか。", choices:["氏名を変更しても、他の身分証で確認できれば免許証の書替えは不要である。","取消しの場合の免許証の返還先は、運転者が任意に選んだ船会社である。","免許に係る業務に現に就く者又は就こうとする者が免許証を損傷したときは、再交付を受ける。","免許証の再交付申請先は、必ず所属会社の所在地の市町村長である。","免許証を滅失しても、会社が所持を証明すれば再交付を受けなくてよい。"], answer:2, explain:"この記述が正しい内容です。免許に係る業務に現に就く者又は就こうとする者が免許証を損傷したときは、再交付を受ける。<br><br>ほかの選択肢の確認：<br>・再交付申請先には、免許証の交付を受けた都道府県労働局長又は住所を管轄する都道府県労働局長がある。<br>・免許に係る業務に現に就く者又は就こうとする者が免許証を滅失したときは、再交付を受ける。<br>・免許に係る業務に現に就く者又は就こうとする者が氏名を変更したときは、書替えを受ける。<br>・取消しの場合の免許証の返還先は、その取消しをした都道府県労働局長である。"},

{license:"cargo_handling", id:"cargo_law_10_8", subject:"law", theme:10, q:"免許と免許証について、誤っているものはどれか。", choices:["免許に係る業務に現に就く者又は就こうとする者が免許証を滅失したときは、再交付を受ける。","取消しの場合の免許証の返還先は、その取消しをした都道府県労働局長である。","免許に係る業務に現に就く者又は就こうとする者が氏名を変更したときは、書替えを受ける。","免許が必要な運転業務に就くときは、その資格を証する免許証を携帯する。","免許に係る業務で故意に重大事故を起こしても、免許の取消しや効力停止の対象にはならない。"], answer:4, explain:"この記述が誤りです。正しくは、故意又は重大な過失で免許に係る業務について重大な事故を起こすと、取消し又は効力の一時停止の対象となり得る。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_1_1", subject:"motor", theme:1, q:"電気の基礎について、正しいものはどれか。", choices:["工場の動力用には、一般に単相交流だけが用いられる。","発電所から変電所等へ送ることを配電、変電所等から需要先へ送ることを送電という。","銅やアルミニウムは、一般に電気を通しにくい絶縁体である。","乾燥したゴムやガラスは、一般に銅より電気を通しやすい。","直流はDC、交流はACと表す。"], answer:4, explain:"この記述が正しい内容です。直流はDC、交流はACと表す。<br><br>ほかの選択肢の確認：<br>・発電所から変電所等へ送ることを送電、変電所等から需要先へ送ることを配電という。<br>・乾燥したゴムやガラスは、一般に電気を通しにくい。<br>・工場の動力用には、一般に三相交流が用いられる。<br>・銅やアルミニウムは、一般に電気を通しやすい導体である。"},
{license:"cargo_handling", id:"cargo_motor_1_2", subject:"motor", theme:1, q:"電気の基礎について、誤っているものはどれか。", choices:["工場の動力用には、一般に三相交流が用いられる。","直流はDC、交流はACと表す。","交流は、常に一定方向にだけ流れる電流である。","発電所から変電所等へ送ることを送電、変電所等から需要先へ送ることを配電という。","電力系統の周波数には、地域により50Hzと60Hzがある。"], answer:2, explain:"この記述が誤りです。正しくは、交流は、電流の向きと大きさが周期的に変化する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_1_3", subject:"motor", theme:1, q:"電気の基礎について、正しいものはどれか。", choices:["発電所から変電所等へ送ることを送電、変電所等から需要先へ送ることを配電という。","乾燥したゴムやガラスは、一般に銅より電気を通しやすい。","銅やアルミニウムは、一般に電気を通しにくい絶縁体である。","直流はAC、交流はDCと表す。","同じ電力を送る場合、送電電圧を低くして電流を大きくすると電線の発熱損失を減らせる。"], answer:0, explain:"この記述が正しい内容です。発電所から変電所等へ送ることを送電、変電所等から需要先へ送ることを配電という。<br><br>ほかの選択肢の確認：<br>・銅やアルミニウムは、一般に電気を通しやすい導体である。<br>・同じ電力を送る場合、送電電圧を高くして電流を小さくすると電線の発熱損失を減らせる。<br>・乾燥したゴムやガラスは、一般に電気を通しにくい。<br>・直流はDC、交流はACと表す。"},
{license:"cargo_handling", id:"cargo_motor_1_4", subject:"motor", theme:1, q:"電気の基礎について、誤っているものはどれか。", choices:["乾燥したゴムやガラスは、一般に電気を通しにくい。","交流は、電流の向きと大きさが周期的に変化する。","電力系統の周波数には、地域により50Hzと60Hzがある。","同じ電力を送る場合、送電電圧を高くして電流を小さくすると電線の発熱損失を減らせる。","工場の動力用には、一般に単相交流だけが用いられる。"], answer:4, explain:"この記述が誤りです。正しくは、工場の動力用には、一般に三相交流が用いられる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_1_5", subject:"motor", theme:1, q:"電気の基礎について、正しいものはどれか。", choices:["工場の動力用には、一般に単相交流だけが用いられる。","電力系統の周波数には、地域により50Hzと60Hzがある。","直流はAC、交流はDCと表す。","乾燥したゴムやガラスは、一般に銅より電気を通しやすい。","同じ電力を送る場合、送電電圧を低くして電流を大きくすると電線の発熱損失を減らせる。"], answer:1, explain:"この記述が正しい内容です。電力系統の周波数には、地域により50Hzと60Hzがある。<br><br>ほかの選択肢の確認：<br>・直流はDC、交流はACと表す。<br>・工場の動力用には、一般に三相交流が用いられる。<br>・同じ電力を送る場合、送電電圧を高くして電流を小さくすると電線の発熱損失を減らせる。<br>・乾燥したゴムやガラスは、一般に電気を通しにくい。"},
{license:"cargo_handling", id:"cargo_motor_1_6", subject:"motor", theme:1, q:"電気の基礎について、誤っているものはどれか。", choices:["交流は、電流の向きと大きさが周期的に変化する。","乾燥したゴムやガラスは、一般に電気を通しにくい。","電力系統の周波数には、地域により50Hzと60Hzがある。","銅やアルミニウムは、一般に電気を通しにくい絶縁体である。","直流はDC、交流はACと表す。"], answer:3, explain:"この記述が誤りです。正しくは、銅やアルミニウムは、一般に電気を通しやすい導体である。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_1_7", subject:"motor", theme:1, q:"電気の基礎について、正しいものはどれか。", choices:["同じ電力を送る場合、送電電圧を低くして電流を大きくすると電線の発熱損失を減らせる。","交流は、常に一定方向にだけ流れる電流である。","直流はAC、交流はDCと表す。","乾燥したゴムやガラスは、一般に電気を通しにくい。","銅やアルミニウムは、一般に電気を通しにくい絶縁体である。"], answer:3, explain:"この記述が正しい内容です。乾燥したゴムやガラスは、一般に電気を通しにくい。<br><br>ほかの選択肢の確認：<br>・直流はDC、交流はACと表す。<br>・同じ電力を送る場合、送電電圧を高くして電流を小さくすると電線の発熱損失を減らせる。<br>・銅やアルミニウムは、一般に電気を通しやすい導体である。<br>・交流は、電流の向きと大きさが周期的に変化する。"},
