{license:"cargo_handling", id:"cargo_motor_3_8", subject:"motor", theme:3, q:"図の回路について、回路全体に流れる電流は何Aか。<div class=\"diagram-box\"><svg viewBox=\"0 0 560 230\" role=\"img\" aria-label=\"一つの抵抗と二つの並列抵抗を直列接続した回路\" style=\"width:100%;max-width:560px;height:auto;background:white\"><g font-family=\"sans-serif\" font-size=\"18\" fill=\"#17263b\" stroke-width=\"2\"><path d=\"M25 100 H80 M175 100 H240 M240 65 V150 M240 65 H290 M390 65 H475 V150 H390 M290 150 H240 M475 100 H540\" fill=\"none\" stroke=\"#17263b\"/><rect x=\"80\" y=\"80\" width=\"95\" height=\"40\" fill=\"#dbeafe\" stroke=\"#17263b\"/><rect x=\"290\" y=\"45\" width=\"100\" height=\"40\" fill=\"#dbeafe\" stroke=\"#17263b\"/><rect x=\"290\" y=\"130\" width=\"100\" height=\"40\" fill=\"#dbeafe\" stroke=\"#17263b\"/><text x=\"100\" y=\"106\">12Ω</text><text x=\"320\" y=\"71\">8Ω</text><text x=\"320\" y=\"157\">8Ω</text><circle cx=\"25\" cy=\"100\" r=\"4\"/><circle cx=\"540\" cy=\"100\" r=\"4\"/><text x=\"120\" y=\"212\">両端の電圧 80V（直流）</text></g></svg></div>", choices:["2.5 A","5 A","7.5 A","10 A","15 A"], answer:1, explain:"並列部分は8×8÷(8＋8)＝4Ω。全体は12＋4＝16Ω。したがって全電流I＝80÷16＝5A。"},
{license:"cargo_handling", id:"cargo_motor_4_1", subject:"motor", theme:4, q:"導体と絶縁体について、正しいものはどれか。", choices:["銅は、電気を通しやすい導体である。","空気は、どのような高電圧でも絶対に放電しない。","絶縁体の損傷は、作業速度を落とせば修理せずに使い続けられる。","乾燥したゴムは、金属と同じ程度に電気を通しやすい。","ガラスは、通常、銅より電気抵抗が小さい導体である。"], answer:0, explain:"この記述が正しい内容です。銅は、電気を通しやすい導体である。<br><br>ほかの選択肢の確認：<br>・ガラスは、通常の使用条件では絶縁体として扱われる。<br>・絶縁体の劣化や損傷を認めた機器は、適切に点検・修理して使用する。<br>・空気は通常は絶縁性を持つが、高い電圧で絶縁破壊することがある。<br>・乾燥したゴムは、一般に電気を通しにくい。"},
{license:"cargo_handling", id:"cargo_motor_4_2", subject:"motor", theme:4, q:"導体と絶縁体について、誤っているものはどれか。", choices:["空気は通常は絶縁性を持つが、高い電圧で絶縁破壊することがある。","絶縁物でも、水分や汚れによって絶縁性能が低下することがある。","電線の被覆の損傷は、漏電や感電の原因になる。","アルミニウムは、電気を全く通さない非金属である。","銅は、電気を通しやすい導体である。"], answer:3, explain:"この記述が誤りです。正しくは、アルミニウムは、電気を通しやすい金属である。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_4_3", subject:"motor", theme:4, q:"導体と絶縁体について、正しいものはどれか。", choices:["銅は、電線の絶縁被覆に使う代表的な絶縁体である。","絶縁物は、水分や汚れが付くほど絶縁性能が必ず高くなる。","乾燥したゴムは、金属と同じ程度に電気を通しやすい。","絶縁体の損傷は、作業速度を落とせば修理せずに使い続けられる。","ガラスは、通常の使用条件では絶縁体として扱われる。"], answer:4, explain:"この記述が正しい内容です。ガラスは、通常の使用条件では絶縁体として扱われる。<br><br>ほかの選択肢の確認：<br>・乾燥したゴムは、一般に電気を通しにくい。<br>・絶縁体の劣化や損傷を認めた機器は、適切に点検・修理して使用する。<br>・絶縁物でも、水分や汚れによって絶縁性能が低下することがある。<br>・銅は、電気を通しやすい導体である。"},
{license:"cargo_handling", id:"cargo_motor_4_4", subject:"motor", theme:4, q:"導体と絶縁体について、誤っているものはどれか。", choices:["電線の被覆の損傷は、漏電や感電の原因になる。","絶縁物でも、水分や汚れによって絶縁性能が低下することがある。","空気は通常は絶縁性を持つが、高い電圧で絶縁破壊することがある。","乾燥したゴムは、金属と同じ程度に電気を通しやすい。","ガラスは、通常の使用条件では絶縁体として扱われる。"], answer:3, explain:"この記述が誤りです。正しくは、乾燥したゴムは、一般に電気を通しにくい。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_4_5", subject:"motor", theme:4, q:"導体と絶縁体について、正しいものはどれか。", choices:["アルミニウムは、電気を全く通さない非金属である。","空気は通常は絶縁性を持つが、高い電圧で絶縁破壊することがある。","ガラスは、通常、銅より電気抵抗が小さい導体である。","電線の被覆が破れていても、金属芯が切れていなければ感電には関係しない。","銅は、電線の絶縁被覆に使う代表的な絶縁体である。"], answer:1, explain:"この記述が正しい内容です。空気は通常は絶縁性を持つが、高い電圧で絶縁破壊することがある。<br><br>ほかの選択肢の確認：<br>・電線の被覆の損傷は、漏電や感電の原因になる。<br>・アルミニウムは、電気を通しやすい金属である。<br>・ガラスは、通常の使用条件では絶縁体として扱われる。<br>・銅は、電気を通しやすい導体である。"},
{license:"cargo_handling", id:"cargo_motor_4_6", subject:"motor", theme:4, q:"導体と絶縁体について、誤っているものはどれか。", choices:["電線の被覆の損傷は、漏電や感電の原因になる。","ガラスは、通常の使用条件では絶縁体として扱われる。","絶縁体の劣化や損傷を認めた機器は、適切に点検・修理して使用する。","絶縁物は、水分や汚れが付くほど絶縁性能が必ず高くなる。","アルミニウムは、電気を通しやすい金属である。"], answer:3, explain:"この記述が誤りです。正しくは、絶縁物でも、水分や汚れによって絶縁性能が低下することがある。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_4_7", subject:"motor", theme:4, q:"導体と絶縁体について、正しいものはどれか。", choices:["ガラスは、通常、銅より電気抵抗が小さい導体である。","銅は、電線の絶縁被覆に使う代表的な絶縁体である。","絶縁体の損傷は、作業速度を落とせば修理せずに使い続けられる。","電線の被覆の損傷は、漏電や感電の原因になる。","空気は、どのような高電圧でも絶対に放電しない。"], answer:3, explain:"この記述が正しい内容です。電線の被覆の損傷は、漏電や感電の原因になる。<br><br>ほかの選択肢の確認：<br>・銅は、電気を通しやすい導体である。<br>・空気は通常は絶縁性を持つが、高い電圧で絶縁破壊することがある。<br>・絶縁体の劣化や損傷を認めた機器は、適切に点検・修理して使用する。<br>・ガラスは、通常の使用条件では絶縁体として扱われる。"},
{license:"cargo_handling", id:"cargo_motor_4_8", subject:"motor", theme:4, q:"導体と絶縁体について、誤っているものはどれか。", choices:["銅は、電気を通しやすい導体である。","絶縁体の損傷は、作業速度を落とせば修理せずに使い続けられる。","乾燥したゴムは、一般に電気を通しにくい。","ガラスは、通常の使用条件では絶縁体として扱われる。","電線の被覆の損傷は、漏電や感電の原因になる。"], answer:1, explain:"この記述が誤りです。正しくは、絶縁体の劣化や損傷を認めた機器は、適切に点検・修理して使用する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_5_1", subject:"motor", theme:5, q:"電気計器について、正しいものはどれか。", choices:["電圧の単位はオームで、記号はΩである。","絶縁抵抗計は、ウインチの巻上げ速度だけを測る計器である。","電流計は、測定する回路に直列に接続する。","電圧計は、交流・直流とも必ず負荷に直列に接続する。","テスタの抵抗測定は、対象回路に高電圧をかけたまま行うのが原則である。"], answer:2, explain:"この記述が正しい内容です。電流計は、測定する回路に直列に接続する。<br><br>ほかの選択肢の確認：<br>・電圧の単位はボルトで、記号はVである。<br>・テスタで抵抗を測るときは、原則として対象回路の電源を切って測定する。<br>・電圧計は、電圧を測る2点間に並列に接続する。<br>・絶縁抵抗計は、機器や配線の絶縁抵抗を測るために用いる。"},
{license:"cargo_handling", id:"cargo_motor_5_2", subject:"motor", theme:5, q:"電気計器について、誤っているものはどれか。", choices:["電圧計は、交流・直流とも必ず負荷に直列に接続する。","絶縁抵抗計は、機器や配線の絶縁抵抗を測るために用いる。","電圧の単位はボルトで、記号はVである。","電流の単位はアンペアで、記号はAである。","抵抗の単位はオームで、記号はΩである。"], answer:0, explain:"この記述が誤りです。正しくは、電圧計は、電圧を測る2点間に並列に接続する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_5_3", subject:"motor", theme:5, q:"電気計器について、正しいものはどれか。", choices:["電圧の単位はオームで、記号はΩである。","電気計器は、交流用と直流用や測定範囲を区別する必要がない。","抵抗の単位はワットで、記号はWである。","電流の単位はアンペアで、記号はAである。","絶縁抵抗計は、ウインチの巻上げ速度だけを測る計器である。"], answer:3, explain:"この記述が正しい内容です。電流の単位はアンペアで、記号はAである。<br><br>ほかの選択肢の確認：<br>・交流用・直流用など、測定対象に合う計器と測定範囲を選ぶ。<br>・電圧の単位はボルトで、記号はVである。<br>・絶縁抵抗計は、機器や配線の絶縁抵抗を測るために用いる。<br>・抵抗の単位はオームで、記号はΩである。"},
{license:"cargo_handling", id:"cargo_motor_5_4", subject:"motor", theme:5, q:"電気計器について、誤っているものはどれか。", choices:["テスタで抵抗を測るときは、原則として対象回路の電源を切って測定する。","電圧の単位はオームで、記号はΩである。","電圧計は、電圧を測る2点間に並列に接続する。","交流用・直流用など、測定対象に合う計器と測定範囲を選ぶ。","電流の単位はアンペアで、記号はAである。"], answer:1, explain:"この記述が誤りです。正しくは、電圧の単位はボルトで、記号はVである。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_5_5", subject:"motor", theme:5, q:"電気計器について、正しいものはどれか。", choices:["電流計は、測定する負荷と必ず並列に接続する。","電圧の単位はオームで、記号はΩである。","電圧計は、交流・直流とも必ず負荷に直列に接続する。","絶縁抵抗計は、ウインチの巻上げ速度だけを測る計器である。","抵抗の単位はオームで、記号はΩである。"], answer:4, explain:"この記述が正しい内容です。抵抗の単位はオームで、記号はΩである。<br><br>ほかの選択肢の確認：<br>・電流計は、測定する回路に直列に接続する。<br>・電圧の単位はボルトで、記号はVである。<br>・電圧計は、電圧を測る2点間に並列に接続する。<br>・絶縁抵抗計は、機器や配線の絶縁抵抗を測るために用いる。"},
{license:"cargo_handling", id:"cargo_motor_5_6", subject:"motor", theme:5, q:"電気計器について、誤っているものはどれか。", choices:["電流計は、測定する回路に直列に接続する。","絶縁抵抗計は、ウインチの巻上げ速度だけを測る計器である。","電圧計は、電圧を測る2点間に並列に接続する。","テスタで抵抗を測るときは、原則として対象回路の電源を切って測定する。","交流用・直流用など、測定対象に合う計器と測定範囲を選ぶ。"], answer:1, explain:"この記述が誤りです。正しくは、絶縁抵抗計は、機器や配線の絶縁抵抗を測るために用いる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_5_7", subject:"motor", theme:5, q:"電気計器について、正しいものはどれか。", choices:["テスタの抵抗測定は、対象回路に高電圧をかけたまま行うのが原則である。","交流用・直流用など、測定対象に合う計器と測定範囲を選ぶ。","絶縁抵抗計は、ウインチの巻上げ速度だけを測る計器である。","電流計は、測定する負荷と必ず並列に接続する。","電圧の単位はオームで、記号はΩである。"], answer:1, explain:"この記述が正しい内容です。交流用・直流用など、測定対象に合う計器と測定範囲を選ぶ。<br><br>ほかの選択肢の確認：<br>・電流計は、測定する回路に直列に接続する。<br>・絶縁抵抗計は、機器や配線の絶縁抵抗を測るために用いる。<br>・電圧の単位はボルトで、記号はVである。<br>・テスタで抵抗を測るときは、原則として対象回路の電源を切って測定する。"},
{license:"cargo_handling", id:"cargo_motor_5_8", subject:"motor", theme:5, q:"電気計器について、誤っているものはどれか。", choices:["電流の単位はアンペアで、記号はAである。","電流計は、測定する回路に直列に接続する。","テスタの抵抗測定は、対象回路に高電圧をかけたまま行うのが原則である。","交流用・直流用など、測定対象に合う計器と測定範囲を選ぶ。","抵抗の単位はオームで、記号はΩである。"], answer:2, explain:"この記述が誤りです。正しくは、テスタで抵抗を測るときは、原則として対象回路の電源を切って測定する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_6_1", subject:"motor", theme:6, q:"感電と接地について、正しいものはどれか。", choices:["感電の影響は、電流の大きさ、通電時間、経路などによって変わる。","電気によるやけどは、必ず皮膚表面だけにとどまる。","保護接地の導体は、できるだけ抵抗の大きい細い電線を選ぶ。","電気機器の金属カバーを接地すれば、充電部分を直接触っても感電しない。","漏電が疑われても、ゴム靴を履けば点検せずに使い続けてよい。"], answer:0, explain:"この記述が正しい内容です。感電の影響は、電流の大きさ、通電時間、経路などによって変わる。<br><br>ほかの選択肢の確認：<br>・絶縁の劣化や漏電が疑われる機器は、使用を止めて点検・修理する。<br>・電気機器の金属カバー等の接地は、漏電時の感電防止対策の一つである。<br>・電気によるやけどは、皮膚だけでなく身体内部にも及ぶことがある。<br>・保護接地の導体は、適切な太さと低い抵抗を確保する。"},
{license:"cargo_handling", id:"cargo_motor_6_2", subject:"motor", theme:6, q:"感電と接地について、誤っているものはどれか。", choices:["保護接地の導体は、適切な太さと低い抵抗を確保する。","絶縁の劣化や漏電が疑われる機器は、使用を止めて点検・修理する。","漏電遮断器は漏電を検出して回路を遮断するために用いる。","皮膚が濡れると、一般に電気抵抗が大きくなり、必ず感電しにくくなる。","電気によるやけどは、皮膚だけでなく身体内部にも及ぶことがある。"], answer:3, explain:"この記述が誤りです。正しくは、皮膚が濡れると、一般に電気抵抗が小さくなり、感電の危険が増す。<br>ほかの4つの記述は正しい内容です。"},

{license:"cargo_handling", id:"cargo_motor_7_1", subject:"motor", theme:7, q:"油圧駆動モータについて、正しいものはどれか。", choices:["油圧モータは、一般に小型軽量にできず、遠隔操作も不可能である。","油圧装置には、潤滑を良くするため金属粉を混ぜた作動油を使う。","ラジアル形プランジャモータでは、プランジャが回転軸と同一方向にだけ配列される。","油圧モータは、ポンプがなくても作動油を入れるだけで回転し続ける。","油圧モータは、圧油のエネルギーを回転運動に変える。"], answer:4, explain:"この記述が正しい内容です。油圧モータは、圧油のエネルギーを回転運動に変える。<br><br>ほかの選択肢の確認：<br>・ラジアル形プランジャモータでは、プランジャが回転軸に対して放射状に配列される。<br>・油圧モータへ圧油を送るには、油圧ポンプとその駆動用原動機が必要である。<br>・油圧モータは、一般に同等出力の電動機に比べて小型軽量にしやすい。<br>・作動油に異物や空気が混入すると、油圧装置の不調や損傷につながることがある。"},
{license:"cargo_handling", id:"cargo_motor_7_2", subject:"motor", theme:7, q:"油圧駆動モータについて、誤っているものはどれか。", choices:["油圧モータは、ポンプがなくても作動油を入れるだけで回転し続ける。","油圧モータの効率や動作は、作動油の温度や粘度の影響を受ける。","油圧モータは、圧油のエネルギーを回転運動に変える。","ラジアル形プランジャモータでは、プランジャが回転軸に対して放射状に配列される。","ベーンモータは、ベーンとカムリング等で囲む油室に圧油を送り、ロータを回す。"], answer:0, explain:"この記述が誤りです。正しくは、油圧モータへ圧油を送るには、油圧ポンプとその駆動用原動機が必要である。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_7_3", subject:"motor", theme:7, q:"油圧駆動モータについて、正しいものはどれか。", choices:["油圧モータは、一般に同等出力の電動機に比べて小型軽量にしやすい。","油圧モータは、ポンプがなくても作動油を入れるだけで回転し続ける。","ベーンモータは、点火プラグの火花でベーンを押し出して回す。","油圧装置には、潤滑を良くするため金属粉を混ぜた作動油を使う。","油圧モータは、作動油の温度変化に全く影響を受けない。"], answer:0, explain:"この記述が正しい内容です。油圧モータは、一般に同等出力の電動機に比べて小型軽量にしやすい。<br><br>ほかの選択肢の確認：<br>・油圧モータの効率や動作は、作動油の温度や粘度の影響を受ける。<br>・ベーンモータは、ベーンとカムリング等で囲む油室に圧油を送り、ロータを回す。<br>・作動油に異物や空気が混入すると、油圧装置の不調や損傷につながることがある。<br>・油圧モータへ圧油を送るには、油圧ポンプとその駆動用原動機が必要である。"},

{license:"cargo_handling", id:"cargo_motor_7_8", subject:"motor", theme:7, q:"油圧駆動モータについて、誤っているものはどれか。", choices:["アキシャル形プランジャモータでは、プランジャが回転軸に沿う方向に配列される。","油圧装置には、潤滑を良くするため金属粉を混ぜた作動油を使う。","油圧モータの効率や動作は、作動油の温度や粘度の影響を受ける。","ラジアル形プランジャモータでは、プランジャが回転軸に対して放射状に配列される。","油圧モータは、一般に同等出力の電動機に比べて小型軽量にしやすい。"], answer:1, explain:"この記述が誤りです。正しくは、作動油に異物や空気が混入すると、油圧装置の不調や損傷につながることがある。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_8_1", subject:"motor", theme:8, q:"電動機の構造について、正しいものはどれか。", choices:["誘導電動機は、固定子の回転磁界によって回転子に電流が誘導されて回る。","巻線形誘導電動機では、回転子側へ外部抵抗を接続できない。","かご形誘導電動機には、燃料噴射ノズルとピストンが必ずある。","誘導電動機の回転子は、通常の電動運転で必ず同期速度より速く回転する。","電動機は、過負荷にするほど発熱が減り、絶縁寿命が長くなる。"], answer:0, explain:"この記述が正しい内容です。誘導電動機は、固定子の回転磁界によって回転子に電流が誘導されて回る。<br><br>ほかの選択肢の確認：<br>・かご形誘導電動機の回転子には、導体棒と短絡環を用いる。<br>・巻線形誘導電動機の回転子巻線は、スリップリング等を介して外部抵抗へ接続できる。<br>・誘導電動機の回転子は、通常の電動運転では同期速度より遅く回転する。<br>・電動機の過負荷は、過熱や絶縁劣化の原因になる。"},
{license:"cargo_handling", id:"cargo_motor_8_2", subject:"motor", theme:8, q:"電動機の構造について、誤っているものはどれか。", choices:["三相誘導電動機では、回転子側を一次側、固定子側を二次側と呼ぶ。","誘導電動機は、固定子の回転磁界によって回転子に電流が誘導されて回る。","三相誘導電動機は、電源の3本のうち2本の接続を入れ換えると回転方向が変わる。","巻線形誘導電動機の回転子巻線は、スリップリング等を介して外部抵抗へ接続できる。","同期速度は、電源周波数に比例し、極数に反比例する。"], answer:0, explain:"この記述が誤りです。正しくは、三相誘導電動機では、固定子側を一次側、回転子側を二次側と呼ぶ。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_8_3", subject:"motor", theme:8, q:"電動機の構造について、正しいものはどれか。", choices:["誘導電動機の回転子は、通常の電動運転で必ず同期速度より速く回転する。","誘導電動機は、燃料をシリンダ内で燃焼させて回る。","かご形誘導電動機の回転子には、導体棒と短絡環を用いる。","三相誘導電動機では、回転子側を一次側、固定子側を二次側と呼ぶ。","三相誘導電動機は、どのように電源相を入れ換えても回転方向が変わらない。"], answer:2, explain:"この記述が正しい内容です。かご形誘導電動機の回転子には、導体棒と短絡環を用いる。<br><br>ほかの選択肢の確認：<br>・誘導電動機は、固定子の回転磁界によって回転子に電流が誘導されて回る。<br>・三相誘導電動機では、固定子側を一次側、回転子側を二次側と呼ぶ。<br>・誘導電動機の回転子は、通常の電動運転では同期速度より遅く回転する。<br>・三相誘導電動機は、電源の3本のうち2本の接続を入れ換えると回転方向が変わる。"},
{license:"cargo_handling", id:"cargo_motor_8_4", subject:"motor", theme:8, q:"電動機の構造について、誤っているものはどれか。", choices:["三相誘導電動機は、電源の3本のうち2本の接続を入れ換えると回転方向が変わる。","同期速度は、電源周波数に比例し、極数に反比例する。","巻線形誘導電動機では、回転子側へ外部抵抗を接続できない。","誘導電動機の回転子は、通常の電動運転では同期速度より遅く回転する。","三相誘導電動機では、固定子側を一次側、回転子側を二次側と呼ぶ。"], answer:2, explain:"この記述が誤りです。正しくは、巻線形誘導電動機の回転子巻線は、スリップリング等を介して外部抵抗へ接続できる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_8_5", subject:"motor", theme:8, q:"電動機の構造について、正しいものはどれか。", choices:["かご形誘導電動機には、燃料噴射ノズルとピストンが必ずある。","誘導電動機の回転子は、通常の電動運転では同期速度より遅く回転する。","三相誘導電動機は、どのように電源相を入れ換えても回転方向が変わらない。","誘導電動機は、燃料をシリンダ内で燃焼させて回る。","同期速度は、電源周波数に反比例し、極数に比例する。"], answer:1, explain:"この記述が正しい内容です。誘導電動機の回転子は、通常の電動運転では同期速度より遅く回転する。<br><br>ほかの選択肢の確認：<br>・同期速度は、電源周波数に比例し、極数に反比例する。<br>・誘導電動機は、固定子の回転磁界によって回転子に電流が誘導されて回る。<br>・かご形誘導電動機の回転子には、導体棒と短絡環を用いる。<br>・三相誘導電動機は、電源の3本のうち2本の接続を入れ換えると回転方向が変わる。"},
{license:"cargo_handling", id:"cargo_motor_8_6", subject:"motor", theme:8, q:"電動機の構造について、誤っているものはどれか。", choices:["巻線形誘導電動機の回転子巻線は、スリップリング等を介して外部抵抗へ接続できる。","同期速度は、電源周波数に反比例し、極数に比例する。","誘導電動機の回転子は、通常の電動運転では同期速度より遅く回転する。","電動機の過負荷は、過熱や絶縁劣化の原因になる。","三相誘導電動機は、電源の3本のうち2本の接続を入れ換えると回転方向が変わる。"], answer:1, explain:"この記述が誤りです。正しくは、同期速度は、電源周波数に比例し、極数に反比例する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_8_7", subject:"motor", theme:8, q:"電動機の構造について、正しいものはどれか。", choices:["誘導電動機の回転子は、通常の電動運転で必ず同期速度より速く回転する。","三相誘導電動機は、電源の3本のうち2本の接続を入れ換えると回転方向が変わる。","誘導電動機は、燃料をシリンダ内で燃焼させて回る。","かご形誘導電動機には、燃料噴射ノズルとピストンが必ずある。","同期速度は、電源周波数に反比例し、極数に比例する。"], answer:1, explain:"この記述が正しい内容です。三相誘導電動機は、電源の3本のうち2本の接続を入れ換えると回転方向が変わる。<br><br>ほかの選択肢の確認：<br>・誘導電動機の回転子は、通常の電動運転では同期速度より遅く回転する。<br>・かご形誘導電動機の回転子には、導体棒と短絡環を用いる。<br>・誘導電動機は、固定子の回転磁界によって回転子に電流が誘導されて回る。<br>・同期速度は、電源周波数に比例し、極数に反比例する。"},
{license:"cargo_handling", id:"cargo_motor_8_8", subject:"motor", theme:8, q:"電動機の構造について、誤っているものはどれか。", choices:["かご形誘導電動機の回転子には、導体棒と短絡環を用いる。","誘導電動機は、固定子の回転磁界によって回転子に電流が誘導されて回る。","誘導電動機の回転子は、通常の電動運転では同期速度より遅く回転する。","電動機は、過負荷にするほど発熱が減り、絶縁寿命が長くなる。","三相誘導電動機は、電源の3本のうち2本の接続を入れ換えると回転方向が変わる。"], answer:3, explain:"この記述が誤りです。正しくは、電動機の過負荷は、過熱や絶縁劣化の原因になる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_9_1", subject:"motor", theme:9, q:"制御器と保護装置について、正しいものはどれか。", choices:["サーマルリレーは、荷の質量をフックの形だけから測る装置である。","直接制御器は、電動機の主回路を制御器で直接開閉する方式である。","ヒューズは、過大な電流ほど抵抗がゼロになり、流し続けるための部品である。","間接制御器は、主回路の大電流を必ず操作レバー内に直接流す方式である。","間接制御器は、ウインチの直上にしか操作部を配置できない。"], answer:1, explain:"この記述が正しい内容です。直接制御器は、電動機の主回路を制御器で直接開閉する方式である。<br><br>ほかの選択肢の確認：<br>・サーマルリレーは、過電流による発熱を利用し、過負荷から電動機を保護する。<br>・ヒューズは、過大な電流が流れると溶断して回路を保護する。<br>・間接制御器は、主幹制御器の操作によって電磁接触器等を働かせる。<br>・間接制御器は、主幹制御器を荷が見やすい離れた位置へ配置できる。"},
{license:"cargo_handling", id:"cargo_motor_9_2", subject:"motor", theme:9, q:"制御器と保護装置について、誤っているものはどれか。", choices:["間接制御器は、主回路の大電流を必ず操作レバー内に直接流す方式である。","電磁接触器は、電磁石の働きで接点を開閉する。","サーマルリレーは、過電流による発熱を利用し、過負荷から電動機を保護する。","一般に、直接制御器は間接方式の主幹制御器より大きな電流を扱う。","間接制御器は、主幹制御器を荷が見やすい離れた位置へ配置できる。"], answer:0, explain:"この記述が誤りです。正しくは、間接制御器は、主幹制御器の操作によって電磁接触器等を働かせる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_9_3", subject:"motor", theme:9, q:"制御器と保護装置について、正しいものはどれか。", choices:["電磁接触器は、作動油をろ過して電流を止める。","直接制御器は、微小な信号だけを送り、主回路を必ず別の接触器で開閉する方式である。","サーマルリレーは、荷の質量をフックの形だけから測る装置である。","間接制御器は、主幹制御器を荷が見やすい離れた位置へ配置できる。","一般に、直接制御器は間接方式の主幹制御器より必ず小さな電流しか扱わない。"], answer:3, explain:"この記述が正しい内容です。間接制御器は、主幹制御器を荷が見やすい離れた位置へ配置できる。<br><br>ほかの選択肢の確認：<br>・直接制御器は、電動機の主回路を制御器で直接開閉する方式である。<br>・一般に、直接制御器は間接方式の主幹制御器より大きな電流を扱う。<br>・サーマルリレーは、過電流による発熱を利用し、過負荷から電動機を保護する。<br>・電磁接触器は、電磁石の働きで接点を開閉する。"},
{license:"cargo_handling", id:"cargo_motor_9_4", subject:"motor", theme:9, q:"制御器と保護装置について、誤っているものはどれか。", choices:["サーマルリレーは、過電流による発熱を利用し、過負荷から電動機を保護する。","直接制御器は、電動機の主回路を制御器で直接開閉する方式である。","間接制御器は、主幹制御器の操作によって電磁接触器等を働かせる。","一般に、直接制御器は間接方式の主幹制御器より必ず小さな電流しか扱わない。","インバータは、周波数などを変えて交流電動機の速度制御に用いられる。"], answer:3, explain:"この記述が誤りです。正しくは、一般に、直接制御器は間接方式の主幹制御器より大きな電流を扱う。<br>ほかの4つの記述は正しい内容です。"},

{license:"cargo_handling", id:"cargo_motor_10_1", subject:"motor", theme:10, q:"ディーゼルエンジンの基礎について、正しいものはどれか。", choices:["ディーゼルエンジンは、一般にガソリンエンジンより圧縮比が低い。","ディーゼルエンジンは、低温になるほど燃料が自己着火しやすくなる。","ディーゼルエンジンには、一般に点火用のガソリンだけが用いられる。","ディーゼルエンジンは、圧縮して高温になった空気中に燃料を噴射し、自己着火させる。","ディーゼルエンジンは、一般にガソリンエンジンより熱効率が低い。"], answer:3, explain:"この記述が正しい内容です。ディーゼルエンジンは、圧縮して高温になった空気中に燃料を噴射し、自己着火させる。<br><br>ほかの選択肢の確認：<br>・ディーゼルエンジンは、一般にガソリンエンジンより圧縮比が高い。<br>・ディーゼルエンジンには、一般に軽油が用いられる。<br>・ディーゼルエンジンは、一般にガソリンエンジンより熱効率が高い。<br>・ディーゼルエンジンは、一般にガソリンエンジンより低温時の始動性が劣る。"},

{license:"cargo_handling", id:"cargo_motor_10_3", subject:"motor", theme:10, q:"ディーゼルエンジンの基礎について、正しいものはどれか。", choices:["ディーゼルエンジンは、一般にガソリンエンジンより熱効率が低い。","ディーゼルエンジンは、点火プラグの火花で毎回燃料に点火する。","2サイクルエンジンは、ピストンの4行程で1循環を行う。","4サイクルエンジンは、吸入・圧縮・燃焼膨張・排気の4行程で1循環を行う。","4サイクルエンジンは、1循環の間にクランク軸が1回転する。"], answer:3, explain:"この記述が正しい内容です。4サイクルエンジンは、吸入・圧縮・燃焼膨張・排気の4行程で1循環を行う。<br><br>ほかの選択肢の確認：<br>・4サイクルエンジンは、1循環の間にクランク軸が2回転する。<br>・ディーゼルエンジンは、一般にガソリンエンジンより熱効率が高い。<br>・2サイクルエンジンは、ピストンの2行程で1循環を行う。<br>・ディーゼルエンジンは、圧縮して高温になった空気中に燃料を噴射し、自己着火させる。"},

{license:"cargo_handling", id:"cargo_motor_10_5", subject:"motor", theme:10, q:"ディーゼルエンジンの基礎について、正しいものはどれか。", choices:["ディーゼルエンジンには、一般に点火用のガソリンだけが用いられる。","ディーゼルエンジンは、点火プラグの火花で毎回燃料に点火する。","2サイクルエンジンは、ピストンの2行程で1循環を行う。","4サイクルエンジンは、吸入と排気の2行程だけで1循環を行う。","ディーゼルエンジンは、一般にガソリンエンジンより熱効率が低い。"], answer:2, explain:"この記述が正しい内容です。2サイクルエンジンは、ピストンの2行程で1循環を行う。<br><br>ほかの選択肢の確認：<br>・ディーゼルエンジンは、圧縮して高温になった空気中に燃料を噴射し、自己着火させる。<br>・ディーゼルエンジンは、一般にガソリンエンジンより熱効率が高い。<br>・4サイクルエンジンは、吸入・圧縮・燃焼膨張・排気の4行程で1循環を行う。<br>・ディーゼルエンジンには、一般に軽油が用いられる。"},
{license:"cargo_handling", id:"cargo_motor_10_6", subject:"motor", theme:10, q:"ディーゼルエンジンの基礎について、誤っているものはどれか。", choices:["ディーゼルエンジンは、圧縮して高温になった空気中に燃料を噴射し、自己着火させる。","ディーゼルエンジンは、一般にガソリンエンジンより低温時の始動性が劣る。","ディーゼルエンジンは、一般にガソリンエンジンより圧縮比が低い。","2サイクルエンジンは、ピストンの2行程で1循環を行う。","ディーゼルエンジンは、一般にガソリンエンジンより熱効率が高い。"], answer:2, explain:"この記述が誤りです。正しくは、ディーゼルエンジンは、一般にガソリンエンジンより圧縮比が高い。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_motor_10_7", subject:"motor", theme:10, q:"ディーゼルエンジンの基礎について、正しいものはどれか。", choices:["ディーゼルエンジンは、一般にガソリンエンジンより低温時の始動性が劣る。","ディーゼルエンジンは、点火プラグの火花で毎回燃料に点火する。","ディーゼルエンジンは、一般にガソリンエンジンより圧縮比が低い。","ディーゼルエンジンには、一般に点火用のガソリンだけが用いられる。","2サイクルエンジンは、ピストンの4行程で1循環を行う。"], answer:0, explain:"この記述が正しい内容です。ディーゼルエンジンは、一般にガソリンエンジンより低温時の始動性が劣る。<br><br>ほかの選択肢の確認：<br>・ディーゼルエンジンには、一般に軽油が用いられる。<br>・ディーゼルエンジンは、圧縮して高温になった空気中に燃料を噴射し、自己着火させる。<br>・ディーゼルエンジンは、一般にガソリンエンジンより圧縮比が高い。<br>・2サイクルエンジンは、ピストンの2行程で1循環を行う。"},
{license:"cargo_handling", id:"cargo_motor_10_8", subject:"motor", theme:10, q:"ディーゼルエンジンの基礎について、誤っているものはどれか。", choices:["ディーゼルエンジンは、一般にガソリンエンジンより熱効率が高い。","ディーゼルエンジンには、一般に点火用のガソリンだけが用いられる。","ディーゼルエンジンは、圧縮して高温になった空気中に燃料を噴射し、自己着火させる。","ディーゼルエンジンは、一般にガソリンエンジンより低温時の始動性が劣る。","2サイクルエンジンは、ピストンの2行程で1循環を行う。"], answer:1, explain:"この記述が誤りです。正しくは、ディーゼルエンジンには、一般に軽油が用いられる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_1_1", subject:"mechanics", theme:1, q:"力の基礎について、正しいものはどれか。", choices:["一点に働く二力の合力は、常に二力の大きさの単純な和になる。","同一直線上で同じ向きの二力の合力は、必ずゼロになる。","同一直線上で反対向きの二力の合力は、常に大きさの積になる。","偶力は、同じ作用線上で同じ向きに働く二力である。","力の三要素は、大きさ、方向、作用点である。"], answer:4, explain:"この記述が正しい内容です。力の三要素は、大きさ、方向、作用点である。<br><br>ほかの選択肢の確認：<br>・同一直線上で同じ向きの二力の合力は、二力の大きさの和になる。<br>・同一直線上で反対向きの二力の合力は、大きさの差で求められる。<br>・偶力は、大きさが等しく逆向きで、作用線が異なる平行な二力である。<br>・一点に働く二力の合力は、平行四辺形の対角線で表せる。"},
{license:"cargo_handling", id:"cargo_mechanics_1_2", subject:"mechanics", theme:1, q:"力の基礎について、誤っているものはどれか。", choices:["剛体に働く力は、作用線上で作用点を移しても外部に対する作用は変わらない。","一点に働く二力の合力は、平行四辺形の対角線で表せる。","力の三要素は、大きさ、方向、作用点である。","同一直線上で反対向きの二力の合力は、大きさの差で求められる。","同一直線上で同じ向きの二力の合力は、必ずゼロになる。"], answer:4, explain:"この記述が誤りです。正しくは、同一直線上で同じ向きの二力の合力は、二力の大きさの和になる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_1_3", subject:"mechanics", theme:1, q:"力の基礎について、正しいものはどれか。", choices:["一点に働く二力の合力は、常に二力の大きさの単純な和になる。","力の単位はN・mで、力のモーメントの単位はNである。","同一直線上で反対向きの二力の合力は、大きさの差で求められる。","力の三要素は、質量、体積、密度である。","剛体に働く力は、作用線から離れたどの位置に移しても作用が変わらない。"], answer:2, explain:"この記述が正しい内容です。同一直線上で反対向きの二力の合力は、大きさの差で求められる。<br><br>ほかの選択肢の確認：<br>・剛体に働く力は、作用線上で作用点を移しても外部に対する作用は変わらない。<br>・力の単位Nと、力のモーメントの単位N・mは区別する。<br>・力の三要素は、大きさ、方向、作用点である。<br>・一点に働く二力の合力は、平行四辺形の対角線で表せる。"},
{license:"cargo_handling", id:"cargo_mechanics_1_4", subject:"mechanics", theme:1, q:"力の基礎について、誤っているものはどれか。", choices:["力の三要素は、大きさ、方向、作用点である。","偶力は、大きさが等しく逆向きで、作用線が異なる平行な二力である。","剛体に働く力は、作用線上で作用点を移しても外部に対する作用は変わらない。","力の単位Nと、力のモーメントの単位N・mは区別する。","一点に働く二力の合力は、常に二力の大きさの単純な和になる。"], answer:4, explain:"この記述が誤りです。正しくは、一点に働く二力の合力は、平行四辺形の対角線で表せる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_1_5", subject:"mechanics", theme:1, q:"力の基礎について、正しいものはどれか。", choices:["力の三要素は、質量、体積、密度である。","一点に働く二力の合力は、常に二力の大きさの単純な和になる。","同一直線上で反対向きの二力の合力は、常に大きさの積になる。","偶力は、同じ作用線上で同じ向きに働く二力である。","剛体に働く力は、作用線上で作用点を移しても外部に対する作用は変わらない。"], answer:4, explain:"この記述が正しい内容です。剛体に働く力は、作用線上で作用点を移しても外部に対する作用は変わらない。<br><br>ほかの選択肢の確認：<br>・一点に働く二力の合力は、平行四辺形の対角線で表せる。<br>・力の三要素は、大きさ、方向、作用点である。<br>・偶力は、大きさが等しく逆向きで、作用線が異なる平行な二力である。<br>・同一直線上で反対向きの二力の合力は、大きさの差で求められる。"},
{license:"cargo_handling", id:"cargo_mechanics_1_6", subject:"mechanics", theme:1, q:"力の基礎について、誤っているものはどれか。", choices:["力のモーメントは、力を支点からの垂直距離で割った値である。","力の単位Nと、力のモーメントの単位N・mは区別する。","同一直線上で反対向きの二力の合力は、大きさの差で求められる。","力の三要素は、大きさ、方向、作用点である。","剛体に働く力は、作用線上で作用点を移しても外部に対する作用は変わらない。"], answer:0, explain:"この記述が誤りです。正しくは、力のモーメントは、力と、支点から作用線までの垂直距離との積である。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_1_7", subject:"mechanics", theme:1, q:"力の基礎について、正しいものはどれか。", choices:["同一直線上で同じ向きの二力の合力は、必ずゼロになる。","力のモーメントは、力を支点からの垂直距離で割った値である。","剛体に働く力は、作用線から離れたどの位置に移しても作用が変わらない。","偶力は、大きさが等しく逆向きで、作用線が異なる平行な二力である。","力の三要素は、質量、体積、密度である。"], answer:3, explain:"この記述が正しい内容です。偶力は、大きさが等しく逆向きで、作用線が異なる平行な二力である。<br><br>ほかの選択肢の確認：<br>・剛体に働く力は、作用線上で作用点を移しても外部に対する作用は変わらない。<br>・同一直線上で同じ向きの二力の合力は、二力の大きさの和になる。<br>・力のモーメントは、力と、支点から作用線までの垂直距離との積である。<br>・力の三要素は、大きさ、方向、作用点である。"},
{license:"cargo_handling", id:"cargo_mechanics_1_8", subject:"mechanics", theme:1, q:"力の基礎について、誤っているものはどれか。", choices:["一点に働く二力の合力は、平行四辺形の対角線で表せる。","同一直線上で同じ向きの二力の合力は、二力の大きさの和になる。","偶力は、大きさが等しく逆向きで、作用線が異なる平行な二力である。","力の単位はN・mで、力のモーメントの単位はNである。","力のモーメントは、力と、支点から作用線までの垂直距離との積である。"], answer:3, explain:"この記述が誤りです。正しくは、力の単位Nと、力のモーメントの単位N・mは区別する。<br>ほかの4つの記述は正しい内容です。"},

{license:"cargo_handling", id:"cargo_mechanics_2_7", subject:"mechanics", theme:2, q:"質量を無視できる水平な棒がつり合っている。支点の左3mに下向き400N、右5mに下向きFを加える。Fは何Nか。<div class=\"diagram-box\"><svg viewBox=\"0 0 560 200\" role=\"img\" aria-label=\"支点の左右に下向きの力が作用するてこ（長さは模式表示）\" style=\"width:100%;max-width:560px;height:auto;background:#fff;color:#17263b\"><g font-family=\"sans-serif\" font-size=\"16\" fill=\"#17263b\" stroke-width=\"2\"><path d=\"M55 90 H505\" stroke=\"#263850\" stroke-width=\"6\"/><path d=\"M280 92 L257 127 H303 Z\" fill=\"#93c5fd\" stroke=\"#263850\"/><path d=\"M80 92 V150 M480 92 V150\" stroke=\"#263850\"/><text x=\"43\" y=\"179\">↓400N</text><text x=\"452\" y=\"179\">↓F</text><text x=\"140\" y=\"60\">3m</text><text x=\"370\" y=\"60\">5m</text><text x=\"258\" y=\"155\">支点</text></g></svg></div>", choices:["480 N","360 N","120 N","240 N","720 N"], answer:3, explain:"支点まわりのモーメントがつり合うので、400×3＝F×5。したがってF＝400×3÷5＝240N。"},
{license:"cargo_handling", id:"cargo_mechanics_2_8", subject:"mechanics", theme:2, q:"質量を無視できる水平な棒がつり合っている。支点の左4mに下向き250N、右5mに下向きFを加える。Fは何Nか。<div class=\"diagram-box\"><svg viewBox=\"0 0 560 200\" role=\"img\" aria-label=\"支点の左右に下向きの力が作用するてこ（長さは模式表示）\" style=\"width:100%;max-width:560px;height:auto;background:#fff;color:#17263b\"><g font-family=\"sans-serif\" font-size=\"16\" fill=\"#17263b\" stroke-width=\"2\"><path d=\"M55 90 H505\" stroke=\"#263850\" stroke-width=\"6\"/><path d=\"M280 92 L257 127 H303 Z\" fill=\"#93c5fd\" stroke=\"#263850\"/><path d=\"M80 92 V150 M480 92 V150\" stroke=\"#263850\"/><text x=\"43\" y=\"179\">↓250N</text><text x=\"452\" y=\"179\">↓F</text><text x=\"140\" y=\"60\">4m</text><text x=\"370\" y=\"60\">5m</text><text x=\"258\" y=\"155\">支点</text></g></svg></div>", choices:["100 N","600 N","400 N","200 N","300 N"], answer:3, explain:"支点まわりのモーメントがつり合うので、250×4＝F×5。したがってF＝250×4÷5＝200N。"},
{license:"cargo_handling", id:"cargo_mechanics_3_1", subject:"mechanics", theme:3, q:"質量・比重・体積について、正しいものはどれか。", choices:["質量mの物体に働く重力の大きさは、mをgで割った値である。","比重の単位は、必ずkgである。","水の密度を1t/m³とすると、比重7.8の鋼の密度は0.78t/m³である。","均質な材料では、体積が2倍になれば質量は半分になる。","質量は、密度と体積の積で求める。"], answer:4, explain:"この記述が正しい内容です。質量は、密度と体積の積で求める。<br><br>ほかの選択肢の確認：<br>・比重は基準物質の密度に対する比なので、単位を持たない。<br>・質量mの物体に働く重力の大きさは、重力加速度をgとしてmgである。<br>・均質な材料では、体積が2倍になれば質量も2倍になる。<br>・水の密度を1t/m³とすると、比重7.8の鋼の密度は7.8t/m³である。"},
{license:"cargo_handling", id:"cargo_mechanics_3_2", subject:"mechanics", theme:3, q:"質量・比重・体積について、誤っているものはどれか。", choices:["直方体の体積は、縦、横、高さを掛けて求める。","水の密度を1t/m³とすると、比重7.8の鋼の密度は7.8t/m³である。","円柱の体積は、底面積に高さを掛けて求める。","比重の単位は、必ずkgである。","質量mの物体に働く重力の大きさは、重力加速度をgとしてmgである。"], answer:3, explain:"この記述が誤りです。正しくは、比重は基準物質の密度に対する比なので、単位を持たない。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_3_3", subject:"mechanics", theme:3, q:"質量・比重・体積について、正しいものはどれか。", choices:["水の密度を1t/m³とすると、比重7.8の鋼の密度は7.8t/m³である。","比重の単位は、必ずkgである。","直方体の体積は、縦、横、高さを足して求める。","均質な材料では、体積が2倍になれば質量は半分になる。","円柱の体積は、底面の円周に高さを掛けて求める。"], answer:0, explain:"この記述が正しい内容です。水の密度を1t/m³とすると、比重7.8の鋼の密度は7.8t/m³である。<br><br>ほかの選択肢の確認：<br>・円柱の体積は、底面積に高さを掛けて求める。<br>・比重は基準物質の密度に対する比なので、単位を持たない。<br>・均質な材料では、体積が2倍になれば質量も2倍になる。<br>・直方体の体積は、縦、横、高さを掛けて求める。"},
{license:"cargo_handling", id:"cargo_mechanics_3_4", subject:"mechanics", theme:3, q:"質量・比重・体積について、誤っているものはどれか。", choices:["直方体の体積は、縦、横、高さを足して求める。","1m³は、100万cm³に等しい。","水の密度を1t/m³とすると、比重7.8の鋼の密度は7.8t/m³である。","比重は基準物質の密度に対する比なので、単位を持たない。","円柱の体積は、底面積に高さを掛けて求める。"], answer:0, explain:"この記述が誤りです。正しくは、直方体の体積は、縦、横、高さを掛けて求める。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_3_5", subject:"mechanics", theme:3, q:"縦2m、横1m、高さ0.1mの中実の直方体がある。均質な材料で、密度は7.8t/m³である。質量は何tか。", choices:["4.68 t","0.78 t","2.34 t","3.12 t","1.56 t"], answer:4, explain:"体積＝2×1×0.1＝0.2m³。質量＝密度×体積＝7.8×0.2＝1.56t。寸法の単位をmにそろえて計算します。"},
{license:"cargo_handling", id:"cargo_mechanics_3_6", subject:"mechanics", theme:3, q:"縦1m、横0.5m、高さ0.2mの中実の直方体がある。均質な材料で、密度は7.8t/m³である。質量は何tか。", choices:["0.39 t","1.56 t","2.34 t","0.78 t","1.17 t"], answer:3, explain:"体積＝1×0.5×0.2＝0.1m³。質量＝密度×体積＝7.8×0.1＝0.78t。寸法の単位をmにそろえて計算します。"},
{license:"cargo_handling", id:"cargo_mechanics_3_7", subject:"mechanics", theme:3, q:"縦2m、横1m、高さ0.5mの中実の直方体がある。均質な材料で、密度は2.4t/m³である。質量は何tか。", choices:["3.6 t","4.8 t","2.4 t","7.2 t","1.2 t"], answer:2, explain:"体積＝2×1×0.5＝1m³。質量＝密度×体積＝2.4×1＝2.4t。寸法の単位をmにそろえて計算します。"},
{license:"cargo_handling", id:"cargo_mechanics_3_8", subject:"mechanics", theme:3, q:"縦3m、横1m、高さ0.2mの中実の直方体がある。均質な材料で、密度は0.8t/m³である。質量は何tか。", choices:["0.48 t","1.44 t","0.96 t","0.72 t","0.24 t"], answer:0, explain:"体積＝3×1×0.2＝0.6m³。質量＝密度×体積＝0.8×0.6＝0.48t。寸法の単位をmにそろえて計算します。"},
{license:"cargo_handling", id:"cargo_mechanics_4_1", subject:"mechanics", theme:4, q:"重心と安定について、正しいものはどれか。", choices:["同じ重心高さなら、支持面が狭い方が一般に安定する。","物体の重心からの鉛直線が支持面の外へ出るほど安定する。","均質で左右対称な物体の重心は、その対称面上にある。","同じ支持面なら、重心が高い方が一般に転倒に対して安定する。","複数の物体の合成重心は、それぞれの質量を無視して位置だけで決まる。"], answer:2, explain:"この記述が正しい内容です。均質で左右対称な物体の重心は、その対称面上にある。<br><br>ほかの選択肢の確認：<br>・複数の物体の合成重心は、それぞれの質量と位置から求められる。<br>・物体の重心からの鉛直線が支持面の外へ出ると、転倒しやすくなる。<br>・同じ重心高さなら、支持面が広い方が一般に安定する。<br>・同じ支持面なら、重心が低い方が一般に転倒に対して安定する。"},
{license:"cargo_handling", id:"cargo_mechanics_4_2", subject:"mechanics", theme:4, q:"重心と安定について、誤っているものはどれか。", choices:["複数の物体の合成重心は、それぞれの質量と位置から求められる。","地切り時には、荷の傾きや玉掛けの状態を確認する。","均質な円環では、重心が材料の存在しない中心部に位置することがある。","物体の重心からの鉛直線が支持面の外へ出るほど安定する。","同じ支持面なら、重心が低い方が一般に転倒に対して安定する。"], answer:3, explain:"この記述が誤りです。正しくは、物体の重心からの鉛直線が支持面の外へ出ると、転倒しやすくなる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_4_3", subject:"mechanics", theme:4, q:"重心と安定について、正しいものはどれか。", choices:["荷を安定してつるには、フックを荷の重心からできるだけ横にずらす。","複数の物体の合成重心は、それぞれの質量を無視して位置だけで決まる。","同じ重心高さなら、支持面が狭い方が一般に安定する。","同じ支持面なら、重心が低い方が一般に転倒に対して安定する。","均質で左右対称な物体の重心は、必ず物体の最下点にある。"], answer:3, explain:"この記述が正しい内容です。同じ支持面なら、重心が低い方が一般に転倒に対して安定する。<br><br>ほかの選択肢の確認：<br>・荷を安定してつるには、フックを荷の重心の真上に合わせる。<br>・同じ重心高さなら、支持面が広い方が一般に安定する。<br>・複数の物体の合成重心は、それぞれの質量と位置から求められる。<br>・均質で左右対称な物体の重心は、その対称面上にある。"},
{license:"cargo_handling", id:"cargo_mechanics_4_4", subject:"mechanics", theme:4, q:"重心と安定について、誤っているものはどれか。", choices:["同じ重心高さなら、支持面が狭い方が一般に安定する。","地切り時には、荷の傾きや玉掛けの状態を確認する。","荷を安定してつるには、フックを荷の重心の真上に合わせる。","均質で左右対称な物体の重心は、その対称面上にある。","均質な円環では、重心が材料の存在しない中心部に位置することがある。"], answer:0, explain:"この記述が誤りです。正しくは、同じ重心高さなら、支持面が広い方が一般に安定する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_4_5", subject:"mechanics", theme:4, q:"重心と安定について、正しいものはどれか。", choices:["均質で左右対称な物体の重心は、必ず物体の最下点にある。","物体の重心からの鉛直線が支持面の外へ出るほど安定する。","荷を安定してつるには、フックを荷の重心の真上に合わせる。","複数の物体の合成重心は、それぞれの質量を無視して位置だけで決まる。","同じ重心高さなら、支持面が狭い方が一般に安定する。"], answer:2, explain:"この記述が正しい内容です。荷を安定してつるには、フックを荷の重心の真上に合わせる。<br><br>ほかの選択肢の確認：<br>・物体の重心からの鉛直線が支持面の外へ出ると、転倒しやすくなる。<br>・均質で左右対称な物体の重心は、その対称面上にある。<br>・同じ重心高さなら、支持面が広い方が一般に安定する。<br>・複数の物体の合成重心は、それぞれの質量と位置から求められる。"},
{license:"cargo_handling", id:"cargo_mechanics_4_6", subject:"mechanics", theme:4, q:"重心と安定について、誤っているものはどれか。", choices:["同じ重心高さなら、支持面が広い方が一般に安定する。","物体の重心は、必ず材料が存在する部分にしか位置しない。","均質で左右対称な物体の重心は、その対称面上にある。","物体の重心からの鉛直線が支持面の外へ出ると、転倒しやすくなる。","複数の物体の合成重心は、それぞれの質量と位置から求められる。"], answer:1, explain:"この記述が誤りです。正しくは、均質な円環では、重心が材料の存在しない中心部に位置することがある。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_4_7", subject:"mechanics", theme:4, q:"重心と安定について、正しいものはどれか。", choices:["均質で左右対称な物体の重心は、必ず物体の最下点にある。","同じ支持面なら、重心が高い方が一般に転倒に対して安定する。","複数の物体の合成重心は、それぞれの質量と位置から求められる。","荷を安定してつるには、フックを荷の重心からできるだけ横にずらす。","地切り時に荷が傾いても、そのまま高速で巻き上げる。"], answer:2, explain:"この記述が正しい内容です。複数の物体の合成重心は、それぞれの質量と位置から求められる。<br><br>ほかの選択肢の確認：<br>・荷を安定してつるには、フックを荷の重心の真上に合わせる。<br>・均質で左右対称な物体の重心は、その対称面上にある。<br>・地切り時には、荷の傾きや玉掛けの状態を確認する。<br>・同じ支持面なら、重心が低い方が一般に転倒に対して安定する。"},
{license:"cargo_handling", id:"cargo_mechanics_4_8", subject:"mechanics", theme:4, q:"重心と安定について、誤っているものはどれか。", choices:["物体の重心からの鉛直線が支持面の外へ出ると、転倒しやすくなる。","荷を安定してつるには、フックを荷の重心の真上に合わせる。","地切り時に荷が傾いても、そのまま高速で巻き上げる。","均質な円環では、重心が材料の存在しない中心部に位置することがある。","同じ支持面なら、重心が低い方が一般に転倒に対して安定する。"], answer:2, explain:"この記述が誤りです。正しくは、地切り時には、荷の傾きや玉掛けの状態を確認する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_5_1", subject:"mechanics", theme:5, q:"物体の運動について、正しいものはどれか。", choices:["等速円運動では、速さが一定なので加速度はない。","慣性とは、物体が静止又は等速直線運動の状態を保とうとする性質である。","仕事率は、仕事に所要時間を掛けた値である。","遠心力の大きさは、速さに反比例し、回転半径に比例する。","急な旋回停止では、荷は慣性の影響を受けず必ず直ちに静止する。"], answer:1, explain:"この記述が正しい内容です。慣性とは、物体が静止又は等速直線運動の状態を保とうとする性質である。<br><br>ほかの選択肢の確認：<br>・急な旋回停止では、荷が慣性によって振れやすい。<br>・遠心力の大きさは、質量と速さの二乗に比例し、回転半径に反比例する。<br>・仕事率は、単位時間当たりに行う仕事である。<br>・等速円運動でも速度の向きが変わるため、加速度がある。"},
{license:"cargo_handling", id:"cargo_mechanics_5_2", subject:"mechanics", theme:5, q:"物体の運動について、誤っているものはどれか。", choices:["慣性とは、物体が静止又は等速直線運動の状態を保とうとする性質である。","急な旋回停止では、荷が慣性によって振れやすい。","加速度は、移動距離と質量の積である。","同じ質量なら、加速度を大きくするほど必要な力は大きくなる。","遠心力の大きさは、質量と速さの二乗に比例し、回転半径に反比例する。"], answer:2, explain:"この記述が誤りです。正しくは、加速度は、単位時間当たりの速度の変化である。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_5_3", subject:"mechanics", theme:5, q:"物体の運動について、正しいものはどれか。", choices:["同じ質量なら、加速度を大きくするほど必要な力は大きくなる。","遠心力の大きさは、速さに反比例し、回転半径に比例する。","急な旋回停止では、荷は慣性の影響を受けず必ず直ちに静止する。","慣性とは、物体が必ず自然に加速し続ける性質である。","仕事率は、仕事に所要時間を掛けた値である。"], answer:0, explain:"この記述が正しい内容です。同じ質量なら、加速度を大きくするほど必要な力は大きくなる。<br><br>ほかの選択肢の確認：<br>・慣性とは、物体が静止又は等速直線運動の状態を保とうとする性質である。<br>・遠心力の大きさは、質量と速さの二乗に比例し、回転半径に反比例する。<br>・急な旋回停止では、荷が慣性によって振れやすい。<br>・仕事率は、単位時間当たりに行う仕事である。"},
{license:"cargo_handling", id:"cargo_mechanics_5_4", subject:"mechanics", theme:5, q:"物体の運動について、誤っているものはどれか。", choices:["慣性とは、物体が静止又は等速直線運動の状態を保とうとする性質である。","同じ質量なら、加速度を大きくするほど必要な力は大きくなる。","等速円運動では、速さが一定なので加速度はない。","仕事率は、単位時間当たりに行う仕事である。","急な旋回停止では、荷が慣性によって振れやすい。"], answer:2, explain:"この記述が誤りです。正しくは、等速円運動でも速度の向きが変わるため、加速度がある。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_5_5", subject:"mechanics", theme:5, q:"物体の運動について、正しいものはどれか。", choices:["仕事率は、仕事に所要時間を掛けた値である。","慣性とは、物体が必ず自然に加速し続ける性質である。","加速度は、移動距離と質量の積である。","遠心力の大きさは、質量と速さの二乗に比例し、回転半径に反比例する。","等速円運動では、速さが一定なので加速度はない。"], answer:3, explain:"この記述が正しい内容です。遠心力の大きさは、質量と速さの二乗に比例し、回転半径に反比例する。<br><br>ほかの選択肢の確認：<br>・仕事率は、単位時間当たりに行う仕事である。<br>・等速円運動でも速度の向きが変わるため、加速度がある。<br>・慣性とは、物体が静止又は等速直線運動の状態を保とうとする性質である。<br>・加速度は、単位時間当たりの速度の変化である。"},
{license:"cargo_handling", id:"cargo_mechanics_5_6", subject:"mechanics", theme:5, q:"物体の運動について、誤っているものはどれか。", choices:["加速度は、単位時間当たりの速度の変化である。","運動エネルギーは、質量が同じなら速さの二乗に比例する。","急な旋回停止では、荷は慣性の影響を受けず必ず直ちに静止する。","等速円運動でも速度の向きが変わるため、加速度がある。","仕事率は、単位時間当たりに行う仕事である。"], answer:2, explain:"この記述が誤りです。正しくは、急な旋回停止では、荷が慣性によって振れやすい。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_5_7", subject:"mechanics", theme:5, q:"物体の運動について、正しいものはどれか。", choices:["慣性とは、物体が必ず自然に加速し続ける性質である。","急な旋回停止では、荷は慣性の影響を受けず必ず直ちに静止する。","加速度は、移動距離と質量の積である。","仕事率は、仕事に所要時間を掛けた値である。","運動エネルギーは、質量が同じなら速さの二乗に比例する。"], answer:4, explain:"この記述が正しい内容です。運動エネルギーは、質量が同じなら速さの二乗に比例する。<br><br>ほかの選択肢の確認：<br>・慣性とは、物体が静止又は等速直線運動の状態を保とうとする性質である。<br>・加速度は、単位時間当たりの速度の変化である。<br>・急な旋回停止では、荷が慣性によって振れやすい。<br>・仕事率は、単位時間当たりに行う仕事である。"},
{license:"cargo_handling", id:"cargo_mechanics_5_8", subject:"mechanics", theme:5, q:"物体の運動について、誤っているものはどれか。", choices:["等速円運動でも速度の向きが変わるため、加速度がある。","仕事率は、仕事に所要時間を掛けた値である。","加速度は、単位時間当たりの速度の変化である。","急な旋回停止では、荷が慣性によって振れやすい。","慣性とは、物体が静止又は等速直線運動の状態を保とうとする性質である。"], answer:1, explain:"この記述が誤りです。正しくは、仕事率は、単位時間当たりに行う仕事である。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_6_1", subject:"mechanics", theme:6, q:"摩擦力について、正しいものはどれか。", choices:["摩擦係数は、材料や表面状態によらず常に1である。","乾燥摩擦の基本モデルでは、接触面積が2倍になると摩擦力は必ず2倍になる。","一般に、転がり摩擦は滑り摩擦より必ず大きい。","静止摩擦力は、外力がゼロでも常に最大値で働く。","最大静止摩擦力は、静止摩擦係数と垂直抗力の積で求める。"], answer:4, explain:"この記述が正しい内容です。最大静止摩擦力は、静止摩擦係数と垂直抗力の積で求める。<br><br>ほかの選択肢の確認：<br>・摩擦係数は接触する材料や表面状態などで変わる。<br>・乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。<br>・一般に、転がり摩擦は滑り摩擦より小さい。<br>・静止摩擦力は、滑り出す直前まで外力に応じて変化する。"},
{license:"cargo_handling", id:"cargo_mechanics_6_2", subject:"mechanics", theme:6, q:"摩擦力について、誤っているものはどれか。", choices:["ブレーキの摩擦面に油が付着すると、制動力が低下するおそれがある。","乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。","滑り摩擦力は、接触面の相対的な滑りを妨げる向きに働く。","静止摩擦力は、外力がゼロでも常に最大値で働く。","一般に、転がり摩擦は滑り摩擦より小さい。"], answer:3, explain:"この記述が誤りです。正しくは、静止摩擦力は、滑り出す直前まで外力に応じて変化する。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_6_3", subject:"mechanics", theme:6, q:"摩擦力について、正しいものはどれか。", choices:["一般に、動摩擦力は最大静止摩擦力より小さい。","滑り摩擦力は、常に接触面の滑りを加速する向きに働く。","乾燥摩擦の基本モデルでは、接触面積が2倍になると摩擦力は必ず2倍になる。","最大静止摩擦力は、静止摩擦係数を垂直抗力で割って求める。","一般に、転がり摩擦は滑り摩擦より必ず大きい。"], answer:0, explain:"この記述が正しい内容です。一般に、動摩擦力は最大静止摩擦力より小さい。<br><br>ほかの選択肢の確認：<br>・最大静止摩擦力は、静止摩擦係数と垂直抗力の積で求める。<br>・滑り摩擦力は、接触面の相対的な滑りを妨げる向きに働く。<br>・一般に、転がり摩擦は滑り摩擦より小さい。<br>・乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。"},
{license:"cargo_handling", id:"cargo_mechanics_6_4", subject:"mechanics", theme:6, q:"摩擦力について、誤っているものはどれか。", choices:["摩擦係数は接触する材料や表面状態などで変わる。","乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。","滑り摩擦力は、常に接触面の滑りを加速する向きに働く。","一般に、動摩擦力は最大静止摩擦力より小さい。","ブレーキの摩擦面に油が付着すると、制動力が低下するおそれがある。"], answer:2, explain:"この記述が誤りです。正しくは、滑り摩擦力は、接触面の相対的な滑りを妨げる向きに働く。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_6_5", subject:"mechanics", theme:6, q:"摩擦力について、正しいものはどれか。", choices:["最大静止摩擦力は、静止摩擦係数を垂直抗力で割って求める。","静止摩擦力は、外力がゼロでも常に最大値で働く。","乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。","滑り摩擦力は、常に接触面の滑りを加速する向きに働く。","摩擦係数は、材料や表面状態によらず常に1である。"], answer:2, explain:"この記述が正しい内容です。乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。<br><br>ほかの選択肢の確認：<br>・滑り摩擦力は、接触面の相対的な滑りを妨げる向きに働く。<br>・静止摩擦力は、滑り出す直前まで外力に応じて変化する。<br>・摩擦係数は接触する材料や表面状態などで変わる。<br>・最大静止摩擦力は、静止摩擦係数と垂直抗力の積で求める。"},
{license:"cargo_handling", id:"cargo_mechanics_6_6", subject:"mechanics", theme:6, q:"摩擦力について、誤っているものはどれか。", choices:["一般に、転がり摩擦は滑り摩擦より小さい。","静止摩擦力は、滑り出す直前まで外力に応じて変化する。","一般に、動摩擦力は最大静止摩擦力より小さい。","乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。","摩擦係数は、材料や表面状態によらず常に1である。"], answer:4, explain:"この記述が誤りです。正しくは、摩擦係数は接触する材料や表面状態などで変わる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_6_7", subject:"mechanics", theme:6, q:"摩擦力について、正しいものはどれか。", choices:["一般に、転がり摩擦は滑り摩擦より小さい。","滑り摩擦力は、常に接触面の滑りを加速する向きに働く。","乾燥摩擦の基本モデルでは、接触面積が2倍になると摩擦力は必ず2倍になる。","最大静止摩擦力は、静止摩擦係数を垂直抗力で割って求める。","ブレーキの摩擦面には、制動力を高めるため常に油を多量に塗る。"], answer:0, explain:"この記述が正しい内容です。一般に、転がり摩擦は滑り摩擦より小さい。<br><br>ほかの選択肢の確認：<br>・ブレーキの摩擦面に油が付着すると、制動力が低下するおそれがある。<br>・最大静止摩擦力は、静止摩擦係数と垂直抗力の積で求める。<br>・乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。<br>・滑り摩擦力は、接触面の相対的な滑りを妨げる向きに働く。"},
{license:"cargo_handling", id:"cargo_mechanics_6_8", subject:"mechanics", theme:6, q:"摩擦力について、誤っているものはどれか。", choices:["ブレーキの摩擦面には、制動力を高めるため常に油を多量に塗る。","最大静止摩擦力は、静止摩擦係数と垂直抗力の積で求める。","乾燥摩擦の基本モデルでは、摩擦力は見かけの接触面積にほぼ依存しない。","滑り摩擦力は、接触面の相対的な滑りを妨げる向きに働く。","摩擦係数は接触する材料や表面状態などで変わる。"], answer:0, explain:"この記述が誤りです。正しくは、ブレーキの摩擦面に油が付着すると、制動力が低下するおそれがある。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_7_1", subject:"mechanics", theme:7, q:"荷重の種類について、正しいものはどれか。", choices:["繰返し荷重は、材料の疲労に関係しない。","衝撃荷重は、ゆっくり一定に加え続ける荷重だけをいう。","急な巻上げや停止でも、ロープに作用する力は静止時と必ず同じである。","静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。","分布荷重は、一点だけに作用する荷重である。"], answer:3, explain:"この記述が正しい内容です。静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。<br><br>ほかの選択肢の確認：<br>・繰返し荷重は、繰り返して作用する荷重で、材料疲労の原因となる。<br>・分布荷重は、ある範囲に分布して作用する荷重である。<br>・急な巻上げや停止では、静かにつっているときより大きな力が生じることがある。<br>・衝撃荷重は、ごく短時間に作用する荷重である。"},
{license:"cargo_handling", id:"cargo_mechanics_7_2", subject:"mechanics", theme:7, q:"荷重の種類について、誤っているものはどれか。", choices:["動荷重は、必ず大きさも方向も永久に一定の荷重である。","静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。","分布荷重は、ある範囲に分布して作用する荷重である。","衝撃荷重は、ごく短時間に作用する荷重である。","交番荷重は、引張りと圧縮など、向きが交互に変わる荷重である。"], answer:0, explain:"この記述が誤りです。正しくは、動荷重は、時間とともに大きさや方向が変化する荷重である。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_7_3", subject:"mechanics", theme:7, q:"荷重の種類について、正しいものはどれか。", choices:["分布荷重は、一点だけに作用する荷重である。","交番荷重は、一度だけ作用して終わる荷重である。","繰返し荷重は、材料の疲労に関係しない。","集中荷重は、全体に均一に広がって作用する荷重である。","衝撃荷重は、ごく短時間に作用する荷重である。"], answer:4, explain:"この記述が正しい内容です。衝撃荷重は、ごく短時間に作用する荷重である。<br><br>ほかの選択肢の確認：<br>・交番荷重は、引張りと圧縮など、向きが交互に変わる荷重である。<br>・分布荷重は、ある範囲に分布して作用する荷重である。<br>・繰返し荷重は、繰り返して作用する荷重で、材料疲労の原因となる。<br>・集中荷重は、狭い範囲に集中して作用する荷重である。"},
{license:"cargo_handling", id:"cargo_mechanics_7_4", subject:"mechanics", theme:7, q:"荷重の種類について、誤っているものはどれか。", choices:["衝撃荷重は、ごく短時間に作用する荷重である。","分布荷重は、ある範囲に分布して作用する荷重である。","動荷重は、時間とともに大きさや方向が変化する荷重である。","静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。","繰返し荷重は、材料の疲労に関係しない。"], answer:4, explain:"この記述が誤りです。正しくは、繰返し荷重は、繰り返して作用する荷重で、材料疲労の原因となる。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_7_5", subject:"mechanics", theme:7, q:"荷重の種類について、正しいものはどれか。", choices:["静荷重は、短時間に急激な衝撃を与える荷重だけをいう。","集中荷重は、全体に均一に広がって作用する荷重である。","急な巻上げや停止でも、ロープに作用する力は静止時と必ず同じである。","繰返し荷重は、材料の疲労に関係しない。","交番荷重は、引張りと圧縮など、向きが交互に変わる荷重である。"], answer:4, explain:"この記述が正しい内容です。交番荷重は、引張りと圧縮など、向きが交互に変わる荷重である。<br><br>ほかの選択肢の確認：<br>・静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。<br>・急な巻上げや停止では、静かにつっているときより大きな力が生じることがある。<br>・繰返し荷重は、繰り返して作用する荷重で、材料疲労の原因となる。<br>・集中荷重は、狭い範囲に集中して作用する荷重である。"},
{license:"cargo_handling", id:"cargo_mechanics_7_6", subject:"mechanics", theme:7, q:"荷重の種類について、誤っているものはどれか。", choices:["急な巻上げや停止では、静かにつっているときより大きな力が生じることがある。","集中荷重は、全体に均一に広がって作用する荷重である。","動荷重は、時間とともに大きさや方向が変化する荷重である。","交番荷重は、引張りと圧縮など、向きが交互に変わる荷重である。","繰返し荷重は、繰り返して作用する荷重で、材料疲労の原因となる。"], answer:1, explain:"この記述が誤りです。正しくは、集中荷重は、狭い範囲に集中して作用する荷重である。<br>ほかの4つの記述は正しい内容です。"},
{license:"cargo_handling", id:"cargo_mechanics_7_7", subject:"mechanics", theme:7, q:"荷重の種類について、正しいものはどれか。", choices:["分布荷重は、ある範囲に分布して作用する荷重である。","繰返し荷重は、材料の疲労に関係しない。","静荷重は、短時間に急激な衝撃を与える荷重だけをいう。","衝撃荷重は、ゆっくり一定に加え続ける荷重だけをいう。","集中荷重は、全体に均一に広がって作用する荷重である。"], answer:0, explain:"この記述が正しい内容です。分布荷重は、ある範囲に分布して作用する荷重である。<br><br>ほかの選択肢の確認：<br>・集中荷重は、狭い範囲に集中して作用する荷重である。<br>・静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。<br>・衝撃荷重は、ごく短時間に作用する荷重である。<br>・繰返し荷重は、繰り返して作用する荷重で、材料疲労の原因となる。"},
{license:"cargo_handling", id:"cargo_mechanics_7_8", subject:"mechanics", theme:7, q:"荷重の種類について、誤っているものはどれか。", choices:["交番荷重は、引張りと圧縮など、向きが交互に変わる荷重である。","静荷重は、大きさや方向が時間的にほとんど変わらない荷重である。","動荷重は、時間とともに大きさや方向が変化する荷重である。","衝撃荷重は、ごく短時間に作用する荷重である。","急な巻上げや停止でも、ロープに作用する力は静止時と必ず同じである。"], answer:4, explain:"この記述が誤りです。正しくは、急な巻上げや停止では、静かにつっているときより大きな力が生じることがある。<br>ほかの4つの記述は正しい内容です。"},

{license:"cargo_handling", id:"cargo_mechanics_9_1", subject:"mechanics", theme:9, q:"荷重10kNを、等しい長さの2本のロープで左右対称につる。2本のロープの間のつり角度は60°である。1本当たりの張力に最も近い値はどれか。ロープの質量を無視し、cos(30°)＝0.866とする。<div class=\"diagram-box\"><svg viewBox=\"0 0 560 200\" role=\"img\" aria-label=\"左右対称な二本づり。表示角度は二本のロープの間の角度\" style=\"width:100%;max-width:560px;height:auto;background:#fff;color:#17263b\"><g font-family=\"sans-serif\" font-size=\"16\" fill=\"#17263b\" stroke-width=\"2\"><path d=\"M280 25 L219.4 130 H340.6 Z\" fill=\"none\" stroke=\"#263850\"/><rect x=\"214.4\" y=\"132\" width=\"131.2\" height=\"35\" fill=\"#dbeafe\" stroke=\"#263850\"/><text x=\"255\" y=\"70\">60°</text><text x=\"235\" y=\"193\">荷重 10kN</text><text x=\"184.4\" y=\"100\">T</text><text x=\"365.6\" y=\"100\">T</text></g></svg></div>", choices:["2.88 kN","17.31 kN","11.54 kN","5.77 kN","8.65 kN"], answer:3, explain:"各ロープの鉛直成分が荷重の半分を受けます。T＝W÷[2cos(つり角度/2)]＝10÷(2×0.866)≒5.77kN。角度が大きいほど張力は増えます。"},

/* ================= State ================= */
let state = {
  screen:'hub',          // hub | license | quiz | result
  stats:{},               // stats[licenseId][subjectId] = {correct,total,missed:[]}
  currentLicense:null,
  currentSubject:null,
  currentQueue:[],
  currentIndex:0,
  sessionCorrect:0,
  sessionMissed:[],
  answered:false,
  chosenIndex:null,
  isReviewSession:false,
  currentMode:null,       // 'test' | 'all' | null
  confirmReset:false,
  showExempt:false,
};

const STORAGE_KEY = 'examAppStats_v2';
const LEGACY_KEY  = 'craneQuizStats';

function blankLicenseStats(lic){
  const o = {};
  lic.subjects.forEach(s=>{ o[s.id] = {correct:0,total:0,missed:[]}; });
  return o;
}

function ensureStatsShape(){
  LICENSES.forEach(lic=>{
    if(!state.stats[lic.id]) state.stats[lic.id] = {};
    lic.subjects.forEach(s=>{
      if(!state.stats[lic.id][s.id]) state.stats[lic.id][s.id] = {correct:0,total:0,missed:[]};
    });
  });
}

/* ---- Storage abstraction ----
   Uses window.storage when running inside a Claude.ai artifact preview.
   Falls back to the browser's own localStorage when hosted anywhere else
   (e.g. a public link), so visitors' progress saves in their own browser. */
function hasArtifactStorage(){
  return typeof window !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}

async function storageGet(key){
  if(hasArtifactStorage()){
    return await window.storage.get(key, false);
  }
  try{
    const v = localStorage.getItem(key);
    return v === null ? null : {key, value:v};
  }catch(e){
    return null; // e.g. localStorage disabled/blocked
  }
}

async function storageSet(key, value){
  if(hasArtifactStorage()){
    return await window.storage.set(key, value, false);
  }
  try{
    localStorage.setItem(key, value);
    return {key, value};
  }catch(e){
    return null;
  }
}

async function loadStats(){
  let loaded = null;
  try{
    const res = await storageGet(STORAGE_KEY);
    if(res && res.value) loaded = JSON.parse(res.value);
  }catch(e){ /* not found */ }

  if(!loaded){
    // migrate old flat crane-only stats into crane_fixed
    try{
      const old = await storageGet(LEGACY_KEY);
      if(old && old.value){
        const parsed = JSON.parse(old.value);
        loaded = { crane_fixed: parsed };
      }
    }catch(e){ /* no legacy data */ }
  }

  state.stats = loaded || {};
  ensureStatsShape();
}

async function saveStats(){
  try{ await storageSet(STORAGE_KEY, JSON.stringify(state.stats)); }
  catch(e){ /* best effort */ }
}

/* ---- Analytics (GA4 custom events) ----
   No-ops safely if gtag isn't loaded (ad blockers, offline, etc.) */
function trackEvent(name, params){
  try{
    if(typeof gtag === 'function') gtag('event', name, params || {});
  }catch(e){ /* never let analytics break the app */ }
}


function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function licenseMissedIds(licenseId){
  const lic = getLicense(licenseId);
  if(!lic) return [];
  const set = new Set();
  lic.subjects.forEach(s=>{
    const st = state.stats[licenseId] && state.stats[licenseId][s.id];
    if(st && st.missed) st.missed.forEach(id=>set.add(id));
  });
  return Array.from(set);
}

function licenseTotals(licenseId){
  const lic = getLicense(licenseId);
  let correct=0, total=0;
  if(lic){
    lic.subjects.forEach(s=>{
      const st = state.stats[licenseId] && state.stats[licenseId][s.id];
      if(st){ correct += st.correct; total += st.total; }
    });
  }
  return {correct, total};
}

/* ================= Navigation ================= */
function goHub(){
  state.screen = 'hub';
  state.confirmReset = false;
  render();
}

function openLicense(licenseId){
  const lic = getLicense(licenseId);
  if(!lic || lic.status !== 'available') return;
  state.currentLicense = licenseId;
  state.screen = 'license';
  state.confirmReset = false;
  state.showExempt = false;
  trackEvent('select_license', {license_id: licenseId, license_name: lic.short});
  render();
}

function startSubjectQuiz(subjectId, mode){
  const licId = state.currentLicense;
  const subj = subjectMeta(licId, subjectId);
  if(!subj) return;
  const pool = licenseQuestions(licId).filter(q=>q.subject===subjectId);
  let qs;
  if(subj.themes && subj.themes.length && mode !== 'all'){
    qs = subj.themes.map((_, idx)=>{
      const themeQs = pool.filter(q=>q.theme===idx+1);
      return themeQs.length ? themeQs[Math.floor(Math.random()*themeQs.length)] : null;
    }).filter(Boolean);
    qs = shuffle(qs);
  } else {
    qs = shuffle(pool);
  }
  if(!qs.length) return;
  state.currentSubject = subjectId;
  state.currentQueue = qs;
  state.currentIndex = 0;
  state.sessionCorrect = 0;
  state.sessionMissed = [];
  state.answered = false;
  state.chosenIndex = null;
  state.isReviewSession = false;
  state.currentMode = (subj.themes && subj.themes.length && mode !== 'all') ? 'test' : 'all';
  state.confirmReset = false;
  state.screen = 'quiz';
  trackEvent('start_test', {
    license_id: licId,
    subject_id: subjectId,
    subject_name: subj.name,
    mode: state.currentMode,
    question_count: qs.length
  });
  render();
}

function startReviewQuiz(){
  const licId = state.currentLicense;
  const ids = licenseMissedIds(licId);
  const qs = licenseQuestions(licId).filter(q=>ids.includes(q.id));
  if(!qs.length) return;
  state.currentSubject = null;
  state.currentQueue = shuffle(qs);
  state.currentIndex = 0;
  state.sessionCorrect = 0;
  state.sessionMissed = [];
  state.answered = false;
  state.chosenIndex = null;
  state.isReviewSession = true;
  state.currentMode = null;
  state.confirmReset = false;
  state.screen = 'quiz';
  trackEvent('start_review', {license_id: licId, missed_count: qs.length});
  render();
}

function selectChoice(idx){
  if(state.answered) return;
  state.answered = true;
  state.chosenIndex = idx;
  const q = state.currentQueue[state.currentIndex];
  const correct = idx === q.answer;

  const st = state.stats[q.license][q.subject];
  st.total += 1;
  if(correct){
    st.correct += 1;
    st.missed = (st.missed||[]).filter(id=>id!==q.id);
  } else {
    if(!st.missed) st.missed = [];
    if(!st.missed.includes(q.id)) st.missed.push(q.id);
  }
  saveStats();

  if(correct) state.sessionCorrect += 1;
  else state.sessionMissed.push(q);
  render();
}

function nextQuestion(){
  if(state.currentIndex < state.currentQueue.length-1){
    state.currentIndex += 1;
    state.answered = false;
    state.chosenIndex = null;
  } else {
    state.screen = 'result';
    trackEvent('complete_test', {
      license_id: state.currentLicense,
      subject_id: state.currentSubject,
      mode: state.isReviewSession ? 'review' : state.currentMode,
      is_review: state.isReviewSession,
      score: state.sessionCorrect,
      total: state.currentQueue.length
    });
  }
  render();
}

async function resetLicenseStats(){
  const lic = getLicense(state.currentLicense);
  if(lic) state.stats[lic.id] = blankLicenseStats(lic);
  state.confirmReset = false;
  try{ await saveStats(); }catch(e){}
  render();
}

/* ================= Diagram generators (SVG) ================= */
const DINK = '#1B2630', DSTEEL='#2E4053', DHAZ='#C98F12', DROPE='#9C6B3E', DMUTE='#8FA0AC';

function diagLever(p){
  // p: {leftLabel, leftDist, rightLabel, rightDist, leftIsForce, rightIsForce}
  const cx=150, beamY=70, pivotY=100, halfLen=120;
  const leftX = cx - halfLen, rightX = cx + halfLen;
  return `<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg">
    <line x1="${leftX}" y1="${beamY}" x2="${rightX}" y2="${beamY}" stroke="${DINK}" stroke-width="5" stroke-linecap="round"/>
    <polygon points="${cx-14},${pivotY} ${cx+14},${pivotY} ${cx},${beamY+6}" fill="${DSTEEL}"/>
    <line x1="${cx-22}" y1="${pivotY}" x2="${cx+22}" y2="${pivotY}" stroke="${DINK}" stroke-width="3"/>
    <line x1="${leftX}" y1="${beamY}" x2="${leftX}" y2="${beamY+40}" stroke="${DHAZ}" stroke-width="4"/>
    <polygon points="${leftX-6},${beamY+34} ${leftX+6},${beamY+34} ${leftX},${beamY+48}" fill="${DHAZ}"/>
    <text x="${leftX}" y="${beamY+64}" font-size="13" text-anchor="middle" fill="${DINK}">${p.leftLabel}</text>
    <line x1="${rightX}" y1="${beamY}" x2="${rightX}" y2="${beamY+40}" stroke="${DROPE}" stroke-width="4"/>
    <polygon points="${rightX-6},${beamY+34} ${rightX+6},${beamY+34} ${rightX},${beamY+48}" fill="${DROPE}"/>
    <text x="${rightX}" y="${beamY+64}" font-size="13" text-anchor="middle" fill="${DINK}">${p.rightLabel}</text>
    <line x1="${leftX}" y1="${beamY-14}" x2="${cx}" y2="${beamY-14}" stroke="${DMUTE}" stroke-width="1.5" marker-start="url(#dArrow)" marker-end="url(#dArrow)"/>
    <text x="${(leftX+cx)/2}" y="${beamY-20}" font-size="12" text-anchor="middle" fill="${DINK}">${p.leftDist}</text>
    <line x1="${cx}" y1="${beamY-14}" x2="${rightX}" y2="${beamY-14}" stroke="${DMUTE}" stroke-width="1.5" marker-start="url(#dArrow)" marker-end="url(#dArrow)"/>
    <text x="${(cx+rightX)/2}" y="${beamY-20}" font-size="12" text-anchor="middle" fill="${DINK}">${p.rightDist}</text>
    <defs><marker id="dArrow" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${DMUTE}"/></marker></defs>
  </svg>`;
}

function diagBeamTwoSupports(p){
  // p: {totalLabel, leftSegLabel, rightSegLabel, loadLabel}
  const leftX=40, rightX=260, beamY=70;
  const loadFrac = p.loadFrac!==undefined ? p.loadFrac : 0.6;
  const loadX = leftX + (rightX-leftX)*loadFrac;
  return `<svg viewBox="0 0 300 170" xmlns="http://www.w3.org/2000/svg">
    <line x1="${leftX}" y1="${beamY}" x2="${rightX}" y2="${beamY}" stroke="${DINK}" stroke-width="5" stroke-linecap="round"/>
    <polygon points="${leftX-12},${beamY+22} ${leftX+12},${beamY+22} ${leftX},${beamY+4}" fill="${DSTEEL}"/>
    <text x="${leftX}" y="${beamY+40}" font-size="13" text-anchor="middle" fill="${DINK}">A</text>
    <polygon points="${rightX-12},${beamY+22} ${rightX+12},${beamY+22} ${rightX},${beamY+4}" fill="${DSTEEL}"/>
    <text x="${rightX}" y="${beamY+40}" font-size="13" text-anchor="middle" fill="${DINK}">B</text>
    <line x1="${loadX}" y1="${beamY-46}" x2="${loadX}" y2="${beamY-2}" stroke="${DHAZ}" stroke-width="4"/>
    <polygon points="${loadX-6},${beamY-8} ${loadX+6},${beamY-8} ${loadX},${beamY+4}" fill="${DHAZ}"/>
    <text x="${loadX}" y="${beamY-52}" font-size="13" text-anchor="middle" fill="${DINK}">${p.loadLabel}</text>
    <line x1="${leftX}" y1="${beamY+58}" x2="${loadX}" y2="${beamY+58}" stroke="${DMUTE}" stroke-width="1.5" marker-start="url(#dArrow2)" marker-end="url(#dArrow2)"/>
    <text x="${(leftX+loadX)/2}" y="${beamY+72}" font-size="12" text-anchor="middle" fill="${DINK}">${p.leftSegLabel}</text>
    <line x1="${loadX}" y1="${beamY+58}" x2="${rightX}" y2="${beamY+58}" stroke="${DMUTE}" stroke-width="1.5" marker-start="url(#dArrow2)" marker-end="url(#dArrow2)"/>
    <text x="${(loadX+rightX)/2}" y="${beamY+72}" font-size="12" text-anchor="middle" fill="${DINK}">${p.rightSegLabel}</text>
    <defs><marker id="dArrow2" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="${DMUTE}"/></marker></defs>
  </svg>`;
}

function diagAngleTension(p){
  // p: {angleLabel, weightLabel} -- angleLabel is the TOTAL angle between the two ropes
  const cx=150, hookY=130, ceilY=30, spread=95;
  const leftTopX = cx-spread, rightTopX = cx+spread;
  return `<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg">
    <line x1="20" y1="${ceilY}" x2="280" y2="${ceilY}" stroke="${DSTEEL}" stroke-width="6"/>
    <line x1="${leftTopX}" y1="${ceilY}" x2="${cx}" y2="${hookY}" stroke="${DINK}" stroke-width="3"/>
    <line x1="${rightTopX}" y1="${ceilY}" x2="${cx}" y2="${hookY}" stroke="${DINK}" stroke-width="3"/>
    <path d="M ${cx-26} ${hookY-22} A 30 30 0 0 1 ${cx+26} ${hookY-22}" fill="none" stroke="${DHAZ}" stroke-width="2.5"/>
    <text x="${cx}" y="${hookY-32}" font-size="13" text-anchor="middle" fill="${DINK}">つり角度 ${p.angleLabel}</text>
    <rect x="${cx-22}" y="${hookY}" width="44" height="34" rx="3" fill="${DROPE}"/>
    <text x="${cx}" y="${hookY+22}" font-size="12" text-anchor="middle" fill="#fff">${p.weightLabel}</text>
  </svg>`;
}

function diagPulley(type){

      <rect x="118" y="140" width="44" height="34" rx="3" fill="${DROPE}"/>
      <text x="140" y="162" font-size="12" text-anchor="middle" fill="#fff">W</text>
      <line x1="160" y1="55" x2="200" y2="130" stroke="${DHAZ}" stroke-width="3"/>
      <polygon points="194,120 206,120 200,136" fill="${DHAZ}"/>
      <text x="212" y="128" font-size="14" fill="${DINK}">F</text>
    </svg>`;
  }
  if(type==='movable1'){
    return `<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg">
      ${partsFixed}
      <circle cx="130" cy="35" r="14" fill="none" stroke="${DINK}" stroke-width="3"/>
      <line x1="118" y1="25" x2="60" y2="150" stroke="${DINK}" stroke-width="3"/>
      <circle cx="150" cy="100" r="16" fill="none" stroke="${DINK}" stroke-width="3"/>
      <line x1="142" y1="35" x2="142" y2="90" stroke="${DINK}" stroke-width="3"/>
      <line x1="158" y1="90" x2="158" y2="35" stroke="${DINK}" stroke-width="3"/>
      <line x1="150" y1="116" x2="150" y2="140" stroke="${DINK}" stroke-width="3"/>
      <rect x="128" y="140" width="44" height="34" rx="3" fill="${DROPE}"/>
      <text x="150" y="162" font-size="12" text-anchor="middle" fill="#fff">W</text>
      <polygon points="54,140 66,140 60,156" fill="${DHAZ}"/>
      <text x="30" y="150" font-size="14" fill="${DINK}">F</text>
    </svg>`;
  }
  // compound2: two movable pulleys, mechanical advantage 4
  return `<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg">
    ${partsFixed}
    <circle cx="128" cy="30" r="12" fill="none" stroke="${DINK}" stroke-width="2.5"/>
    <circle cx="172" cy="30" r="12" fill="none" stroke="${DINK}" stroke-width="2.5"/>
    <circle cx="150" cy="90" r="15" fill="none" stroke="${DINK}" stroke-width="2.5"/>
    <line x1="118" y1="22" x2="60" y2="150" stroke="${DINK}" stroke-width="2.5"/>
    <line x1="140" y1="30" x2="140" y2="82" stroke="${DINK}" stroke-width="2.5"/>
    <line x1="160" y1="82" x2="160" y2="30" stroke="${DINK}" stroke-width="2.5"/>
    <line x1="182" y1="30" x2="182" y2="98" stroke="${DINK}" stroke-width="2.5"/>
    <line x1="150" y1="105" x2="150" y2="140" stroke="${DINK}" stroke-width="2.5"/>
    <rect x="128" y="140" width="44" height="34" rx="3" fill="${DROPE}"/>
    <text x="150" y="162" font-size="12" text-anchor="middle" fill="#fff">W</text>

}

function diagHangingRod(p){
  // p: {diameterLabel, weightLabel}
  return `<svg viewBox="0 0 300 190" xmlns="http://www.w3.org/2000/svg">
    <rect x="60" y="15" width="180" height="12" fill="${DSTEEL}"/>
    <line x1="150" y1="27" x2="150" y2="130" stroke="${DINK}" stroke-width="6"/>
    <text x="170" y="80" font-size="12" fill="${DINK}">${p.diameterLabel}</text>
    <rect x="122" y="130" width="56" height="36" rx="3" fill="${DROPE}"/>
    <text x="150" y="153" font-size="12" text-anchor="middle" fill="#fff">${p.weightLabel}</text>
  </svg>`;
}

function diagGearTrain(p){
  // p: {tA,tB,tC,tD, nA,nD} (labels, some may be '?')
  const twoStage = p.tC!==undefined;
  const cyMain=100;
  let svg, axA, axB, rA=26, rB=40;
  axA=42; axB=axA+rA+rB;
  svg = `<svg viewBox="0 0 340 210" xmlns="http://www.w3.org/2000/svg">`;
  svg += `<circle cx="${axA}" cy="${cyMain}" r="${rA}" fill="none" stroke="${DINK}" stroke-width="3"/>`;
  svg += `<text x="${axA}" y="${cyMain+4}" font-size="13" text-anchor="middle" fill="${DINK}">A</text>`;
  svg += `<text x="${axA}" y="${cyMain-rA-8}" font-size="10.5" text-anchor="middle" fill="${DROPE}">${p.tA}枚</text>`;
  if(p.nA) svg += `<text x="${axA}" y="${cyMain+rA+18}" font-size="10.5" text-anchor="middle" fill="${DHAZ}">${p.nA}</text>`;
  svg += `<circle cx="${axB}" cy="${cyMain}" r="${rB}" fill="none" stroke="${DINK}" stroke-width="3"/>`;
  svg += `<text x="${axB}" y="${cyMain+4}" font-size="13" text-anchor="middle" fill="${DINK}">B</text>`;
  svg += `<text x="${axB}" y="${cyMain-rB-8}" font-size="10.5" text-anchor="middle" fill="${DROPE}">${p.tB}枚</text>`;
  if(twoStage){
    const rC=22, rD=32;
    const axC = axB+rB+26; // shaft offset to the right of B (same axle, drawn adjacent)
    const axD = axC+rC+rD; // tangent C-D
    svg += `<rect x="${axB+rB}" y="${cyMain-4}" width="${(axC-rC)-(axB+rB)}" height="8" fill="${DSTEEL}"/>`; // shaft bar linking B and C
    svg += `<circle cx="${axC}" cy="${cyMain}" r="${rC}" fill="none" stroke="${DINK}" stroke-width="3"/>`;
    svg += `<text x="${axC}" y="${cyMain+4}" font-size="12" text-anchor="middle" fill="${DINK}">C</text>`;
    svg += `<text x="${axC}" y="${cyMain-rC-8}" font-size="10.5" text-anchor="middle" fill="${DROPE}">${p.tC}枚</text>`;
    svg += `<text x="${(axB+axC)/2}" y="${cyMain+26}" font-size="9.5" text-anchor="middle" fill="${DMUTE}">(B・C同軸)</text>`;
    svg += `<circle cx="${axD}" cy="${cyMain}" r="${rD}" fill="none" stroke="${DINK}" stroke-width="3"/>`;
    svg += `<text x="${axD}" y="${cyMain+4}" font-size="13" text-anchor="middle" fill="${DINK}">D</text>`;
    svg += `<text x="${axD}" y="${cyMain-rD-8}" font-size="10.5" text-anchor="middle" fill="${DROPE}">${p.tD}枚</text>`;
    if(p.nD) svg += `<text x="${axD}" y="${cyMain+rD+18}" font-size="10.5" text-anchor="middle" fill="${DHAZ}">${p.nD}</text>`;
  } else {
    if(p.nB) svg += `<text x="${axB}" y="${cyMain+rB+18}" font-size="10.5" text-anchor="middle" fill="${DHAZ}">${p.nB}</text>`;
  }
  svg += `</svg>`;
  return svg;
}

function renderDiagram(d){
  if(!d) return '';
  let svg='';
  if(d.type==='lever') svg = diagLever(d.params);
  else if(d.type==='beamTwoSupports') svg = diagBeamTwoSupports(d.params);
  else if(d.type==='angleTension') svg = diagAngleTension(d.params);
  else if(d.type==='pulley') svg = diagPulley(d.params.kind);
  else if(d.type==='hangingRod') svg = diagHangingRod(d.params);
  else if(d.type==='gearTrain') svg = diagGearTrain(d.params);
  if(!svg) return '';
  return `<div class="diagram-box">${svg}</div>`;
}

/* ================= Rendering ================= */

function renderHub(){
  const blocks = CATEGORIES.map(cat=>{
    const lics = LICENSES.filter(l=>l.category===cat.id);
    if(!lics.length) return '';
    const cards = lics.map(lic=>{
      if(lic.status !== 'available'){
        return `
        <div class="lic-card locked">
          <div class="lic-info">
            <div class="name">${lic.short}</div>
            <div class="sub">${lic.name}</div>
          </div>
          <div class="lic-badge soon">準備中</div>
        </div>`;
      }
      const qCount = licenseQuestions(lic.id).length;
      const t = licenseTotals(lic.id);
      const prog = t.total>0 ? `${Math.round(t.correct/t.total*100)}%<br><span style="font-size:10px">${t.correct}/${t.total}問</span>` : `全${qCount}問`;
      return `
      <button class="lic-card" data-license="${lic.id}">
        <div class="lic-info">
          <div class="name">${lic.short}</div>
          <div class="sub">${lic.name}</div>
        </div>
        <div class="lic-prog">${prog}</div>
        <div class="arrow">›</div>
      </button>`;
    }).join('');
    return `
    <div class="cat-head"><div class="bar"></div><div class="name">${cat.name}</div></div>
    ${cards}`;
  }).join('');

  return `
  <header class="top">
    <div class="eyebrow">LICENSE EXAM TRAINER</div>
    <h1>重機・資格<br>試験対策</h1>
    <p>学習したい資格を選んでください</p>
  </header>
  <main>
    ${blocks}
    <div class="note">
      各資格の問題は、実際の学科試験の出題科目・傾向にもとづいて作成したオリジナルの演習問題です。実際の試験問題そのものではありません。最新の法令・公式テキストとあわせてご確認ください。
    </div>
  </main>`;
}

function renderLicense(){
  const lic = getLicense(state.currentLicense);
  const t = licenseTotals(lic.id);
  const pct = t.total>0 ? Math.round(t.correct/t.total*100) : 0;
  const missedCount = licenseMissedIds(lic.id).length;

  const subjectBlocks = lic.subjects.map(s=>{
    const st = state.stats[lic.id][s.id];
    const total = licenseQuestions(lic.id).filter(q=>q.subject===s.id).length;
    const badge = st.total>0 ? `${st.correct}/${st.total} 正解` : '未着手';
    const hasThemes = s.themes && s.themes.length;
    const actions = hasThemes
      ? `<button class="action-chip primary" data-subject="${s.id}" data-mode="test">模擬テスト(${s.themes.length}問)</button>
         <button class="action-chip" data-subject="${s.id}" data-mode="all">全${total}問学習</button>`
      : `<button class="action-chip primary" data-subject="${s.id}" data-mode="all">演習を始める</button>`;
    return `
    <div class="subject-block">
      <div class="subject-block-top">
        <div class="subject-num">${s.no}</div>
        <div class="subject-info">
          <div class="name">${s.name}</div>
          <div class="sub">全${total}問${hasThemes?`(${s.themes.length}テーマ)`:''}</div>
        </div>
        <div class="subject-badge">${badge}</div>
      </div>
      <div class="subject-actions">${actions}</div>
    </div>`;
  }).join('');

  return `
  <header class="top">
    <button class="backlink" id="toHubBtn">‹ 資格一覧に戻る</button>
    <div class="eyebrow">SUBJECT TEST</div>
    <h1>${lic.short}</h1>
    <p>${lic.name}</p>
    ${lic.requirement?`<div class="requirement"><span class="rq-label">受験資格</span>${lic.requirement}</div>`:''}
    ${lic.exemptions&&lic.exemptions.length?`<div class="exempt">
      <button class="ex-toggle${state.showExempt?' open':''}" id="exToggle">
        <span class="ex-label">免除科目</span>
        <span class="ex-hint">${state.showExempt?'閉じる':'他の資格をお持ちの方はこちら'}</span>
        <span class="ex-caret">${state.showExempt?'▲':'▼'}</span>
      </button>
      ${state.showExempt?`<ul>${lic.exemptions.map(e=>`<li>${e}</li>`).join('')}</ul>`:''}
    </div>`:''}
  </header>
  <main>
    <div class="overall">
      <div class="ring" style="--pct:${pct}"><span>${pct}%</span></div>
      <div class="overall-text">
        <div class="label">この資格のこれまでの正答率</div>
        <div class="value">${t.correct} / ${t.total} 問 正解</div>
      </div>
    </div>
    ${subjectBlocks}
    <button class="review-btn" id="reviewBtn" ${missedCount===0?'disabled':''}>
      苦手問題だけ復習する <span class="cnt">(${missedCount}問)</span>
    </button>
    <button class="reset-btn${state.confirmReset?' confirming':''}" id="resetBtn">${state.confirmReset?'本当にリセットしますか？（もう一度タップ）':'この資格の成績をリセットする'}</button>
    ${state.confirmReset?'<button class="reset-cancel" id="resetCancelBtn">キャンセル</button>':''}
    <div class="note">
      「模擬テスト」は各テーマから1問ずつ出題し、本番に近い構成で実力を確認できます。「全問学習」は収録問題をすべて通しで演習します。問題は出題傾向にもとづくオリジナル問題であり、実際の試験問題そのものではありません。
    </div>
  </main>`;
}

function renderQuiz(){
  const q = state.currentQueue[state.currentIndex];
  const lic = getLicense(q.license);
  const meta = subjectMeta(q.license, q.subject);
  const progressPct = Math.round((state.currentIndex/state.currentQueue.length)*100);
  let title = state.isReviewSession ? '苦手問題の復習' : meta.name;
  if(!state.isReviewSession && meta.themes && meta.themes.length){
    title += (state.currentMode==='test' ? '(模擬テスト)' : '(全問学習)');
  }

  const choicesHtml = q.choices.map((c,idx)=>{
    let cls = 'choice';
    if(state.answered){
      if(idx===q.answer) cls += ' correct';
      else if(idx===state.chosenIndex) cls += ' incorrect';
      else cls += ' dim';
    }
    return `<button class="${cls}" data-idx="${idx}" ${state.answered?'disabled':''}>
      <span class="num">(${idx+1})</span><span>${c}</span>
    </button>`;
  }).join('');

  let resultBlock = '';
  if(state.answered){
    const correct = state.chosenIndex === q.answer;
    resultBlock = `
    <div style="margin:16px 16px 0;">
      <span class="result-tag ${correct?'correct':'incorrect'}">${correct?'正解':'不正解'}</span>
    </div>
    <div class="explain">
      <div class="h">EXPLANATION</div>
      ${q.explain}
    </div>
    <button class="next-btn" id="nextBtn">${state.currentIndex<state.currentQueue.length-1?'次の問題へ':'結果を見る'}</button>`;
  }

  return `
  <div class="quiz-header">
    <div class="quiz-topbar">
      <button class="back-btn" id="backBtn">‹ 科目一覧</button>
      <div class="qcount">${title}　${state.currentIndex+1} / ${state.currentQueue.length}</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" style="width:${progressPct}%"></div></div>
  </div>
  <div class="card">
    <div class="subject-tag">${lic.short} — ${meta.name}</div>
    <div class="qtext">${q.q}</div>
    ${renderDiagram(q.diagram)}
    ${choicesHtml}
  </div>
  ${resultBlock}`;
}

function renderResult(){
  const total = state.currentQueue.length;
  const correct = state.sessionCorrect;
  const pct = Math.round(correct/total*100);
  const missed = state.sessionMissed;

  const missedHtml = missed.length>0 ? `
    <div class="missed-list">
      <div class="h">今回間違えた問題</div>
      ${missed.map(q=>`<div class="missed-item">${subjectMeta(q.license,q.subject).name}：${q.q}</div>`).join('')}
    </div>` : '';

  let desc = '';
  if(state.isReviewSession) desc = '苦手問題を克服できたか確認しましょう';
  else if(state.currentSubject){
    const m = subjectMeta(state.currentLicense, state.currentSubject);
    desc = m.name + (state.currentMode==='test' ? 'の模擬テスト結果です' : 'の全問学習結果です');
  }

  return `
  <div class="result-wrap">
    <div class="score-ring" style="--pct:${pct}">
      <div class="inner">
        <div class="big">${correct}/${total}</div>
        <div class="small">${pct}% 正解</div>
      </div>
    </div>
    <h2>${state.isReviewSession ? '復習お疲れさまでした' : 'お疲れさまでした'}</h2>
    <div class="desc">${desc}</div>
    <button class="rbtn primary" id="retryBtn">もう一度挑戦する</button>
    <button class="rbtn secondary" id="homeBtn">科目一覧に戻る</button>
    ${missedHtml}
  </div>`;
}

function render(){
  const app = document.getElementById('app');
  if(state.screen==='hub'){
    app.innerHTML = renderHub();
    document.querySelectorAll('.lic-card[data-license]').forEach(btn=>{
      btn.addEventListener('click', ()=>openLicense(btn.dataset.license));
    });
  } else if(state.screen==='license'){
    app.innerHTML = renderLicense();
    const toHub = document.getElementById('toHubBtn');
    if(toHub) toHub.addEventListener('click', goHub);
    document.querySelectorAll('.action-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>startSubjectQuiz(btn.dataset.subject, btn.dataset.mode));
    });
    const exToggle = document.getElementById('exToggle');
    if(exToggle) exToggle.addEventListener('click', ()=>{
      state.showExempt = !state.showExempt;
      render();
    });
    const reviewBtn = document.getElementById('reviewBtn');
    if(reviewBtn) reviewBtn.addEventListener('click', startReviewQuiz);
    const resetBtn = document.getElementById('resetBtn');
    if(resetBtn) resetBtn.addEventListener('click', ()=>{
      if(state.confirmReset) resetLicenseStats();
      else { state.confirmReset = true; render(); }
    });
    const cancelBtn = document.getElementById('resetCancelBtn');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.confirmReset=false; render(); });
  } else if(state.screen==='quiz'){
    app.innerHTML = renderQuiz();
    document.querySelectorAll('.choice').forEach(btn=>{
      btn.addEventListener('click', ()=>selectChoice(parseInt(btn.dataset.idx,10)));
    });
    const nextBtn = document.getElementById('nextBtn');
    if(nextBtn) nextBtn.addEventListener('click', nextQuestion);
    const backBtn = document.getElementById('backBtn');
    if(backBtn) backBtn.addEventListener('click', ()=>{ state.screen='license'; render(); });
  } else if(state.screen==='result'){
    app.innerHTML = renderResult();
    document.getElementById('retryBtn').addEventListener('click', ()=>{
      if(state.isReviewSession) startReviewQuiz();
      else startSubjectQuiz(state.currentSubject, state.currentMode);
    });
    document.getElementById('homeBtn').addEventListener('click', ()=>{ state.screen='license'; render(); });
  }
}

(async function init(){
  await loadStats();
  render();
})();
</script>
</body>
