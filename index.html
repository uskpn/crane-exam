{license:"sennai", id:"s3_t6_1", subject:"slinging", theme:6, q:"玉掛けのかけ方に関する記述として、正しいものはどれか。", choices:["かけ方の選択は、作業能率のみで決めてよい。","かけ方は、荷の形状にかかわらず同じでよい。","荷の形状・重心・重量に応じて、2点つり・4点つり・あだ巻きなど適切なかけ方を選ぶ。","かけ方は、常に1点つりでよい。","4点つりでは、必ず4本すべてに均等に荷重がかかる。"], answer:2, explain:"荷の形状・重心・重量に応じて適切なかけ方を選ぶことが、荷崩れや落下の防止につながります。"},
{license:"sennai", id:"s3_t6_2", subject:"slinging", theme:6, q:"あだ巻き(半掛けに対する巻き付け)を用いる理由として、正しいものはどれか。", choices:["あだ巻きは、荷を傷つけるために行う。","ワイヤロープを短くするため。","荷を軽くするため。","荷とワイヤロープの間の摩擦を増やし、荷がすべり抜けるのを防ぐため。","作業時間を短縮するため。"], answer:3, explain:"あだ巻きは、荷とワイヤロープの摩擦を増やして荷のすべり抜けを防ぐために行います。"},
{license:"sennai", id:"s3_t6_3", subject:"slinging", theme:6, q:"地切り時の確認に関する記述として、正しいものはどれか。", choices:["地切りは行わず、一気につり上げる。","地切りという手順は存在しない。","地切りで一旦停止し、荷の安定・玉掛けの状態・重心の位置を確認してから本つり上げを行う。","地切り時に荷が傾いても、そのままつり上げてよい。","地切り時の確認は、重い荷の場合のみ必要である。"], answer:2, explain:"地切りで一旦停止し、荷の安定・玉掛け状態・重心位置を確認してから本つり上げを行うのが基本手順です。"},
{license:"sennai", id:"s3_t6_4", subject:"slinging", theme:6, q:"玉掛け作業時の作業者の位置に関する記述として、正しいものはどれか。", choices:["つり荷の直下で状態を見守るのがよい。","荷の移動経路上で待機するのが効率的である。","玉掛け作業者は、常に荷に手を添えて移動させる。","作業者の位置は、荷の安全とは無関係である。","つり荷の下や移動経路に入らず、安全な位置に退避してから合図する。"], answer:4, explain:"つり荷の下や移動経路には立ち入らず、安全な位置に退避してから合図することが原則です。"},
{license:"sennai", id:"s3_t7_1", subject:"slinging", theme:7, q:"長尺物(鋼材・管材等)の玉掛けに関する記述として、正しいものはどれか。", choices:["長尺物は、必ず1本ずつしかつれない。","長尺物のつり位置は、考慮する必要がない。","長尺物は、中央1点でつるのが最も安定する。","2点つり以上とし、つり位置のバランスと抜け落ち防止に注意する。","長尺物でも、短尺物と同じ方法でつればよい。"], answer:3, explain:"長尺物は2点つり以上とし、つり位置のバランスや荷の抜け落ち防止に注意する必要があります。"},
{license:"sennai", id:"s3_t7_2", subject:"slinging", theme:7, q:"円筒形の荷(ドラム・コイル等)の玉掛けに関する記述として、正しいものはどれか。", choices:["円筒形の荷は、転がる性質がないため特別な配慮は不要である。","円筒形の荷は、必ず1点つりとする。","円筒形の荷は、半掛けで十分に安定する。","転がりやすく抜け落ちやすいため、専用のつり具やあだ巻き等ですべり止めの措置を講じる。","専用のつり具は、使用してはならない。"], answer:3, explain:"円筒形の荷は転がりやすく抜け落ちやすいため、専用つり具やあだ巻き等ですべり止めの措置が必要です。"},
{license:"sennai", id:"s3_t7_3", subject:"slinging", theme:7, q:"重心が偏っている荷の玉掛けに関する記述として、正しいものはどれか。", choices:["重心が偏っていても、左右同じ長さのロープでつればよい。","重心の偏りは、つり上げれば自然に解消する。","ワイヤロープの長さを調整するなどして、フックが重心の真上にくるように玉掛けする。","重心が偏った荷は、つり上げてから位置を調整すればよい。","重心の偏りは、玉掛け方法に影響しない。"], answer:2, explain:"重心が偏っている荷は、ロープ長を調整するなどしてフックが重心の真上にくるようにします。"},
{license:"sennai", id:"s3_t7_4", subject:"slinging", theme:7, q:"不定形・ばら物の荷の取扱いに関する記述として、正しいものはどれか。", choices:["ばら物のこぼれ落ちは、防ぎようがない。","不定形の荷は、ワイヤロープで直接縛れば十分である。","ネットの目の大きさは、荷の大きさと無関係でよい。","ネットやバケット等の適切なつり具を用い、荷のこぼれ落ちを防止する。","バケットは、容量を超えて積み込んでもよい。"], answer:3, explain:"不定形・ばら物は、ネットやバケット等の適切なつり具を用い、こぼれ落ちを防止します。"},
{license:"sennai", id:"s3_t8_1", subject:"slinging", theme:8, q:"危険物の玉掛け・取扱いに関する記述として、正しいものはどれか。", choices:["危険物は、性状に応じた取扱方法を確認し、衝撃や摩擦を与えないよう慎重に取り扱う。","危険物の性状は、確認する必要がない。","危険物は、荷役を急ぐことが最も重要である。","危険物も、通常の貨物と同じ方法で取り扱ってよい。","危険物の玉掛けには、当て物や緩衝材は不要である。"], answer:0, explain:"危険物は性状に応じた取扱方法を確認し、衝撃・摩擦を与えないよう慎重に取り扱う必要があります。"},
{license:"sennai", id:"s3_t8_2", subject:"slinging", theme:8, q:"有害物を含む貨物の取扱いに関する記述として、正しいものはどれか。", choices:["有害物であっても、保護具は不要である。","粉じんやガスの発生に応じた保護具を使用し、換気等の措置を講じる。","有害物の情報は、作業者に知らせない方が混乱がない。","換気は、作業終了後に行えばよい。","有害物は、通常の貨物より速く荷役するのがよい。"], answer:1, explain:"有害物を含む貨物では、粉じんやガスの発生に応じた保護具の使用と換気等の措置が必要です。"},
{license:"sennai", id:"s3_t8_3", subject:"slinging", theme:8, q:"高温の貨物の玉掛けに関する記述として、正しいものはどれか。", choices:["高温の貨物は、冷めるまで放置するしか方法がない。","高温の貨物は、玉掛用具の選定に影響しない。","高温の貨物にも、繊維スリングを使用するのが最適である。","繊維スリングは熱に弱いため、つりチェーン等の耐熱性のある用具を選定する。","高温の貨物は、素手で取り扱っても問題ない。"], answer:3, explain:"繊維スリングは熱に弱いため、高温の貨物にはつりチェーン等の耐熱性のある用具を選定します。"},
{license:"sennai", id:"s3_t8_4", subject:"slinging", theme:8, q:"危険物の表示・標識に関する記述として、正しいものはどれか。", choices:["危険物の表示は、荷主のためのものであり作業者には関係ない。","表示が剥がれていても、そのまま取り扱ってよい。","容器の表示やラベルを確認し、内容物と取扱い上の注意を把握してから作業する。","表示やラベルは、確認しなくても支障ない。","表示の確認は、作業終了後に行えばよい。"], answer:2, explain:"容器の表示やラベルを確認し、内容物と取扱い上の注意を把握してから作業することが必要です。"},
{license:"sennai", id:"s3_t9_1", subject:"slinging", theme:9, q:"荷役作業における合図に関する記述として、正しいものはどれか。", choices:["合図を行う者を定め、統一した方法で合図を行わせる。","合図者を定めることは、法令上禁止されている。","合図は、その場にいる誰が行ってもよい。","合図は、作業開始時のみ必要である。","合図の方法は、作業者が各自で決めればよい。"], answer:0, explain:"合図を行う者を定め、統一した方法で合図を行わせることが法令上求められています。"},
{license:"sennai", id:"s3_t9_2", subject:"slinging", theme:9, q:"合図者の位置に関する記述として、正しいものはどれか。", choices:["運転者から見やすく、かつ荷やつり荷の動きが確認できる安全な位置で合図する。","合図者は、つり荷の直下で合図するのがよい。","合図者は、運転者から見えない位置の方がよい。","合図者の位置は、どこでもよい。","合図者は、常に移動しながら合図する。"], answer:0, explain:"合図者は、運転者から見やすく、荷の動きが確認でき、かつ自身が安全な位置で合図します。"},
{license:"sennai", id:"s3_t9_3", subject:"slinging", theme:9, q:"合図が不明確な場合の運転者の対応として、正しいものはどれか。", choices:["不明確でも、自分の判断で操作を続ける。","合図が不明確なときは、速度を上げて作業を終わらせる。","合図の確認は、作業終了後に行えばよい。","直ちに運転を停止し、合図の内容を確認してから作業を再開する。","前回と同じ動作をすればよい。"], answer:3, explain:"合図が不明確なときは直ちに運転を停止し、内容を確認してから再開することが安全確保の基本です。"},
{license:"sennai", id:"s3_t9_4", subject:"slinging", theme:9, q:"合図の方法に関する記述として、正しいものはどれか。", choices:["騒音の大きい場所でも、声による合図のみで十分である。","合図の方法は、作業中に随時変更するのがよい。","無線による合図は、法令上認められていない。","手による合図のほか、笛・旗・無線等が用いられ、作業環境に応じて確実に伝わる方法を選ぶ。","合図は、必ず手による方法でなければならない。"], answer:3, explain:"合図には手・笛・旗・無線等があり、騒音や視界など作業環境に応じて確実に伝わる方法を選び、統一して用います。"},
{license:"sennai", id:"s3_t10_1", subject:"slinging", theme:10, q:"玉掛け作業の資格に関する記述として、正しいものはどれか。", choices:["制限荷重が1トン以上の揚貨装置等で行う玉掛け業務には、玉掛け技能講習の修了が必要である。","玉掛けの資格は、事業者が独自に認定できる。","玉掛け業務には、いかなる資格も不要である。","玉掛け業務は、特別教育のみですべて行える。","玉掛け業務の資格制度は、船内荷役作業には適用されない。"], answer:0, explain:"制限荷重1トン以上の揚貨装置等で行う玉掛け業務には玉掛け技能講習の修了が必要で、1トン未満では特別教育が必要です。"},
{license:"sennai", id:"s3_t10_2", subject:"slinging", theme:10, q:"玉掛け作業における声かけ・確認に関する記述として、正しいものはどれか。", choices:["退避の確認は、つり上げた後に行えばよい。","つり上げ前に周囲の作業者へ声をかけ、退避を確認してから合図する。","周囲の作業者の位置は、運転者だけが確認すればよい。","声かけは、新人作業者のみが行えばよい。","周囲への声かけは、作業能率を下げるため不要である。"], answer:1, explain:"つり上げ前に周囲へ声をかけ、作業者の退避を確認してから合図することが基本です。"},
{license:"sennai", id:"s3_t10_3", subject:"slinging", theme:10, q:"玉掛用具の使用禁止基準に関する記述として、誤っているものはどれか。", choices:["キンクしたワイヤロープは使用できない。","著しい形くずれや腐食があるワイヤロープは使用できない。","直径の減少が公称径の7%を超えるワイヤロープは使用できない。","エンドレスでないワイヤロープで、両端にフック・シャックル・リング又はアイのいずれも備えていないものでも使用できる。","1よりの間で素線数の10%以上が切断したワイヤロープは使用できない。"], answer:3, explain:"エンドレスでないワイヤロープで、両端にフック・シャックル・リング又はアイのいずれも備えていないものは、玉掛用具として使用が禁止されています。"},
{license:"sennai", id:"s3_t10_4", subject:"slinging", theme:10, q:"玉掛け作業の安全確保に関する記述として、正しいものはどれか。", choices:["玉掛けは、経験と勘のみで行えば十分である。","荷の質量が不明でも、とりあえずつり上げて確認すればよい。","荷の質量・重心・形状を把握し、適切な用具とかけ方を選び、地切りで確認したうえで安全な位置から合図する。","玉掛け作業者は、合図をせず自分のタイミングで運転者に任せればよい。","地切りの確認は省略し、一気につり上げる方が安全である。"], answer:2, explain:"荷の質量・重心・形状の把握、適切な用具とかけ方の選定、地切りでの確認、安全な位置からの合図が玉掛け作業の基本です。"},
{license:"sennai", id:"s4_t1_1", subject:"cargo", theme:1, q:"段違い作業に関する記述として、正しいものはどれか。", choices:["段違い作業は、荷を平らに積んだ状態での作業をいう。","段違い作業には、墜落の危険はない。","段違い作業は、荷役作業には存在しない用語である。","積み荷の高さに差がある状態での作業をいい、墜落・転落や荷崩れの危険があるため特に注意が必要である。","段違い作業とは、船倉の底で行う作業のみをいう。"], answer:3, explain:"段違い作業は積み荷の高さに差がある状態での作業で、墜落・転落や荷崩れの危険が高い作業です。"},
{license:"sennai", id:"s4_t1_2", subject:"cargo", theme:1, q:"段違い作業における墜落防止措置として、正しいものはどれか。", choices:["段差があっても、飛び降りれば問題ない。","段差の高さは、危険性に関係しない。","墜落防止措置は、作業者の希望があるときのみ講じる。","段違いの箇所には、特段の措置は不要である。","高さの差が大きい箇所では、昇降設備の設置や要求性能墜落制止用器具の使用等の措置を講じる。"], answer:4, explain:"高さの差が大きい箇所では、昇降設備の設置や要求性能墜落制止用器具の使用等の墜落防止措置が必要です。"},
{license:"sennai", id:"s4_t1_3", subject:"cargo", theme:1, q:"段違い作業における荷崩れ防止に関する記述として、正しいものはどれか。", choices:["段の端部の荷は、できるだけ高く積むのがよい。","荷崩れの確認は、作業終了後に行えばよい。","段の端部の荷は、崩れても危険はない。","段の端部にある荷が崩れ落ちないよう、積付けの状態を確認し、必要に応じて固定する。","荷崩れは、段違い作業とは無関係である。"], answer:3, explain:"段の端部の荷が崩れ落ちると下方の作業者に重大な危険が及ぶため、積付け状態の確認と必要な固定が重要です。"},
{license:"sennai", id:"s4_t1_4", subject:"cargo", theme:1, q:"段違い作業における作業者の配置に関する記述として、正しいものはどれか。", choices:["上下で同時に作業を行う場合は、落下物による危険があるため、作業区域を分けるか時間差を設ける。","上下同時作業では、保護帽があれば十分である。","上下同時の作業は、能率がよいので積極的に行うべきである。","上方から物が落ちても、下方の作業者が注意すれば防げる。","作業者の上下の位置関係は、考慮する必要がない。"], answer:0, explain:"上下同時作業は落下物による災害の危険が高いため、作業区域を分けるか時間差を設けることが必要です。"},
{license:"sennai", id:"s4_t2_1", subject:"cargo", theme:2, q:"船内における高所作業に関する記述として、正しいものはどれか。", choices:["墜落のおそれのある高所では、作業床や手すりの設置、要求性能墜落制止用器具の使用等の措置を講じる。","高所作業でも、慣れた作業者であれば措置は不要である。","高所作業では、作業床を設けてはならない。","高所作業の危険は、保護帽のみで防止できる。","高所とは、地上10m以上の場所のみをいう。"], answer:0, explain:"墜落のおそれのある高所では、作業床や手すりの設置、要求性能墜落制止用器具の使用等の措置が必要です。"},
{license:"sennai", id:"s4_t2_2", subject:"cargo", theme:2, q:"高所作業における工具・材料の取扱いに関する記述として、正しいものはどれか。", choices:["工具は、下方へ投げ降ろすのが効率的である。","小さな工具であれば、落下しても危険はない。","工具の落下防止は、法令上も実務上も不要である。","高所から物を降ろすときは、合図なしで行ってよい。","工具や材料を落下させないよう、工具袋の使用や落下防止措置を講じる。"], answer:4, explain:"高所からの工具・材料の落下は重大災害につながるため、工具袋の使用や落下防止措置が必要です。"},
{license:"sennai", id:"s4_t2_3", subject:"cargo", theme:2, q:"高所作業と天候の関係に関する記述として、正しいものはどれか。", choices:["強風は、高所作業の危険性に影響しない。","天候による作業中止は、事業者の許可がなければ一切できない。","強風・大雨・降雪等により危険が予想されるときは、高所作業を中止する。","雨天時は、滑りやすくなるが作業性には影響しない。","天候が悪くても、高所作業は予定どおり行うべきである。"], answer:2, explain:"強風・大雨・降雪等により危険が予想されるときは、高所作業を中止する必要があります。"},
{license:"sennai", id:"s4_t2_4", subject:"cargo", theme:2, q:"高所からの昇降に関する記述として、正しいものはどれか。", choices:["片手に工具を持ちながら昇降しても問題ない。","安全な昇降設備を用い、手に物を持たずに三点支持を保ちながら昇降する。","昇降設備の状態は、点検する必要がない。","昇降は、荷につかまって行えばよい。","昇降は、急いで行うほど安全である。"], answer:1, explain:"昇降は安全な昇降設備を用い、手に物を持たず三点支持を保って行うことが基本です。"},
{license:"sennai", id:"s4_t3_1", subject:"cargo", theme:3, q:"巻出し作業に関する記述として、正しいものはどれか。", choices:["船倉の隅など、つり具が直接届かない場所から荷を作業位置まで移動させる作業をいう。","巻出し作業とは、ワイヤロープを巻き取る作業をいう。","巻出し作業には、危険はない。","巻出し作業は、荷役作業には存在しない。","巻出し作業とは、荷を船倉から陸上へ直接つり上げる作業のみをいう。"], answer:0, explain:"巻出し作業は、つり具が直接届かない船倉の隅等から荷を作業位置まで移動させる作業です。"},
{license:"sennai", id:"s4_t3_2", subject:"cargo", theme:3, q:"巻出し作業の危険性に関する記述として、正しいものはどれか。", choices:["巻出し作業の危険性は、荷の重量とは無関係である。","荷が斜めに引かれるため、索に過大な張力がかかったり、荷が急激に振れたりする危険がある。","巻出し作業では、索の張力は通常より小さくなる。","荷が斜めに引かれても、危険はない。","巻出し作業では、荷の振れは発生しない。"], answer:1, explain:"巻出し作業では荷が斜めに引かれるため、索に過大な張力がかかり、荷が急激に振れる危険があります。"},
{license:"sennai", id:"s4_t3_3", subject:"cargo", theme:3, q:"巻出し作業における作業者の位置に関する記述として、正しいものはどれか。", choices:["荷が振れる方向は予測できないため、位置を考えても意味がない。","荷の進行方向で待ち構えるのがよい。","荷が急に振れたときに備え、索の内側や荷の進行方向には立たないようにする。","作業者の位置は、巻出し作業では考慮しなくてよい。","索の内側は、作業しやすいため最適な位置である。"], answer:2, explain:"巻出し作業では荷が急に振れることがあるため、索の内側や荷の進行方向に立たないことが重要です。"},
{license:"sennai", id:"s4_t3_4", subject:"cargo", theme:3, q:"巻出し作業に用いる用具に関する記述として、正しいものはどれか。", choices:["用具を使わず人力で引く方が安全である。","巻出し作業では、常に直接横引きするのがよい。","スナッチブロックは、船内荷役作業では使用できない。","スナッチブロック等を用いて索の方向を変え、無理な横引きにならないようにする。","索の方向は、作業に影響しない。"], answer:3, explain:"スナッチブロック等で索の方向を変え、無理な横引きにならないようにすることが安全な巻出し作業の要点です。"},
{license:"sennai", id:"s4_t4_1", subject:"cargo", theme:4, q:"引込み作業に関する記述として、正しいものはどれか。", choices:["引込み作業では、索に斜め方向の力はかからない。","引込み作業とは、船を岸壁に引き寄せる作業をいう。","ハッチ口の真下以外の場所へ荷を移動させる作業で、索に斜め方向の力がかかるため注意が必要である。","引込み作業は、ハッチ口の真下でのみ行う作業である。","引込み作業には、特別な注意は不要である。"], answer:2, explain:"引込み作業はハッチ口の真下以外へ荷を移動させる作業で、索に斜め方向の力がかかるため注意が必要です。"},
{license:"sennai", id:"s4_t4_2", subject:"cargo", theme:4, q:"引込み作業時の荷の振れに関する記述として、正しいものはどれか。", choices:["振れを止めるため、作業者が手で荷を押さえるのが基本である。","荷の振れは、引込み作業では発生しない。","荷の振れは、速く操作すれば防止できる。","荷が振れて船体や他の荷に衝突するおそれがあるため、速度を抑え、振れを抑制しながら作業する。","荷が船体に衝突しても、問題はない。"], answer:3, explain:"引込み作業では荷の振れによる衝突のおそれがあるため、速度を抑え振れを抑制しながら作業します。"},
{license:"sennai", id:"s4_t4_3", subject:"cargo", theme:4, q:"引込み作業における合図に関する記述として、正しいものはどれか。", choices:["合図は、荷が動き始めてから行えばよい。","運転者から荷の位置が見えにくくなるため、合図者を配置し確実な合図で作業を進める。","引込み作業では、合図は不要である。","合図者は、荷の直下に位置するのがよい。","運転者が見えなくても、玉掛け者の判断で作業を進めればよい。"], answer:1, explain:"引込み作業では運転者から荷の位置が見えにくくなるため、合図者を配置し確実な合図で作業を進めます。"},
{license:"sennai", id:"s4_t4_4", subject:"cargo", theme:4, q:"引込み作業と横引きに関する記述として、正しいものはどれか。", choices:["横引きをしても、索の張力は変わらない。","横引きは、引込み作業の基本的な方法として推奨される。","横引きは、荷が軽ければ常に安全である。","横引きによる危険は、認識されていない。","巻上げ索による無理な横引きは索の破断や荷の急激な振れを招くため、避けなければならない。"], answer:4, explain:"巻上げ索による無理な横引きは索の破断や荷の急激な振れを招くため、避けなければなりません。"},
{license:"sennai", id:"s4_t5_1", subject:"cargo", theme:5, q:"積付け作業の基本に関する記述として、正しいものはどれか。", choices:["重い荷を下に、軽い荷を上に積むなど、荷崩れが生じないよう安定した積付けを行う。","積付けは、できるだけ高く積むことを優先する。","軽い荷を下に、重い荷を上に積むのが基本である。","積付けの方法は、作業者が自由に決めてよい。","積付けの順序は、荷の安定性に影響しない。"], answer:0, explain:"重い荷を下、軽い荷を上に積むなど、荷崩れが生じないよう安定した積付けを行うことが基本です。"},
{license:"sennai", id:"s4_t5_2", subject:"cargo", theme:5, q:"船体の動揺を考慮した積付けに関する記述として、正しいものはどれか。", choices:["船体の動揺は、積付けには影響しない。","積付け後の荷の移動は、防ぐ方法がない。","固縛は、重量物の場合にのみ必要である。","荷は自重で安定するため、固縛は不要である。","航海中の動揺により荷が移動しないよう、固縛(ラッシング)や中詰め等の措置を講じる。"], answer:4, explain:"航海中の船体動揺により荷が移動しないよう、固縛や中詰め等の措置を講じる必要があります。"},
{license:"sennai", id:"s4_t5_3", subject:"cargo", theme:5, q:"積付け時の隙間(空間)に関する記述として、正しいものはどれか。", choices:["隙間は、荷役作業の効率のみを考えて決めればよい。","中詰めは、行ってはならない措置である。","隙間は、荷の通気のために大きくとるのがよい。","隙間の大きさは、荷崩れとは無関係である。","荷の間に大きな隙間があると航海中に荷が移動するため、中詰め等で隙間を埋める。"], answer:4, explain:"荷の間の大きな隙間は航海中の荷の移動の原因となるため、中詰め等で埋めることが必要です。"},
{license:"sennai", id:"s4_t5_4", subject:"cargo", theme:5, q:"積付け作業における作業者の安全に関する記述として、正しいものはどれか。", choices:["積付け作業中は、荷の高さを考慮しなくてよい。","荷の上での作業には、墜落防止措置は不要である。","積付け中の荷の上での作業は不安定であるため、足場や墜落防止措置を講じる。","荷の上での作業は、作業者の慣れに任せればよい。","積み上げた荷の上は平らなので、安全に作業できる。"], answer:2, explain:"積付け中の荷の上は不安定であり、足場の確保や墜落防止措置を講じる必要があります。"},
{license:"sennai", id:"s4_t6_1", subject:"cargo", theme:6, q:"取り卸し作業に関する記述として、正しいものはどれか。", choices:["積付けの状態を確認し、上段から順に、荷崩れが生じない順序で取り卸す。","荷崩れのおそれがあっても、作業を優先する。","取り卸しの順序は、荷の安定性に影響しない。","取り卸しは、どこから始めてもよい。","取り卸しは、下段から抜き取るのが効率的である。"], answer:0, explain:"取り卸しは積付け状態を確認し、上段から順に荷崩れが生じない順序で行います。下段から抜き取ると崩壊の危険があります。"},
{license:"sennai", id:"s4_t6_2", subject:"cargo", theme:6, q:"取り卸し中に荷崩れのおそれを発見した場合の対応として、正しいものはどれか。", choices:["荷崩れのおそれは、作業終了後に報告すればよい。","荷崩れのおそれは、判断が難しいため無視してよい。","直ちに作業を中止し、作業者を退避させたうえで、安全な方法を検討する。","そのまま作業を続け、崩れたら対応する。","作業者を荷の近くに配置して支えさせる。"], answer:2, explain:"荷崩れのおそれを発見した場合は直ちに作業を中止し、作業者を退避させたうえで安全な方法を検討します。"},
{license:"sennai", id:"s4_t6_3", subject:"cargo", theme:6, q:"崩れかけた荷(はい)の処理に関する記述として、正しいものはどれか。", choices:["崩れかけた荷の下で作業を続けてよい。","作業者が人力で押さえて崩れを止めるのが最も早い。","崩れかけた荷は、放置しておけば自然に安定する。","崩れかけた荷は、勢いよく引き抜くとよい。","人力で無理に押さえようとせず、荷役機械やロープ等を用いて安全な方法で処理する。"], answer:4, explain:"崩れかけた荷を人力で押さえようとすることは極めて危険であり、荷役機械やロープ等で安全に処理します。"},
{license:"sennai", id:"s4_t6_4", subject:"cargo", theme:6, q:"取り卸し作業における立入禁止措置に関する記述として、正しいものはどれか。", choices:["危険区域でも、作業者が注意すれば立ち入ってよい。","立入禁止措置は、陸上作業にのみ必要である。","立入禁止区域は、作業終了後に設定すればよい。","荷の落下や荷崩れのおそれがある区域には、関係者以外を立ち入らせない。","立入禁止の表示は、必要ない。"], answer:3, explain:"荷の落下や荷崩れのおそれがある区域には、関係者以外の立入りを禁止する措置が必要です。"},
{license:"sennai", id:"s4_t7_1", subject:"cargo", theme:7, q:"バケット作業に関する記述として、正しいものはどれか。", choices:["ばら貨物をグラブバケット等で積卸しする作業で、バケットの下や旋回範囲に立ち入らないようにする。","バケット作業では、作業者の位置を考慮する必要がない。","バケットの旋回範囲内で作業するのが効率的である。","バケット作業は、袋物専用の荷役方法である。","バケットの下は、荷がよく見えるため安全な位置である。"], answer:0, explain:"バケット作業では、バケットの下や旋回範囲への立入りを禁止することが重要です。"},
{license:"sennai", id:"s4_t7_2", subject:"cargo", theme:7, q:"バケットへの積込み量に関する記述として、正しいものはどれか。", choices:["容量を超えて過積みすると、こぼれ落ちや過負荷の原因となるため、適正な量とする。","バケットの容量は、作業能率とは無関係である。","こぼれ落ちは、防止できない現象である。","過積みをしても、荷役機械には影響しない。","バケットは、こぼれる直前まで積み込むのが効率的である。"], answer:0, explain:"バケットへの過積みはこぼれ落ちや過負荷の原因となるため、適正な量とする必要があります。"},
{license:"sennai", id:"s4_t7_3", subject:"cargo", theme:7, q:"バケット作業における粉じん対策に関する記述として、正しいものはどれか。", choices:["粉じんは、目に見えなければ問題ない。","粉じんが発生する貨物では、防じんマスク等の保護具を使用し、必要に応じて散水等の措置を講じる。","防じんマスクは、作業者の任意で使用すればよい。","バケット作業では、粉じんは発生しない。","粉じん対策は、作業終了後に行えばよい。"], answer:1, explain:"粉じんが発生する貨物では、防じんマスク等の保護具の使用と、必要に応じた散水等の措置が必要です。"},
{license:"sennai", id:"s4_t7_4", subject:"cargo", theme:7, q:"バケット作業と船倉内作業者の関係に関する記述として、正しいものはどれか。", choices:["バケットと作業者の距離は、考慮しなくてよい。","船倉内の作業者の位置は、運転者が把握する必要はない。","船倉内に作業者がいる場合は、バケットの動作範囲と作業者の位置を明確に分離し、合図により作業を進める。","バケットの動作範囲内でも、作業者が注意すれば作業してよい。","バケット作業中は、合図は不要である。"], answer:2, explain:"バケットの動作範囲と作業者の位置を明確に分離し、合図により作業を進めることが不可欠です。"},
{license:"sennai", id:"s4_t8_1", subject:"cargo", theme:8, q:"危険物の荷役に関する記述として、正しいものはどれか。", choices:["危険物の性状は、荷役の方法に影響しない。","危険物は、荷役を急いで早く終わらせることが最も重要である。","危険物の荷役中でも、喫煙は差し支えない。","危険物も、通常の貨物と同じ方法で荷役してよい。","火気の使用を禁止し、衝撃や摩擦を避け、性状に応じた取扱方法により荷役する。"], answer:4, explain:"危険物の荷役では火気の使用を禁止し、衝撃・摩擦を避け、性状に応じた取扱方法で行う必要があります。"},
{license:"sennai", id:"s4_t8_2", subject:"cargo", theme:8, q:"酸素欠乏のおそれがある船倉での作業に関する記述として、正しいものはどれか。", choices:["立入り前に酸素濃度等を測定し、換気を行うとともに、必要な保護具を準備する。","酸素欠乏のおそれがある場所でも、通常どおり立ち入ってよい。","酸素濃度の測定は、異常を感じてから行えばよい。","換気をすれば、測定は不要である。","船倉は外気とつながっているため、酸素欠乏は起こらない。"], answer:0, explain:"酸素欠乏のおそれがある船倉では、立入り前の酸素濃度等の測定と換気、必要な保護具の準備が不可欠です。"},
{license:"sennai", id:"s4_t8_3", subject:"cargo", theme:8, q:"有害物を含む貨物の荷役における健康障害防止措置として、誤っているものはどれか。", choices:["適切な保護具を使用させる。","貨物の性状と取扱い上の注意を作業者に周知する。","作業時間や休憩について配慮する。","健康障害は自覚症状が出てから対応すれば十分である。","作業場所の換気を行う。"], answer:3, explain:"有害物による健康障害は自覚症状が出たときには進行していることがあり、事前の予防措置が重要です。"},
{license:"sennai", id:"s4_t8_4", subject:"cargo", theme:8, q:"危険物の混載・隔離に関する記述として、正しいものはどれか。", choices:["混載の可否は、荷役作業には関係しない。","危険物は、できるだけ密集させて積むのがよい。","危険物は、種類にかかわらず同じ場所に積んでよい。","危険物の隔離は、航海中のみ必要である。","相互に反応するおそれのある危険物は、混載を避け、適切に隔離して積み付ける。"], answer:4, explain:"相互に反応するおそれのある危険物は混載を避け、適切に隔離して積み付ける必要があります。"},
{license:"sennai", id:"s4_t9_1", subject:"cargo", theme:9, q:"長尺物の荷役に関する記述として、正しいものはどれか。", choices:["介添えロープは、使用してはならない。","長尺物は、作業者が直接手で支えて誘導するのがよい。","2点以上でつり、振れ回りによる衝突に注意しながら、介添えロープ等で方向を制御する。","長尺物は、中央1点でつるのが基本である。","長尺物の振れ回りは、発生しない。"], answer:2, explain:"長尺物は2点以上でつり、振れ回りによる衝突に注意し、介添えロープ等で方向を制御します。直接手で支えるのは危険です。"},
{license:"sennai", id:"s4_t9_2", subject:"cargo", theme:9, q:"重量物の荷役に関する記述として、正しいものはどれか。", choices:["荷の重量は、おおよその見当で判断すればよい。","荷役機械と玉掛用具の能力が荷の重量に対し十分であることを確認し、慎重に作業する。","重量物は、素早く荷役するほど安全である。","重量物の荷役では、能力の確認は不要である。","重量物も、通常の荷と同じ用具で荷役してよい。"], answer:1, explain:"重量物では荷役機械と玉掛用具の能力が荷重に対して十分であることを確認し、慎重に作業する必要があります。"},
{license:"sennai", id:"s4_t9_3", subject:"cargo", theme:9, q:"円筒形貨物(ドラム・コイル等)の荷役に関する記述として、正しいものはどれか。", choices:["専用のつり具は、円筒形貨物には使用できない。","円筒形貨物は、平置きにすれば自然に安定する。","円筒形貨物は、転がして移動させるのが最も安全である。","円筒形貨物は、転がる性質がないため固定は不要である。","転がり出さないよう歯止め(チョーク)等で固定し、専用のつり具を用いる。"], answer:4, explain:"円筒形貨物は転がり出さないよう歯止め等で固定し、専用のつり具を用いて荷役します。"},
{license:"sennai", id:"s4_t9_4", subject:"cargo", theme:9, q:"特殊な形状の貨物の荷役に関する記述として、正しいものはどれか。", choices:["重心が偏っていたり不安定な形状のものは、事前に荷姿と重心を確認し、つり方を検討する。","重心の偏りは、つり上げれば自然に解消する。","特殊形状の貨物は、つり上げながら方法を考えればよい。","荷姿の確認は、荷役の安全とは無関係である。","形状が特殊でも、通常と同じつり方でよい。"], answer:0, explain:"特殊な形状の貨物は、事前に荷姿と重心を確認したうえで、つり方を十分に検討することが必要です。"},
{license:"sennai", id:"s4_t10_1", subject:"cargo", theme:10, q:"ばら貨物の荷役に関する記述として、正しいものはどれか。", choices:["ばら貨物では、埋没災害は起こり得ない。","ばら貨物は、崩れても軽いので危険はない。","ばら貨物の荷役では、作業者の位置を考慮しなくてよい。","貨物の崩落や埋没のおそれがあるため、作業者を貨物の斜面の下方に立ち入らせないようにする。","ばら貨物の斜面の下は、作業しやすい安全な位置である。"], answer:3, explain:"ばら貨物は崩落・埋没のおそれがあるため、貨物の斜面の下方に作業者を立ち入らせないことが重要です。"},
{license:"sennai", id:"s4_t10_2", subject:"cargo", theme:10, q:"コンテナの荷役に関する記述として、正しいものはどれか。", choices:["スプレッダの係合状態は、確認しなくてよい。","コンテナの荷役では、作業者は上部に乗って誘導する。","コンテナは、ワイヤロープで胴を巻いてつるのが基本である。","四隅のコーナー金具に専用のつり具(スプレッダ)を確実に係合させてから、つり上げる。","コンテナは、どの位置からつっても安定する。"], answer:3, explain:"コンテナは四隅のコーナー金具に専用のスプレッダを確実に係合させてからつり上げます。"},
{license:"sennai", id:"s4_t10_3", subject:"cargo", theme:10, q:"袋物・紙袋類の荷役に関する記述として、正しいものはどれか。", choices:["袋物は柔らかいので、どのように積んでも崩れない。","荷崩れしやすいため、積み方を工夫し、ネットやパレット等を用いて安定させる。","袋物は、できるだけ高く積むのがよい。","袋物の荷崩れは、危険性が低いため考慮不要である。","袋物にはネットやパレットを使用してはならない。"], answer:1, explain:"袋物・紙袋類は荷崩れしやすいため、積み方を工夫し、ネットやパレット等で安定させます。"},
{license:"sennai", id:"s4_t10_4", subject:"cargo", theme:10, q:"荷役作業全般における安全確保に関する記述として、誤っているものはどれか。", choices:["作業者の位置と荷の移動経路を明確に分離する。","合図者を定め、統一した合図により作業を進める。","作業条件が変わったときは、作業方法を再検討する。","作業能率を最優先し、安全確認の手順は状況に応じて省略する。","貨物の種類・形状に応じた荷役方法と用具を選定する。"], answer:3, explain:"安全確認の手順を作業能率のために省略することは、重大災害につながるため認められません。"},
{license:"sennai", id:"s5_t1_1", subject:"law", theme:1, q:"船内荷役作業主任者を選任しなければならない作業に関する記述として、正しいものはどれか。", choices:["すべての陸上の荷役作業","船舶に荷を積み、船舶から荷を卸し、又は船舶において荷を移動させる作業(総トン数500トン未満の船舶で揚貨装置を用いないで行うものを除く)","倉庫内での荷の整理作業のみ","船舶の運航そのもの","船舶の修理作業のみ"], answer:1, explain:"船内荷役作業主任者は、船舶への荷の積卸し・船内での荷の移動作業(総トン数500トン未満で揚貨装置を用いないものを除く)について選任が必要です。"},
{license:"sennai", id:"s5_t1_2", subject:"law", theme:1, q:"作業主任者の選任に関する事業者の義務として、正しいものはどれか。", choices:["作業主任者の氏名は、公表してはならない。","技能講習を修了した者のうちから作業主任者を選任し、その氏名及び職務を作業場の見やすい箇所に掲示する等により関係労働者に周知する。","作業主任者の選任は、事業者の任意である。","作業主任者を選任すれば、周知は不要である。","作業主任者は、作業者の互選で決めればよい。"], answer:1, explain:"事業者は技能講習修了者から作業主任者を選任し、その氏名及び職務を関係労働者に周知しなければなりません。"},
{license:"sennai", id:"s5_t1_3", subject:"law", theme:1, q:"船内荷役作業主任者の職務として、法令上定められていないものはどれか。", choices:["要求性能墜落制止用器具等及び保護具の使用状況を監視すること。","器具、工具、要求性能墜落制止用器具等及び保護具の機能を点検し、不良品を取り除くこと。","作業に従事する労働者に対し、必要な指示を行うこと。","船舶の運航計画を決定し、出港の可否を判断すること。","作業の方法及び労働者の配置を決定し、作業を直接指揮すること。"], answer:3, explain:"船舶の運航計画の決定や出港の可否の判断は船長等の職務であり、船内荷役作業主任者の職務ではありません。"},
{license:"sennai", id:"s5_t1_4", subject:"law", theme:1, q:"船内荷役作業主任者技能講習の受講資格に関する記述として、正しいものはどれか。", choices:["揚貨装置・クレーン・移動式クレーン・デリックの運転士免許を受けた後、一定年数以上船内荷役作業の業務に従事した経験を有する者などが対象となる。","受講資格に関する定めはなく、誰でも受講できる。","受講には、大学卒業の学歴が必要である。","受講資格は、年齢のみで判断される。","受講には、船長の資格が必要である。"], answer:0, explain:"揚貨装置等の運転士免許取得後に一定年数以上の船内荷役作業の実務経験を有する者などが受講資格の対象となります。"},
{license:"sennai", id:"s5_t2_1", subject:"law", theme:2, q:"揚貨装置の運転業務の就業制限に関する記述として、正しいものはどれか。", choices:["揚貨装置の運転資格は、事業者が独自に認定できる。","制限荷重5トン未満の揚貨装置の運転にも、免許が必要である。","揚貨装置の運転には、資格は不要である。","制限荷重が5トン以上の揚貨装置の運転業務には、揚貨装置運転士免許が必要である。","制限荷重にかかわらず、特別教育のみで運転できる。"], answer:3, explain:"制限荷重5トン以上の揚貨装置の運転には揚貨装置運転士免許が必要で、5トン未満のものは特別教育の修了が必要です。"},
{license:"sennai", id:"s5_t2_2", subject:"law", theme:2, q:"制限荷重5トン未満の揚貨装置の運転業務に関する記述として、正しいものはどれか。", choices:["揚貨装置運転士免許が必要である。","技能講習の修了が必要である。","船員のみが行うことができる。","当該業務に関する安全のための特別の教育を行わなければならない。","いかなる教育も必要ない。"], answer:3, explain:"制限荷重5トン未満の揚貨装置の運転業務には、安全のための特別の教育が必要です。"},
{license:"sennai", id:"s5_t2_3", subject:"law", theme:2, q:"玉掛け業務の就業制限に関する記述として、正しいものはどれか。", choices:["玉掛け業務は、すべて特別教育のみで行える。","制限荷重1トン以上の揚貨装置等で行う玉掛け業務には、玉掛け技能講習の修了が必要である。","玉掛け業務の資格は、船内荷役作業には適用されない。","玉掛け業務には、資格は一切不要である。","玉掛け業務には、揚貨装置運転士免許が必要である。"], answer:1, explain:"制限荷重1トン以上の揚貨装置等で行う玉掛け業務には玉掛け技能講習の修了が必要です。"},
{license:"sennai", id:"s5_t2_4", subject:"law", theme:2, q:"就業制限業務への配置に関する記述として、正しいものはどれか。", choices:["有資格者の立会いがあれば、無資格者が単独で作業してよい。","就業制限は、緊急時には適用されない。","就業制限業務の資格は、事業者が任意に判断できる。","経験が長ければ、無資格者を就業制限業務に就かせてよい。","事業者は、就業制限業務に、必要な資格を有しない者を就かせてはならない。"], answer:4, explain:"事業者は、法令で定める資格を有しない者を就業制限業務に就かせてはなりません。"},
{license:"sennai", id:"s5_t3_1", subject:"law", theme:3, q:"揚貨装置の定期自主検査に関する記述として、正しいものはどれか。", choices:["1年以内ごとに1回、定期に自主検査を行わなければならない。","揚貨装置には、定期自主検査の規定がない。","定期自主検査は、5年に1回でよい。","3年以内ごとに1回行えばよい。","定期自主検査は、事業者の任意である。"], answer:0, explain:"揚貨装置については、1年以内ごとに1回、定期に自主検査を行わなければなりません。"},
{license:"sennai", id:"s5_t3_2", subject:"law", theme:3, q:"揚貨装置の作業開始前の点検に関する記述として、正しいものはどれか。", choices:["作業開始前の点検は、任意で省略できる。","その日の作業を開始する前に、制動装置、操作装置、ワイヤロープ等の機能について点検を行わなければならない。","点検は、揚貨装置運転士以外が行ってはならない。","点検は、異常を感じたときのみ行えばよい。","点検は、1か月に1回行えばよい。"], answer:1, explain:"揚貨装置を用いて作業を行うときは、その日の作業開始前に制動装置・操作装置・ワイヤロープ等の機能を点検しなければなりません。"},
{license:"sennai", id:"s5_t3_3", subject:"law", theme:3, q:"定期自主検査の結果の記録に関する記述として、正しいものはどれか。", choices:["自主検査の結果は、記録してはならない。","記録の保存期間についての定めはない。","記録は必要だが、保存する必要はない。","自主検査の結果を記録し、3年間保存しなければならない。","記録は1か月保存すれば足りる。"], answer:3, explain:"定期自主検査の結果は記録し、3年間保存しなければなりません。"},
{license:"sennai", id:"s5_t3_4", subject:"law", theme:3, q:"点検・検査で異常を認めたときの措置に関する記述として、正しいものはどれか。", choices:["直ちに補修その他必要な措置を講じなければならない。","措置の要否は、作業者の判断に任せてよい。","異常の程度が軽い場合は、記録のみで足りる。","次回の定期自主検査までに補修すればよい。","異常があっても、作業に支障がなければ措置は不要である。"], answer:0, explain:"点検・検査で異常を認めたときは、直ちに補修その他必要な措置を講じなければなりません。"},
{license:"sennai", id:"s5_t4_1", subject:"law", theme:4, q:"玉掛け用ワイヤロープの安全係数に関する記述として、正しいものはどれか。", choices:["玉掛け用ワイヤロープに、安全係数の規定はない。","安全係数は6以上でなければ使用してはならない。","安全係数は4以上であればよい。","安全係数は10以上でなければならない。","安全係数は3以上であればよい。"], answer:1, explain:"玉掛け用ワイヤロープの安全係数は6以上でなければ使用できません。"},
{license:"sennai", id:"s5_t4_2", subject:"law", theme:4, q:"玉掛け用フック又はシャックルの安全係数に関する記述として、正しいものはどれか。", choices:["フックやシャックルには、安全係数の規定がない。","安全係数は6以上でなければならない。","安全係数は3以上であればよい。","安全係数は5以上でなければ使用してはならない。","安全係数は、ワイヤロープと同一の値である。"], answer:3, explain:"玉掛け用フック又はシャックルの安全係数は5以上でなければ使用できません。"},
{license:"sennai", id:"s5_t4_3", subject:"law", theme:4, q:"使用が禁止されるワイヤロープに関する記述として、誤っているものはどれか。", choices:["製造から1年以上経過しているもの","1よりの間において素線数の10%以上の素線が切断しているもの","著しい形くずれ又は腐食があるもの","キンクしたもの","直径の減少が公称径の7%を超えるもの"], answer:0, explain:"製造からの経過年数そのものは法令上の使用禁止事由ではありません。素線切れ・径の減少・キンク・形くずれ・腐食が基準となります。"},
{license:"sennai", id:"s5_t4_4", subject:"law", theme:4, q:"つりチェーンの使用禁止基準に関する記述として、正しいものはどれか。", choices:["つりチェーンは、伸びても強度に影響しない。","つりチェーンには、伸びに関する基準はない。","伸びが50%を超えなければ使用できる。","伸びが製造されたときの長さの5%を超えるものは使用してはならない。","伸びが1%を超えるものは使用してはならない。"], answer:3, explain:"つりチェーンは、伸びが製造時の長さの5%を超えるものは使用が禁止されています。"},
{license:"sennai", id:"s5_t5_1", subject:"law", theme:5, q:"揚貨装置によりつり上げられている荷の下への立入りに関する記述として、正しいものはどれか。", choices:["荷の下に労働者を立ち入らせてはならない場合が法令で定められている。","つり荷の下への立入りは、常に自由である。","つり荷の下は、玉掛け者に限り安全である。","立入り制限は、陸上のクレーンにのみ適用される。","立入り制限に関する規定は存在しない。"], answer:0, explain:"ハッカーや磁力による吸着つり具の使用時、1箇所つりの場合など、つり荷の下への立入りが禁止される場合が定められています。"},
{license:"sennai", id:"s5_t5_2", subject:"law", theme:5, q:"船倉の内部で荷の巻上げ・巻卸し作業を行う場合の措置に関する記述として、正しいものはどれか。", choices:["作業者は、その場で待機させておけばよい。","作業に従事する労働者に危険を及ぼすおそれのあるときは、あらかじめ、その者を安全な場所に退避させなければならない。","退避場所は、定めておく必要がない。","退避の措置は、荷が重い場合のみ必要である。","退避は、荷が落下してから行えばよい。"], answer:1, explain:"労働者に危険を及ぼすおそれのあるときは、あらかじめ安全な場所に退避させなければなりません。"},
{license:"sennai", id:"s5_t5_3", subject:"law", theme:5, q:"立入禁止措置に関する記述として、正しいものはどれか。", choices:["立入禁止措置は、事故が起きてから講じればよい。","立入禁止区域には、表示をする必要はない。","立入禁止は、口頭で伝えれば表示は不要である。","危険のおそれがある区域には関係者以外の立入りを禁止し、その旨を表示する等の措置を講じる。","立入禁止区域の設定は、事業者の任意である。"], answer:3, explain:"危険のおそれがある区域には関係者以外の立入りを禁止し、その旨を見やすい箇所に表示する等の措置が必要です。"},
{license:"sennai", id:"s5_t5_4", subject:"law", theme:5, q:"ハッチの開口部に関する措置として、正しいものはどれか。", choices:["開口部には、特段の措置は不要である。","労働者が墜落するおそれのある開口部には、囲い、手すり、覆い等を設ける等の措置を講じる。","開口部の危険は、作業者の注意のみで防止できる。","開口部には、表示のみを行えばよい。","開口部の措置は、夜間のみ必要である。"], answer:1, explain:"墜落のおそれのある開口部には、囲い・手すり・覆い等を設ける等の墜落防止措置が必要です。"},
{license:"sennai", id:"s5_t6_1", subject:"law", theme:6, q:"船倉への昇降設備に関する記述として、正しいものはどれか。", choices:["昇降設備がない場合は、荷につかまって昇降させればよい。","労働者を船倉の内部において荷役作業に従事させるときは、当該労働者が安全に昇降するための設備を設けなければならない。","昇降設備に関する規定は存在しない。","昇降設備は、深い船倉のみに設ければよい。","昇降設備は、必要に応じて事業者が任意に設ければよい。"], answer:1, explain:"船倉の内部で荷役作業に従事させるときは、労働者が安全に昇降するための設備を設けなければなりません。"},
{license:"sennai", id:"s5_t6_2", subject:"law", theme:6, q:"はしご道の構造に関する記述として、正しいものはどれか。", choices:["はしご道の構造については、法令上の定めがない。","踏さんの間隔は、自由でよい。","踏さんは等間隔に設け、はしごの転位を防止するため上端を60cm以上突出させる等の措置が定められている。","はしごは、転位防止の措置をしなくてよい。","はしごの上端は、突出させてはならない。"], answer:2, explain:"はしご道は、踏さんを等間隔に設け、転位防止のため上端を60cm以上突出させる等の構造基準が定められています。"},
{license:"sennai", id:"s5_t6_3", subject:"law", theme:6, q:"通路の設置に関する記述として、正しいものはどれか。", choices:["通路上に物を置いても、作業者が避ければよい。","通路に関する規定は、船内荷役作業には適用されない。","作業場に通ずる場所及び作業場内には、安全な通路を設け、常時有効に保持しなければならない。","通路は、必要と感じたときに設ければよい。","通路の保持は、作業終了後に行えばよい。"], answer:2, explain:"作業場に通ずる場所及び作業場内には安全な通路を設け、常時有効に保持しなければなりません。"},
{license:"sennai", id:"s5_t6_4", subject:"law", theme:6, q:"作業場の照度に関する記述として、正しいものはどれか。", choices:["照度の確保は、屋外作業では不要である。","照度は、作業能率にのみ関係する事項である。","照度は、作業者が暗いと感じたときに確保すればよい。","作業の区分に応じ、必要な照度を確保しなければならない。","照度に関する定めはない。"], answer:3, explain:"事業者は、作業の区分に応じて必要な照度を確保しなければなりません。"},
{license:"sennai", id:"s5_t7_1", subject:"law", theme:7, q:"保護帽の着用に関する記述として、正しいものはどれか。", choices:["保護帽は、高所作業のみで着用させればよい。","保護帽の着用義務は、陸上作業にのみ適用される。","保護帽の着用については、法令上の定めがない。","保護帽の着用は、労働者の任意である。","船舶の船倉内で荷の取扱い作業を行うときは、原則として労働者に保護帽を着用させなければならない。"], answer:4, explain:"船倉内での荷の取扱い作業等では、飛来・落下等による危険を防止するため、労働者に保護帽を着用させなければなりません。"},
{license:"sennai", id:"s5_t7_2", subject:"law", theme:7, q:"要求性能墜落制止用器具の使用に関する記述として、正しいものはどれか。", choices:["器具の使用は、高さ10m以上の作業のみに必要である。","要求性能墜落制止用器具の使用は、労働者の判断に任せてよい。","墜落の危険のある作業では、要求性能墜落制止用器具等を使用させるとともに、取付設備等を設けなければならない。","器具の点検は、労働者本人の責任のみである。","器具を労働者に渡しておけば、取付設備は不要である。"], answer:2, explain:"墜落の危険のある作業では、要求性能墜落制止用器具等を使用させるとともに、そのための取付設備等を設けなければなりません。"},
{license:"sennai", id:"s5_t7_3", subject:"law", theme:7, q:"保護具の数と管理に関する記述として、正しいものはどれか。", choices:["保護具は、必要な人が持参すればよい。","保護具の数については、法令上の定めがない。","保護具の清潔保持は、事業者の義務ではない。","保護具は、労働者の人数より少なくてもよい。","保護具は、同時に就業する労働者の人数と同数以上を備え、常時有効かつ清潔に保持しなければならない。"], answer:4, explain:"保護具は同時に就業する労働者の人数と同数以上を備え、常時有効かつ清潔に保持しなければなりません。"},
{license:"sennai", id:"s5_t7_4", subject:"law", theme:7, q:"労働者の保護具使用義務に関する記述として、正しいものはどれか。", choices:["事業者から保護具等の使用を命じられた労働者は、これを使用しなければならない。","保護具の使用は、事業者の努力義務にすぎない。","労働者には、保護具を使用する義務はない。","保護具の使用義務は、作業主任者のみに課される。","労働者は、保護具の使用を拒否できる。"], answer:0, explain:"事業者から保護具等の使用を命じられた労働者は、これを使用しなければならないと定められています。"},
{license:"sennai", id:"s5_t8_1", subject:"law", theme:8, q:"悪天候時の作業に関する記述として、正しいものはどれか。", choices:["悪天候でも、作業を継続しなければならない。","悪天候時の作業中止は、労働者が判断する事項ではなく、法令上の定めもない。","強風時は、作業速度を上げて早く終わらせるべきである。","悪天候の判断は、荷主が行う。","強風、大雨、大雪等の悪天候のため危険が予想されるときは、当該作業に労働者を従事させてはならない。"], answer:4, explain:"強風・大雨・大雪等の悪天候により危険が予想されるときは、当該作業に労働者を従事させてはなりません。"},
{license:"sennai", id:"s5_t8_2", subject:"law", theme:8, q:"揚貨装置を用いる作業における悪天候後の点検に関する記述として、正しいものはどれか。", choices:["悪天候の後も、通常どおり作業を開始してよい。","点検は、次回の定期自主検査でまとめて行えばよい。","点検は、作業開始後に行えばよい。","悪天候後の点検は、法令上不要である。","強風等の後に作業を行うときは、あらかじめ、各部分の異常の有無について点検を行う。"], answer:4, explain:"強風等の悪天候の後に作業を行うときは、あらかじめ各部分の異常の有無について点検を行う必要があります。"},
{license:"sennai", id:"s5_t8_3", subject:"law", theme:8, q:"船舶の動揺による危険の防止に関する記述として、正しいものはどれか。", choices:["船舶の動揺により労働者に危険が及ぶおそれがあるときは、作業の中止を含め必要な措置を講じる。","動揺時の措置は、船長のみが判断する。","動揺があっても、作業は必ず継続しなければならない。","動揺による危険は、法令上考慮されていない。","船舶の動揺は、荷役作業の安全に影響しない。"], answer:0, explain:"船舶の動揺により労働者に危険が及ぶおそれがあるときは、作業の中止を含む必要な措置を講じます。"},
{license:"sennai", id:"s5_t8_4", subject:"law", theme:8, q:"作業の中止と再開に関する記述として、正しいものはどれか。", choices:["作業の中止・再開は、記録してはならない。","作業の再開は、荷主の指示のみで決める。","中止した作業は、天候が回復すれば直ちに点検なしで再開してよい。","危険が予想されて中止した作業を再開するときは、安全が確認されたことを確かめてから行う。","再開時の安全確認は、法令上も実務上も不要である。"], answer:3, explain:"中止した作業を再開するときは、設備や作業環境の安全が確認されたことを確かめてから行う必要があります。"},
{license:"sennai", id:"s5_t9_1", subject:"law", theme:9, q:"特別教育に関する記述として、正しいものはどれか。", choices:["特別教育は、資格試験に合格すれば不要である。","特別教育は、事業者の任意である。","特別教育の記録は、残してはならない。","危険又は有害な業務に労働者を就かせるときは、当該業務に関する安全衛生のための特別の教育を行わなければならない。","特別教育は、新入社員にのみ行えばよい。"], answer:3, explain:"事業者は、危険又は有害な業務に労働者を就かせるとき、当該業務に関する特別の教育を行わなければなりません。"},
{license:"sennai", id:"s5_t9_2", subject:"law", theme:9, q:"雇入れ時等の安全衛生教育に関する記述として、正しいものはどれか。", choices:["労働者を雇い入れたとき及び作業内容を変更したときは、従事する業務に関する安全衛生教育を行わなければならない。","雇入れ時の教育のみ行えば、作業内容が変わっても再教育は不要である。","安全衛生教育は、希望者にのみ行えばよい。","作業内容の変更時には、教育は不要である。","安全衛生教育は、法令上の義務ではない。"], answer:0, explain:"労働者の雇入れ時及び作業内容の変更時には、従事する業務に関する安全衛生教育を行わなければなりません。"},
{license:"sennai", id:"s5_t9_3", subject:"law", theme:9, q:"特別教育の記録に関する記述として、正しいものはどれか。", choices:["記録の保存期間についての定めはない。","記録は、労働者本人が保管すればよい。","記録は1か月保存すれば足りる。","特別教育の記録は、作成する必要がない。","特別教育を行ったときは、受講者・科目等の記録を作成し、3年間保存しなければならない。"], answer:4, explain:"特別教育を行ったときは、受講者・科目等の記録を作成し、3年間保存しなければなりません。"},
{license:"sennai", id:"s5_t9_4", subject:"law", theme:9, q:"労働者の義務に関する記述として、正しいものはどれか。", choices:["労働者の義務は、作業主任者にのみ課される。","労働災害の防止は、事業者のみの責任である。","労働者には、安全に関する義務は一切ない。","労働者は、事業者の措置に従う必要はない。","労働者は、労働災害を防止するため必要な事項を守るほか、事業者等が実施する措置に応じて必要な事項を守らなければならない。"], answer:4, explain:"労働者も、労働災害防止のため必要な事項を守り、事業者が実施する措置に協力する義務があります。"},
{license:"sennai", id:"s5_t10_1", subject:"law", theme:10, q:"労働安全衛生法における事業者の責務に関する記述として、正しいものはどれか。", choices:["事業者は、最低基準を守るだけでなく、快適な職場環境の実現と労働条件の改善を通じて労働者の安全と健康を確保するようにしなければならない。","事業者は、法令の最低基準さえ守れば、それ以上の配慮は一切不要である。","事業者の責務は、災害が発生したときにのみ生じる。","事業者の責務は、法令上定められていない。","労働者の安全確保は、労働者自身の責任である。"], answer:0, explain:"事業者は、最低基準の遵守にとどまらず、職場環境の改善を通じて労働者の安全と健康を確保する責務があります。"},
{license:"sennai", id:"s5_t10_2", subject:"law", theme:10, q:"労働災害が発生した場合の報告に関する記述として、正しいものはどれか。", choices:["労働災害の報告は、事業者の任意である。","休業を伴わない災害であれば、いかなる報告も不要である。","労働災害の報告先は、荷主である。","労働者が死亡し、又は休業したときは、遅滞なく労働者死傷病報告を所轄労働基準監督署長に提出しなければならない。","報告は、1年に1回まとめて行えばよい。"], answer:3, explain:"労働者が死亡し又は休業したときは、遅滞なく労働者死傷病報告を所轄労働基準監督署長に提出しなければなりません。"},
{license:"sennai", id:"s5_t10_3", subject:"law", theme:10, q:"元方事業者と関係請負人が混在する作業場での措置に関する記述として、正しいものはどれか。", choices:["連絡調整は、災害が起きてから行えばよい。","作業間の連絡及び調整を行うなど、労働災害を防止するため必要な措置を講じなければならない。","混在作業であっても、各事業者が独自に作業すればよい。","作業間の調整は、荷主が行うべき事項である。","混在作業における措置は、法令上定められていない。"], answer:1, explain:"混在作業では、作業間の連絡及び調整を行うなど、労働災害を防止するために必要な措置を講じる必要があります。"},
{license:"sennai", id:"s5_t10_4", subject:"law", theme:10, q:"船内荷役作業に適用される法令に関する記述として、正しいものはどれか。", choices:["適用されるのは、クレーン等安全規則のみである。","船内荷役作業は、船員法のみが適用される。","労働安全衛生法、同法施行令、労働安全衛生規則及びクレーン等安全規則の関係条項が適用される。","船内荷役作業には、労働安全衛生法は適用されない。","船内荷役作業に適用される法令は存在しない。"], answer:2, explain:"船内荷役作業には、労働安全衛生法・同法施行令・労働安全衛生規則及びクレーン等安全規則の関係条項が適用されます。"},
{license:"crane_mobile", id:"mobile_crane_1_1", subject:"crane", theme:1, q:"用語の定義について、正しいものはどれか。", choices:["定格速度は、無負荷のときの各作動の最高速度である。","定格荷重は、定格総荷重につり具の質量を加えたものである。","ジブ長さが一定なら、一般にジブを起こすと作業半径は大きくなる。","作業半径は、ジブフートピンからジブ先端までのジブに沿った長さである。","つり上げ荷重にはフックなどのつり具の質量が含まれる。"], answer:4, explain:"この記述が正しい内容です。つり上げ荷重にはフックなどのつり具の質量が含まれる。<br><br>ほかの選択肢の確認：<br>・定格荷重は、その作業条件で負荷できる最大荷重からつり具の重量に相当する荷重を差し引いたものである。<br>・ジブ長さが一定なら、一般にジブを起こすと作業半径は小さくなる。<br>・定格速度は、定格荷重に相当する荷をつったときの各作動の最高速度である。<br>・作業半径は、旋回中心からつり具の中心までの水平距離である。"},
{license:"crane_mobile", id:"mobile_crane_1_2", subject:"crane", theme:1, q:"用語の定義について、誤っているものはどれか。", choices:["つり上げ荷重にはフックなどのつり具の質量が含まれる。","定格速度は、定格荷重に相当する荷をつったときの各作動の最高速度である。","作業半径は、旋回中心からつり具の中心までの水平距離である。","定格荷重は、定格総荷重につり具の質量を加えたものである。","揚程は、つり具を有効に上げ下げできる上限と下限との間の垂直距離である。"], answer:3, explain:"この記述が誤りです。正しくは、定格荷重は、その作業条件で負荷できる最大荷重からつり具の重量に相当する荷重を差し引いたものである。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_crane_1_3", subject:"crane", theme:1, q:"用語の定義について、正しいものはどれか。", choices:["ジブの傾斜角は、ジブの中心線と鉛直線とのなす角である。","定格速度は、無負荷のときの各作動の最高速度である。","ジブ長さが一定なら、一般にジブを起こすと作業半径は大きくなる。","ジブの起伏は、上部旋回体を水平方向に回転させる運動である。","作業半径は、旋回中心からつり具の中心までの水平距離である。"], answer:4, explain:"この記述が正しい内容です。作業半径は、旋回中心からつり具の中心までの水平距離である。<br><br>ほかの選択肢の確認：<br>・ジブの傾斜角は、ジブの中心線と水平面とのなす角である。<br>・ジブ長さが一定なら、一般にジブを起こすと作業半径は小さくなる。<br>・ジブの起伏は、取付けピンを支点としてジブの傾斜角を変える運動である。<br>・定格速度は、定格荷重に相当する荷をつったときの各作動の最高速度である。"},
{license:"crane_mobile", id:"mobile_crane_1_4", subject:"crane", theme:1, q:"用語の定義について、誤っているものはどれか。", choices:["つり上げ荷重にはフックなどのつり具の質量が含まれる。","ジブの傾斜角は、ジブの中心線と鉛直線とのなす角である。","揚程は、つり具を有効に上げ下げできる上限と下限との間の垂直距離である。","定格荷重は、その作業条件で負荷できる最大荷重からつり具の重量に相当する荷重を差し引いたものである。","定格速度は、定格荷重に相当する荷をつったときの各作動の最高速度である。"], answer:1, explain:"この記述が誤りです。正しくは、ジブの傾斜角は、ジブの中心線と水平面とのなす角である。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_crane_1_5", subject:"crane", theme:1, q:"用語の定義について、正しいものはどれか。", choices:["作業半径は、ジブフートピンからジブ先端までのジブに沿った長さである。","ジブ長さが一定なら、一般にジブを起こすと作業半径は大きくなる。","定格速度は、定格荷重に相当する荷をつったときの各作動の最高速度である。","定格荷重は、定格総荷重につり具の質量を加えたものである。","揚程は、クレーンの旋回中心からジブ先端までの水平距離である。"], answer:2, explain:"この記述が正しい内容です。定格速度は、定格荷重に相当する荷をつったときの各作動の最高速度である。<br><br>ほかの選択肢の確認：<br>・定格荷重は、その作業条件で負荷できる最大荷重からつり具の重量に相当する荷重を差し引いたものである。<br>・揚程は、つり具を有効に上げ下げできる上限と下限との間の垂直距離である。<br>・作業半径は、旋回中心からつり具の中心までの水平距離である。<br>・ジブ長さが一定なら、一般にジブを起こすと作業半径は小さくなる。"},
{license:"crane_mobile", id:"mobile_crane_1_6", subject:"crane", theme:1, q:"用語の定義について、誤っているものはどれか。", choices:["定格速度は、定格荷重に相当する荷をつったときの各作動の最高速度である。","ジブの傾斜角は、ジブの中心線と水平面とのなす角である。","ジブ長さが一定なら、一般にジブを起こすと作業半径は小さくなる。","定格荷重は、その作業条件で負荷できる最大荷重からつり具の重量に相当する荷重を差し引いたものである。","ジブの起伏は、上部旋回体を水平方向に回転させる運動である。"], answer:4, explain:"この記述が誤りです。正しくは、ジブの起伏は、取付けピンを支点としてジブの傾斜角を変える運動である。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_crane_1_7", subject:"crane", theme:1, q:"用語の定義について、正しいものはどれか。", choices:["つり上げ荷重にはフックなどのつり具の質量が含まれない。","作業半径は、ジブフートピンからジブ先端までのジブに沿った長さである。","ジブの傾斜角は、ジブの中心線と鉛直線とのなす角である。","ジブ長さが一定なら、一般にジブを起こすと作業半径は小さくなる。","定格荷重は、定格総荷重につり具の質量を加えたものである。"], answer:3, explain:"この記述が正しい内容です。ジブ長さが一定なら、一般にジブを起こすと作業半径は小さくなる。<br><br>ほかの選択肢の確認：<br>・つり上げ荷重にはフックなどのつり具の質量が含まれる。<br>・作業半径は、旋回中心からつり具の中心までの水平距離である。<br>・定格荷重は、その作業条件で負荷できる最大荷重からつり具の重量に相当する荷重を差し引いたものである。<br>・ジブの傾斜角は、ジブの中心線と水平面とのなす角である。"},
{license:"crane_mobile", id:"mobile_crane_1_8", subject:"crane", theme:1, q:"用語の定義について、誤っているものはどれか。", choices:["定格荷重は、その作業条件で負荷できる最大荷重からつり具の重量に相当する荷重を差し引いたものである。","定格速度は、定格荷重に相当する荷をつったときの各作動の最高速度である。","揚程は、クレーンの旋回中心からジブ先端までの水平距離である。","ジブ長さが一定なら、一般にジブを起こすと作業半径は小さくなる。","つり上げ荷重にはフックなどのつり具の質量が含まれる。"], answer:2, explain:"この記述が誤りです。正しくは、揚程は、つり具を有効に上げ下げできる上限と下限との間の垂直距離である。<br>ほかの4つの記述は正しい内容です。"},

{license:"crane_mobile", id:"mobile_crane_3_1", subject:"crane", theme:3, q:"クローラと接地圧について、正しいものはどれか。", choices:["一般的なクローラ下部走行体では、前方に起動輪、後方に遊動輪を配置する。","クローラであれば、地盤の支持力や機体の水平は確認しなくてよい。","同じ全装備重量で総接地面積が大きくなれば、平均接地圧は大きくなる。","クローラクレーンの全装備質量には、運転士、燃料、潤滑油、冷却水などの質量を含む。","クローラ中心距離は前後の車輪間の距離で、左右の安定とは関係しない。"], answer:3, explain:"この記述が正しい内容です。クローラクレーンの全装備質量には、運転士、燃料、潤滑油、冷却水などの質量を含む。<br><br>ほかの選択肢の確認：<br>・クローラであっても、地盤の支持力や水平を確認して据え付ける必要がある。<br>・クローラ中心距離は左右のクローラの中心間の距離で、広げると側方の安定に有利になる。<br>・同じ全装備重量で総接地面積が大きくなれば、平均接地圧は小さくなる。<br>・一般的なクローラ下部走行体では、後方に起動輪、前方に遊動輪を配置する。"},

{license:"crane_mobile", id:"mobile_crane_4_1", subject:"crane", theme:4, q:"上部旋回体と旋回装置について、正しいものはどれか。", choices:["旋回時は、つり荷だけを監視すれば、上部旋回体後部の周囲は確認しなくてよい。","長尺ジブを引き起こす際のAフレームは、必ず最も低い位置に設定する。","ボールベアリング式旋回装置では、巻上げドラムのワイヤロープを横に引くことで旋回させる。","Aフレームは、作動油をろ過するためにタンク内へ設ける部品である。","上部旋回体は、旋回フレームに巻上装置、起伏装置などを設置したものである。"], answer:4, explain:"この記述が正しい内容です。上部旋回体は、旋回フレームに巻上装置、起伏装置などを設置したものである。<br><br>ほかの選択肢の確認：<br>・ボールベアリング式旋回装置では、旋回ギヤとかみ合うピニオンの回転により上部旋回体を旋回させる。<br>・Aフレームは、ジブ起伏用ワイヤロープやブライドルによるジブ支持に関係する。<br>・長尺ジブを引き起こす際のAフレームは、指定された高い位置など、取扱説明書に従った位置に設定する。<br>・旋回時は、つり荷の経路に加え、上部旋回体後部と周囲との挟まれにも注意する。"},

{license:"crane_mobile", id:"mobile_crane_5_1", subject:"crane", theme:5, q:"巻上装置とブレーキについて、正しいものはどれか。", choices:["巻上げドラムのロック機構には、一般にウォーム歯車だけを用いる。","自動ブレーキ方式では、一般に操作をやめるとブレーキが解除される。","クラッチ付き巻上装置では、一般に油圧モータ、減速機、クラッチ、ドラムの順に動力が伝わる。","ドラムの回転数が同じなら、ロープの巻層が変わってもワイヤロープ速度は変わらない。","巻上装置の減速機は、摩擦車式だけで、歯車は使用されない。"], answer:2, explain:"この記述が正しい内容です。クラッチ付き巻上装置では、一般に油圧モータ、減速機、クラッチ、ドラムの順に動力が伝わる。<br><br>ほかの選択肢の確認：<br>・巻上げドラムのロック機構には、一般に爪車と爪を用いる。<br>・ドラムの回転数が同じでも、巻かれたロープの層が変わるとワイヤロープ速度は変わる。<br>・自動ブレーキ方式では、一般に作動させていないときにブレーキが効く。<br>・巻上装置の減速機には、平歯車式や遊星歯車式などがある。"},

{license:"crane_mobile", id:"mobile_crane_6_1", subject:"crane", theme:6, q:"ジブとつり具について、正しいものはどれか。", choices:["ロープ開閉式グラブバケットは、電気の磁力だけで開閉する。","箱形構造ジブには、油圧シリンダなどを用いて伸縮するものがある。","箱形構造ジブは、すべて各段が別々に順番どおり動く方式だけである。","ペンダントロープは、上部・下部ブライドルの滑車間を段掛けする起伏用ロープと同じものである。","ジブバックストップは、箱形構造ジブ内で燃料の逆流を防ぐ弁である。"], answer:1, explain:"この記述が正しい内容です。箱形構造ジブには、油圧シリンダなどを用いて伸縮するものがある。<br><br>ほかの選択肢の確認：<br>・ジブバックストップは、トラス構造ジブが後方へ倒れることを防ぐための装置である。<br>・ペンダントロープは、ジブ先端側と上部ブライドル等を結びジブを支える。<br>・箱形構造ジブの伸縮順序は構造によって異なり、各段が同時に動く方式もある。<br>・ロープ開閉式グラブバケットでは、支持用と開閉用のロープの働きを区別する。"},

{license:"crane_mobile", id:"mobile_crane_8_1", subject:"crane", theme:8, q:"安全装置の働きについて、正しいものはどれか。", choices:["油圧ホース破損時の荷の保持は、油面計だけで行う。","巻過防止装置は、クレーンの走行速度だけを制限する。","安全装置に異常があっても、運転経験が長ければ作業を続けてよい。","過負荷防止装置があれば、地盤の沈下による転倒も必ず防げる。","外れ止め装置は、フックから玉掛け用ワイヤロープ等が外れるのを防ぐ。"], answer:4, explain:"この記述が正しい内容です。外れ止め装置は、フックから玉掛け用ワイヤロープ等が外れるのを防ぐ。<br><br>ほかの選択肢の確認：<br>・巻過防止装置は、つり具の巻上げ過ぎによる衝突を防ぐ。<br>・過負荷防止装置は、作業半径等に応じて過負荷となる危険を防ぐために用いる。<br>・油圧ホース破損等によるシリンダの急な動きを防ぐため、保持機能を持つ弁が使われる。<br>・安全装置に異常があるときは、使用を止めて必要な点検・補修を行う。"},

{license:"crane_mobile", id:"mobile_crane_9_1", subject:"crane", theme:9, q:"据付けと運転時の取扱いについて、正しいものはどれか。", choices:["フロントジャッキは、巻上げドラムの回転数を高めるための装置である。","地切りで荷が傾いても、高く巻き上げれば安定するので続行する。","同じ機械なら作業領域やアウトリガーの張出し幅が変わっても能力は同じである。","箱形構造ジブを伸ばすときは、フックをさらに巻き上げて先端へ密着させる。","アウトリガー最大張出しの一般的なトラッククレーンでは、後方領域は前方領域より安定がよい。"], answer:4, explain:"この記述が正しい内容です。アウトリガー最大張出しの一般的なトラッククレーンでは、後方領域は前方領域より安定がよい。<br><br>ほかの選択肢の確認：<br>・同じ機械でも作業領域やアウトリガーの張出し幅により能力が異なる場合がある。<br>・地切りの段階で荷の安定や玉掛けの状態を確認し、異常があれば着地させて見直す。<br>・フロントジャッキは、前方領域の安定を確保するために用いられるものがある。<br>・箱形構造ジブを伸ばすとフックが巻き上がる状態になるため、必要に応じて巻下げを合わせて行う。"},

{license:"crane_mobile", id:"mobile_motor_2_1", subject:"motor", theme:2, q:"エンジンの補機と電装品について、正しいものはどれか。", choices:["始動補助装置は、燃焼室や吸気を冷やして着火を助ける。","燃料噴射ノズルは、主として冷却水の温度を調節する装置である。","エアクリーナは、排出する作動油を加圧するポンプである。","オルタネータは、シリンダ内に点火火花を発生させる点火プラグである。","調速機は、負荷の変動等に応じて燃料供給量を調整し、回転速度を調節する。"], answer:4, explain:"この記述が正しい内容です。調速機は、負荷の変動等に応じて燃料供給量を調整し、回転速度を調節する。<br><br>ほかの選択肢の確認：<br>・オルタネータは交流を発生し、車両では整流してバッテリの充電等に用いる。<br>・始動補助装置には、燃焼室や吸気を暖めて着火を助けるものがある。<br>・エアクリーナは、吸入空気中のごみやほこりを取り除く。<br>・燃料噴射ノズルは、燃料を細かい霧状にして燃焼室に噴射する。"},

{license:"crane_mobile", id:"mobile_motor_4_1", subject:"motor", theme:4, q:"油圧ポンプと駆動装置について、正しいものはどれか。", choices:["歯車ポンプは、歯車を使わずピストンの往復だけで油を送る。","歯車ポンプは、どのような吸込み条件でもキャビテーションを生じない。","アキシアル形は、プランジャが回転軸から放射状に配列される。","油圧シリンダは、圧油を燃焼させて回転運動を得る。","油圧ポンプは、原動機から受けた機械的エネルギーを作動油のエネルギーに変える。"], answer:4, explain:"この記述が正しい内容です。油圧ポンプは、原動機から受けた機械的エネルギーを作動油のエネルギーに変える。<br><br>ほかの選択肢の確認：<br>・油圧ポンプで吸込みが不足すると、キャビテーションが生じることがある。<br>・油圧シリンダは、圧油の力でピストンを動かし、主に直線運動を得る。<br>・歯車ポンプは、歯車とケーシングの間の空間を利用して油を送る。<br>・アキシアル形は、プランジャが回転軸に沿う方向に配列される。"},
{license:"crane_mobile", id:"mobile_motor_4_2", subject:"motor", theme:4, q:"油圧ポンプと駆動装置について、誤っているものはどれか。", choices:["アキシアル形は、プランジャが回転軸に沿う方向に配列される。","油圧ポンプで吸込みが不足すると、キャビテーションが生じることがある。","ラジアル形は、プランジャが回転軸に対して放射状に配列される。","油圧シリンダは、圧油を燃焼させて回転運動を得る。","油圧モータは、圧油のエネルギーを回転運動に変える。"], answer:3, explain:"この記述が誤りです。正しくは、油圧シリンダは、圧油の力でピストンを動かし、主に直線運動を得る。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_4_3", subject:"motor", theme:4, q:"油圧ポンプと駆動装置について、正しいものはどれか。", choices:["歯車ポンプは、歯車を使わずピストンの往復だけで油を送る。","アキシアル形は、プランジャが回転軸から放射状に配列される。","複動シリンダは、ピストンの両側へ交互に圧油を送り、往復運動させる。","ラジアル形は、プランジャが回転軸と同一方向に配列される。","油圧モータは、回転軸を持たず、作動油の温度を測るための装置である。"], answer:2, explain:"この記述が正しい内容です。複動シリンダは、ピストンの両側へ交互に圧油を送り、往復運動させる。<br><br>ほかの選択肢の確認：<br>・アキシアル形は、プランジャが回転軸に沿う方向に配列される。<br>・歯車ポンプは、歯車とケーシングの間の空間を利用して油を送る。<br>・油圧モータは、圧油のエネルギーを回転運動に変える。<br>・ラジアル形は、プランジャが回転軸に対して放射状に配列される。"},
{license:"crane_mobile", id:"mobile_motor_4_4", subject:"motor", theme:4, q:"油圧ポンプと駆動装置について、誤っているものはどれか。", choices:["アキシアル形は、プランジャが回転軸に沿う方向に配列される。","油圧モータは、回転軸を持たず、作動油の温度を測るための装置である。","油圧シリンダは、圧油の力でピストンを動かし、主に直線運動を得る。","油圧ポンプで吸込みが不足すると、キャビテーションが生じることがある。","複動シリンダは、ピストンの両側へ交互に圧油を送り、往復運動させる。"], answer:1, explain:"この記述が誤りです。正しくは、油圧モータは、圧油のエネルギーを回転運動に変える。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_4_5", subject:"motor", theme:4, q:"油圧ポンプと駆動装置について、正しいものはどれか。", choices:["歯車ポンプは、歯車を使わずピストンの往復だけで油を送る。","アキシアル形は、プランジャが回転軸に沿う方向に配列される。","油圧モータは、回転軸を持たず、作動油の温度を測るための装置である。","油圧シリンダは、圧油を燃焼させて回転運動を得る。","油圧ポンプは、作動油のエネルギーを受けて荷を直接回転させる油圧モータと同じ役割である。"], answer:1, explain:"この記述が正しい内容です。アキシアル形は、プランジャが回転軸に沿う方向に配列される。<br><br>ほかの選択肢の確認：<br>・歯車ポンプは、歯車とケーシングの間の空間を利用して油を送る。<br>・油圧ポンプは、原動機から受けた機械的エネルギーを作動油のエネルギーに変える。<br>・油圧シリンダは、圧油の力でピストンを動かし、主に直線運動を得る。<br>・油圧モータは、圧油のエネルギーを回転運動に変える。"},
{license:"crane_mobile", id:"mobile_motor_4_6", subject:"motor", theme:4, q:"油圧ポンプと駆動装置について、誤っているものはどれか。", choices:["油圧ポンプは、原動機から受けた機械的エネルギーを作動油のエネルギーに変える。","油圧モータは、圧油のエネルギーを回転運動に変える。","油圧シリンダは、圧油の力でピストンを動かし、主に直線運動を得る。","油圧ポンプで吸込みが不足すると、キャビテーションが生じることがある。","ラジアル形は、プランジャが回転軸と同一方向に配列される。"], answer:4, explain:"この記述が誤りです。正しくは、ラジアル形は、プランジャが回転軸に対して放射状に配列される。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_4_7", subject:"motor", theme:4, q:"油圧ポンプと駆動装置について、正しいものはどれか。", choices:["ラジアル形は、プランジャが回転軸と同一方向に配列される。","複動シリンダは、片側だけに圧油を送り、反対方向へは必ず人力で戻す。","油圧シリンダは、圧油を燃焼させて回転運動を得る。","アキシアル形は、プランジャが回転軸から放射状に配列される。","歯車ポンプは、歯車とケーシングの間の空間を利用して油を送る。"], answer:4, explain:"この記述が正しい内容です。歯車ポンプは、歯車とケーシングの間の空間を利用して油を送る。<br><br>ほかの選択肢の確認：<br>・複動シリンダは、ピストンの両側へ交互に圧油を送り、往復運動させる。<br>・油圧シリンダは、圧油の力でピストンを動かし、主に直線運動を得る。<br>・ラジアル形は、プランジャが回転軸に対して放射状に配列される。<br>・アキシアル形は、プランジャが回転軸に沿う方向に配列される。"},
{license:"crane_mobile", id:"mobile_motor_4_8", subject:"motor", theme:4, q:"油圧ポンプと駆動装置について、誤っているものはどれか。", choices:["油圧シリンダは、圧油の力でピストンを動かし、主に直線運動を得る。","歯車ポンプは、どのような吸込み条件でもキャビテーションを生じない。","複動シリンダは、ピストンの両側へ交互に圧油を送り、往復運動させる。","ラジアル形は、プランジャが回転軸に対して放射状に配列される。","油圧ポンプは、原動機から受けた機械的エネルギーを作動油のエネルギーに変える。"], answer:1, explain:"この記述が誤りです。正しくは、油圧ポンプで吸込みが不足すると、キャビテーションが生じることがある。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_5_1", subject:"motor", theme:5, q:"油圧制御弁について、正しいものはどれか。", choices:["リリーフ弁は、回路の最高圧力を制限するために用いる。","減圧弁は、二次側の圧力を一次側より必ず高くするために用いる。","チェック弁は、常に両方向へ同じように油を流す。","流量制御弁は、油の流量を変えずに燃料の燃焼温度を調整する。","パイロットチェック弁は、どのような条件でも逆方向へは流せない。"], answer:0, explain:"この記述が正しい内容です。リリーフ弁は、回路の最高圧力を制限するために用いる。<br><br>ほかの選択肢の確認：<br>・パイロットチェック弁は、外部からの圧力信号によって逆方向にも流せる構造を持つ。<br>・絞り弁などの流量制御弁は、流量を調整して作動速度を制御するために用いる。<br>・減圧弁は、二次側の圧力を一次側より低い所定の圧力にするために用いる。<br>・チェック弁は、通常、一方向の流れを許し、反対方向の流れを止める。"},
{license:"crane_mobile", id:"mobile_motor_5_2", subject:"motor", theme:5, q:"油圧制御弁について、誤っているものはどれか。", choices:["絞り弁などの流量制御弁は、流量を調整して作動速度を制御するために用いる。","方向切換弁は、油の流れる方向を切り換える。","パイロットチェック弁は、外部からの圧力信号によって逆方向にも流せる構造を持つ。","カウンタバランス弁は、荷重によるアクチュエータの暴走を防ぐために用いる。","減圧弁は、二次側の圧力を一次側より必ず高くするために用いる。"], answer:4, explain:"この記述が誤りです。正しくは、減圧弁は、二次側の圧力を一次側より低い所定の圧力にするために用いる。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_5_3", subject:"motor", theme:5, q:"油圧制御弁について、正しいものはどれか。", choices:["パイロットチェック弁は、どのような条件でも逆方向へは流せない。","リリーフ弁は、シリンダへ流す油の方向だけを切り換える。","減圧弁は、二次側の圧力を一次側より必ず高くするために用いる。","チェック弁は、常に両方向へ同じように油を流す。","シーケンス弁は、所定の圧力に達すると次の回路へ油を流し、作動順序を制御する。"], answer:4, explain:"この記述が正しい内容です。シーケンス弁は、所定の圧力に達すると次の回路へ油を流し、作動順序を制御する。<br><br>ほかの選択肢の確認：<br>・チェック弁は、通常、一方向の流れを許し、反対方向の流れを止める。<br>・減圧弁は、二次側の圧力を一次側より低い所定の圧力にするために用いる。<br>・リリーフ弁は、回路の最高圧力を制限するために用いる。<br>・パイロットチェック弁は、外部からの圧力信号によって逆方向にも流せる構造を持つ。"},
{license:"crane_mobile", id:"mobile_motor_5_4", subject:"motor", theme:5, q:"油圧制御弁について、誤っているものはどれか。", choices:["チェック弁は、常に両方向へ同じように油を流す。","減圧弁は、二次側の圧力を一次側より低い所定の圧力にするために用いる。","シーケンス弁は、所定の圧力に達すると次の回路へ油を流し、作動順序を制御する。","方向切換弁は、油の流れる方向を切り換える。","カウンタバランス弁は、荷重によるアクチュエータの暴走を防ぐために用いる。"], answer:0, explain:"この記述が誤りです。正しくは、チェック弁は、通常、一方向の流れを許し、反対方向の流れを止める。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_5_5", subject:"motor", theme:5, q:"油圧制御弁について、正しいものはどれか。", choices:["流量制御弁は、油の流量を変えずに燃料の燃焼温度を調整する。","チェック弁は、常に両方向へ同じように油を流す。","方向切換弁は、タンク内の油量だけを表示する。","パイロットチェック弁は、外部からの圧力信号によって逆方向にも流せる構造を持つ。","シーケンス弁は、作動油の不純物をろ過する装置である。"], answer:3, explain:"この記述が正しい内容です。パイロットチェック弁は、外部からの圧力信号によって逆方向にも流せる構造を持つ。<br><br>ほかの選択肢の確認：<br>・チェック弁は、通常、一方向の流れを許し、反対方向の流れを止める。<br>・方向切換弁は、油の流れる方向を切り換える。<br>・シーケンス弁は、所定の圧力に達すると次の回路へ油を流し、作動順序を制御する。<br>・絞り弁などの流量制御弁は、流量を調整して作動速度を制御するために用いる。"},
{license:"crane_mobile", id:"mobile_motor_5_6", subject:"motor", theme:5, q:"油圧制御弁について、誤っているものはどれか。", choices:["絞り弁などの流量制御弁は、流量を調整して作動速度を制御するために用いる。","リリーフ弁は、回路の最高圧力を制限するために用いる。","パイロットチェック弁は、外部からの圧力信号によって逆方向にも流せる構造を持つ。","方向切換弁は、タンク内の油量だけを表示する。","カウンタバランス弁は、荷重によるアクチュエータの暴走を防ぐために用いる。"], answer:3, explain:"この記述が誤りです。正しくは、方向切換弁は、油の流れる方向を切り換える。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_5_7", subject:"motor", theme:5, q:"油圧制御弁について、正しいものはどれか。", choices:["リリーフ弁は、シリンダへ流す油の方向だけを切り換える。","減圧弁は、二次側の圧力を一次側より必ず高くするために用いる。","絞り弁などの流量制御弁は、流量を調整して作動速度を制御するために用いる。","シーケンス弁は、作動油の不純物をろ過する装置である。","パイロットチェック弁は、どのような条件でも逆方向へは流せない。"], answer:2, explain:"この記述が正しい内容です。絞り弁などの流量制御弁は、流量を調整して作動速度を制御するために用いる。<br><br>ほかの選択肢の確認：<br>・パイロットチェック弁は、外部からの圧力信号によって逆方向にも流せる構造を持つ。<br>・減圧弁は、二次側の圧力を一次側より低い所定の圧力にするために用いる。<br>・リリーフ弁は、回路の最高圧力を制限するために用いる。<br>・シーケンス弁は、所定の圧力に達すると次の回路へ油を流し、作動順序を制御する。"},
{license:"crane_mobile", id:"mobile_motor_5_8", subject:"motor", theme:5, q:"油圧制御弁について、誤っているものはどれか。", choices:["絞り弁などの流量制御弁は、流量を調整して作動速度を制御するために用いる。","パイロットチェック弁は、外部からの圧力信号によって逆方向にも流せる構造を持つ。","シーケンス弁は、所定の圧力に達すると次の回路へ油を流し、作動順序を制御する。","カウンタバランス弁は、荷重でシリンダが自由落下するようにするための弁である。","リリーフ弁は、回路の最高圧力を制限するために用いる。"], answer:3, explain:"この記述が誤りです。正しくは、カウンタバランス弁は、荷重によるアクチュエータの暴走を防ぐために用いる。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_6_1", subject:"motor", theme:6, q:"油圧装置の付属機器について、正しいものはどれか。", choices:["作動油タンクは、油を蓄えるほか、放熱や気泡分離の役割も持つ。","アキュムレータは、ガスを常時外気と入れ換えることで圧力を蓄える。","オイルクーラーは、作動油を燃料として燃やすために用いる。","油圧ホースは、外径さえ同じであれば耐圧や温度条件に関係なく交換できる。","エアブリーザは、アキュムレータの密閉ガス室を常時大気に開放する装置である。"], answer:0, explain:"この記述が正しい内容です。作動油タンクは、油を蓄えるほか、放熱や気泡分離の役割も持つ。<br><br>ほかの選択肢の確認：<br>・エアブリーザは、タンクの油面変化に伴う空気の出入りで異物の侵入を抑える。<br>・アキュムレータは、密閉されたガスの圧縮性等を利用して圧力エネルギーを蓄える。<br>・オイルクーラーは、作動油を冷却するために用いる。<br>・油圧ホースは、圧力、曲げ半径、温度等の使用条件に適合するものを用いる。"},
{license:"crane_mobile", id:"mobile_motor_6_2", subject:"motor", theme:6, q:"油圧装置の付属機器について、誤っているものはどれか。", choices:["フィルタは、作動油中の異物を取り除く。","エアブリーザは、アキュムレータの密閉ガス室を常時大気に開放する装置である。","アキュムレータは、密閉されたガスの圧縮性等を利用して圧力エネルギーを蓄える。","油圧ホースは、圧力、曲げ半径、温度等の使用条件に適合するものを用いる。","作動油タンクは、油を蓄えるほか、放熱や気泡分離の役割も持つ。"], answer:1, explain:"この記述が誤りです。正しくは、エアブリーザは、タンクの油面変化に伴う空気の出入りで異物の侵入を抑える。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_6_3", subject:"motor", theme:6, q:"油圧装置の付属機器について、正しいものはどれか。", choices:["油面計は、タンク内の作動油の量を確認するために用いる。","アキュムレータは、リターンフィルタによるろ過だけで衝撃圧を吸収する。","アキュムレータは、ガスを常時外気と入れ換えることで圧力を蓄える。","エアブリーザは、アキュムレータの密閉ガス室を常時大気に開放する装置である。","フィルタは、作動油中に金属粉を混ぜて粘度を高める。"], answer:0, explain:"この記述が正しい内容です。油面計は、タンク内の作動油の量を確認するために用いる。<br><br>ほかの選択肢の確認：<br>・アキュムレータは、密閉されたガスの圧縮性等を利用して圧力エネルギーを蓄える。<br>・フィルタは、作動油中の異物を取り除く。<br>・エアブリーザは、タンクの油面変化に伴う空気の出入りで異物の侵入を抑える。<br>・アキュムレータは、衝撃圧の吸収などに用いられる。"},
{license:"crane_mobile", id:"mobile_motor_6_4", subject:"motor", theme:6, q:"油圧装置の付属機器について、誤っているものはどれか。", choices:["作動油タンクは、油を蓄えるほか、放熱や気泡分離の役割も持つ。","アキュムレータは、密閉されたガスの圧縮性等を利用して圧力エネルギーを蓄える。","オイルクーラーは、作動油を燃料として燃やすために用いる。","油圧ホースは、圧力、曲げ半径、温度等の使用条件に適合するものを用いる。","フィルタは、作動油中の異物を取り除く。"], answer:2, explain:"この記述が誤りです。正しくは、オイルクーラーは、作動油を冷却するために用いる。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_6_5", subject:"motor", theme:6, q:"油圧装置の付属機器について、正しいものはどれか。", choices:["作動油タンクは、油を燃焼させて動力を得る容器である。","油面計は、シリンダの推力だけを直接表示する。","フィルタは、作動油中の異物を取り除く。","油圧ホースは、外径さえ同じであれば耐圧や温度条件に関係なく交換できる。","オイルクーラーは、作動油を燃料として燃やすために用いる。"], answer:2, explain:"この記述が正しい内容です。フィルタは、作動油中の異物を取り除く。<br><br>ほかの選択肢の確認：<br>・油面計は、タンク内の作動油の量を確認するために用いる。<br>・油圧ホースは、圧力、曲げ半径、温度等の使用条件に適合するものを用いる。<br>・作動油タンクは、油を蓄えるほか、放熱や気泡分離の役割も持つ。<br>・オイルクーラーは、作動油を冷却するために用いる。"},
{license:"crane_mobile", id:"mobile_motor_6_6", subject:"motor", theme:6, q:"油圧装置の付属機器について、誤っているものはどれか。", choices:["エアブリーザは、タンクの油面変化に伴う空気の出入りで異物の侵入を抑える。","アキュムレータは、衝撃圧の吸収などに用いられる。","アキュムレータは、ガスを常時外気と入れ換えることで圧力を蓄える。","油面計は、タンク内の作動油の量を確認するために用いる。","油圧ホースは、圧力、曲げ半径、温度等の使用条件に適合するものを用いる。"], answer:2, explain:"この記述が誤りです。正しくは、アキュムレータは、密閉されたガスの圧縮性等を利用して圧力エネルギーを蓄える。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_6_7", subject:"motor", theme:6, q:"油圧装置の付属機器について、正しいものはどれか。", choices:["エアブリーザは、アキュムレータの密閉ガス室を常時大気に開放する装置である。","油圧ホースは、外径さえ同じであれば耐圧や温度条件に関係なく交換できる。","油面計は、シリンダの推力だけを直接表示する。","アキュムレータは、衝撃圧の吸収などに用いられる。","作動油タンクは、油を燃焼させて動力を得る容器である。"], answer:3, explain:"この記述が正しい内容です。アキュムレータは、衝撃圧の吸収などに用いられる。<br><br>ほかの選択肢の確認：<br>・油圧ホースは、圧力、曲げ半径、温度等の使用条件に適合するものを用いる。<br>・作動油タンクは、油を蓄えるほか、放熱や気泡分離の役割も持つ。<br>・油面計は、タンク内の作動油の量を確認するために用いる。<br>・エアブリーザは、タンクの油面変化に伴う空気の出入りで異物の侵入を抑える。"},
{license:"crane_mobile", id:"mobile_motor_6_8", subject:"motor", theme:6, q:"油圧装置の付属機器について、誤っているものはどれか。", choices:["オイルクーラーは、作動油を冷却するために用いる。","アキュムレータは、密閉されたガスの圧縮性等を利用して圧力エネルギーを蓄える。","エアブリーザは、タンクの油面変化に伴う空気の出入りで異物の侵入を抑える。","油面計は、タンク内の作動油の量を確認するために用いる。","油圧ホースは、外径さえ同じであれば耐圧や温度条件に関係なく交換できる。"], answer:4, explain:"この記述が誤りです。正しくは、油圧ホースは、圧力、曲げ半径、温度等の使用条件に適合するものを用いる。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_7_1", subject:"motor", theme:7, q:"油圧装置の保守について、正しいものはどれか。", choices:["油圧ポンプの異音や発熱の有無は、運転状態で安全に確認する。","油圧ホースに著しい損傷があっても、外側に布を巻けば使い続けてよい。","エンジンを止めれば残圧は必ずゼロになるため、そのまま分解してよい。","すべてのフィルタエレメントは、洗浄すれば何回でも再使用できる。","分解整備後の空気抜きは、最初から全負荷運転にして行う。"], answer:0, explain:"この記述が正しい内容です。油圧ポンプの異音や発熱の有無は、運転状態で安全に確認する。<br><br>ほかの選択肢の確認：<br>・洗浄して再使用できるフィルタと、交換すべきフィルタを区別する。<br>・油圧装置を分解する前には、残圧や蓄圧を安全に解放する。<br>・分解整備後に空気が残った場合は、所定の低負荷運転等で空気抜きを行う。<br>・油圧ホースに著しい損傷を認めた場合は、適切な交換等の措置を行う。"},
{license:"crane_mobile", id:"mobile_motor_7_2", subject:"motor", theme:7, q:"油圧装置の保守について、誤っているものはどれか。", choices:["油圧装置を分解する前には、残圧や蓄圧を安全に解放する。","高圧の油漏れを、手指で直接触れて探してはいけない。","油圧ホースに著しい損傷を認めた場合は、適切な交換等の措置を行う。","清掃・交換時は、油圧回路にごみや水分を入れないようにする。","油圧配管の接続部の漏れは、6か月に1回だけ確認すればよい。"], answer:4, explain:"この記述が誤りです。正しくは、油圧配管の接続部は、圧油の漏れや緩みを日常的に点検する。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_7_3", subject:"motor", theme:7, q:"油圧装置の保守について、正しいものはどれか。", choices:["高圧の油漏れ箇所は、素手で触れて確かめるのがよい。","油圧ホースに著しい損傷があっても、外側に布を巻けば使い続けてよい。","分解整備後に空気が残った場合は、所定の低負荷運転等で空気抜きを行う。","すべてのフィルタエレメントは、洗浄すれば何回でも再使用できる。","油圧配管の接続部の漏れは、6か月に1回だけ確認すればよい。"], answer:2, explain:"この記述が正しい内容です。分解整備後に空気が残った場合は、所定の低負荷運転等で空気抜きを行う。<br><br>ほかの選択肢の確認：<br>・油圧配管の接続部は、圧油の漏れや緩みを日常的に点検する。<br>・洗浄して再使用できるフィルタと、交換すべきフィルタを区別する。<br>・高圧の油漏れを、手指で直接触れて探してはいけない。<br>・油圧ホースに著しい損傷を認めた場合は、適切な交換等の措置を行う。"},
{license:"crane_mobile", id:"mobile_motor_7_4", subject:"motor", theme:7, q:"油圧装置の保守について、誤っているものはどれか。", choices:["高圧の油漏れを、手指で直接触れて探してはいけない。","油圧ポンプの異音や発熱の有無は、運転状態で安全に確認する。","油圧配管の接続部は、圧油の漏れや緩みを日常的に点検する。","分解整備後に空気が残った場合は、所定の低負荷運転等で空気抜きを行う。","エンジンを止めれば残圧は必ずゼロになるため、そのまま分解してよい。"], answer:4, explain:"この記述が誤りです。正しくは、油圧装置を分解する前には、残圧や蓄圧を安全に解放する。<br>ほかの4つの記述は正しい内容です。"},

{license:"crane_mobile", id:"mobile_motor_8_1", subject:"motor", theme:8, q:"作動油の性質について、正しいものはどれか。", choices:["作動油は、温度が低くなると一般に粘度が低くなる。","異なる種類の作動油は、粘度表示が似ていれば無条件に混ぜてよい。","作動油は圧力だけ伝えればよく、潤滑性や耐酸化性は不要である。","作動油の白濁は、常に新品で正常であることを示す。","一般的な鉱油系作動油の比重は、約0.85～0.95である。"], answer:4, explain:"この記述が正しい内容です。一般的な鉱油系作動油の比重は、約0.85～0.95である。<br><br>ほかの選択肢の確認：<br>・作動油には、潤滑性、耐酸化性、防せい性などが求められる。<br>・異なる種類の作動油を混ぜるときは、メーカーの適合性の確認が必要である。<br>・作動油は、温度が低くなると一般に粘度が高くなる。<br>・作動油に水分が混入すると、白濁などの異常が生じることがある。"},
{license:"crane_mobile", id:"mobile_motor_8_2", subject:"motor", theme:8, q:"作動油の性質について、誤っているものはどれか。", choices:["作動油には、潤滑性、耐酸化性、防せい性などが求められる。","作動油は、温度が低くなると一般に粘度が低くなる。","作動油の温度が低すぎると、粘度が高くなりポンプの駆動に大きな力を要する。","一般的な鉱油系作動油の比重は、約0.85～0.95である。","作動油の温度が高すぎると、潤滑性の低下や劣化の促進につながる。"], answer:1, explain:"この記述が誤りです。正しくは、作動油は、温度が低くなると一般に粘度が高くなる。<br>ほかの4つの記述は正しい内容です。"},

{license:"crane_mobile", id:"mobile_motor_9_1", subject:"motor", theme:9, q:"電気の基礎について、正しいものはどれか。", choices:["工場の動力用には、一般に単相交流だけが用いられる。","発電所から変電所等へ送ることを配電、変電所等から需要先へ送ることを送電という。","銅やアルミニウムは、一般に電気を通しにくい絶縁体である。","乾燥したゴムやガラスは、一般に銅より電気を通しやすい。","直流はDC、交流はACと表す。"], answer:4, explain:"この記述が正しい内容です。直流はDC、交流はACと表す。<br><br>ほかの選択肢の確認：<br>・発電所から変電所等へ送ることを送電、変電所等から需要先へ送ることを配電という。<br>・乾燥したゴムやガラスは、一般に電気を通しにくい。<br>・工場の動力用には、一般に三相交流が用いられる。<br>・銅やアルミニウムは、一般に電気を通しやすい導体である。"},
{license:"crane_mobile", id:"mobile_motor_9_2", subject:"motor", theme:9, q:"電気の基礎について、誤っているものはどれか。", choices:["工場の動力用には、一般に三相交流が用いられる。","交流は、常に一定方向にだけ流れる電流である。","発電所から変電所等へ送ることを送電、変電所等から需要先へ送ることを配電という。","電力系統の周波数には、地域により50Hzと60Hzがある。","直流はDC、交流はACと表す。"], answer:1, explain:"この記述が誤りです。正しくは、交流は、電流の向きと大きさが周期的に変化する。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_9_3", subject:"motor", theme:9, q:"電気の基礎について、正しいものはどれか。", choices:["直流はAC、交流はDCと表す。","銅やアルミニウムは、一般に電気を通しにくい絶縁体である。","同じ電力を送る場合、送電電圧を低くして電流を大きくすると電線の発熱損失を減らせる。","発電所から変電所等へ送ることを送電、変電所等から需要先へ送ることを配電という。","乾燥したゴムやガラスは、一般に銅より電気を通しやすい。"], answer:3, explain:"この記述が正しい内容です。発電所から変電所等へ送ることを送電、変電所等から需要先へ送ることを配電という。<br><br>ほかの選択肢の確認：<br>・銅やアルミニウムは、一般に電気を通しやすい導体である。<br>・同じ電力を送る場合、送電電圧を高くして電流を小さくすると電線の発熱損失を減らせる。<br>・乾燥したゴムやガラスは、一般に電気を通しにくい。<br>・直流はDC、交流はACと表す。"},

{license:"crane_mobile", id:"mobile_motor_10_1", subject:"motor", theme:10, q:"感電と近接作業について、正しいものはどれか。", choices:["感電の危険は、電流の大きさ、通電時間、経路などによって変わる。","皮膚が濡れると、一般に電気抵抗が増大し、感電しにくくなる。","機体が充電していても、機体と地面に同時に触れれば電位差がなく安全になる。","電流によるやけどは、皮膚表面だけに限られ、内部組織には及ばない。","電線近接作業では、ジブの塗装だけを絶縁対策として用いればよい。"], answer:0, explain:"この記述が正しい内容です。感電の危険は、電流の大きさ、通電時間、経路などによって変わる。<br><br>ほかの選択肢の確認：<br>・電流によるやけどは、皮膚だけでなく内部組織にも及ぶことがある。<br>・機体が充電した場合、機体と地面に同時に触れると感電するおそれがある。<br>・電線近接作業では、電力会社との協議、離隔の確保、監視等の対策を行う。<br>・皮膚が濡れると、一般に電気抵抗が低下し、感電の危険が増す。"},
{license:"crane_mobile", id:"mobile_motor_10_2", subject:"motor", theme:10, q:"感電と近接作業について、誤っているものはどれか。", choices:["機体が充電した場合、機体と地面に同時に触れると感電するおそれがある。","高圧電線は、直接接触しなくても接近による放電で危険になることがある。","電流によるやけどは、皮膚だけでなく内部組織にも及ぶことがある。","皮膚が濡れると、一般に電気抵抗が増大し、感電しにくくなる。","充電した機体に不用意に近づいたり触れたりせず、送電停止などの措置を関係者へ求める。"], answer:3, explain:"この記述が誤りです。正しくは、皮膚が濡れると、一般に電気抵抗が低下し、感電の危険が増す。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_10_3", subject:"motor", theme:10, q:"感電と近接作業について、正しいものはどれか。", choices:["充電した機体から人を救うときは、まず素手で機体に触れて電気を逃がす。","電流によるやけどは、皮膚だけでなく内部組織にも及ぶことがある。","電線近接作業では、ジブの塗装だけを絶縁対策として用いればよい。","感電事故の救助では、通電状態でも最初に被災者を素手で引き離す。","機体が充電していても、機体と地面に同時に触れれば電位差がなく安全になる。"], answer:1, explain:"この記述が正しい内容です。電流によるやけどは、皮膚だけでなく内部組織にも及ぶことがある。<br><br>ほかの選択肢の確認：<br>・機体が充電した場合、機体と地面に同時に触れると感電するおそれがある。<br>・感電事故の救助では、救助者の感電を防ぐため、電源の遮断など安全を確保する。<br>・電線近接作業では、電力会社との協議、離隔の確保、監視等の対策を行う。<br>・充電した機体に不用意に近づいたり触れたりせず、送電停止などの措置を関係者へ求める。"},
{license:"crane_mobile", id:"mobile_motor_10_4", subject:"motor", theme:10, q:"感電と近接作業について、誤っているものはどれか。", choices:["感電事故の救助では、救助者の感電を防ぐため、電源の遮断など安全を確保する。","皮膚が濡れると、一般に電気抵抗が低下し、感電の危険が増す。","機体が充電した場合、機体と地面に同時に触れると感電するおそれがある。","感電の危険は、電流の大きさ、通電時間、経路などによって変わる。","高圧電線は、直接触れなければどれだけ近づいても感電しない。"], answer:4, explain:"この記述が誤りです。正しくは、高圧電線は、直接接触しなくても接近による放電で危険になることがある。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_10_5", subject:"motor", theme:10, q:"感電と近接作業について、正しいものはどれか。", choices:["充電した機体から人を救うときは、まず素手で機体に触れて電気を逃がす。","電線近接作業では、電力会社との協議、離隔の確保、監視等の対策を行う。","電流によるやけどは、皮膚表面だけに限られ、内部組織には及ばない。","感電の危険は、電圧の表示だけで決まり、通電時間や経路には関係しない。","皮膚が濡れると、一般に電気抵抗が増大し、感電しにくくなる。"], answer:1, explain:"この記述が正しい内容です。電線近接作業では、電力会社との協議、離隔の確保、監視等の対策を行う。<br><br>ほかの選択肢の確認：<br>・電流によるやけどは、皮膚だけでなく内部組織にも及ぶことがある。<br>・皮膚が濡れると、一般に電気抵抗が低下し、感電の危険が増す。<br>・充電した機体に不用意に近づいたり触れたりせず、送電停止などの措置を関係者へ求める。<br>・感電の危険は、電流の大きさ、通電時間、経路などによって変わる。"},
{license:"crane_mobile", id:"mobile_motor_10_6", subject:"motor", theme:10, q:"感電と近接作業について、誤っているものはどれか。", choices:["電流によるやけどは、皮膚だけでなく内部組織にも及ぶことがある。","感電事故の救助では、救助者の感電を防ぐため、電源の遮断など安全を確保する。","高圧電線は、直接接触しなくても接近による放電で危険になることがある。","機体が充電していても、機体と地面に同時に触れれば電位差がなく安全になる。","電線近接作業では、電力会社との協議、離隔の確保、監視等の対策を行う。"], answer:3, explain:"この記述が誤りです。正しくは、機体が充電した場合、機体と地面に同時に触れると感電するおそれがある。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_motor_10_7", subject:"motor", theme:10, q:"感電と近接作業について、正しいものはどれか。", choices:["感電の危険は、電圧の表示だけで決まり、通電時間や経路には関係しない。","高圧電線は、直接触れなければどれだけ近づいても感電しない。","感電事故の救助では、通電状態でも最初に被災者を素手で引き離す。","充電した機体に不用意に近づいたり触れたりせず、送電停止などの措置を関係者へ求める。","電流によるやけどは、皮膚表面だけに限られ、内部組織には及ばない。"], answer:3, explain:"この記述が正しい内容です。充電した機体に不用意に近づいたり触れたりせず、送電停止などの措置を関係者へ求める。<br><br>ほかの選択肢の確認：<br>・高圧電線は、直接接触しなくても接近による放電で危険になることがある。<br>・電流によるやけどは、皮膚だけでなく内部組織にも及ぶことがある。<br>・感電の危険は、電流の大きさ、通電時間、経路などによって変わる。<br>・感電事故の救助では、救助者の感電を防ぐため、電源の遮断など安全を確保する。"},
{license:"crane_mobile", id:"mobile_motor_10_8", subject:"motor", theme:10, q:"感電と近接作業について、誤っているものはどれか。", choices:["機体が充電した場合、機体と地面に同時に触れると感電するおそれがある。","感電の危険は、電流の大きさ、通電時間、経路などによって変わる。","電流によるやけどは、皮膚だけでなく内部組織にも及ぶことがある。","感電事故の救助では、通電状態でも最初に被災者を素手で引き離す。","皮膚が濡れると、一般に電気抵抗が低下し、感電の危険が増す。"], answer:3, explain:"この記述が誤りです。正しくは、感電事故の救助では、救助者の感電を防ぐため、電源の遮断など安全を確保する。<br>ほかの4つの記述は正しい内容です。"},
{license:"crane_mobile", id:"mobile_law_1_1", subject:"law", theme:1, q:"製造と検査の区分について、正しいものはどれか。", choices:["性能検査では、免許証の確認だけを行い、荷重試験は行わない。","つり上げ荷重3t以上の機械のジブ等の構造部分を変更しても、運転士免許があれば変更検査は不要である。","つり上げ荷重3t以上の移動式クレーンを製造した場合は、月例自主検査だけで製造検査を省略できる。","製造検査では、構造・機能の点検だけを行い、荷重試験は行わない。","つり上げ荷重3t以上の移動式クレーンを輸入した場合は、原則として使用検査の対象となる。"], answer:4, explain:"この記述が正しい内容です。つり上げ荷重3t以上の移動式クレーンを輸入した場合は、原則として使用検査の対象となる。<br><br>ほかの選択肢の確認：<br>・性能検査では、構造・機能の点検のほか、荷重試験を行う。<br>・つり上げ荷重3t以上の移動式クレーンを製造した場合は、原則として製造検査の対象となる。<br>・つり上げ荷重3t以上の機械のジブ等の構造部分を変更したときは、原則として変更検査を受ける。<br>・製造検査では、構造・機能の点検のほか、荷重試験と安定度試験を行う。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_1_2", subject:"law", theme:1, q:"製造と検査の区分について、誤っているものはどれか。", choices:["つり上げ荷重3t以上の機械の台車を変更したときは、原則として変更検査の対象となる。","つり上げ荷重3t以上の移動式クレーンを製造した場合は、月例自主検査だけで製造検査を省略できる。","つり上げ荷重3t以上の移動式クレーンの製造許可には、既に許可を受けたものと同一型式の場合の例外がある。","検査証の有効期間を超えて使用を休止した機械を再使用するときは、使用再開検査の対象となる。","性能検査では、構造・機能の点検のほか、荷重試験を行う。"], answer:1, explain:"この記述が誤りです。正しくは、つり上げ荷重3t以上の移動式クレーンを製造した場合は、原則として製造検査の対象となる。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_1_3", subject:"law", theme:1, q:"製造と検査の区分について、正しいものはどれか。", choices:["性能検査では、免許証の確認だけを行い、荷重試験は行わない。","製造検査では、構造・機能の点検のほか、荷重試験と安定度試験を行う。","つり上げ荷重3t以上の移動式クレーンを製造した場合は、月例自主検査だけで製造検査を省略できる。","検査証の有効期間を超えて使用を休止した機械は、日常点検だけで再使用できる。","つり上げ荷重3t以上の機械のジブ等の構造部分を変更しても、運転士免許があれば変更検査は不要である。"], answer:1, explain:"この記述が正しい内容です。製造検査では、構造・機能の点検のほか、荷重試験と安定度試験を行う。<br><br>ほかの選択肢の確認：<br>・検査証の有効期間を超えて使用を休止した機械を再使用するときは、使用再開検査の対象となる。<br>・つり上げ荷重3t以上の機械のジブ等の構造部分を変更したときは、原則として変更検査を受ける。<br>・つり上げ荷重3t以上の移動式クレーンを製造した場合は、原則として製造検査の対象となる。<br>・性能検査では、構造・機能の点検のほか、荷重試験を行う。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},

{license:"crane_mobile", id:"mobile_law_1_5", subject:"law", theme:1, q:"製造と検査の区分について、正しいものはどれか。", choices:["つり上げ荷重3t以上の機械の台車を変更しても、変更検査の対象になることはない。","検査証の有効期間を超えて使用を休止した機械は、日常点検だけで再使用できる。","つり上げ荷重3t以上の機械のジブ等の構造部分を変更したときは、原則として変更検査を受ける。","つり上げ荷重3t以上の移動式クレーンを輸入した場合は、原則として製造検査を受ける。","つり上げ荷重3t以上の移動式クレーンを製造した場合は、月例自主検査だけで製造検査を省略できる。"], answer:2, explain:"この記述が正しい内容です。つり上げ荷重3t以上の機械のジブ等の構造部分を変更したときは、原則として変更検査を受ける。<br><br>ほかの選択肢の確認：<br>・つり上げ荷重3t以上の移動式クレーンを製造した場合は、原則として製造検査の対象となる。<br>・つり上げ荷重3t以上の移動式クレーンを輸入した場合は、原則として使用検査の対象となる。<br>・つり上げ荷重3t以上の機械の台車を変更したときは、原則として変更検査の対象となる。<br>・検査証の有効期間を超えて使用を休止した機械を再使用するときは、使用再開検査の対象となる。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},

{license:"crane_mobile", id:"mobile_law_1_8", subject:"law", theme:1, q:"製造と検査の区分について、誤っているものはどれか。", choices:["つり上げ荷重3t以上の機械のジブ等の構造部分を変更したときは、原則として変更検査を受ける。","製造検査では、構造・機能の点検のほか、荷重試験と安定度試験を行う。","検査証の有効期間を超えて使用を休止した機械を再使用するときは、使用再開検査の対象となる。","つり上げ荷重3t以上の移動式クレーンを製造した場合は、原則として製造検査の対象となる。","つり上げ荷重3t以上の移動式クレーンの製造許可は、同一型式の許可の有無に関係なく省略できる。"], answer:4, explain:"この記述が誤りです。正しくは、つり上げ荷重3t以上の移動式クレーンの製造許可には、既に許可を受けたものと同一型式の場合の例外がある。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_2_1", subject:"law", theme:2, q:"検査証と設置報告について、正しいものはどれか。", choices:["検査証が必要な移動式クレーンを使用するときは、機械に検査証を備え付ける。","製造検査・使用検査の結果によらず、検査証の有効期間は必ず2年である。","使用を休止した場合は、その期間に関係なく必ず直ちに検査証を返還する。","運転士免許を更新すれば、機械の検査証の有効期間も自動的に更新される。","設置報告書には、運転者の履歴書だけを添えればよい。"], answer:0, explain:"この記述が正しい内容です。検査証が必要な移動式クレーンを使用するときは、機械に検査証を備え付ける。<br><br>ほかの選択肢の確認：<br>・製造検査・使用検査の結果により、検査証の有効期間が2年未満となることがある。<br>・使用の廃止と使用の休止は異なり、休止しただけで直ちに検査証を返還するものではない。<br>・設置報告書には、所定の移動式クレーン明細書と検査証を添える。<br>・性能検査に合格すると、検査証の有効期間が更新される。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_2_2", subject:"law", theme:2, q:"検査証と設置報告について、誤っているものはどれか。", choices:["設置報告書には、所定の移動式クレーン明細書と検査証を添える。","移動式クレーン検査証の有効期間は、原則として5年である。","製造検査・使用検査の結果により、検査証の有効期間が2年未満となることがある。","使用の廃止と使用の休止は異なり、休止しただけで直ちに検査証を返還するものではない。","届出免除の認定がなく、休止期間が検査証の有効期間を超える場合は、有効期間中に休止を報告する。"], answer:1, explain:"この記述が誤りです。正しくは、移動式クレーン検査証の有効期間は、原則として2年である。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_2_3", subject:"law", theme:2, q:"検査証と設置報告について、正しいものはどれか。", choices:["運転士免許を更新すれば、機械の検査証の有効期間も自動的に更新される。","使用を休止した場合は、その期間に関係なく必ず直ちに検査証を返還する。","製造検査・使用検査の結果により、検査証の有効期間が2年未満となることがある。","設置報告書には、運転者の履歴書だけを添えればよい。","届出免除の認定がなく、休止期間が検査証の有効期間を超える場合は、有効期間満了後10日以内に報告すればよい。"], answer:2, explain:"この記述が正しい内容です。製造検査・使用検査の結果により、検査証の有効期間が2年未満となることがある。<br><br>ほかの選択肢の確認：<br>・使用の廃止と使用の休止は異なり、休止しただけで直ちに検査証を返還するものではない。<br>・設置報告書には、所定の移動式クレーン明細書と検査証を添える。<br>・性能検査に合格すると、検査証の有効期間が更新される。<br>・届出免除の認定がなく、休止期間が検査証の有効期間を超える場合は、有効期間中に休止を報告する。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_2_4", subject:"law", theme:2, q:"検査証と設置報告について、誤っているものはどれか。", choices:["移動式クレーン検査証の有効期間は、原則として2年である。","設置報告書には、所定の移動式クレーン明細書と検査証を添える。","使用の廃止と使用の休止は異なり、休止しただけで直ちに検査証を返還するものではない。","検査証が必要な移動式クレーンを使用するときは、機械に検査証を備え付ける。","運転士免許を更新すれば、機械の検査証の有効期間も自動的に更新される。"], answer:4, explain:"この記述が誤りです。正しくは、性能検査に合格すると、検査証の有効期間が更新される。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_2_5", subject:"law", theme:2, q:"検査証と設置報告について、正しいものはどれか。", choices:["設置報告書には、運転者の履歴書だけを添えればよい。","製造検査・使用検査の結果によらず、検査証の有効期間は必ず2年である。","届出免除の認定がない場合、つり上げ荷重3t以上の設置報告は、設置前に行う。","届出免除の認定がなく、休止期間が検査証の有効期間を超える場合は、有効期間満了後10日以内に報告すればよい。","使用を休止した場合は、その期間に関係なく必ず直ちに検査証を返還する。"], answer:2, explain:"この記述が正しい内容です。届出免除の認定がない場合、つり上げ荷重3t以上の設置報告は、設置前に行う。<br><br>ほかの選択肢の確認：<br>・届出免除の認定がなく、休止期間が検査証の有効期間を超える場合は、有効期間中に休止を報告する。<br>・使用の廃止と使用の休止は異なり、休止しただけで直ちに検査証を返還するものではない。<br>・設置報告書には、所定の移動式クレーン明細書と検査証を添える。<br>・製造検査・使用検査の結果により、検査証の有効期間が2年未満となることがある。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_2_6", subject:"law", theme:2, q:"検査証と設置報告について、誤っているものはどれか。", choices:["届出免除の認定がなく、休止期間が検査証の有効期間を超える場合は、有効期間中に休止を報告する。","検査証が必要な移動式クレーンを使用するときは、機械に検査証を備え付ける。","移動式クレーン検査証の有効期間は、原則として2年である。","設置報告書には、運転者の履歴書だけを添えればよい。","使用の廃止と使用の休止は異なり、休止しただけで直ちに検査証を返還するものではない。"], answer:3, explain:"この記述が誤りです。正しくは、設置報告書には、所定の移動式クレーン明細書と検査証を添える。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_2_7", subject:"law", theme:2, q:"検査証と設置報告について、正しいものはどれか。", choices:["移動式クレーン検査証の有効期間は、原則として5年である。","届出免除の認定がなく、休止期間が検査証の有効期間を超える場合は、有効期間満了後10日以内に報告すればよい。","届出免除の認定がない場合でも、つり上げ荷重3t以上の設置報告は、設置後14日以内でよい。","使用の廃止と使用の休止は異なり、休止しただけで直ちに検査証を返還するものではない。","運転士免許を更新すれば、機械の検査証の有効期間も自動的に更新される。"], answer:3, explain:"この記述が正しい内容です。使用の廃止と使用の休止は異なり、休止しただけで直ちに検査証を返還するものではない。<br><br>ほかの選択肢の確認：<br>・届出免除の認定がなく、休止期間が検査証の有効期間を超える場合は、有効期間中に休止を報告する。<br>・届出免除の認定がない場合、つり上げ荷重3t以上の設置報告は、設置前に行う。<br>・移動式クレーン検査証の有効期間は、原則として2年である。<br>・性能検査に合格すると、検査証の有効期間が更新される。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_2_8", subject:"law", theme:2, q:"検査証と設置報告について、誤っているものはどれか。", choices:["届出免除の認定がない場合、つり上げ荷重3t以上の設置報告は、設置前に行う。","移動式クレーン検査証の有効期間は、原則として2年である。","届出免除の認定がなく、休止期間が検査証の有効期間を超える場合は、有効期間満了後10日以内に報告すればよい。","製造検査・使用検査の結果により、検査証の有効期間が2年未満となることがある。","設置報告書には、所定の移動式クレーン明細書と検査証を添える。"], answer:2, explain:"この記述が誤りです。正しくは、届出免除の認定がなく、休止期間が検査証の有効期間を超える場合は、有効期間中に休止を報告する。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_3_1", subject:"law", theme:3, q:"運転と玉掛けの資格について、正しいものはどれか。", choices:["つり上げ荷重20tの移動式クレーンでも、荷が0.5tなら玉掛けの特別教育だけでよい。","つり上げ荷重3t未満の移動式クレーンなら、運転は特別教育だけで足りる。","つり上げ荷重2.9tの移動式クレーンは、運転の特別教育だけで運転できる。","移動式クレーン運転士免許を持てば、別の資格なしであらゆる玉掛け業務に就ける。","つり上げ荷重5t以上の移動式クレーンの運転には、原則として移動式クレーン運転士免許が必要である。"], answer:4, explain:"この記述が正しい内容です。つり上げ荷重5t以上の移動式クレーンの運転には、原則として移動式クレーン運転士免許が必要である。<br><br>ほかの選択肢の確認：<br>・つり上げ荷重2.9tの移動式クレーンは、運転の特別教育だけでは運転できない。<br>・つり上げ荷重1t未満の移動式クレーン運転の業務には、特別教育の規定がある。<br>・移動式クレーン運転士免許を持つことだけで、玉掛けの資格も自動的に得られるわけではない。<br>・つり上げ荷重20tの移動式クレーンで0.5tの荷を玉掛けする場合、玉掛けの特別教育だけでは足りない。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_3_2", subject:"law", theme:3, q:"運転と玉掛けの資格について、誤っているものはどれか。", choices:["小型移動式クレーン運転技能講習で運転できる範囲は、つり上げ荷重1t以上5t以下である。","つり上げ荷重1t未満の移動式クレーン運転の業務には、特別教育の規定がある。","つり上げ荷重20tの移動式クレーンで0.5tの荷を玉掛けする場合、玉掛けの特別教育だけでは足りない。","つり上げ荷重2.9tの移動式クレーンは、運転の特別教育だけでは運転できない。","移動式クレーン運転士免許を持つことだけで、玉掛けの資格も自動的に得られるわけではない。"], answer:0, explain:"この記述が誤りです。正しくは、小型移動式クレーン運転技能講習で運転できる範囲は、つり上げ荷重1t以上5t未満である。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_3_3", subject:"law", theme:3, q:"運転と玉掛けの資格について、正しいものはどれか。", choices:["つり上げ荷重1t未満の移動式クレーン運転の業務には、特別教育の規定がある。","つり上げ荷重2.9tの移動式クレーンは、運転の特別教育だけで運転できる。","つり上げ荷重20tの移動式クレーンでも、荷が0.5tなら玉掛けの特別教育だけでよい。","移動式クレーン運転士免許を持てば、別の資格なしであらゆる玉掛け業務に就ける。","つり上げ荷重5t以上の移動式クレーンは、小型移動式クレーン運転技能講習だけで運転できる。"], answer:0, explain:"この記述が正しい内容です。つり上げ荷重1t未満の移動式クレーン運転の業務には、特別教育の規定がある。<br><br>ほかの選択肢の確認：<br>・つり上げ荷重20tの移動式クレーンで0.5tの荷を玉掛けする場合、玉掛けの特別教育だけでは足りない。<br>・つり上げ荷重2.9tの移動式クレーンは、運転の特別教育だけでは運転できない。<br>・移動式クレーン運転士免許を持つことだけで、玉掛けの資格も自動的に得られるわけではない。<br>・つり上げ荷重5t以上の移動式クレーンの運転には、原則として移動式クレーン運転士免許が必要である。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_3_4", subject:"law", theme:3, q:"運転と玉掛けの資格について、誤っているものはどれか。", choices:["つり上げ荷重5t以上の移動式クレーンの運転には、原則として移動式クレーン運転士免許が必要である。","つり上げ荷重2.9tの移動式クレーンは、運転の特別教育だけで運転できる。","つり上げ荷重20tの移動式クレーンで0.5tの荷を玉掛けする場合、玉掛けの特別教育だけでは足りない。","移動式クレーン運転士免許を持つことだけで、玉掛けの資格も自動的に得られるわけではない。","玉掛け技能講習の要否は、実際の荷の質量ではなく、使用する機械のつり上げ荷重で判断する。"], answer:1, explain:"この記述が誤りです。正しくは、つり上げ荷重2.9tの移動式クレーンは、運転の特別教育だけでは運転できない。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_3_5", subject:"law", theme:3, q:"運転と玉掛けの資格について、正しいものはどれか。", choices:["つり上げ荷重2.9tの移動式クレーンは、運転の特別教育だけで運転できる。","小型移動式クレーン運転技能講習で運転できる範囲は、つり上げ荷重1t以上5t以下である。","移動式クレーン運転士免許があれば、道路上の走行にも自動車運転免許は不要である。","玉掛け技能講習の要否は、実際の荷の質量ではなく、使用する機械のつり上げ荷重で判断する。","つり上げ荷重5t以上の移動式クレーンは、小型移動式クレーン運転技能講習だけで運転できる。"], answer:3, explain:"この記述が正しい内容です。玉掛け技能講習の要否は、実際の荷の質量ではなく、使用する機械のつり上げ荷重で判断する。<br><br>ほかの選択肢の確認：<br>・つり上げ荷重2.9tの移動式クレーンは、運転の特別教育だけでは運転できない。<br>・つり上げ荷重5t以上の移動式クレーンの運転には、原則として移動式クレーン運転士免許が必要である。<br>・クレーン作業の運転資格と、道路上を走行するための運転免許は区別する。<br>・小型移動式クレーン運転技能講習で運転できる範囲は、つり上げ荷重1t以上5t未満である。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_3_6", subject:"law", theme:3, q:"運転と玉掛けの資格について、誤っているものはどれか。", choices:["つり上げ荷重20tの移動式クレーンでも、荷が0.5tなら玉掛けの特別教育だけでよい。","玉掛け技能講習の要否は、実際の荷の質量ではなく、使用する機械のつり上げ荷重で判断する。","つり上げ荷重2.9tの移動式クレーンは、運転の特別教育だけでは運転できない。","クレーン作業の運転資格と、道路上を走行するための運転免許は区別する。","つり上げ荷重5t以上の移動式クレーンの運転には、原則として移動式クレーン運転士免許が必要である。"], answer:0, explain:"この記述が誤りです。正しくは、つり上げ荷重20tの移動式クレーンで0.5tの荷を玉掛けする場合、玉掛けの特別教育だけでは足りない。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_3_7", subject:"law", theme:3, q:"運転と玉掛けの資格について、正しいものはどれか。", choices:["玉掛け技能講習の要否は、使用する機械の能力に関係なく、実際の荷の質量だけで判断する。","つり上げ荷重3t未満の移動式クレーンなら、運転は特別教育だけで足りる。","移動式クレーン運転士免許を持つことだけで、玉掛けの資格も自動的に得られるわけではない。","つり上げ荷重5t以上の移動式クレーンは、小型移動式クレーン運転技能講習だけで運転できる。","つり上げ荷重20tの移動式クレーンでも、荷が0.5tなら玉掛けの特別教育だけでよい。"], answer:2, explain:"この記述が正しい内容です。移動式クレーン運転士免許を持つことだけで、玉掛けの資格も自動的に得られるわけではない。<br><br>ほかの選択肢の確認：<br>・つり上げ荷重5t以上の移動式クレーンの運転には、原則として移動式クレーン運転士免許が必要である。<br>・玉掛け技能講習の要否は、実際の荷の質量ではなく、使用する機械のつり上げ荷重で判断する。<br>・つり上げ荷重20tの移動式クレーンで0.5tの荷を玉掛けする場合、玉掛けの特別教育だけでは足りない。<br>・つり上げ荷重1t未満の移動式クレーン運転の業務には、特別教育の規定がある。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_3_8", subject:"law", theme:3, q:"運転と玉掛けの資格について、誤っているものはどれか。", choices:["移動式クレーン運転士免許があれば、道路上の走行にも自動車運転免許は不要である。","つり上げ荷重5t以上の移動式クレーンの運転には、原則として移動式クレーン運転士免許が必要である。","つり上げ荷重20tの移動式クレーンで0.5tの荷を玉掛けする場合、玉掛けの特別教育だけでは足りない。","玉掛け技能講習の要否は、実際の荷の質量ではなく、使用する機械のつり上げ荷重で判断する。","移動式クレーン運転士免許を持つことだけで、玉掛けの資格も自動的に得られるわけではない。"], answer:0, explain:"この記述が誤りです。正しくは、クレーン作業の運転資格と、道路上を走行するための運転免許は区別する。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_4_1", subject:"law", theme:4, q:"使用条件と安全装置の調整について、正しいものはどれか。", choices:["つり上げ荷重3t以上では、検査証に記載された運転士の経験年数に応じてジブの傾斜角を決める。","荷が軽ければ、外れ止め装置を使用しなくてよい。","つり上げ荷重3t未満では、ジブの傾斜角に関する使用制限はない。","定格荷重の表示等は、管理者だけが見られる場所にあればよい。","移動式クレーンには、定格荷重を超える荷重をかけて使用してはならない。"], answer:4, explain:"この記述が正しい内容です。移動式クレーンには、定格荷重を超える荷重をかけて使用してはならない。<br><br>ほかの選択肢の確認：<br>・つり上げ荷重3t以上では、明細書に記載されたジブの傾斜角の範囲を超えて使用しない。<br>・移動式クレーンで荷をつり上げるときは、外れ止め装置を使用する。<br>・つり上げ荷重3t未満では、製造者が指定したジブの傾斜角の範囲を超えて使用しない。<br>・運転者と玉掛け者が定格荷重を常時知ることができるよう、表示等の措置を行う。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_4_2", subject:"law", theme:4, q:"使用条件と安全装置の調整について、誤っているものはどれか。", choices:["直働式巻過防止装置は、所定の間隔が0.05m以上となるよう調整する。","移動式クレーンで荷をつり上げるときは、外れ止め装置を使用する。","つり上げ荷重3t以上では、検査証に記載された運転士の経験年数に応じてジブの傾斜角を決める。","安全弁は、原則として最大の定格荷重に相当する荷重をかけたときの圧力以下で作用するよう調整する。","運転者と玉掛け者が定格荷重を常時知ることができるよう、表示等の措置を行う。"], answer:2, explain:"この記述が誤りです。正しくは、つり上げ荷重3t以上では、明細書に記載されたジブの傾斜角の範囲を超えて使用しない。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_4_3", subject:"law", theme:4, q:"使用条件と安全装置の調整について、正しいものはどれか。", choices:["直働式巻過防止装置は、所定の間隔が0.005m以上となるよう調整する。","つり上げ荷重3t未満では、製造者が指定したジブの傾斜角の範囲を超えて使用しない。","定格荷重の表示等は、管理者だけが見られる場所にあればよい。","荷が軽ければ、外れ止め装置を使用しなくてよい。","安全弁は、原則としてつり上げ荷重の2倍をかけたときの圧力で作用するよう調整する。"], answer:1, explain:"この記述が正しい内容です。つり上げ荷重3t未満では、製造者が指定したジブの傾斜角の範囲を超えて使用しない。<br><br>ほかの選択肢の確認：<br>・安全弁は、原則として最大の定格荷重に相当する荷重をかけたときの圧力以下で作用するよう調整する。<br>・直働式巻過防止装置は、所定の間隔が0.05m以上となるよう調整する。<br>・移動式クレーンで荷をつり上げるときは、外れ止め装置を使用する。<br>・運転者と玉掛け者が定格荷重を常時知ることができるよう、表示等の措置を行う。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},

{license:"crane_mobile", id:"mobile_law_4_5", subject:"law", theme:4, q:"使用条件と安全装置の調整について、正しいものはどれか。", choices:["直働式巻過防止装置は、所定の間隔が0.005m以上となるよう調整する。","荷が軽ければ、外れ止め装置を使用しなくてよい。","つり上げ荷重3t以上では、検査証に記載された運転士の経験年数に応じてジブの傾斜角を決める。","巻過防止装置は、原則として所定の間隔が0.25m以上となるよう調整する。","つり上げ荷重3t未満では、ジブの傾斜角に関する使用制限はない。"], answer:3, explain:"この記述が正しい内容です。巻過防止装置は、原則として所定の間隔が0.25m以上となるよう調整する。<br><br>ほかの選択肢の確認：<br>・移動式クレーンで荷をつり上げるときは、外れ止め装置を使用する。<br>・直働式巻過防止装置は、所定の間隔が0.05m以上となるよう調整する。<br>・つり上げ荷重3t未満では、製造者が指定したジブの傾斜角の範囲を超えて使用しない。<br>・つり上げ荷重3t以上では、明細書に記載されたジブの傾斜角の範囲を超えて使用しない。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_4_6", subject:"law", theme:4, q:"使用条件と安全装置の調整について、誤っているものはどれか。", choices:["直働式巻過防止装置は、所定の間隔が0.005m以上となるよう調整する。","移動式クレーンには、定格荷重を超える荷重をかけて使用してはならない。","移動式クレーンで荷をつり上げるときは、外れ止め装置を使用する。","運転者と玉掛け者が定格荷重を常時知ることができるよう、表示等の措置を行う。","安全弁は、原則として最大の定格荷重に相当する荷重をかけたときの圧力以下で作用するよう調整する。"], answer:0, explain:"この記述が誤りです。正しくは、直働式巻過防止装置は、所定の間隔が0.05m以上となるよう調整する。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_4_7", subject:"law", theme:4, q:"使用条件と安全装置の調整について、正しいものはどれか。", choices:["巻過防止装置は、原則として所定の間隔が0.025m以上となるよう調整する。","移動式クレーンは、低速であれば定格荷重を10％超えて使用できる。","安全弁は、原則として最大の定格荷重に相当する荷重をかけたときの圧力以下で作用するよう調整する。","つり上げ荷重3t未満では、ジブの傾斜角に関する使用制限はない。","定格荷重の表示等は、管理者だけが見られる場所にあればよい。"], answer:2, explain:"この記述が正しい内容です。安全弁は、原則として最大の定格荷重に相当する荷重をかけたときの圧力以下で作用するよう調整する。<br><br>ほかの選択肢の確認：<br>・巻過防止装置は、原則として所定の間隔が0.25m以上となるよう調整する。<br>・運転者と玉掛け者が定格荷重を常時知ることができるよう、表示等の措置を行う。<br>・つり上げ荷重3t未満では、製造者が指定したジブの傾斜角の範囲を超えて使用しない。<br>・移動式クレーンには、定格荷重を超える荷重をかけて使用してはならない。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_4_8", subject:"law", theme:4, q:"使用条件と安全装置の調整について、誤っているものはどれか。", choices:["巻過防止装置は、原則として所定の間隔が0.25m以上となるよう調整する。","運転者と玉掛け者が定格荷重を常時知ることができるよう、表示等の措置を行う。","安全弁は、原則として最大の定格荷重に相当する荷重をかけたときの圧力以下で作用するよう調整する。","直働式巻過防止装置は、所定の間隔が0.05m以上となるよう調整する。","荷が軽ければ、外れ止め装置を使用しなくてよい。"], answer:4, explain:"この記述が誤りです。正しくは、移動式クレーンで荷をつり上げるときは、外れ止め装置を使用する。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_5_1", subject:"law", theme:5, q:"作業計画とアウトリガーについて、正しいものはどれか。", choices:["最大限に張り出せなくても、最大張出し時の能力表のまま使用できる。","軟弱地盤等でも、クローラクレーンなら転倒防止措置なしに使用できる。","作業方法を定める際は、場所の広さ、地形、地質、荷の重量、機械の能力等を考慮する。","作業方法等は、管理者だけが知っていれば周知する必要はない。","転倒防止方法や指揮系統は、荷をつってから決めればよい。"], answer:2, explain:"この記述が正しい内容です。作業方法を定める際は、場所の広さ、地形、地質、荷の重量、機械の能力等を考慮する。<br><br>ほかの選択肢の確認：<br>・作業方法、転倒防止方法、労働者の配置と指揮系統をあらかじめ定める。<br>・定めた作業方法等は、作業開始前に関係労働者へ周知する。<br>・最大限に張り出せないときは、張出し幅に応じた定格荷重を下回ることが確実に見込まれる等の条件を満たす必要がある。<br>・軟弱地盤等で転倒のおそれがある場所での使用は、原則として禁止される。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_5_2", subject:"law", theme:5, q:"作業計画とアウトリガーについて、誤っているものはどれか。", choices:["作業方法を定める際は、場所の広さ、地形、地質、荷の重量、機械の能力等を考慮する。","最大限に張り出せないときは、張出し幅に応じた定格荷重を下回ることが確実に見込まれる等の条件を満たす必要がある。","定めた作業方法等は、作業開始前に関係労働者へ周知する。","転倒防止方法や指揮系統は、荷をつってから決めればよい。","軟弱地盤等で使用する例外措置には、必要な広さと強度の鉄板等を敷いてその上に設置する方法がある。"], answer:3, explain:"この記述が誤りです。正しくは、作業方法、転倒防止方法、労働者の配置と指揮系統をあらかじめ定める。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_5_3", subject:"law", theme:5, q:"作業計画とアウトリガーについて、正しいものはどれか。", choices:["定めた作業方法等は、作業開始前に関係労働者へ周知する。","最大限に張り出せなくても、最大張出し時の能力表のまま使用できる。","転倒防止方法や指揮系統は、荷をつってから決めればよい。","軟弱地盤等で使用する例外措置は、薄い布を敷くことだけで満たせる。","鉄板等を敷けば、アウトリガーを鉄板の縁から外して置いてもよい。"], answer:0, explain:"この記述が正しい内容です。定めた作業方法等は、作業開始前に関係労働者へ周知する。<br><br>ほかの選択肢の確認：<br>・最大限に張り出せないときは、張出し幅に応じた定格荷重を下回ることが確実に見込まれる等の条件を満たす必要がある。<br>・作業方法、転倒防止方法、労働者の配置と指揮系統をあらかじめ定める。<br>・鉄板等の上にアウトリガーを設置するときは、機械が転倒するおそれのない位置を選ぶ。<br>・軟弱地盤等で使用する例外措置には、必要な広さと強度の鉄板等を敷いてその上に設置する方法がある。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
{license:"crane_mobile", id:"mobile_law_5_4", subject:"law", theme:5, q:"作業計画とアウトリガーについて、誤っているものはどれか。", choices:["軟弱地盤等で使用する例外措置には、必要な広さと強度の鉄板等を敷いてその上に設置する方法がある。","アウトリガーや拡幅式クローラは、原則として最大限に張り出す。","作業方法、転倒防止方法、労働者の配置と指揮系統をあらかじめ定める。","軟弱地盤等でも、クローラクレーンなら転倒防止措置なしに使用できる。","作業方法を定める際は、場所の広さ、地形、地質、荷の重量、機械の能力等を考慮する。"], answer:3, explain:"この記述が誤りです。正しくは、軟弱地盤等で転倒のおそれがある場所での使用は、原則として禁止される。<br>ほかの4つの記述は正しい内容です。<br><small>法令参照：<a href=\"https://www.mhlw.go.jp/web/t_doc?dataId=74020000\" target=\"_blank\" rel=\"noopener\">クレーン等安全規則</a></small>"},
